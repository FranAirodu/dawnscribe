<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var t=localStorage.getItem('ds_theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DawnScribe — My Collab Submissions</title>
  <meta name="robots" content="noindex,nofollow" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css"/>
  <style>
    :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--bg4:#22223a;--accent:#2dd4bf;--accent2:#0d9488;--text:#f1f0ff;--text2:#9b9bc0;--text3:#5a5a80;--border:rgba(255,255,255,0.07);--red:#f87171;--green:#34d399;}
    html[data-theme="light"]{--bg:#f4f4f8;--bg2:#ffffff;--bg3:#ebebf2;--bg4:#d8d8e8;--accent:#0d9488;--accent2:#0f766e;--text:#0a0a0f;--text2:#3a3a5c;--text3:#7a7a9a;--border:rgba(0,0,0,0.08);--red:#dc2626;--green:#059669;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    /* BUG FIX: removed duplicate @keyframes spin */
    @keyframes spin{to{transform:rotate(360deg);}}

    nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .logo{font-family:'Cinzel',serif;font-size:22px;color:var(--accent);text-decoration:none;}
    .logo span{color:var(--text);}
    .back-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 16px;color:var(--text2);font-size:13px;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;text-decoration:none;}
    .back-btn:hover{border-color:var(--accent);color:var(--accent);}

    .page{max-width:760px;margin:0 auto;padding:40px 24px 80px;flex:1;}

    .page-header{margin-bottom:32px;}
    .page-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
    .page-title{font-family:'Cinzel',serif;font-size:28px;font-weight:700;color:var(--text);margin-bottom:6px;}
    .page-sub{font-size:14px;color:var(--text3);line-height:1.6;}

    /* SECTION */
    .section{margin-bottom:36px;}
    .section-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
    .section-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
    .section-icon.gold{background:rgba(245,158,11,0.12);color:#f59e0b;}
    .section-icon.teal{background:rgba(45,212,191,0.1);color:var(--accent);}
    .section-title{font-family:'Cinzel',serif;font-size:16px;font-weight:700;color:var(--text);}
    .section-count{font-size:11px;font-weight:700;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);border-radius:8px;padding:2px 8px;color:#f59e0b;margin-left:auto;}
    .section-count.zero{background:var(--bg3);border-color:var(--border);color:var(--text3);}

    /* COLLAPSIBLE history rows */
    .section-toggle{background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:12px;font-family:'Lato',sans-serif;display:flex;align-items:center;gap:5px;padding:0;margin-left:8px;transition:color 0.2s;white-space:nowrap;}
    .section-toggle:hover{color:var(--accent);}
    .section-toggle i{transition:transform 0.25s;}
    .section-toggle.collapsed i{transform:rotate(180deg);}
    .history-body{overflow:hidden;transition:max-height 0.3s ease,opacity 0.3s ease;max-height:9999px;opacity:1;}
    .history-body.collapsed{max-height:0;opacity:0;}

    /* ROW */
    .collab-row{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:10px;transition:border-color 0.2s;}
    .collab-row:last-child{margin-bottom:0;}
    .collab-row:hover{border-color:rgba(255,255,255,0.12);}
    .collab-cover{width:42px;height:60px;border-radius:7px;flex-shrink:0;background:var(--bg4);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:18px;overflow:hidden;}
    .collab-cover img{width:100%;height:100%;object-fit:cover;}
    .collab-cover-link{display:block;flex-shrink:0;border-radius:9px;text-decoration:none;transition:transform 0.2s;}
    .collab-cover-link:hover{transform:scale(1.06);}
    .collab-cover-glow{width:42px;height:60px;border-radius:7px;flex-shrink:0;background:var(--bg4);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:18px;overflow:hidden;border:2px solid rgba(45,212,191,0.5);box-shadow:0 0 10px rgba(45,212,191,0.2);}
    .collab-cover-glow img{width:100%;height:100%;object-fit:cover;}
    .collab-cover-link:hover .collab-cover-glow{border-color:var(--accent);box-shadow:0 0 18px rgba(45,212,191,0.4);}
    .collab-info{flex:1;min-width:0;}
    .collab-title{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;text-decoration:none;display:block;}
    .collab-title:hover{color:var(--accent);}
    .collab-meta{font-size:12px;color:var(--text3);line-height:1.5;}
    .collab-meta em{color:var(--text2);font-style:normal;}
    .collab-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}

    /* STATUS BADGES */
    .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:8px;padding:3px 10px;flex-shrink:0;}
    .badge-pending{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:#f59e0b;}
    .badge-approved{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.3);color:var(--green);}
    .badge-rejected{background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.25);color:var(--red);}
    .btn-withdraw{background:transparent;border:1px solid rgba(248,113,113,0.3);border-radius:8px;padding:5px 12px;color:var(--red);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all 0.2s;flex-shrink:0;}
    .btn-withdraw:hover{background:rgba(248,113,113,0.08);border-color:var(--red);}

    /* MODAL */
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:400;display:none;align-items:center;justify-content:center;padding:24px;}
    .modal-backdrop.show{display:flex;}
    .modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:420px;padding:28px 28px 24px;}
    .modal h3{font-family:'Cinzel',serif;font-size:17px;font-weight:700;color:var(--text);margin-bottom:8px;}
    .modal p{font-size:13px;color:var(--text3);line-height:1.6;margin-bottom:20px;}
    .modal-btns{display:flex;gap:10px;justify-content:flex-end;}
    .modal-cancel{background:transparent;border:1px solid var(--border);border-radius:8px;padding:9px 20px;color:var(--text2);font-size:13px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;}
    .modal-cancel:hover{border-color:var(--text3);}
    .modal-confirm{background:var(--red);border:none;border-radius:8px;padding:9px 20px;color:white;font-size:13px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;}
    .modal-confirm:hover{opacity:0.85;}
    .modal-confirm:disabled{opacity:0.5;cursor:not-allowed;}

    /* TOAST */
    .toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 22px;font-size:13px;font-weight:700;color:var(--text);z-index:600;transition:transform 0.3s;display:flex;align-items:center;gap:8px;white-space:nowrap;}
    .toast.show{transform:translateX(-50%) translateY(0);}

    /* EMPTY */
    .empty{text-align:center;padding:36px 24px;color:var(--text3);background:var(--bg2);border:1px solid var(--border);border-radius:12px;}
    .empty i{font-size:32px;display:block;margin-bottom:10px;}
    .empty p{font-size:13px;line-height:1.6;}
    .empty a{color:var(--accent);text-decoration:none;}
    .empty-full{text-align:center;padding:80px 24px;color:var(--text3);}
    .empty-full i{font-size:40px;display:block;margin-bottom:16px;}
    .empty-full h2{font-family:'Cinzel',serif;font-size:20px;color:var(--text);margin-bottom:8px;}
    .empty-full p{font-size:14px;line-height:1.6;}
    .empty-full a{color:var(--accent);text-decoration:none;font-weight:700;}

    .loading{text-align:center;padding:32px;color:var(--text3);font-size:13px;}
    .not-logged{text-align:center;padding:80px 24px;color:var(--text3);}
    .not-logged i{font-size:40px;display:block;margin-bottom:16px;color:var(--text3);}
    .not-logged h2{font-family:'Cinzel',serif;font-size:20px;color:var(--text);margin-bottom:8px;}
    .not-logged a{color:var(--accent);text-decoration:none;font-weight:700;}
  </style>
</head>
<body>

<nav style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
  <a class="logo" href="index.html">Dawn<span>Scribe</span></a>
  <a class="back-btn" href="javascript:history.back()"><i class="ti ti-arrow-left"></i> Back</a>
</nav>

<div class="page">
  <div class="page-header">
    <div class="page-label"><i class="ti ti-send"></i> Outbox</div>
    <h1 class="page-title">My Collab Submissions</h1>
    <p class="page-sub">Collab requests you've sent — track their status here.</p>
  </div>
  <div id="content"><div class="loading"><i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i> Loading…</div></div>
</div>

<script>
  const SUPA_URL = 'https://cajjyyskpmjnpcxcfeuk.supabase.co';
  const SUPA_KEY = 'sb_publishable_ZZjE1u_pQn5YkrMKH4P3KQ_HSGqTjzx';
  const db = window.supabase.createClient(SUPA_URL, SUPA_KEY);

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  // Build a JS string literal safe for an HTML on* attribute. JSON.stringify does
  // the JS-level escaping; the entity encoding does the HTML-level. Without the
  // second layer the raw double quotes terminate the attribute early — which
  // silently broke every handler built this way.
  function attrJson(v){
    return JSON.stringify(v === undefined ? null : v)
      .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function safeUrl(u){
    u = String(u||'').trim();
    return /^(https?:\/\/|\/)/i.test(u) ? u : '';
  }


  function timeAgo(isoStr){
    if(!isoStr) return '';
    var diff = Math.floor((Date.now() - new Date(isoStr).getTime()) / 1000);
    if(diff < 60) return 'just now';
    if(diff < 3600) return Math.floor(diff/60) + 'm ago';
    if(diff < 86400) return Math.floor(diff/3600) + 'h ago';
    var d = Math.floor(diff/86400);
    return d === 1 ? 'yesterday' : d + ' days ago';
  }

  function showToast(msg, icon){
    var t = document.getElementById('toast');
    t.innerHTML = '<i class="ti ' + (icon||'ti-check') + '"></i> ' + esc(msg||'');
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 3000);
  }

  var pendingWithdraw = null;

  function openWithdraw(collabId, tableKey, workId, rowEl){
    pendingWithdraw = { collabId: collabId, tableKey: tableKey, workId: workId, rowEl: rowEl };
    document.getElementById('withdraw-backdrop').classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeWithdraw(){
    document.getElementById('withdraw-backdrop').classList.remove('show');
    document.body.style.overflow = '';
    pendingWithdraw = null;
  }

  async function doWithdraw(){
    if(!pendingWithdraw) return;
    var btn = document.getElementById('withdraw-confirm-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i> Withdrawing…';
    var { collabId, tableKey, workId, rowEl } = pendingWithdraw;

    // BUG FIX: use correct table based on submission type
    // tableKey 'story'  → artwork_collabs (story written for an artwork)
    // tableKey 'fanart' → story_collabs   (artwork drawn for a novel)
    var tbl = tableKey === 'story' ? 'artwork_collabs' : 'story_collabs';
    var { error } = await db.from(tbl).delete().eq('id', collabId);
    if(error){
      showToast('Failed: ' + error.message, 'ti-alert-circle');
      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-trash"></i> Yes, Withdraw';
      return;
    }
    // For story submissions only: also clean up the unpublished work draft if one exists
    if(tableKey === 'story' && workId){
      await Promise.resolve(db.from('works').delete().eq('id', workId).eq('is_published', false)).catch(function(){});
    }
    if(rowEl){
      rowEl.style.transition = 'opacity 0.3s,transform 0.3s';
      rowEl.style.opacity = '0';
      rowEl.style.transform = 'translateX(-12px)';
      setTimeout(function(){ rowEl.remove(); }, 300);
    }
    closeWithdraw();
    showToast('Submission withdrawn.', 'ti-trash');
  }

  // BUG FIX: ti-star is missing from the webfont — use ti-award instead
  // type: 'story' (artwork_collabs) | 'fanart' (story_collabs)
  function statusBadge(status, collabId, type){
    if(status === 'approved'){
      var href = 'collab-approved.html?collab=' + esc(collabId) + (type === 'fanart' ? '&type=fanart' : '');
      return '<a href="' + href + '" class="badge badge-approved" style="text-decoration:none;"><i class="ti ti-award"></i> Approved — View Achievement</a>';
    }
    if(status === 'rejected') return '<span class="badge badge-rejected"><i class="ti ti-x"></i> Declined</span>';
    return '<span class="badge badge-pending"><i class="ti ti-clock"></i> Pending</span>';
  }

  function makeHistoryToggle(bodyEl, count){
    var btn = document.createElement('button');
    btn.className = 'section-toggle';
    btn.innerHTML = 'Show history (' + count + ') <i class="ti ti-chevron-up"></i>';
    btn.onclick = function(){
      var collapsed = bodyEl.classList.toggle('collapsed');
      btn.classList.toggle('collapsed', collapsed);
    };
    return btn;
  }

  async function init(){
    var content = document.getElementById('content');
    var { data: { session } } = await db.auth.getSession();
    if(!session){
      content.innerHTML = '<div class="not-logged"><i class="ti ti-lock"></i><h2>Not logged in</h2><p><a href="auth.html">Log in</a> to view your collab submissions.</p></div>';
      return;
    }
    var uid = session.user.id;
    try {

    // ── STORY SUBMISSIONS (novel written for an artwork) → artwork_collabs
    var { data: storySubmissions } = await db.from('artwork_collabs')
      .select('id, artwork_id, work_id, status, novel_title, novel_cover_url, created_at')
      .eq('author_id', uid)
      .order('created_at', { ascending: false });
    storySubmissions = storySubmissions || [];

    // Fetch artwork titles + artist usernames for story submissions
    var artIds = [...new Set(storySubmissions.map(function(r){ return r.artwork_id; }).filter(Boolean))];
    var artMap = {};
    if(artIds.length){
      var { data: arts } = await db.from('works').select('id, title, author_id').in('id', artIds);
      (arts||[]).forEach(function(a){ artMap[a.id] = a; });
      var artAuthorIds = [...new Set((arts||[]).map(function(a){ return a.author_id; }).filter(Boolean))];
      if(artAuthorIds.length){
        var { data: artAuthors } = await db.from('profiles').select('id, username, display_name').in('id', artAuthorIds);
        (artAuthors||[]).forEach(function(p){
          Object.values(artMap).forEach(function(a){ if(a.author_id === p.id) a._artistUsername = p.display_name || p.username || null; });
        });
      }
    }

    // ── ARTWORK SUBMISSIONS (artwork drawn for a novel) → story_collabs
    var { data: artSubmissions } = await db.from('story_collabs')
      .select('id, work_id, image_url, description, status, created_at')
      .eq('artist_id', uid)
      .order('created_at', { ascending: false });
    artSubmissions = artSubmissions || [];

    // Fetch novel titles + author usernames for artwork submissions
    var novelIds = [...new Set(artSubmissions.map(function(r){ return r.work_id; }).filter(Boolean))];
    var novelMap = {};
    if(novelIds.length){
      var { data: novels } = await db.from('works').select('id, title, author_id').in('id', novelIds);
      (novels||[]).forEach(function(n){ novelMap[n.id] = n; });
      var novelAuthorIds = [...new Set((novels||[]).map(function(n){ return n.author_id; }).filter(Boolean))];
      if(novelAuthorIds.length){
        var { data: novelAuthors } = await db.from('profiles').select('id, username, display_name').in('id', novelAuthorIds);
        (novelAuthors||[]).forEach(function(p){
          Object.values(novelMap).forEach(function(n){ if(n.author_id === p.id) n._authorName = p.display_name || p.username || null; });
        });
      }
    }

    content.innerHTML = '';

    } catch(err) {
      content.innerHTML = '<div class="empty-full"><i class="ti ti-alert-circle"></i><h2>Something went wrong</h2><p>Could not load your submissions. Please try again.</p></div>';
      console.error('Outbox load error:', err);
      return;
    }

    // Suggestion F: single empty state if user has submitted nothing at all
    if(!storySubmissions.length && !artSubmissions.length){
      content.innerHTML =
        '<div class="empty-full"><i class="ti ti-send"></i>'
        + '<h2>No submissions yet</h2>'
        + '<p>You haven\'t sent any collab requests yet.<br>'
        + 'Browse <a href="browse.html?type=artwork">artworks</a> or <a href="browse.html">novels</a> to get started.</p>'
        + '</div>';
      return;
    }

    // ── SECTION 1: Story submissions (novel written for an artwork)
    var pendingStories  = storySubmissions.filter(function(r){ return r.status === 'pending'; });
    var decidedStories  = storySubmissions.filter(function(r){ return r.status !== 'pending'; });

    var storySection = document.createElement('div');
    storySection.className = 'section';
    var storySectionHeader = document.createElement('div');
    storySectionHeader.className = 'section-header';
    storySectionHeader.innerHTML =
      '<div class="section-icon gold"><i class="ti ti-writing"></i></div>'
      + '<div class="section-title">Stories Written for Artwork</div>';
    // Suggestion E: pending count badge
    var storyCountBadge = document.createElement('div');
    storyCountBadge.className = 'section-count' + (pendingStories.length ? '' : ' zero');
    storyCountBadge.textContent = pendingStories.length + ' pending';
    storySectionHeader.appendChild(storyCountBadge);
    storySection.appendChild(storySectionHeader);

    if(!storySubmissions.length){
      storySection.innerHTML += '<div class="empty"><i class="ti ti-writing"></i><p>You haven\'t submitted any collab stories yet.<br>Find an artwork you love and click <em>Write a Collab Story</em>.</p></div>';
    } else {
      // Pending rows
      var storyPendingBody = document.createElement('div');
      if(pendingStories.length){
        pendingStories.forEach(function(row){
          storyPendingBody.appendChild(buildStoryRow(row, artMap));
        });
      }
      storySection.appendChild(storyPendingBody);

      // Decided rows — collapsible history
      if(decidedStories.length){
        var storyHistoryBody = document.createElement('div');
        storyHistoryBody.className = 'history-body';
        decidedStories.forEach(function(row){
          storyHistoryBody.appendChild(buildStoryRow(row, artMap));
        });
        var storyToggle = makeHistoryToggle(storyHistoryBody, decidedStories.length);
        storySectionHeader.appendChild(storyToggle);
        storySection.appendChild(storyHistoryBody);
      }
    }
    content.appendChild(storySection);

    // ── SECTION 2: Artwork submissions (fan-art drawn for a novel)
    var pendingArt  = artSubmissions.filter(function(r){ return r.status === 'pending'; });
    var decidedArt  = artSubmissions.filter(function(r){ return r.status !== 'pending'; });

    var artSection = document.createElement('div');
    artSection.className = 'section';
    var artSectionHeader = document.createElement('div');
    artSectionHeader.className = 'section-header';
    artSectionHeader.innerHTML =
      '<div class="section-icon teal"><i class="ti ti-palette"></i></div>'
      + '<div class="section-title">Artwork Submitted for Novels</div>';
    // Suggestion E: pending count badge
    var artCountBadge = document.createElement('div');
    artCountBadge.className = 'section-count' + (pendingArt.length ? '' : ' zero');
    artCountBadge.textContent = pendingArt.length + ' pending';
    artSectionHeader.appendChild(artCountBadge);
    artSection.appendChild(artSectionHeader);

    if(!artSubmissions.length){
      artSection.innerHTML += '<div class="empty"><i class="ti ti-palette"></i><p>You haven\'t submitted any collab artwork yet.<br>Visit a novel\'s page to submit fan art.</p></div>';
    } else {
      var artPendingBody = document.createElement('div');
      if(pendingArt.length){
        pendingArt.forEach(function(row){
          artPendingBody.appendChild(buildArtRow(row, novelMap));
        });
      }
      artSection.appendChild(artPendingBody);

      if(decidedArt.length){
        var artHistoryBody = document.createElement('div');
        artHistoryBody.className = 'history-body';
        decidedArt.forEach(function(row){
          artHistoryBody.appendChild(buildArtRow(row, novelMap));
        });
        var artToggle = makeHistoryToggle(artHistoryBody, decidedArt.length);
        artSectionHeader.appendChild(artToggle);
        artSection.appendChild(artHistoryBody);
      }
    }
    content.appendChild(artSection);
  }

  // Build a story submission row
  function buildStoryRow(row, artMap){
    var art = artMap[row.artwork_id] || {};
    var div = document.createElement('div');
    div.className = 'collab-row';
    // Approved story → link to collab-approved; otherwise no link
    var storyLink = (row.status === 'approved' && row.work_id) ? 'story.html?id=' + esc(row.work_id) : null;
    var coverHtml = storyLink
      ? '<a href="' + storyLink + '" class="collab-cover-link" title="View published story">'
          + '<div class="collab-cover collab-cover-glow">'
            + (row.novel_cover_url ? '<img src="' + esc(row.novel_cover_url) + '" alt=""/>' : '<i class="ti ti-book"></i>')
          + '</div></a>'
      : '<div class="collab-cover">'
          + (row.novel_cover_url ? '<img src="' + esc(row.novel_cover_url) + '" alt=""/>' : '<i class="ti ti-book"></i>')
        + '</div>';
    // Suggestion C: show artwork owner's name
    var byLine = art._artistUsername ? 'artwork by <em>' + esc(art._artistUsername) + '</em>' : '';
    var artLabel = 'For artwork: <em>' + esc(art.title || 'Untitled Artwork') + '</em>' + (byLine ? ' · ' + byLine : '');
    // BUG FIX: openWithdraw now passes tableKey 'story' so doWithdraw hits artwork_collabs
    var withdrawId = attrJson(row.id);
    var workId = attrJson(row.work_id || '');
    div.innerHTML =
      coverHtml
      + '<div class="collab-info">'
        + '<span class="collab-title">' + esc(row.novel_title || 'Untitled Story') + '</span>'
        + '<div class="collab-meta">' + artLabel + '</div>'
        + '<div class="collab-meta" style="margin-top:2px;">' + esc(timeAgo(row.created_at)) + '</div>'
        + (storyLink ? '<div class="collab-meta" style="margin-top:3px;"><a href="' + storyLink + '" style="color:var(--accent);text-decoration:none;font-size:12px;"><i class="ti ti-external-link"></i> View published story</a></div>' : '')
      + '</div>'
      + '<div class="collab-actions">'
        + statusBadge(row.status, row.id, 'story')
        + (row.status === 'pending' ? '<button class="btn-withdraw" onclick="openWithdraw(' + withdrawId + ',\'story\',' + workId + ',this.closest(\'.collab-row\'))"><i class="ti ti-trash"></i> Withdraw</button>' : '')
      + '</div>';
    return div;
  }

  // Build a fan-art submission row
  function buildArtRow(row, novelMap){
    var novel = novelMap[row.work_id] || {};
    var div = document.createElement('div');
    div.className = 'collab-row';
    // BUG FIX: approved artwork → link to collab-approved, not just the novel page
    // For pending/rejected we still show the novel link for context
    var approvedLink = row.status === 'approved' ? 'collab-approved.html?collab=' + esc(row.id) : null;
    var novelLink    = row.work_id ? 'story.html?id=' + esc(row.work_id) : null;
    var coverHref    = approvedLink || novelLink;
    var coverHtml = coverHref
      ? '<a href="' + coverHref + '" class="collab-cover-link" title="' + (approvedLink ? 'View achievement' : 'View novel') + '">'
          + '<div class="collab-cover collab-cover-glow">'
            + (row.image_url ? '<img src="' + esc(row.image_url) + '" alt=""/>' : '<i class="ti ti-photo"></i>')
          + '</div></a>'
      : '<div class="collab-cover">'
          + (row.image_url ? '<img src="' + esc(row.image_url) + '" alt=""/>' : '<i class="ti ti-photo"></i>')
        + '</div>';
    // Suggestion D: show novel author's name
    var authorLine = novel._authorName ? 'by <em>' + esc(novel._authorName) + '</em>' : '';
    var novelLabel = 'For novel: <em>' + esc(novel.title || 'Untitled Novel') + '</em>' + (authorLine ? ' · ' + authorLine : '');
    // BUG FIX: openWithdraw passes tableKey 'fanart' so doWithdraw hits story_collabs
    // BUG FIX: withdraw button is now present for pending fan-art rows
    var withdrawId = attrJson(row.id);
    div.innerHTML =
      coverHtml
      + '<div class="collab-info">'
        + '<span class="collab-title">' + esc(row.description || 'Untitled Artwork') + '</span>'
        + '<div class="collab-meta">' + novelLabel + '</div>'
        + '<div class="collab-meta" style="margin-top:2px;">' + esc(timeAgo(row.created_at)) + '</div>'
        + (novelLink ? '<div class="collab-meta" style="margin-top:3px;"><a href="' + novelLink + '" style="color:var(--accent);text-decoration:none;font-size:12px;"><i class="ti ti-book-2"></i> View novel</a></div>' : '')
      + '</div>'
      + '<div class="collab-actions">'
        // BUG FIX: status no longer defaults to 'approved' — falls back to 'pending'
        + statusBadge(row.status || 'pending', row.id, 'fanart')
        + (row.status === 'pending' ? '<button class="btn-withdraw" onclick="openWithdraw(' + withdrawId + ',\'fanart\',null,this.closest(\'.collab-row\'))"><i class="ti ti-trash"></i> Withdraw</button>' : '')
      + '</div>';
    return div;
  }

  init();
</script>

<!-- WITHDRAW MODAL -->
<div class="modal-backdrop" id="withdraw-backdrop" onclick="if(event.target===this)closeWithdraw()">
  <div class="modal">
    <h3>Withdraw Submission?</h3>
    <p>This will permanently delete your collab submission and remove it from the review queue. <strong>This cannot be undone.</strong></p>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeWithdraw()">Cancel</button>
      <button class="modal-confirm" id="withdraw-confirm-btn" onclick="doWithdraw()"><i class="ti ti-trash"></i> Yes, Withdraw</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<footer id="ds-footer"></footer>
<script src="spoilerUtils.js"></script>
<script src="footer.js"></script>
<script src="muteFilter.js"></script>
<script src="nav.js"></script>
</body>
</html>
