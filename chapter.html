    async function submitParaReply(parentId, wrap, parentCard) {
      var ta = wrap.querySelector('.para-reply-ta');
      var text = ta.value.trim();
      if (!text) return;
      var btn = wrap.querySelector('.para-reply-submit');
      btn.disabled = true;
      btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i>';

      var { data: inserted, error } = await db.from('paragraph_comments').insert({
        chapter_id: chapterData.id,
        paragraph_index: activeParaIndex,
        user_id: currentSession.user.id,
        content: text,
        parent_id: parentId
      }).select().single();

      if (error) { showToast('Error: ' + error.message, 'ti-x'); btn.disabled=false; btn.innerHTML='<i class="ti ti-send"></i> Reply'; return; }

      wrap.remove();
      var rlist = parentCard.querySelector('.para-replies-list');
      if (!rlist) {
        rlist = document.createElement('div');
        rlist.className = 'para-replies-list';
        rlist.id = 'para-replies-' + parentId;
        parentCard.appendChild(rlist);
      }
      rlist.style.display = '';
      var { data: myP } = await db.from('profiles').select('id,username,display_name,avatar_url').eq('id', currentSession.user.id).maybeSingle();
      var pm = {}; if(myP) pm[myP.id] = myP;
      rlist.appendChild(buildParaReplyCard(inserted, pm));
      showToast('Reply posted!', 'ti-check');
    }

    async function submitParaComment() {
      var input = document.getElementById('para-comment-input');
      var val = input ? input.value.trim() : '';
      if (!val) return;
      var btn = document.getElementById('para-send-btn');
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i>'; }

      var { data: inserted, error } = await db.from('paragraph_comments').insert({
        chapter_id: chapterData.id,
        paragraph_index: activeParaIndex,
        user_id: currentSession.user.id,
        content: val
      }).select().single();

      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ti ti-send"></i>'; }
      if (error) { showToast('Error: ' + error.message, 'ti-x'); return; }
      input.value = '';

      // Notify the work author (if not commenting on own chapter)
      if (workData && currentSession.user.id !== workData.author_id) {
        try {
          var { data: myProf } = await db.from('profiles').select('display_name,username').eq('id', currentSession.user.id).maybeSingle();
          var myName = myProf ? (myProf.display_name || myProf.username || 'Someone') : 'Someone';
          await db.from('notifications').insert({
            user_id: workData.author_id,
            type: 'para_comment',
            from_user_id: currentSession.user.id,
            work_id: workData.id,
            chapter_id: chapterData.id,
            paragraph_index: activeParaIndex,
            message: myName + ' commented on a paragraph in "' + workData.title + '"'
          });
        } catch(e) {}
      }

      // Append to body immediately
      var body = document.getElementById('para-panel-body');
      var emptyMsg = body.querySelector('div[style*="text-align:center"]');
      if (emptyMsg) emptyMsg.remove();
      var { data: myP } = await db.from('profiles').select('id,username,display_name,avatar_url').eq('id', currentSession.user.id).maybeSingle();
      var pm = {}; if(myP) pm[myP.id] = myP;
      body.appendChild(buildParaCommentCard(inserted, pm, [], pm));

      // Update the bubble count on the paragraph
      updateParaBubbleCount(activeParaIndex, 1);
    }

    async function deleteParaComment(commentId, cardEl) {
      cardEl.style.opacity = '0.4';
      var { error } = await db.from('paragraph_comments').delete()
        .eq('id', commentId).eq('user_id', currentSession.user.id);
      if (error) {
        var { error: e2 } = await db.from('paragraph_comments').delete().eq('id', commentId);
        if (e2) { cardEl.style.opacity='1'; showToast('Could not delete.','ti-x'); return; }
      }
      cardEl.style.transition = 'opacity 0.3s';
      setTimeout(function(){ cardEl.remove(); }, 300);
      showToast('Comment deleted.', 'ti-trash');
      if (activeParaIndex !== null) updateParaBubbleCount(activeParaIndex, -1);
    }

    function updateParaBubbleCount(idx, delta) {
      var bubble = document.querySelector('.para-comment-bubble[data-idx="'+idx+'"]');
      if (!bubble) return;
      var countEl = bubble.querySelector('.bubble-count');
      var cur = countEl ? parseInt(countEl.textContent||0) : 0;
      var next = Math.max(0, cur + delta);
      if (next > 0) {
        if (!countEl) {
          countEl = document.createElement('span');
          countEl.className = 'bubble-count';
          bubble.appendChild(countEl);
        }
        countEl.textContent = next;
      } else {
        if (countEl) countEl.remove();
      }
    }

    // ── INJECT PARA WRAPS INTO RENDERED CONTENT ───────────────────
    async function injectParaWraps() {
      var content = document.getElementById('page-content');
      var paras = content.querySelectorAll('p, h1, h2, h3, blockquote');

      // Fetch comment counts for this page's paragraphs
      var startIdx = currentPage * WORDS_PER_PAGE; // rough offset — we track by absolute paragraph index
      // Re-index from the actual DOM position relative to full chapter
      // Use data-para-abs set during paginate
      var countMap = {};
      if (chapterData) {
        var cr = await db.from('paragraph_comments')
          .select('paragraph_index')
          .eq('chapter_id', chapterData.id)
          .is('parent_id', null);
        (cr.data||[]).forEach(function(c){
          countMap[c.paragraph_index] = (countMap[c.paragraph_index]||0) + 1;
        });
      }

      paras.forEach(function(p, i) {
        // Skip empty paragraphs
        if (!p.textContent.trim()) return;
        var absIdx = parseInt(p.getAttribute('data-para-idx') || i);
        var count = countMap[absIdx] || 0;
        var wrap = document.createElement('div');
        wrap.className = 'para-wrap';
        var bubble = document.createElement('div');
        bubble.className = 'para-comment-bubble';
        bubble.setAttribute('data-idx', absIdx);
        if (count > 0) wrap.classList.add('has-comments');
        bubble.innerHTML = '<i class="ti ti-message-circle bubble-icon"></i>' +
          (count > 0 ? '<span class="bubble-count">' + count + '</span>' : '');
        bubble.addEventListener('click', function(e){
          e.stopPropagation();
          var text = p.textContent || '';
          openParaPanel(absIdx, text);
        });
        p.appendChild(bubble);
        // Echo bubble — only for logged-in non-owners
        if (currentSession && !isOwner) {
          var echoBubble = document.createElement('span');
          echoBubble.className = 'para-echo-bubble';
          echoBubble.setAttribute('data-para-idx', absIdx);
          echoBubble.innerHTML = '<span class="echo-bubble-icon">🔮</span>';
          echoBubble.addEventListener('click', function(e){
            e.stopPropagation();
            // Set this paragraph as the active target and open echoes panel
            activeEchoParaTarget = absIdx;
            spOpen('echoes');
          });
          p.appendChild(echoBubble);
        }
        p.parentNode.insertBefore(wrap, p);
        wrap.appendChild(p);
      });
    }

    // ── CHAPTER COMMENTS (THREADED) ────────────────────────────────
    function buildChapterCommentCard(c, profileMap, isOwner, isReply){
      var p = profileMap[c.user_id] || {};
      var name = escHtml(p.display_name || p.username || 'User');
      var avatarHtml = p.avatar_url ? '<img src="'+escHtml(p.avatar_url)+'" alt=""/>' : '<i class="ti ti-user"></i>';
      var canDelete = currentSession && (currentSession.user.id === c.user_id || isOwner);
      var card = document.createElement('div');
      card.className = isReply ? 'reply-card' : 'comment-card';
      card.dataset.commentId = c.id;
      card.dataset.userId = c.user_id;
      card.innerHTML =
        '<div class="comment-header">'
          + '<div class="comment-avatar" style="'+(isReply?'width:24px;height:24px;font-size:11px;':'')+'">' + avatarHtml + '</div>'
          + '<div class="comment-name">' + name + '</div>'
          + '<div class="comment-time">' + timeAgo(c.created_at) + '</div>'
        + '</div>'
        + '<div class="comment-body">' + escHtml(c.content) + '</div>'
        + (c.gif_url ? '<img class="comment-gif" src="'+escHtml(c.gif_url)+'" alt="gif"/>' : '')
        + '<div class="comment-actions">'
          + (currentSession ? '<button class="comment-reply-btn"><i class="ti ti-corner-down-right"></i> Reply</button>' : '')
          + (canDelete ? '<button class="comment-delete-btn"><i class="ti ti-trash"></i></button>' : '')
          + (currentSession && currentSession.user.id !== c.user_id ? '<button class="comment-block-btn"><i class="ti ti-ban"></i></button>' : '')
        + '</div>';

      if(currentSession){
        card.querySelector('.comment-reply-btn').addEventListener('click', function(){
          toggleChapterReplyBox(c.id, card, p.display_name || p.username || 'User');
        });
      }
      if(canDelete){
        card.querySelector('.comment-delete-btn').addEventListener('click', function(){
          deleteChapterComment(c.id, card);
        });
      }
      if(currentSession && currentSession.user.id !== c.user_id){
        card.querySelector('.comment-block-btn').addEventListener('click', async function(){
          var name = escHtml(p.display_name||p.username||'User');
          if(!confirm('Block '+name+'? Their comments will be hidden.')) return;
          await dsBlock.block(c.user_id);
          document.querySelectorAll('.comment-card,.reply-card').forEach(function(el){ if(el.dataset.userId===c.user_id) el.remove(); });
          showToast('User blocked.','ti-ban');
        });
      }
      return card;
    }

    function toggleChapterReplyBox(parentId, parentCard, parentName){
      document.querySelectorAll('.reply-input-wrap').forEach(function(el){ el.remove(); });
      if(parentCard.dataset.replyOpen === '1'){ parentCard.dataset.replyOpen = '0'; return; }
      parentCard.dataset.replyOpen = '1';
      var wrap = document.createElement('div');
      wrap.className = 'reply-input-wrap';
      wrap.innerHTML =
        '<textarea class="reply-textarea" placeholder="Replying to ' + escHtml(parentName) + '…" maxlength="1000"></textarea>'
        + '<div class="reply-actions">'
          + '<button class="reply-cancel-btn">Cancel</button>'
          + '<button class="reply-submit-btn"><i class="ti ti-send"></i> Post Reply</button>'
        + '</div>';
      parentCard.appendChild(wrap);
      wrap.querySelector('.reply-textarea').focus();
      wrap.querySelector('.reply-cancel-btn').addEventListener('click', function(){
        wrap.remove(); parentCard.dataset.replyOpen = '0';
      });
      wrap.querySelector('.reply-submit-btn').addEventListener('click', function(){
        submitChapterReply(parentId, wrap, parentCard);
      });
    }

    async function submitChapterReply(parentId, wrap, parentCard){
      var ta = wrap.querySelector('.reply-textarea');
      var text = ta.value.trim();
      if(!text) return;
      var btn = wrap.querySelector('.reply-submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i>';

      var { data: inserted, error } = await db.from('chapter_comments').insert({
        chapter_id: chapterData.id,
        user_id: currentSession.user.id,
        content: text,
        parent_id: parentId
      }).select().single();

      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-send"></i> Post Reply';
      if(error){ showToast('Failed to post reply: ' + error.message, 'ti-x'); return; }

      wrap.remove(); parentCard.dataset.replyOpen = '0';

      // Notify original commenter
      var { data: parentCmt } = await db.from('chapter_comments')
        .select('user_id').eq('id', parentId).maybeSingle();
      if(parentCmt && parentCmt.user_id !== currentSession.user.id){
        var { data: myProf } = await db.from('profiles')
          .select('display_name,username').eq('id', currentSession.user.id).maybeSingle();
        var myName = myProf ? (myProf.display_name || myProf.username || 'Someone') : 'Someone';
        try { await db.from('notifications').insert({
          user_id: parentCmt.user_id,
          type: 'chapter_reply',
          from_user_id: currentSession.user.id,
          work_id: workData ? workData.id : null,
          message: myName + ' replied to your comment on "' + (workData ? workData.title : 'a chapter') + '"'
        }); } catch(e){}
      }

      // Append reply card
      var repliesList = parentCard.querySelector('.replies-list');
      if(!repliesList){
        repliesList = document.createElement('div');
        repliesList.className = 'replies-list';
        parentCard.appendChild(repliesList);
      }
      var profMap = {};
      var { data: myProfile } = await db.from('profiles')
        .select('id,username,display_name,avatar_url').eq('id', currentSession.user.id).maybeSingle();
      if(myProfile) profMap[myProfile.id] = myProfile;
      var isOwner = currentSession && workData && currentSession.user.id === workData.author_id;
      repliesList.appendChild(buildChapterCommentCard(inserted, profMap, isOwner, true));
      showToast('Reply posted!', 'ti-check');
    }

    async function deleteChapterComment(commentId, cardEl){
      if(!currentSession) return;
      cardEl.style.opacity = '0.4';
      var { error } = await db.from('chapter_comments').delete()
        .eq('id', commentId).eq('user_id', currentSession.user.id);
      if(error){
        var { error: err2 } = await db.from('chapter_comments').delete().eq('id', commentId);
        if(err2){ cardEl.style.opacity = '1'; showToast('Could not delete.', 'ti-x'); return; }
      }
      cardEl.remove();
      showToast('Comment deleted.', 'ti-trash');
    }

    async function loadChapterComments() {
      // Fetch all comments for this chapter (top-level + replies)
      var result = await db.from('chapter_comments')
        .select('id, content, created_at, user_id, parent_id, gif_url')
        .eq('chapter_id', chapterData.id)
        .order('created_at', { ascending: true });

      var comments = (result.data||[]).filter(function(cm){ return !dsBlock.either(cm.user_id); });
      var listEl = document.getElementById('chapter-comments-list');
      listEl.innerHTML = '';

      if(!comments.length){
        listEl.innerHTML = '<div class="empty-comments"><i class="ti ti-message-off" style="font-size:22px;display:block;margin-bottom:6px;opacity:0.4;"></i>No comments yet — be the first!</div>';
      } else {
        // Fetch profiles
        var allIds = [...new Set(comments.map(function(c){ return c.user_id; }).filter(Boolean))];
        var profileMap = {};
        if(allIds.length){
          var profRes = await db.from('profiles').select('id,username,display_name,avatar_url').in('id', allIds);
          (profRes.data||[]).forEach(function(p){ profileMap[p.id] = p; });
        }
        var isOwner = currentSession && workData && currentSession.user.id === workData.author_id;
        var topLevel = comments.filter(function(c){ return !c.parent_id; });
        var replies   = comments.filter(function(c){ return !!c.parent_id; });
        var replyMap  = {};
        replies.forEach(function(r){
          if(!replyMap[r.parent_id]) replyMap[r.parent_id] = [];
          replyMap[r.parent_id].push(r);
        });
        topLevel.forEach(function(c){
          var card = buildChapterCommentCard(c, profileMap, isOwner, false);
          var childReplies = replyMap[c.id] || [];
          if(childReplies.length){
            var repliesList = document.createElement('div');
            repliesList.className = 'replies-list';
            childReplies.forEach(function(r){
              repliesList.appendChild(buildChapterCommentCard(r, profileMap, isOwner, true));
            });
            card.appendChild(repliesList);
          }
          listEl.appendChild(card);
        });
      }

      var formEl = document.getElementById('chapter-comment-form');
      if(currentSession){
        formEl.innerHTML =
          '<div class="comment-input-area">'
          + '<textarea class="comment-textarea" id="chapter-comment-input" placeholder="Leave a comment on this chapter…" maxlength="1000"></textarea>'
          + '<div class="comment-actions-row">'
            + '<button class="comment-submit" onclick="submitChapterComment()"><i class="ti ti-send"></i> Post Comment</button>'
          + '</div>'
          + '</div>';
      } else {
        formEl.innerHTML = '<div class="login-prompt"><a href="auth.html">Sign in</a> to leave a comment.</div>';
      }
    }

    async function submitChapterComment() {
      var input = document.getElementById('chapter-comment-input');
      var val = input ? input.value.trim() : '';
      if(!val) return;
      var btn = document.querySelector('.comment-submit');
      if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i>'; }

      var { data: inserted, error } = await db.from('chapter_comments').insert({
        chapter_id: chapterData.id,
        user_id: currentSession.user.id,
        content: val
      }).select().single();

      if(btn){ btn.disabled = false; btn.innerHTML = '<i class="ti ti-send"></i> Post Comment'; }
      if(error){ showToast('Error: ' + error.message, 'ti-x'); return; }
      input.value = '';
      showToast('Comment posted!');

      // Append immediately to the list
      var listEl = document.getElementById('chapter-comments-list');
      var emptyMsg = listEl ? listEl.querySelector('.empty-comments') : null;
      if(emptyMsg) emptyMsg.remove();
      var { data: myProfile } = await db.from('profiles')
        .select('id,username,display_name,avatar_url').eq('id', currentSession.user.id).maybeSingle();
      var profMap = {}; if(myProfile) profMap[myProfile.id] = myProfile;
      var isOwner = currentSession && workData && currentSession.user.id === workData.author_id;
      if(listEl) listEl.appendChild(buildChapterCommentCard(inserted, profMap, isOwner, false));
    }

    // ── EDIT OVERLAY CHARACTER MANAGER ───────────────────────────
    var editCtCharacters = [];

    async function editCtInit(workId, chapterId) {
      var { data } = await db.from('novel_characters')
        .select('id, name, portrait_url, status, ended_reason')
        .eq('work_id', workId)
        .order('sort_order', { ascending: true });
      editCtCharacters = (data || []).map(function(c){
        return Object.assign({}, c, { chapter_status: 'active' });
      });
      // Load per-chapter statuses
      var { data: cc } = await db.from('chapter_characters')
        .select('character_id, status')
        .eq('chapter_id', chapterId);
      (cc || []).forEach(function(r){
        var char = editCtCharacters.find(function(c){ return c.id === r.character_id; });
        if (char) char.chapter_status = r.status;
      });
      editCtRender();
    }

    function editCtRender() {
      var list = document.getElementById('edit-ct-mgr-list');
      if (!list) return;
      if (!editCtCharacters.length) {
        list.innerHTML = '<div style="font-size:12px;color:var(--text3);padding:6px 0;">No characters added yet.</div>';
        return;
      }
      list.innerHTML = '';
      editCtCharacters.forEach(function(char) {
        var row = document.createElement('div');
        row.className = 'ct-mgr-row';
        var statusLabel = char.chapter_status === 'skipped' ? 'Skipped' : (char.status === 'ended' ? 'Ended' : 'Active');
        var statusClass = char.chapter_status === 'skipped' ? 'skipped' : (char.status === 'ended' ? 'ended' : 'active');
        row.innerHTML =
          '<div class="comment-avatar ct-mgr-avatar">' +
            (char.portrait_url ? '<img src="'+char.portrait_url+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%;"/>' : '<i class="ti ti-user"></i>') +
          '</div>' +
          '<div class="ct-mgr-name">' + char.name + '</div>' +
          '<span class="ct-mgr-status ' + statusClass + '">' + statusLabel + '</span>' +
          '<div class="ct-mgr-actions">' +
            (char.chapter_status !== 'skipped' && char.status !== 'ended'
              ? '<button class="ct-mgr-btn" onclick="editCtSkip(\''+char.id+'\')">Skip<span class="ct-tooltip">Character isn\'t present in this chapter</span></button>'
              : (char.chapter_status === 'skipped' ? '<button class="ct-mgr-btn" onclick="editCtActivate(\''+char.id+'\')">Include<span class="ct-tooltip">Mark character as present in this chapter</span></button>' : '')) +
            (char.status !== 'ended'
              ? '<button class="ct-mgr-btn danger" onclick="editCtEnd(\''+char.id+'\')">End<span class="ct-tooltip">Character has passed away and/or will never return</span></button>'
              : '') +
          '</div>';
        list.appendChild(row);
      });
    }

    async function editCtAddCharacter() {
      var input = document.getElementById('edit-ct-mgr-input');
      var name = input ? input.value.trim() : '';
      if (!name || !workData) return;
      var { data, error } = await db.from('novel_characters').insert({
        work_id: workData.id, name: name, sort_order: editCtCharacters.length
      }).select().single();
      if (error) { showToast('Error: ' + error.message, 'ti-x'); return; }
      editCtCharacters.push(Object.assign({}, data, { chapter_status: 'active' }));
      input.value = '';
      editCtRender();
      showToast(name + ' added!', 'ti-user-plus');
    }

    function editCtSkip(id) {
      var c = editCtCharacters.find(function(c){ return c.id === id; });
      if (c) { c.chapter_status = 'skipped'; editCtRender(); }
    }
    function editCtActivate(id) {
      var c = editCtCharacters.find(function(c){ return c.id === id; });
      if (c) { c.chapter_status = 'active'; editCtRender(); }
    }
    async function editCtEnd(id) {
      var char = editCtCharacters.find(function(c){ return c.id === id; });
      if (!char) return;
      var reason = prompt('Why is ' + char.name + ' leaving? (e.g. Died, Left)');
      if (reason === null) return;
      await db.from('novel_characters').update({ status: 'ended', ended_reason: reason || 'No longer in story' }).eq('id', id);
      char.status = 'ended'; char.chapter_status = 'skipped';
      editCtRender();
      showToast(char.name + ' marked as ended.', 'ti-skull');
    }

    async function editCtSaveChapterCharacters(chapterId, workId) {
      if (!chapterId || !workId || !editCtCharacters.length) return;
      var rows = editCtCharacters.map(function(c) {
        return { chapter_id: chapterId, character_id: c.id, work_id: workId, status: c.chapter_status || 'active' };
      });
      await db.from('chapter_characters').upsert(rows, { onConflict: 'chapter_id,character_id' });
    }


    // ── SIDE PANEL ────────────────────────────────────────────────
    var spIsOpen = false;
    var spTab = 'toc';
    var spComments = [];

    function spOpen(tab) {
      // Close paragraph panel if open
      closeParaPanel();
      spIsOpen = true;
      document.getElementById('sp-panel').style.display = 'flex';
      var rw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--reader-width')) || 650;
      if (rw <= 800) {
        document.body.classList.add('panel-open-overlay');
      } else {
        document.body.classList.add('sp-panel-open');
      }
      document.querySelectorAll('#sp-tabs button').forEach(function(b){
        b.style.color = 'var(--text3)';
        b.style.borderColor = 'var(--border)';
        b.style.background = 'var(--bg2)';
      });
      var stb = document.getElementById('stb-' + tab);
      if (stb) { stb.style.color = 'var(--accent)'; stb.style.borderColor = 'var(--accent)'; stb.style.background = 'color-mix(in srgb,var(--accent) 8%,transparent)'; }
      spSwitch(tab);
    }

    function spClose() {
      spIsOpen = false;
      document.getElementById('sp-panel').style.display = 'none';
      document.body.classList.remove('sp-panel-open');
      document.body.classList.remove('panel-open-overlay');
      document.body.classList.remove('para-panel-active');
      document.querySelectorAll('#sp-tabs button').forEach(function(b){
        b.style.color = 'var(--text3)'; b.style.borderColor = 'var(--border)'; b.style.background = 'var(--bg2)';
      });
    }

    function spSwitch(tab) {
      spTab = tab;
      ['toc','comments','echoes'].forEach(function(t) {
        var btn = document.getElementById('spt-' + t);
        if (!btn) return;
        btn.style.color = t === tab ? 'var(--accent)' : 'var(--text3)';
        btn.style.borderBottom = t === tab ? '2px solid var(--accent)' : '2px solid transparent';
      });
      document.getElementById('sp-comment-wrap').style.display = (tab === 'comments' && currentSession) ? 'block' : 'none';
      if (tab === 'toc') spRenderToc();
      else if (tab === 'comments') spRenderComments();
      else if (tab === 'echoes') spRenderEchoes();
    }

    function spRenderToc() {
      var body = document.getElementById('sp-body');
      if (!allChapters || !allChapters.length) { body.innerHTML = '<div style="padding:16px;font-size:13px;color:var(--text3);">No chapters yet.</div>'; return; }
      var wid = workData ? workData.id : null;
      body.innerHTML = allChapters.map(function(ch) {
        var isCurrent = chapterData && ch.id === chapterData.id;
        var isRead = !!(wid && readingProgress[wid] && readingProgress[wid][ch.id]);
        var bl = isCurrent ? '3px solid var(--accent)' : '3px solid transparent';
        var bg = isCurrent ? 'color-mix(in srgb,var(--accent) 6%,transparent)' : 'transparent';
        var tc = isCurrent ? 'var(--accent)' : isRead ? 'var(--text2)' : 'var(--text)';
        var icon = isCurrent ? '<i class="ti ti-chevron-right" style="color:var(--accent);font-size:11px;flex-shrink:0;"></i>' : isRead ? '<i class="ti ti-check" style="color:var(--accent);font-size:11px;flex-shrink:0;"></i>' : '';
        return '<a href="chapter.html?id=' + ch.id + '" style="display:flex;align-items:center;gap:10px;padding:8px 16px;text-decoration:none;border-left:' + bl + ';background:' + bg + ';">' +
          '<span style="font-size:11px;color:var(--text3);width:28px;flex-shrink:0;text-align:right;">' + ch.chapter_number + '</span>' +
          '<span style="font-size:13px;font-weight:600;color:' + tc + ';flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escHtml(ch.title || 'Chapter ' + ch.chapter_number) + '</span>' +
          icon + '</a>';
      }).join('');
      setTimeout(function(){ var c = body.querySelector('a[style*="var(--accent)"]'); if(c) c.scrollIntoView({block:'center',behavior:'smooth'}); }, 60);
    }

    function spRenderComments() {
      var body = document.getElementById('sp-body');
      if (!spComments.length) { body.innerHTML = '<div style="padding:16px;font-size:13px;color:var(--text3);">No comments yet — be the first!</div>'; return; }
      body.innerHTML = spComments.map(function(c) {
        var prof = c.profiles || {};
        var name = escHtml(prof.display_name || prof.username || 'User');
        var av = prof.avatar_url ? '<img src="'+escHtml(prof.avatar_url)+'" style="width:26px;height:26px;border-radius:50%;object-fit:cover;" alt=""/>' : '<div style="width:26px;height:26px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text3);">'+name.charAt(0)+'</div>';
        return '<div style="padding:10px 16px;border-bottom:1px solid var(--border);">' +
          '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">' + av + '<span style="font-size:12px;font-weight:700;color:var(--text);">'+name+'</span><span style="font-size:11px;color:var(--text3);margin-left:auto;">'+timeAgo(c.created_at)+'</span></div>' +
          '<div style="font-size:13px;color:var(--text2);line-height:1.5;">'+escHtml(c.content||'')+'</div></div>';
      }).join('');
    }

    function spRenderEchoes() {
      var body = document.getElementById('sp-body');
      if (!echoTypes || !echoTypes.length) {
        body.innerHTML = '<div style="padding:16px;font-size:13px;color:var(--text3);">Log in to use Echoes.</div>';
        return;
      }
      var hint = echoModeActive
        ? '<div style="margin:8px 12px;padding:8px 10px;background:color-mix(in srgb,#f59e0b 8%,transparent);border:1px solid color-mix(in srgb,#f59e0b 25%,transparent);border-radius:8px;font-size:12px;color:#f59e0b;text-align:center;">✨ Now click a paragraph in the chapter</div>'
        : '<div style="padding:8px 16px 4px;font-size:12px;color:var(--text3);font-style:italic;">Select an Echo then click a paragraph. One of each per novel.</div>';
      var html = hint;
      // Helper to render a single echo row
      function renderEchoRow(t) {
        var placed = myEchoes[t.id];
        var isSelected = activeEchoType === t.id;
        var rc = t.rarity==='rare'?'#ef4444':t.rarity==='ultra'?'#a855f7':'var(--text)';
        var sb = isSelected?(t.rarity==='rare'?'color-mix(in srgb,#ef4444 10%,transparent)':'color-mix(in srgb,#f59e0b 10%,transparent)'):'';
        var sbd = isSelected?(t.rarity==='rare'?'color-mix(in srgb,#ef4444 35%,transparent)':'color-mix(in srgb,#f59e0b 35%,transparent)'):'transparent';
        var op = (placed&&!isSelected)?'0.55':'1';
        var pt = '';
        if (placed) {
          if (!placed.chapter_id) pt='On this story';
          else if (chapterData&&placed.chapter_id===chapterData.id) pt='This chapter — click to move';
          else { var pc=allChapters.find(function(c){return c.id===placed.chapter_id;}); pt='Ch.'+(pc?pc.chapter_number:'?')+' — click to move'; }
        }
        return '<div data-echo-id="'+t.id+'" class="sp-echo-row" style="display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:8px;cursor:pointer;border:1.5px solid '+sbd+';background:'+sb+';opacity:'+op+';margin:2px 6px;transition:all 0.12s;">' +
          '<span style="font-size:15px;width:22px;text-align:center;flex-shrink:0;">'+t.icon+'</span>' +
          '<div style="flex:1;min-width:0;"><div style="font-size:12px;font-weight:700;color:'+rc+';line-height:1.2;">'+t.label+'</div>' +
          (pt?'<div style="font-size:10px;color:'+rc+';margin-top:1px;opacity:0.8;">✓ '+pt+'</div>':'') +
          '</div></div>';
      }
      // Chapter-wide echoes
      var chapterEchoes = echoTypes.filter(function(t){ return t.scope === 'chapter'; });
      if (chapterEchoes.length) {
        html += '<div style="padding:8px 12px 2px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);">📖 Chapter Echoes</div>';
        chapterEchoes.forEach(function(t){ html += renderEchoRow(t); });
      }
      // Divider
      html += '<div style="margin:6px 12px 2px;border-top:1px solid var(--border);"></div>';
      // Paragraph/Quote echoes by rarity
      var rarities = [{key:'common',label:'Common'},{key:'rare',label:'Rare ✦'},{key:'ultra',label:'Ultra Rare ✦✦'}];
      html += '<div style="padding:4px 12px 2px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);">✏️ Paragraph & Quote Echoes</div>';
      rarities.forEach(function(r) {
        var items = echoTypes.filter(function(t){ return t.rarity === r.key && t.scope !== 'chapter'; });
        if (!items.length) return;
        if (r.key !== 'common') {
          var lc = r.key==='rare'?'#ef4444':'#a855f7';
          html += '<div style="padding:4px 12px 2px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:'+lc+';">'+r.label+'</div>';
        }
        items.forEach(function(t){ html += renderEchoRow(t); });
      });
      body.innerHTML = html;
      body.addEventListener('click', function spClick(e) {
        var row = e.target.closest('.sp-echo-row');
        if (!row) return;
        body.removeEventListener('click', spClick);
        var type = echoTypes.find(function(t){return t.id===row.dataset.echoId;});
        echoSelect(row.dataset.echoId);
        if (type && type.applies_to !== 'paragraph') spClose();
        else if (spTab === 'echoes') spRenderEchoes();
      });
    }

    async function spLoadComments() {
      if (!chapterData) return;
      var { data } = await db.from('chapter_comments')
        .select('id,content,created_at,user_id,profiles:user_id(username,display_name,avatar_url)')

    async function spSubmitComment() {
      if (!currentSession) return;
      var input = document.getElementById('sp-comment-input');
      var text = (input.value||'').trim();
      if (!text) return;
      var btn = input.nextElementSibling;

    document.addEventListener('click', function(e) {
      if (!spIsOpen) return;

    // ── INIT ─────────────────────────────────────────────────────
    (async function init() {
      applyReadingSettings();
      loadReadingProgress();

      var chapterId = getChapterId();
      if (!chapterId) { document.getElementById('chapter-title-display').textContent = 'Chapter not found.'; return; }

      var sessionRes = await db.auth.getSession();
      currentSession = sessionRes && sessionRes.data ? sessionRes.data.session : null;
      if (!currentSession) {
        for (var _r = 0; _r < 5 && !currentSession; _r++) {
          await new Promise(function(res){ setTimeout(res, 350); });
          sessionRes = await db.auth.getSession();
          currentSession = sessionRes && sessionRes.data ? sessionRes.data.session : null;
        }
      }

      // Load chapter
      var chapResult = await db.from('chapters').select('*').eq('id', chapterId).maybeSingle();
      if (!chapResult.data) { document.getElementById('chapter-title-display').textContent = 'Chapter not found.'; return; }
      chapterData = chapResult.data;
      applyChapterFont();

      // Load work
      var workResult = await db.from('works').select('*').eq('id', chapterData.work_id).maybeSingle();
      workData = workResult.data;

      // Load all chapters for nav
      var allChapResult = await db.from('chapters').select('id,chapter_number,title').eq('work_id', chapterData.work_id).eq('status','published').order('chapter_number',{ascending:true});
      allChapters = allChapResult.data || [];
      // Sync reading progress from Supabase so returning readers on new devices skip the timer
      if (currentSession) {
        try {
          var { data: rpData } = await db.from('reading_progress')
            .select('chapter_id').eq('user_id', currentSession.user.id)
            .eq('work_id', chapterData.work_id).eq('completed', true);
          if (rpData && rpData.length) {
            if (!readingProgress[chapterData.work_id]) readingProgress[chapterData.work_id] = {};
            rpData.forEach(function(r){ readingProgress[chapterData.work_id][r.chapter_id] = true; });
            localStorage.setItem('ds_reading_progress', JSON.stringify(readingProgress));
          }
        } catch(e) {}
      }

      // Check ownership
      isOwner = currentSession && workData && currentSession.user.id === workData.author_id;

      // ── ACCESS GUARD ──────────────────────────────────────────
      // Block access to locked chapters unless owner
      if (!isOwner && chapterData.chapter_number > 1) {
        var prevChapter = allChapters.find(function(c){ return c.chapter_number === chapterData.chapter_number - 1; });
        if (prevChapter) {
          var prevRead = readingProgress[workData.id] && readingProgress[workData.id][prevChapter.id];
          if (!prevRead) {
            // Find the last chapter they can access
            var lastUnlocked = allChapters[0];
            for (var i = 0; i < allChapters.length; i++) {
              var ch = allChapters[i];
              if (ch.chapter_number === 1) { lastUnlocked = ch; continue; }
              var pch = allChapters[i - 1];
              var pRead = readingProgress[workData.id] && readingProgress[workData.id][pch.id];
              if (pRead) { lastUnlocked = ch; } else { break; }
            }
            showToast('Read Chapter ' + lastUnlocked.chapter_number + ' first!', 'ti-lock');
            setTimeout(function(){
              window.location.href = 'chapter.html?id=' + lastUnlocked.id;
            }, 1500);
            return;
          }
        }
      }

      // Nav
      document.getElementById('nav-work-title').textContent = workData ? workData.title : '';
      document.getElementById('nav-work-title').href = 'story.html?id=' + chapterData.work_id;
      document.getElementById('nav-chapter-title').textContent = chapterData.title;
      document.getElementById('chapter-number').textContent = 'Chapter ' + chapterData.chapter_number;
      document.getElementById('chapter-title-display').textContent = chapterData.title;
      document.getElementById('chapter-meta-row').innerHTML =
        '<span><i class="ti ti-calendar" style="font-size:13px;"></i> ' + formatDate(chapterData.created_at) + '</span>' +
        '<span><i class="ti ti-file-text" style="font-size:13px;"></i> ' + (chapterData.word_count||0).toLocaleString() + ' words</span>';

      // Show edit button for owner
      if (isOwner) {
        document.getElementById('edit-chapter-btn').classList.add('visible');
      }

      // AUTHOR'S NOTE — top note shows above the content for everyone.
      // Bottom note shows below the content for the owner (full view, no
      // pagination) and is otherwise handled per-page in renderPage().
      renderAuthorNote('top', chapterData.author_note_top);
      if (isOwner) renderAuthorNote('bottom', chapterData.author_note_bottom);

      // POLLS — load and render. Top poll always shows; bottom poll only
      // shows on the last page for non-owners (handled in renderPage),
      // and immediately for the owner (full view, no pagination).
      await loadChapterPolls();
      renderPoll('top');
      if (isOwner) renderPoll('bottom');

      // Paginate — or show full content for owner (no timer, no pages)
      if (isOwner) {
        document.getElementById('page-content').innerHTML = chapterData.content || '';
        stripInlineColors(document.getElementById('page-content'));
        // Tag paragraphs with absolute indices for owner view
        var ownerParas = document.getElementById('page-content').querySelectorAll('p, h1, h2, h3, blockquote');
        ownerParas.forEach(function(p, i){ p.setAttribute('data-para-idx', i); });
        injectParaWraps();
        document.getElementById('timer-bar-wrap').style.display = 'none';
        document.getElementById('page-nav').style.display = 'none';
      } else {
        pages = paginateContent(chapterData.content || '');
        var savedPage = parseInt(localStorage.getItem('ds_page_' + chapterData.id)) || 0;
        if (savedPage >= pages.length) savedPage = 0;
        renderPage(savedPage);
        if (savedPage > 0) {
          showToast('Resumed from page ' + (savedPage + 1), 'ti-bookmark');
        }
      }
      renderChapterNav();
      document.getElementById('sp-tabs').style.display = 'flex';
      if(currentSession){ await dsBlock.load(currentSession.user.id); }
      await loadChapterComments();
      await spLoadComments();
      if(currentSession && !isOwner) { await echoInit(); }

      // AUTO-OPEN PARAGRAPH PANEL from notification hash (#para-N)
      var _hash = window.location.hash;
      if (_hash && _hash.startsWith('#para-')) {
        var _paraIdx = parseInt(_hash.replace('#para-', ''));
        if (!isNaN(_paraIdx)) {
          // Find which page this paragraph is on and navigate there first
          var _targetPage = 0;
          if (paraAbsoluteMap && paraAbsoluteMap.length) {
            for (var _pi = 0; _pi < paraAbsoluteMap.length; _pi++) {
              if (paraAbsoluteMap[_pi].indexOf(_paraIdx) !== -1) { _targetPage = _pi; break; }
            }
          }
          if (typeof renderPage === 'function' && pages && pages.length) {
            renderPage(_targetPage);
          }
          // Poll until the paragraph element exists in the DOM
          var _attempts = 0;
          var _paraPoller = setInterval(function() {
            _attempts++;
            var _paraEl = document.querySelector('[data-para-idx="' + _paraIdx + '"]');
            if (_paraEl || _attempts > 25) {
              clearInterval(_paraPoller);
              if (!_paraEl) return;
              var _quotedText = _paraEl.textContent || '';
              // Scroll paragraph into view first
              _paraEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
              // Open the panel after scroll settles
              setTimeout(function() {
                openParaPanel(_paraIdx, _quotedText);
              }, 400);
              // Clean the hash without reloading
              history.replaceState(null, '', window.location.pathname + window.location.search);
            }
          }, 150);
        }
      }

      // CHARACTER TITLES — show after chapter nav
      var ctSection = document.getElementById('character-titles-section');
      if (ctSection && chapterData && workData) {
        ctSection.style.display = 'block';
        await CharacterTitles.renderVotingSection(ctSection, chapterData.id, workData.id, currentSession);
        if (!ctSection.innerHTML.trim()) ctSection.style.display = 'none';
      }
    })();

    // ── ECHOES ────────────────────────────────────────────────────
    var echoTypes = [];
    var myEchoes = {};        // echo_type_id -> {id, chapter_id, paragraph_index, highlight_text}
    var allReaderEchosByPara = {}; // paragraph_index -> [{echo_type_id, count}] for ALL readers
    var activeEchoType = null; // currently selected echo type for placement
    var activeEchoParaTarget = null; // paragraph index pre-targeted from inline bubble
    var echoModeActive = false;

    async function echoInit() {
      if (!currentSession || !chapterData) return;
      // Show FAB
      document.getElementById('echo-fab').style.display = 'none';
      // Load echo types
      var { data: types } = await db.from('echo_types').select('*').order('rarity').order('label');
      echoTypes = types || [];
      // Load user's echoes for this work
      var { data: placed } = await db.from('reader_echoes')
        .select('*')
        .eq('work_id', chapterData.work_id)
        .eq('user_id', currentSession.user.id);
      myEchoes = {};
      (placed || []).forEach(function(e){ myEchoes[e.echo_type_id] = e; });

      // Fetch all readers' echoes for this chapter to power para panel display
      var { data: allPlaced } = await db.from('reader_echoes')
        .select('echo_type_id, paragraph_index')
        .eq('work_id', chapterData.work_id)
        .eq('chapter_id', chapterData.id)
        .not('paragraph_index', 'is', null);
      allReaderEchosByPara = {};
      (allPlaced || []).forEach(function(e) {
        var idx = e.paragraph_index;
        if (!allReaderEchosByPara[idx]) allReaderEchosByPara[idx] = {};
        allReaderEchosByPara[idx][e.echo_type_id] = (allReaderEchosByPara[idx][e.echo_type_id] || 0) + 1;
      });

      echoRenderPanel();
      echoRenderPage();
    }

    function echoRenderPanel() {
      var list = document.getElementById('echo-list');
      if (!list) return;
      var rarities = [{key:'common',label:'Common Echoes'},{key:'rare',label:'Rare Echoes'},{key:'ultra',label:'Ultra Rare'}];
      var html = '';
      rarities.forEach(function(r) {
        var items = echoTypes.filter(function(t){ return t.rarity === r.key; });
        if (!items.length) return;
        html += '<div class="echo-rarity-label ' + (r.key !== 'common' ? r.key : '') + '">' + r.label + '</div>';
        items.forEach(function(t) {
          var placed = myEchoes[t.id];
          var isSelected = activeEchoType === t.id;
          var isUsed = !!placed;
          var appliesHere = echoAppliesToHere(t);
          var cls = 'echo-item' + (isSelected ? ' selected' : '') + (isUsed && !isSelected ? ' used' : '') + (t.rarity !== 'common' ? ' ' + t.rarity : '');
          var whereText = t.applies_to === 'paragraph' ? 'Click a paragraph' : t.applies_to === 'chapter' ? 'Applies to this chapter' : 'Applies to the whole story';
          var placedText = placed ? ('Placed in Ch.' + (placed.chapter_id === chapterData.id ? 'this chapter' : '?')) : '';
          html += '<div class="' + cls + '" onclick="echoSelect(' + JSON.stringify(t.id) + ')">' +
            '<span class="echo-item-icon">' + t.icon + '</span>' +
            '<div class="echo-item-info">' +
              '<div class="echo-item-label ' + (t.rarity !== 'common' ? t.rarity : '') + '">' + t.label + '</div>' +
              (placed ? '<div class="echo-item-placed ' + (t.rarity !== 'common' ? t.rarity : '') + '">✓ ' + placedText + ' — click to move</div>'
                      : '<div class="echo-item-where">' + whereText + '</div>') +
            '</div>' +
            '</div>';
        });
      });
      list.innerHTML = html;
    }

    function echoAppliesToHere(type) {
      return type.applies_to === 'paragraph' || type.applies_to === 'chapter' || type.applies_to === 'story';
    }

    function echoSelect(typeId) {
      var type = echoTypes.find(function(t){ return t.id === typeId; });
      if (!type) return;
      if (activeEchoType === typeId) {
        // Deselect
        activeEchoType = null;
        echoModeActive = false;
        echoExitParaMode();
        echoRenderPanel();
        updateEchoHint('Select an Echo, then click a paragraph to place it.');
        return;
      }
      activeEchoType = typeId;
      echoModeActive = true;
      echoRenderPanel();
      if (type.applies_to === 'chapter') {
        echoPlaceOnChapter(typeId);
      } else if (type.applies_to === 'story') {
        echoPlaceOnStory(typeId);
      } else if (activeEchoParaTarget !== null) {
        // Pre-targeted from inline 🔮 bubble — place immediately
        var targetIdx = activeEchoParaTarget;
        activeEchoParaTarget = null;
        echoPlaceOnParagraph(typeId, targetIdx, null, null, null);
      } else {
        echoEnterParaMode();
        updateEchoHint('Now click a paragraph — or highlight text first.');
      }
    }

    function echoEnterParaMode() {
      var paras = document.querySelectorAll('#page-content p, #page-content h1, #page-content h2, #page-content h3, #page-content blockquote');
      paras.forEach(function(p, idx) {
        if (!p.textContent.trim()) return;
        p.classList.add('para-echo-mode');
        p.dataset.paraIdx = p.getAttribute('data-para-idx') || idx;
        p.addEventListener('click', echoParaClick);
      });
    }

    function echoExitParaMode() {
      var paras = document.querySelectorAll('#page-content p, #page-content h1, #page-content h2, #page-content h3, #page-content blockquote');
      paras.forEach(function(p) {
        p.classList.remove('para-echo-mode');
        p.removeEventListener('click', echoParaClick);
      });
    }

    function echoParaClick(e) {
      var paraEl = e.currentTarget;
      var paraIdx = parseInt(paraEl.dataset.paraIdx);
      // Check for text selection
      var sel = window.getSelection();
      var highlightText = null;
      var highlightStart = null;
      var highlightEnd = null;
      if (sel && sel.rangeCount && sel.toString().trim().length > 0) {
        var range = sel.getRangeAt(0);
        if (paraEl.contains(range.commonAncestorContainer)) {
          highlightText = sel.toString().trim();
          highlightStart = range.startOffset;
          highlightEnd = range.endOffset;
        }
      }
      echoPlaceOnParagraph(activeEchoType, paraIdx, highlightText, highlightStart, highlightEnd);
    }

    async function echoPlaceOnParagraph(typeId, paraIdx, highlightText, highlightStart, highlightEnd) {
      echoExitParaMode();
      activeEchoType = null;
      echoModeActive = false;
      // If already placed, remove first (move)
      var existing = myEchoes[typeId];
      if (existing) {
        await db.from('reader_echoes').delete().eq('id', existing.id);
      }
      var { data, error } = await db.from('reader_echoes').insert({
        work_id: chapterData.work_id,
        chapter_id: chapterData.id,
        echo_type_id: typeId,
        user_id: currentSession.user.id,
        paragraph_index: paraIdx,
        highlight_start: highlightStart,
        highlight_end: highlightEnd,
        highlight_text: highlightText
      }).select().single();
      if (error) { showToast('Could not place Echo: ' + (error.message||''), 'ti-x'); return; }
      myEchoes[typeId] = data;
      echoRenderPanel();
      echoRenderPage();
      showToast('Echo placed!', 'ti-sparkles');
    }

    async function echoPlaceOnChapter(typeId) {
      activeEchoType = null;
      echoModeActive = false;
      var existing = myEchoes[typeId];
      if (existing) { await db.from('reader_echoes').delete().eq('id', existing.id); }
      var { data, error } = await db.from('reader_echoes').insert({
        work_id: chapterData.work_id,
        chapter_id: chapterData.id,
        echo_type_id: typeId,
        user_id: currentSession.user.id
      }).select().single();
      if (error) { showToast('Could not place Echo.', 'ti-x'); return; }
      myEchoes[typeId] = data;
      echoRenderPanel();
      echoRenderPage();
      showToast('Echo placed on this chapter!', 'ti-sparkles');
    }

    async function echoPlaceOnStory(typeId) {
      activeEchoType = null;
      echoModeActive = false;
      var existing = myEchoes[typeId];
      if (existing) { await db.from('reader_echoes').delete().eq('id', existing.id); }
      var { data, error } = await db.from('reader_echoes').insert({
        work_id: chapterData.work_id,
        echo_type_id: typeId,
        user_id: currentSession.user.id
      }).select().single();
      if (error) { showToast('Could not place Echo.', 'ti-x'); return; }
      myEchoes[typeId] = data;
      echoRenderPanel();
      showToast('Masterpiece Echo placed on this story!', 'ti-sparkles');
    }

    function echoRenderPage() {
      if (!chapterData || !echoTypes || !echoTypes.length) return;
      var paras = document.querySelectorAll('#page-content p, #page-content h1, #page-content h2, #page-content h3, #page-content blockquote');
      var paraByIdx = {};
      paras.forEach(function(p, i) {
        var absIdx = parseInt(p.getAttribute('data-para-idx') !== null ? p.getAttribute('data-para-idx') : i);
        paraByIdx[absIdx] = p;
        p.classList.remove('echo-glow','rare','ultra');
        Array.from(p.querySelectorAll('mark.echo-highlight')).forEach(function(m){
          if (m.parentNode) m.parentNode.replaceChild(document.createTextNode(m.textContent), m);
        });
      });
      document.querySelectorAll('.echo-badge').forEach(function(b){ b.remove(); });

      // Group paragraph echoes by paragraph index for capping at 3
      var echosByPara = {};
      Object.values(myEchoes).forEach(function(echo) {
        if (echo.chapter_id !== chapterData.id) return;
        var t = echoTypes.find(function(x){ return x.id === echo.echo_type_id; });
        if (!t || t.applies_to !== 'paragraph') return;
        var idx = echo.paragraph_index;
        if (!echosByPara[idx]) echosByPara[idx] = [];
        echosByPara[idx].push(echo);
      });
      // Mark paragraphs that have echoes
      Object.keys(echosByPara).forEach(function(idx) {
        var p = paraByIdx[parseInt(idx)];
        if (p) p.classList.add('has-echo');
        // Update echo bubble count
        var eb = p ? p.querySelector('.para-echo-bubble') : null;
        if (eb) { var cnt = echosByPara[idx].length; if (cnt > 0) eb.innerHTML = '<span class="echo-bubble-icon">🔮</span><span class="echo-bubble-count">'+cnt+'</span>'; }
      });

      Object.values(myEchoes).forEach(function(echo) {
        if (echo.chapter_id !== chapterData.id) return;
        var type = echoTypes.find(function(t){ return t.id === echo.echo_type_id; });
        if (!type) return;
        if (type.applies_to === 'chapter') {
          // Add badge to last paragraph on page
          var allParas = Object.values(paraByIdx);
          var lastPara = allParas[allParas.length - 1];
          if (lastPara && !lastPara.querySelector('.echo-badge-chapter')) {
            var badge = document.createElement('span');
            badge.className = 'echo-badge echo-badge-chapter' + (type.rarity !== 'common' ? ' ' + type.rarity : '');
            badge.innerHTML = type.icon + ' ' + type.label;
            badge.title = 'Your Echo — click to remove';
            badge.onclick = function(){ echoRemove(echo.echo_type_id); };
            lastPara.appendChild(badge);
          }
          return;
        }
        if (type.applies_to !== 'paragraph') return;
        var paraEl = paraByIdx[echo.paragraph_index];
        if (!paraEl) return;
        // Cap at 3 badges per paragraph
        var existingBadges = paraEl.querySelectorAll('.echo-badge:not(.echo-badge-chapter)');
        if (existingBadges.length >= 3) {
          // Update/add overflow badge
          var overflow = paraEl.querySelector('.echo-badge-overflow');
          var total = (echosByPara[echo.paragraph_index] || []).length;
          if (!overflow) {
            overflow = document.createElement('span');
            overflow.className = 'echo-badge echo-badge-overflow';
            paraEl.appendChild(overflow);
          }
          overflow.innerHTML = '+' + (total - 3) + ' more';
          return;
        }
        var rarityClass = type.rarity !== 'common' ? ' ' + type.rarity : '';
        paraEl.classList.add('echo-glow');
        if (type.rarity !== 'common') paraEl.classList.add(type.rarity);
        var badge = document.createElement('span');
        badge.className = 'echo-badge' + rarityClass;
        badge.innerHTML = type.icon + ' ' + type.label;
        badge.title = 'Your Echo — click to remove';
        badge.onclick = function(e) { e.stopPropagation(); echoRemove(echo.echo_type_id); };
        paraEl.appendChild(badge);
        // Apply highlight if text was selected
        if (echo.highlight_text && echo.highlight_start !== null) {
          try {
            var text = paraEl.childNodes[0];
            if (text && text.nodeType === 3) {
              var before = text.textContent.slice(0, echo.highlight_start);
              var highlighted = text.textContent.slice(echo.highlight_start, echo.highlight_end);
              var after = text.textContent.slice(echo.highlight_end);
              var rarityMark = type.rarity !== 'common' ? ' ' + type.rarity : '';
              paraEl.childNodes[0].replaceWith(
                document.createTextNode(before),
                Object.assign(document.createElement('mark'), {
                  className: 'echo-highlight' + rarityMark,
                  textContent: highlighted
                }),
                document.createTextNode(after)
              );
            }
          } catch(e) {}
        }
      });
    }

    async function echoRemove(typeId) {
      var existing = myEchoes[typeId];
      if (!existing) return;
      await db.from('reader_echoes').delete().eq('id', existing.id);
      delete myEchoes[typeId];
      echoRenderPanel();
      echoRenderPage();
      showToast('Echo removed.', 'ti-check');
    }

    function toggleEchoPanel() {
      var panel = document.getElementById('echo-panel');
      var btn = document.getElementById('echo-fab-btn');
      var open = panel.style.display === 'block';
      panel.style.display = open ? 'none' : 'block';
      btn.classList.toggle('active', !open);
      if (!open) echoRenderPanel();
    }

    function closeEchoPanel() {
      document.getElementById('echo-panel').style.display = 'none';
      document.getElementById('echo-fab-btn').classList.remove('active');
      echoExitParaMode();
      activeEchoType = null;
    }

    function updateEchoHint(msg) {
      var el = document.getElementById('echo-hint');
      if (el) el.textContent = msg;
    }

  </script>
