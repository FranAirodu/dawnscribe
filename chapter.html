<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      var t = localStorage.getItem('ds_theme'); if (t) document.documentElement.setAttribute('data-theme', t);
      var w = localStorage.getItem('ds_reader_width'); if (w) document.documentElement.style.setProperty('--reader-width', w);
      var s = localStorage.getItem('ds_reader_size');  if (s) document.documentElement.style.setProperty('--reader-size', s + 'px');
      var l = localStorage.getItem('ds_reader_lh');    if (l) document.documentElement.style.setProperty('--reader-lh', l);
    })();
  </script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DawnScribe — Reading</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="blockUtils.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&family=Merriweather:wght@300;400;700&family=Source+Serif+4:wght@300;400;600&family=Nunito:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="characterTitles.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
  <script src="readingFonts.js"></script>
  <script>
    (function(){
      if (window.READING_FONTS_GOOGLE_URL) {
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = window.READING_FONTS_GOOGLE_URL;
        document.head.appendChild(l);
      }
      // Register font whitelist BEFORE any Quill instance is created
      if (window.READING_FONTS) {
        var fontKeys = Object.keys(window.READING_FONTS);
        var Font = Quill.import('formats/font');
        Font.whitelist = fontKeys;
        Quill.register(Font, true);

        var css = '';
        fontKeys.forEach(function(key){
          var f = window.READING_FONTS[key];
          css += '.ql-font-' + key + '{font-family:' + f.css + ';}';
          css += '.page-content .ql-font-' + key + '{font-family:' + f.css + ';}';
          css += '.ql-snow .ql-picker.ql-font .ql-picker-label[data-value="' + key + '"]::before,';
          css += '.ql-snow .ql-picker.ql-font .ql-picker-item[data-value="' + key + '"]::before{';
          css += 'content:"' + f.label + '";font-family:' + f.css + ';}';
        });
        css += '.ql-snow .ql-picker.ql-font .ql-picker-label::before,';
        css += '.ql-snow .ql-picker.ql-font .ql-picker-item::before{content:"Default";}';
        css += '.ql-snow .ql-picker.ql-font{width:170px;}';
        css += '.ql-snow .ql-picker.ql-font .ql-picker-options{max-height:260px;overflow-y:auto;}';
        var styleTag = document.createElement('style');
        styleTag.textContent = css;
        document.head.appendChild(styleTag);
      }
    })();
  </script>
  <style>
    :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--bg4:#22223a;--accent:#2dd4bf;--accent2:#0d9488;--text:#f1f0ff;--text2:#9b9bc0;--text3:#5a5a80;--border:rgba(255,255,255,0.07);--red:#f87171;--green:#34d399;--gold:#f59e0b;--shadow:rgba(0,0,0,0.4);
      --reader-bg:#1a1a26;--reader-text:#9b9bc0;--reader-strong:#f1f0ff;--reader-font:'Lato',sans-serif;--reader-size:16px;--reader-lh:1.8;--reader-width:650px;}
    html[data-theme="light"]{--bg:#f4f4f8;--bg2:#ffffff;--bg3:#ebebf2;--bg4:#d8d8e8;--accent:#0d9488;--accent2:#0f766e;--text:#0a0a0f;--text2:#3a3a5c;--text3:#7a7a9a;--border:rgba(0,0,0,0.08);--red:#dc2626;--green:#059669;--gold:#d97706;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;font-size:15px;line-height:1.6;min-height:100vh;}

    /* NAV */
    nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:12px;}
    .nav-left{display:flex;align-items:center;gap:10px;min-width:0;}
    .nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
    .logo{font-family:'Cinzel',serif;font-size:18px;color:var(--accent);text-decoration:none;letter-spacing:1px;flex-shrink:0;}
    .logo span{color:#f1f0ff;}
    html[data-theme="light"] .logo span{color:#0a0a0f;}
    .nav-chapter-info{min-width:0;}
    .nav-work-title{font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none;transition:opacity 0.2s;}
    .nav-work-title:hover{opacity:0.75;}
    .nav-chapter-title{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .nav-icon-btn{background:none;border:1px solid var(--border);border-radius:7px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:16px;transition:all 0.2s;text-decoration:none;flex-shrink:0;}
    .nav-icon-btn:hover{border-color:var(--accent);color:var(--accent);}
    .edit-chapter-btn{background:rgba(45,212,191,0.08);border:1px solid rgba(45,212,191,0.25);border-radius:7px;padding:6px 12px;color:var(--accent);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;display:none;align-items:center;gap:5px;transition:all 0.2s;}
    .edit-chapter-btn:hover{background:rgba(45,212,191,0.15);}
    .edit-chapter-btn.visible{display:flex;}

    /* READING AREA */
    .reader-wrap{max-width:var(--reader-width);margin:0 auto;padding:40px 24px 40px;transition:margin-right 0.28s cubic-bezier(.4,0,.2,1),max-width 0.28s cubic-bezier(.4,0,.2,1);}
    /* Wide/Full: shrink and shift left to make room for panel */
    body.sp-panel-open .reader-wrap,body.para-panel-active .reader-wrap{margin-right:320px;margin-left:auto;max-width:calc(var(--reader-width) - 160px);}
    /* Narrow/Medium: just anchor to the left, panel overlays */
    body.panel-open-overlay .reader-wrap{margin-right:0;margin-left:0 !important;max-width:var(--reader-width) !important;}
    .chapter-header{margin-bottom:32px;text-align:center;}
    .chapter-number{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:8px;}
    .chapter-title{font-family:'Cinzel',serif;font-size:24px;font-weight:700;color:var(--text);margin-bottom:12px;}
    .chapter-meta-row{display:flex;align-items:center;justify-content:center;gap:14px;font-size:12px;color:var(--text3);}
    .chapter-divider{width:60px;height:2px;background:var(--border);margin:20px auto;}
    .author-note{background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:14px 16px;margin:0 0 20px;font-size:13px;line-height:1.7;color:var(--text2);}
    .author-note-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:5px;}
    .author-note p{margin:0 0 8px;}
    .author-note p:last-child{margin-bottom:0;}
    .author-note-bottom{margin:24px 0 0;}

    /* ── POLL ─────────────────────────────────────────────── */
    .poll-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin:0 0 20px;}
    .poll-card-bottom{margin:24px 0 0;}
    .poll-question{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:7px;}
    .poll-question i{color:var(--accent);}
    .poll-meta{font-size:11px;color:var(--text3);margin-bottom:14px;}
    .poll-options{display:flex;flex-direction:column;gap:8px;}
    .poll-option{position:relative;border:1px solid var(--border);border-radius:9px;padding:11px 14px;cursor:pointer;transition:all 0.15s;overflow:hidden;background:var(--bg3);}
    .poll-option:hover{border-color:rgba(45,212,191,0.3);}
    .poll-option.selected{border-color:var(--accent);background:rgba(45,212,191,0.06);}
    .poll-option.disabled{cursor:default;}
    .poll-option-fill{position:absolute;top:0;left:0;bottom:0;background:rgba(45,212,191,0.10);transition:width 0.4s;z-index:0;}
    .poll-option-row{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .poll-option-label{font-size:13px;color:var(--text);display:flex;align-items:center;gap:8px;min-width:0;}
    .poll-option-label i{color:var(--accent);font-size:15px;flex-shrink:0;}
    .poll-option-pct{font-size:12px;font-weight:700;color:var(--text3);flex-shrink:0;}
    .poll-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap;}
    .poll-vote-count{font-size:11px;color:var(--text3);}
    .poll-submit-btn{background:var(--accent2);border:none;border-radius:8px;padding:8px 18px;color:white;font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:5px;}
    .poll-submit-btn:hover{background:var(--accent);color:var(--bg);}
    .poll-submit-btn:disabled{opacity:0.4;cursor:not-allowed;}
    .poll-closed-note{font-size:11px;color:var(--text3);font-style:italic;}
    .poll-locked-note{font-size:11px;color:var(--text3);text-align:center;padding:8px 0 0;}

    /* PAGE CONTENT */
    .page-content{background:var(--reader-bg);border-radius:12px;padding:32px;margin-bottom:24px;font-family:var(--reader-font);font-size:var(--reader-size);line-height:var(--reader-lh);color:var(--reader-text);min-height:300px;transition:background 0.3s,color 0.3s;}
    .page-content p{margin-bottom:0.6em;text-indent:2em;}
    .page-content p+p{margin-top:0;}
    .page-content h1+p,.page-content h2+p,.page-content h3+p,.page-content blockquote+p,.page-content p:first-child{text-indent:0;}
    .page-content h1,.page-content h2,.page-content h3{font-family:'Cinzel',serif;color:var(--text);margin-bottom:0.5em;margin-top:1em;}
    .page-content blockquote{border-left:3px solid var(--accent);padding-left:16px;color:var(--text3);font-style:italic;margin:1em 0;}
    .page-content strong{color:var(--reader-strong);}
    .page-content ul,.page-content ol{padding-left:24px;margin-bottom:1em;}

    /* TIMER BAR */
    .timer-bar-wrap{margin-bottom:16px;}
    .timer-bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:6px;}
    .timer-bar{height:3px;background:var(--bg4);border-radius:2px;overflow:hidden;}
    .timer-bar-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.5s linear;width:0%;}
    .timer-bar-fill.done{background:var(--green);}

    /* PAGE NAV */
    .page-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:32px;flex-wrap:wrap;}
    .page-nav-btn{background:none;border:1px solid var(--border);border-radius:9px;padding:10px 20px;color:var(--text2);font-size:13px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;}
    .page-nav-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
    .page-nav-btn:disabled{opacity:0.35;cursor:not-allowed;}
    .page-nav-btn.primary{background:var(--accent2);border-color:var(--accent2);color:white;}
    .page-nav-btn.primary:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:var(--bg);}
    .page-nav-btn.locked{opacity:0.5;cursor:not-allowed;}
    .page-info{font-size:13px;color:var(--text3);}

    /* CHAPTER NAV */
    .chapter-nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:40px;}
    .chapter-nav-btn{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all 0.2s;text-decoration:none;display:flex;flex-direction:column;gap:3px;}
    .chapter-nav-btn:hover{border-color:var(--accent);}
    .chapter-nav-btn.next{text-align:right;align-items:flex-end;}
    .chapter-nav-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text3);}
    .chapter-nav-title{font-size:13px;font-weight:700;color:var(--text);}

    /* PARAGRAPH COMMENTS */
    .para-wrap{position:relative;}
    .reader-settings-btn{background:none;border:1px solid var(--border);border-radius:7px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:16px;transition:all 0.2s;position:relative;}
    .reader-settings-btn:hover{border-color:var(--accent);color:var(--accent);}
    .reader-settings-panel{position:absolute;top:calc(100% + 10px);right:0;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px;width:300px;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,0.3);display:none;flex-direction:column;gap:18px;}
    .reader-settings-panel.open{display:flex;}
    .rs-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text3);margin-bottom:8px;}
    .rs-options{display:flex;gap:8px;flex-wrap:wrap;}
    .rs-opt{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:13px;color:var(--text2);cursor:pointer;transition:all 0.2s;font-family:'Lato',sans-serif;}
    .rs-opt:hover{border-color:var(--accent);color:var(--accent);}
    .rs-opt.active{background:rgba(45,212,191,0.12);border-color:var(--accent);color:var(--accent);font-weight:700;}
    .rs-slider{width:100%;accent-color:var(--accent);}
    .para-wrap:hover .para-comment-btn{opacity:1;}
    .para-comment-btn:hover{border-color:var(--accent);color:var(--accent);}
    .para-comment-btn .count{position:absolute;top:-5px;right:-5px;background:var(--accent);color:white;border-radius:50%;width:14px;height:14px;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700;}

    /* BOTTOM COMMENTS */
    .bottom-section{border-top:1px solid var(--border);padding-top:32px;margin-bottom:40px;}
    .bottom-section-title{font-family:'Cinzel',serif;font-size:16px;font-weight:700;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:7px;}
    .bottom-section-title i{color:var(--accent);}
    .comment-card{background:var(--bg2);border-radius:10px;padding:14px;margin-bottom:10px;}
    .comment-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
    .comment-avatar{width:30px;height:30px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text3);overflow:hidden;flex-shrink:0;}
    .comment-avatar img{width:100%;height:100%;object-fit:cover;}
    .comment-name{font-size:13px;font-weight:700;color:var(--text);}
    .comment-time{font-size:11px;color:var(--text3);margin-left:auto;}
    .comment-body{font-size:13px;color:var(--text2);line-height:1.6;}
    .comment-gif{max-width:240px;border-radius:8px;margin-top:8px;}
    .comment-input-area{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:12px;}
    .comment-textarea{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;font-family:'Lato',sans-serif;outline:none;width:100%;resize:none;min-height:70px;transition:all 0.2s;margin-bottom:8px;}
    .comment-textarea:focus{border-color:var(--accent);}
    .comment-actions-row{display:flex;gap:8px;justify-content:flex-end;}
    .comment-submit{background:var(--accent2);border:none;border-radius:8px;padding:8px 18px;color:white;font-size:13px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;transition:all 0.2s;}
    .comment-submit:hover{background:var(--accent);color:var(--bg);}
    .login-prompt{font-size:13px;color:var(--text3);padding:12px 0;}
    .login-prompt a{color:var(--accent);}
    .empty-comments{text-align:center;padding:24px;color:var(--text3);font-size:13px;}
    .comment-reply-btn{background:transparent;border:none;color:var(--text3);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;padding:2px 6px;border-radius:5px;transition:color 0.2s;display:inline-flex;align-items:center;gap:3px;margin-top:6px;}
    .comment-reply-btn:hover{color:var(--accent);}
    .comment-block-btn{background:transparent;border:none;color:var(--text3);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;padding:2px 6px;border-radius:5px;transition:color 0.2s;display:inline-flex;align-items:center;gap:3px;margin-top:6px;}
    .comment-block-btn:hover{color:var(--red,#f87171);}
    .comment-delete-btn{background:transparent;border:none;color:var(--text3);font-size:12px;cursor:pointer;padding:2px 6px;border-radius:5px;transition:color 0.2s;display:inline-flex;align-items:center;gap:3px;margin-top:6px;margin-left:auto;}
    .comment-delete-btn:hover{color:var(--red);}
    .comment-actions{display:flex;align-items:center;gap:4px;margin-top:4px;}
    .replies-list{margin-top:8px;padding-left:16px;border-left:2px solid var(--border);display:flex;flex-direction:column;gap:8px;}
    .reply-card{background:var(--bg3);border-radius:8px;padding:10px 12px;}
    .reply-input-wrap{margin-top:8px;padding-left:16px;display:flex;flex-direction:column;gap:6px;}
    .reply-textarea{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:12px;font-family:'Lato',sans-serif;outline:none;width:100%;resize:none;min-height:56px;transition:border-color 0.2s;}
    .reply-textarea:focus{border-color:var(--accent);}
    .reply-actions{display:flex;gap:8px;justify-content:flex-end;}
    .reply-cancel-btn{background:transparent;border:1px solid var(--border);border-radius:7px;padding:5px 14px;color:var(--text2);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;transition:all 0.2s;}
    .reply-cancel-btn:hover{border-color:var(--text3);}
    .reply-submit-btn{background:var(--accent2);border:none;border-radius:7px;padding:5px 14px;color:white;font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:5px;}
    .reply-submit-btn:hover{background:var(--accent);color:var(--bg);}

    /* PARA COMMENT PANEL — right slide */
    .para-panel-sidebar{position:fixed;top:56px;right:0;width:340px;height:calc(100vh - 56px);background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(100%);transition:transform 0.28s cubic-bezier(.4,0,.2,1);z-index:120;box-shadow:-4px 0 24px rgba(0,0,0,0.35);}
    .para-panel-sidebar.open{transform:translateX(0);}
    .para-panel-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
    .para-panel-title{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:7px;}
    .para-panel-title i{color:var(--accent);}
    .para-panel-close{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:2px;transition:color 0.2s;}
    .para-panel-close:hover{color:var(--text);}
    .para-panel-quoted{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg3);flex-shrink:0;}
    .para-panel-quoted-text{font-size:12px;color:var(--text3);font-style:italic;line-height:1.5;max-height:52px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
    .para-panel-body{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;}
    .para-panel-footer{padding:10px 16px;border-top:1px solid var(--border);flex-shrink:0;}
    .para-input-row{display:flex;gap:8px;}
    .para-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;font-family:'Lato',sans-serif;outline:none;transition:all 0.2s;}
    .para-input:focus{border-color:var(--accent);}
    .para-send-btn{background:var(--accent2);border:none;border-radius:8px;padding:8px 12px;color:white;font-size:14px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;}
    .para-send-btn:hover{background:var(--accent);color:var(--bg);}

    /* Para comment card */
    .para-cmt-card{background:var(--bg3);border-radius:10px;padding:10px 12px;}
    .para-cmt-card.is-reply{background:var(--bg4);border-radius:8px;padding:8px 10px;}
    .para-cmt-header{display:flex;align-items:center;gap:7px;margin-bottom:6px;}
    .para-cmt-name{font-size:12px;font-weight:700;color:var(--text);}
    .para-cmt-name a{color:var(--text);text-decoration:none;}
    .para-cmt-name a:hover{color:var(--accent);}
    .para-cmt-time{font-size:10px;color:var(--text3);margin-left:auto;}
    .para-cmt-body{font-size:13px;color:var(--text2);line-height:1.55;word-break:break-word;}
    .para-cmt-gif{max-width:100%;border-radius:7px;margin-top:7px;}

    function renderAuthorNote(pos, text) {

      if (!el) return;
      if (!text || !text.trim()) {
        el.style.display = 'none';

      chapterPolls = [];
      if (!chapterData) return;

      var pollsResult = await db.from('chapter_polls').select('*').eq('chapter_id', chapterData.id);
      var polls = pollsResult.data || [];
      if (polls.length === 0) return;

      var pollIds = polls.map(function(p){ return p.id; });
      var votesResult = await db.from('chapter_poll_votes').select('poll_id,user_id,option_indices').in('poll_id', pollIds);
      var allVotes = votesResult.data || [];

      chapterPolls = polls.map(function(p) {
        var votesForPoll = allVotes.filter(function(v){ return v.poll_id === p.id; });
        var voteCounts = (p.options || []).map(function(){ return 0; });
        votesForPoll.forEach(function(v) {
          (v.option_indices || []).forEach(function(idx) {
            if (voteCounts[idx] !== undefined) voteCounts[idx]++;
          });
        });
        var myVote = null;
        if (currentSession) {
          var mine = votesForPoll.find(function(v){ return v.user_id === currentSession.user.id; });
          if (mine) myVote = mine.option_indices || [];
        }
        return {
          poll: p,
          voteCounts: voteCounts,
          totalVoters: votesForPoll.length,
          myVote: myVote,
          selected: myVote ? myVote.slice() : []
        };
      });
    }

    function pollIsClosed(poll) {
      return !!(poll.closes_at && new Date(poll.closes_at) < new Date());
    }

    // Should results (bars/percentages) be visible to this viewer?
    function pollShowResults(state) {
      var p = state.poll;
      if (p.show_votes_publicly) return true;
      if (state.myVote !== null) return true; // voters can always see results of polls they voted in
      if (p.allow_results_without_voting) return true;
      if (pollIsClosed(p)) return true;
      return false;
    }

    function renderPoll(pos) {
      var el = document.getElementById('poll-' + pos);
      if (!el) return;

      var state = chapterPolls.find(function(s){ return s.poll.position === pos; });
      if (!state) {
        el.style.display = 'none';
        el.innerHTML = '';
        return;
      }

      var p = state.poll;
      var closed = pollIsClosed(p);
      var showResults = pollShowResults(state);
      var hasVoted = state.myVote !== null;
      var canVote = !!currentSession && !closed && (!hasVoted || p.allow_change);

      var totalVotes = state.voteCounts.reduce(function(a,b){ return a+b; }, 0);

      var optionsHtml = (p.options || []).map(function(optText, idx) {
        var count = state.voteCounts[idx] || 0;
        var pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
        var isSelected = state.selected.indexOf(idx) !== -1;
        var icon = isSelected ? 'ti-circle-check-filled' : (p.max_choices === 1 ? 'ti-circle' : 'ti-square');

        var fillHtml = showResults ? '<div class="poll-option-fill" style="width:' + pct + '%;"></div>' : '';
        var pctHtml = showResults ? '<span class="poll-option-pct">' + pct + '% (' + count + ')</span>' : '';
        var optClass = 'poll-option' + (isSelected ? ' selected' : '') + (canVote ? '' : ' disabled');
        var clickHandler = canVote ? ' onclick="togglePollOption(\'' + pos + '\',' + idx + ')"' : '';

        return '<div class="' + optClass + '"' + clickHandler + '>' +
          fillHtml +
          '<div class="poll-option-row">' +
            '<span class="poll-option-label"><i class="ti ' + icon + '"></i>' + escHtml(optText) + '</span>' +
            pctHtml +
          '</div>' +
        '</div>';
      }).join('');

      var maxText = p.max_choices === 0 ? 'Choose any number' : (p.max_choices === 1 ? 'Choose 1' : 'Choose up to ' + p.max_choices);
      var closesText = closed ? 'Poll closed' : (p.closes_at ? 'Closes ' + formatDate(p.closes_at) : '');
      var metaParts = [maxText];
      if (closesText) metaParts.push(closesText);

      var footerHtml = '';
      if (!currentSession) {
        footerHtml = '<div class="poll-locked-note">Log in to vote in this poll.</div>';
      } else if (closed) {
        footerHtml = '<div class="poll-footer"><span class="poll-vote-count">' + totalVotes + ' vote' + (totalVotes===1?'':'s') + '</span><span class="poll-closed-note">This poll is closed.</span></div>';
      } else if (canVote) {
        var changed = JSON.stringify(state.selected.slice().sort()) !== JSON.stringify((state.myVote || []).slice().sort());
        var btnLabel = hasVoted ? 'Update Vote' : 'Submit Vote';
        var btnDisabled = state.selected.length === 0 || (hasVoted && !changed);
        footerHtml = '<div class="poll-footer">' +
          '<span class="poll-vote-count">' + totalVotes + ' vote' + (totalVotes===1?'':'s') + '</span>' +
          '<button class="poll-submit-btn" onclick="submitPollVote(\'' + pos + '\')"' + (btnDisabled ? ' disabled' : '') + '><i class="ti ti-check"></i> ' + btnLabel + '</button>' +
        '</div>';
      } else {
        footerHtml = '<div class="poll-footer"><span class="poll-vote-count">' + totalVotes + ' vote' + (totalVotes===1?'':'s') + '</span><span class="poll-closed-note">You voted in this poll.</span></div>';
      }

      var pollCollapsed = el.dataset.collapsed === 'true';
      el.innerHTML =
        '<div class="poll-question" onclick="togglePollCollapse(\'' + pos + '\')">' +
          '<div class="poll-question-left"><i class="ti ti-chart-bar"></i>' + escHtml(p.question) + '</div>' +
          '<i class="ti ti-chevron-down poll-chevron' + (pollCollapsed ? ' collapsed' : '') + '"></i>' +
        '</div>' +
        (pollCollapsed ? '' :
          '<div class="poll-meta">' + metaParts.join(' &middot; ') + '</div>' +
          '<div class="poll-options">' + optionsHtml + '</div>' +
          footerHtml
        );
      el.style.display = 'block';
    }

    function togglePollCollapse(pos) {
      var el = document.getElementById('poll-' + pos);
      if (!el) return;
      el.dataset.collapsed = el.dataset.collapsed === 'true' ? 'false' : 'true';
      renderPoll(pos);
    }

    function togglePollOption(pos, idx) {
      var state = chapterPolls.find(function(s){ return s.poll.position === pos; });
      if (!state) return;
      var p = state.poll;
      var sel = state.selected;
      var i = sel.indexOf(idx);

      if (p.max_choices === 1) {
        state.selected = (i !== -1) ? [] : [idx];
      } else {
        if (i !== -1) {
          sel.splice(i, 1);
        } else {
          if (p.max_choices === 0 || sel.length < p.max_choices) {
            sel.push(idx);
          } else {
            showToast('You can only choose up to ' + p.max_choices + '.', 'ti-alert-triangle');
            return;
          }
        }
      }
      renderPoll(pos);
    }

    async function submitPollVote(pos) {
      var state = chapterPolls.find(function(s){ return s.poll.position === pos; });
      if (!state || !currentSession) return;
      if (state.selected.length === 0) return;

      var { error } = await db.from('chapter_poll_votes').upsert({
        poll_id: state.poll.id,
        user_id: currentSession.user.id,
        option_indices: state.selected,
        updated_at: new Date().toISOString()
      }, { onConflict: 'poll_id,user_id' });

      if (error) {
        showToast('Could not save your vote: ' + error.message, 'ti-alert-triangle');
        return;
      }

      // Update local vote counts optimistically
      var prevVote = state.myVote || [];
      prevVote.forEach(function(idx) {
        if (state.voteCounts[idx] > 0) state.voteCounts[idx]--;
      });
      state.selected.forEach(function(idx) {
        state.voteCounts[idx]++;
      });
      if (state.myVote === null) state.totalVoters++;
      state.myVote = state.selected.slice();

      showToast('Vote recorded!', 'ti-check');
      renderPoll(pos);
    }

    function showToast(msg, icon){
      var t = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg||'Done!';
      t.querySelector('i').className='ti '+(icon||'ti-check');
      t.classList.add('show');
      setTimeout(function(){ t.classList.remove('show'); },2800);
    }

    // ── READING SETTINGS ─────────────────────────────────────────
    function applyReadingSettings() {
      var saved = localStorage.getItem('ds_reading');
      if (!saved) return;
      try {
        var r = JSON.parse(saved);
        var bgMap = { default:'#1a1a26', black:'#000000', sepia:'#f5e6c8', white:'#ffffff', cream:'#faf3e6', nightblue:'#0d1b2a', gray:'#3a3a3f' };
        var colorMap = { default:'#9b9bc0', black:'#888888', sepia:'#5c4a2a', white:'#333333', cream:'#4a4035', nightblue:'#a8c0d8', gray:'#d8d8dc' };
        var strongMap = { default:'#f1f0ff', black:'#dddddd', sepia:'#2a1f0a', white:'#000000', cream:'#1a1510', nightblue:'#e0eef8', gray:'#ffffff' };
        if (r.bg) { document.documentElement.style.setProperty('--reader-bg', bgMap[r.bg]||bgMap.default); document.documentElement.style.setProperty('--reader-text', colorMap[r.bg]||colorMap.default); document.documentElement.style.setProperty('--reader-strong', strongMap[r.bg]||strongMap.default); }
        // Font: only apply reader override here. If no override, the author's
        // chapter-level font (chapterData.font) is applied later in init()
        // once chapterData has loaded — see applyChapterFont().
        if (r.font_override && r.font && window.READING_FONTS) {
          var fontEntry = window.READING_FONTS[r.font] || window.READING_FONTS.lato;
          document.documentElement.style.setProperty('--reader-font', fontEntry.css);
        } else if (window.READING_FONTS) {
          document.documentElement.style.setProperty('--reader-font', window.READING_FONTS.lato.css);
        }
        if (r.fontsize) document.documentElement.style.setProperty('--reader-size', r.fontsize+'px');
        if (r.lineheight) document.documentElement.style.setProperty('--reader-lh', (r.lineheight/10).toFixed(1));
        if (r.width) document.documentElement.style.setProperty('--reader-width', r.width+'px');
      } catch(e){}
    }

    // Apply the author's chapter-level default font, unless the reader has
    // chosen to override it in their settings.
    function applyChapterFont() {
      if (!window.READING_FONTS) return;
      try {
        var saved = localStorage.getItem('ds_reading');
        var r = saved ? JSON.parse(saved) : {};
        if (r.font_override && r.font) return; // reader override already applied
        var key = (chapterData && chapterData.font) || 'lato';
        var fontEntry = window.READING_FONTS[key] || window.READING_FONTS.lato;
        document.documentElement.style.setProperty('--reader-font', fontEntry.css);
      } catch(e){}
    }

    // ── PAGINATE CONTENT ─────────────────────────────────────────
    var paraAbsoluteMap = []; // maps page → [absIdx of each para on that page]

    function paginateContent(html) {
      var div = document.createElement('div');
      div.innerHTML = html;
      var paras = Array.from(div.querySelectorAll('p, h1, h2, h3, blockquote, ul, ol'));
      if (!paras.length) { paras = [div]; }

      var pageList = [];
      var currentPageParas = [];
      var currentWords = 0;
      var absIdx = 0;
      paraAbsoluteMap = [];
      var pageIndices = [];

      paras.forEach(function(p) {
        var words = p.textContent.trim().split(/\s+/).filter(Boolean).length;
        if (currentWords + words > WORDS_PER_PAGE && currentPageParas.length > 0) {
          pageList.push(currentPageParas);
          paraAbsoluteMap.push(pageIndices);
          currentPageParas = [];
          pageIndices = [];
          currentWords = 0;
        }
        p.setAttribute('data-para-idx', absIdx);
        currentPageParas.push(p.outerHTML || p.innerHTML);
        pageIndices.push(absIdx);
        currentWords += words;
        absIdx++;
      });
      if (currentPageParas.length) {
        pageList.push(currentPageParas);
        paraAbsoluteMap.push(pageIndices);
      }
      if (!pageList.length) { pageList.push([div.innerHTML]); paraAbsoluteMap.push([0]); }
      return pageList;
    }

    // ── RENDER PAGE ──────────────────────────────────────────────
    // Strip inline color/background styles injected by Word/LibreOffice paste
    function stripInlineColors(container) {
      container.querySelectorAll('[style]').forEach(function(el) {
        el.style.removeProperty('color');
        el.style.removeProperty('background-color');
        el.style.removeProperty('background');
        // If style attr is now empty, remove it entirely
        if (!el.getAttribute('style').trim()) el.removeAttribute('style');
      });
    }

    function renderPage(idx) {
      currentPage = idx;
      // Save page position per chapter
      if (chapterData && chapterData.id) {
        localStorage.setItem('ds_page_' + chapterData.id, idx);
      }
      var content = document.getElementById('page-content');
      content.innerHTML = pages[idx].join('');
      stripInlineColors(content);
      injectParaWraps();
      echoRenderPage();
      document.getElementById('page-info').textContent = 'Page ' + (idx+1) + ' of ' + pages.length;
      document.getElementById('prev-page-btn').disabled = idx === 0;

      var nextBtn = document.getElementById('next-page-btn');
      var isLastPage = idx === pages.length - 1;
      var alreadyRead = isChapterRead();

      // Bottom author's note only appears on the final page
      renderAuthorNote('bottom', isLastPage ? chapterData.author_note_bottom : null);
      // Bottom poll only appears on the final page
      if (isLastPage) {
        renderPoll('bottom');
      } else {
        document.getElementById('poll-bottom').style.display = 'none';
      }

      if (isLastPage) {
        nextBtn.innerHTML = '<i class="ti ti-check"></i> Finish Chapter';
        nextBtn.onclick = finishChapter;
      } else {
        nextBtn.innerHTML = 'Next Page <i class="ti ti-chevron-right"></i>';
        nextBtn.onclick = nextPage;
      }

      // Timer — only for unread chapters
      if (!alreadyRead) {
        // Count words on this page to scale the timer for short last pages
        var pageWordCount = (pages[idx] || []).join(' ').replace(/<[^>]+>/g, ' ').trim().split(/\s+/).filter(Boolean).length;
        startTimer(nextBtn, pageWordCount);
      } else {
        // Already read — no timer, free navigation
        nextBtn.disabled = false;
        nextBtn.classList.remove('locked');
        document.getElementById('timer-bar-wrap').style.display = 'none';
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ── TIMER ────────────────────────────────────────────────────
    function startTimer(nextBtn, pageWords) {
      clearInterval(timerInterval);
      timerDone = false;
      nextBtn.disabled = true;
      nextBtn.classList.add('locked');

      // Scale timer to page length: full 120s for 500 words, proportionally less for shorter pages, min 15s
      var wordsForTimer = pageWords || WORDS_PER_PAGE;
      var scaledSeconds = Math.max(15, Math.round(TIMER_SECONDS * (wordsForTimer / WORDS_PER_PAGE)));

      var wrap = document.getElementById('timer-bar-wrap');
      var fill = document.getElementById('timer-fill');
      var countdown = document.getElementById('timer-countdown');
      var label = document.getElementById('timer-label');
      wrap.style.display = 'block';
      fill.style.width = '0%';
      fill.classList.remove('done');
      label.textContent = 'Reading timer — please read the page before continuing';

      var elapsed = 0;
      timerInterval = setInterval(function() {
        elapsed++;
        var pct = Math.min((elapsed / scaledSeconds) * 100, 100);
        fill.style.width = pct + '%';
        var remaining = scaledSeconds - elapsed;
        countdown.textContent = remaining > 0 ? remaining + 's' : '';

        if (elapsed >= scaledSeconds) {
          clearInterval(timerInterval);
          timerDone = true;
          fill.classList.add('done');
          label.textContent = '✓ Ready to continue';
          countdown.textContent = '';
          nextBtn.disabled = false;
          nextBtn.classList.remove('locked');
        }
      }, 1000);
    }

    function nextPage() {
      if (currentPage < pages.length - 1) renderPage(currentPage + 1);
    }
    function prevPage() {
      if (currentPage > 0) {
        clearInterval(timerInterval);
        renderPage(currentPage - 1);
      }
    }

    // ── READING PROGRESS ─────────────────────────────────────────
    function loadReadingProgress() {
      var saved = localStorage.getItem('ds_reading_progress');
      readingProgress = saved ? JSON.parse(saved) : {};
    }
    function isChapterRead() {
      if (!workData || !chapterData) return false;
      return !!(readingProgress[workData.id] && readingProgress[workData.id][chapterData.id]);
    }
    function markChapterRead() {
      if (!workData || !chapterData) return;
      if (!readingProgress[workData.id]) readingProgress[workData.id] = {};
      readingProgress[workData.id][chapterData.id] = true;
      localStorage.setItem('ds_reading_progress', JSON.stringify(readingProgress));
    }

    async function finishChapter() {
      clearInterval(timerInterval);
      if (!isChapterRead()) {
        // Save to Supabase FIRST — only mark locally once confirmed (or if logged out)
        if (currentSession) {
          await db.from('reading_progress').upsert({
            user_id: currentSession.user.id,
            work_id: workData.id,
            chapter_id: chapterData.id,
            chapter_number: chapterData.chapter_number,
            completed: true,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id,chapter_id' });
        }
        markChapterRead();

        if (currentSession) {
          // Award embers (owner reading their own chapter doesn't earn embers)
          if (!isOwner) {
            try {
              var { data: embersAwarded } = await db.rpc('award_reading_embers', {
                p_user_id: currentSession.user.id,
                p_chapter_id: chapterData.id,
                p_work_id: workData.id,
                p_word_count: chapterData.word_count || 0
              });
              if (embersAwarded && embersAwarded > 0) {
                showToast('Chapter complete! +' + embersAwarded + ' ember' + (embersAwarded > 1 ? 's' : '') + ' 🔥', 'ti-flame');
                window.dispatchEvent(new CustomEvent('ds-embers-awarded', { detail: { amount: embersAwarded } }));
              } else {
                showToast('Chapter complete! +1 reading progress', 'ti-circle-check');
              }
            } catch(e) {
              showToast('Chapter complete! +1 reading progress', 'ti-circle-check');
            }

            // Award genre/tag reading progress (foundation for future
            // avatar cosmetic rewards), then check for newly unlocked items.
            try {
              await db.rpc('add_tag_reading_progress', {
                p_user_id: currentSession.user.id,
                p_chapter_id: chapterData.id,
                p_work_id: workData.id,
                p_word_count: chapterData.word_count || 0
              });
              var { data: newlyUnlocked } = await db.rpc('check_and_unlock_tag_rewards', {
                p_user_id: currentSession.user.id
              });
              if (newlyUnlocked && newlyUnlocked.length > 0) {
                newlyUnlocked.forEach(function(itemName, i) {
                  setTimeout(function() {
                    showToast('New item unlocked: ' + itemName + '! 🎁', 'ti-gift');
                  }, i * 600);
                });
              }
            } catch(e) {
              // Non-critical — don't interrupt the reading flow if this fails
            }
          } else {
            showToast('Chapter complete! +1 reading progress', 'ti-circle-check');
          }
        } else {
          showToast('Chapter complete! +1 reading progress', 'ti-circle-check');
        }
      }
      renderChapterNav();
      // Scroll to chapter nav
      document.getElementById('chapter-nav').scrollIntoView({ behavior: 'smooth' });
    }

    // ── CHAPTER UNLOCK ────────────────────────────────────────────
    function isChapterUnlocked(chapter) {
      if (!chapter || !workData) return false;
      // Chapter 1 always unlocked
      if (chapter.chapter_number === 1) return true;
      // Owner always unlocked
      if (isOwner) return true;
      // Find the previous chapter
      var prev = allChapters.find(function(c){ return c.chapter_number === chapter.chapter_number - 1; });
      if (!prev) return true;
      return isChapterRead() || !!(readingProgress[workData.id] && readingProgress[workData.id][prev.id]);
    }

    // ── CHAPTER NAV ──────────────────────────────────────────────
    function renderChapterNav() {
      var navEl = document.getElementById('chapter-nav');
      var idx = allChapters.findIndex(function(c){ return c.id === chapterData.id; });
      var prev = allChapters[idx - 1];
      var next = allChapters[idx + 1];

      navEl.innerHTML = '';

      // Previous chapter — always accessible
      if (prev) {
        var prevBtn = document.createElement('a');
        prevBtn.className = 'chapter-nav-btn';
        prevBtn.href = 'chapter.html?id=' + prev.id;
        prevBtn.innerHTML = '<span class="chapter-nav-label"><i class="ti ti-chevron-left"></i> Previous</span><span class="chapter-nav-title">Ch.' + prev.chapter_number + ' — ' + escHtml(prev.title) + '</span>';
        navEl.appendChild(prevBtn);
      } else {
        navEl.appendChild(document.createElement('div'));
      }

      // Next chapter — locked until current chapter is read
      if (next) {
        var currentRead = isChapterRead();
        var nextUnlocked = currentRead || isOwner;
        var nextBtn = document.createElement(nextUnlocked ? 'a' : 'div');
        nextBtn.className = 'chapter-nav-btn next' + (nextUnlocked ? '' : ' locked');
        if (nextUnlocked) {
          nextBtn.href = 'chapter.html?id=' + next.id;
        } else {
          nextBtn.style.cssText = 'opacity:0.4;cursor:not-allowed;';
        }
        nextBtn.innerHTML =
          '<span class="chapter-nav-label">' + (nextUnlocked ? 'Next <i class="ti ti-chevron-right"></i>' : '<i class="ti ti-lock"></i> Locked') + '</span>' +
          '<span class="chapter-nav-title">Ch.' + next.chapter_number + ' — ' + escHtml(next.title) + '</span>' +
          (!nextUnlocked ? '<span style="font-size:11px;color:var(--text3);margin-top:2px;">Finish this chapter to unlock</span>' : '');
        navEl.appendChild(nextBtn);
      }
    }

    // ── EDIT OVERLAY ─────────────────────────────────────────────
    /* ── READER SETTINGS ─────────────────────────────────────────── */
    function toggleReaderSettings() {
      document.getElementById('reader-settings-panel').classList.toggle('open');
    }
    document.addEventListener('click', function(e) {
      var panel = document.getElementById('reader-settings-panel');
      var btn = document.getElementById('reader-settings-btn');
      if (panel && panel.classList.contains('open') && !panel.contains(e.target) && !btn.contains(e.target)) {
        panel.classList.remove('open');
      }
    });
    function setWidth(btn) {
      var width = btn.getAttribute('data-width');
      document.documentElement.style.setProperty('--reader-width', width);
      localStorage.setItem('ds_reader_width', width);
      document.querySelectorAll('#rs-width-opts .rs-opt').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
    }
    function setFontSize(val) {
      document.documentElement.style.setProperty('--reader-size', val + 'px');
      localStorage.setItem('ds_reader_size', val);
      document.getElementById('rs-size-val').textContent = val + 'px';
      document.getElementById('rs-font-slider').value = val;
    }
    function setLineHeight(btn) {
      var lh = btn.getAttribute('data-lh');
      document.documentElement.style.setProperty('--reader-lh', lh);
      localStorage.setItem('ds_reader_lh', lh);
      document.querySelectorAll('#rs-lh-opts .rs-opt').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
    }
    function loadReaderPrefs() {
      var width = localStorage.getItem('ds_reader_width');
      var size  = localStorage.getItem('ds_reader_size');
      var lh    = localStorage.getItem('ds_reader_lh');
      if (width) {
        document.documentElement.style.setProperty('--reader-width', width);
        document.querySelectorAll('#rs-width-opts .rs-opt').forEach(function(b){
          b.classList.toggle('active', b.getAttribute('data-width') === width);
        });
      } else {
        var defaultBtn = document.querySelector('#rs-width-opts .rs-opt[data-width="650px"]');
        if (!defaultBtn) defaultBtn = document.querySelector('#rs-width-opts .rs-opt');
        if (defaultBtn) defaultBtn.classList.add('active');
      }
      if (size) { setFontSize(size); }
      else { document.querySelector('#rs-width-opts') && document.getElementById('rs-font-slider') && (document.getElementById('rs-font-slider').value = 16); }
      if (lh) {
        document.documentElement.style.setProperty('--reader-lh', lh);
        document.querySelectorAll('#rs-lh-opts .rs-opt').forEach(function(b){
          b.classList.toggle('active', b.getAttribute('data-lh') === lh);
        });
      } else {
        var defaultLh = document.querySelector('#rs-lh-opts .rs-opt[data-lh="1.8"]');
        if (defaultLh) defaultLh.classList.add('active');
      }
    }
    document.addEventListener('DOMContentLoaded', loadReaderPrefs);

      document.getElementById('edit-overlay').classList.add('open');
      document.getElementById('edit-title-input').value = chapterData.title || '';
      if (!editQuill) {
        var editFontKeys = window.READING_FONTS ? Object.keys(window.READING_FONTS) : [];
        editQuill = new Quill('#edit-editor', {
          theme: 'snow',
          modules: {
            toolbar: [[{header:[1,2,3,false]}],[{font:editFontKeys}],['bold','italic','underline','strike'],['blockquote'],[{list:'ordered'},{list:'bullet'}],[{align:[]}],['link'],['clean']],
            keyboard: {
              bindings: {
                tab: {
                  key: 9,
                  handler: function(range) {
                    this.quill.insertText(range.index, '\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0', Quill.sources.USER);
                    this.quill.setSelection(range.index + 8, Quill.sources.SILENT);
                    return false;
                  }
                }
              }
            }
          }
        });
        
        editQuill.on('text-change', function(){

          document.getElementById('edit-word-count').textContent = w;
        });
      }
      editQuill.root.innerHTML = chapterData.content || '';
      var w = editQuill.getText().trim().split(/\s+/).filter(Boolean).length;
      document.getElementById('edit-word-count').textContent = w;

      // Load character manager for this chapter
      if (workData && chapterData) {
        await editCtInit(workData.id, chapterData.id);
      }

    function closeEditOverlay() {
      document.getElementById('edit-overlay').classList.remove('open');
    }

    // Edit overlay only closes via the X button — no backdrop click to prevent accidental dismissal

    async function saveEdit() {
      var title = document.getElementById('edit-title-input').value.trim();
      var content = editQuill ? editQuill.root.innerHTML : '';
      var text = editQuill ? editQuill.getText().trim() : '';
      if (!title) { showToast('Please add a title', 'ti-alert-triangle'); return; }
      if (text.length < 5) { showToast('Please add some content', 'ti-alert-triangle'); return; }

      var btn = document.getElementById('save-edit-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="ti ti-loader" style="animation:spin 1s linear infinite"></i> Saving…';

      var wordCount = text.split(/\s+/).filter(Boolean).length;
      var result = await db.from('chapters').update({
        title: title,
        content: content,
        word_count: wordCount
      }).eq('id', chapterData.id);

      if (result.error) {
        showToast('Error: ' + result.error.message, 'ti-x');
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-check"></i> Save Changes';
        return;
      }

      // Update work updated_at
      await db.from('works').update({ updated_at: new Date().toISOString() }).eq('id', workData.id);

      chapterData.title = title;
      chapterData.content = content;
      document.getElementById('chapter-title-display').textContent = title;
      document.getElementById('nav-chapter-title').textContent = title;

      // Re-paginate with new content
      pages = paginateContent(content);
      markChapterRead(); // owner just edited — no timer needed
      renderPage(0);

      // Save chapter characters
      await editCtSaveChapterCharacters(chapterData.id, workData.id);

      closeEditOverlay();
      showToast('Chapter saved!');
      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-check"></i> Save Changes';
    }

    async function loadParaComments(idx) {
      var body = document.getElementById('para-panel-body');
      var footer = document.getElementById('para-panel-footer');
      body.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text3);font-size:13px;"><i class="ti ti-loader-2" style="animation:spin 1s linear infinite;font-size:20px;"></i></div>';

      // Fetch top-level + replies
      var result = await db.from('paragraph_comments')
        .select('id, content, created_at, user_id, paragraph_index, parent_id, upvotes, downvotes, gif_url')
        .eq('chapter_id', chapterData.id)
        .eq('paragraph_index', idx)
        .order('created_at', { ascending: true });

      var all = (result.data || []);
      var topLevel = all.filter(function(c){ return !c.parent_id; });
      var replies = all.filter(function(c){ return !!c.parent_id; });
      var replyMap = {};
      replies.forEach(function(r){ if(!replyMap[r.parent_id]) replyMap[r.parent_id]=[]; replyMap[r.parent_id].push(r); });

      // Batch fetch profiles
      var allIds = [...new Set(all.map(function(c){ return c.user_id; }).filter(Boolean))];
      var profileMap = {};
      if (allIds.length) {
        var pr = await db.from('profiles').select('id,username,display_name,avatar_url').in('id', allIds);
        (pr.data||[]).forEach(function(p){ profileMap[p.id] = p; });
      }

      // Fetch user's own votes if logged in
      if (currentSession && all.length) {
        var allIds2 = all.map(function(c){ return c.id; });
        var vr = await db.from('paragraph_comment_votes')
          .select('comment_id, vote_type')
          .eq('user_id', currentSession.user.id)
          .in('comment_id', allIds2);
        (vr.data||[]).forEach(function(v){ paraVoteCache[v.comment_id] = v.vote_type; });
      }

      body.innerHTML = '';

      // Echo strip — show all echoes placed on this paragraph by all readers
      var paraEchoes = allReaderEchosByPara[idx];
      if (paraEchoes && Object.keys(paraEchoes).length) {
        var stripDiv = document.createElement('div');
        stripDiv.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 12px;border-bottom:1px solid var(--border);margin-bottom:4px;';
        Object.entries(paraEchoes).forEach(function(entry) {
          var typeId = entry[0], count = entry[1];
          var type = echoTypes.find(function(t){ return t.id === typeId; });
          if (!type) return;
          var rc = type.rarity==='rare'?'#ef4444':type.rarity==='ultra'?'#a855f7':'var(--text)';
          var bg = type.rarity==='rare'?'color-mix(in srgb,#ef4444 10%,transparent)':type.rarity==='ultra'?'color-mix(in srgb,#a855f7 10%,transparent)':'var(--bg3)';
          var bd = type.rarity==='rare'?'color-mix(in srgb,#ef4444 30%,transparent)':type.rarity==='ultra'?'color-mix(in srgb,#a855f7 30%,transparent)':'var(--border)';
          var pill = document.createElement('div');
          pill.title = type.label;
          pill.style.cssText = 'display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;background:'+bg+';border:1px solid '+bd+';font-size:12px;cursor:default;white-space:nowrap;';
          pill.innerHTML = '<span>'+type.icon+'</span><span style="font-weight:600;color:'+rc+';">'+type.label+'</span>' +
            (count > 1 ? '<span style="font-size:11px;font-weight:700;color:'+rc+';opacity:0.75;margin-left:2px;">×'+count+'</span>' : '');
          stripDiv.appendChild(pill);
        });
        body.appendChild(stripDiv);
      }

      if (!topLevel.length) {
        var emptyDiv = document.createElement('div');
        emptyDiv.style.cssText = 'text-align:center;padding:24px 16px;color:var(--text3);font-size:13px;';
        emptyDiv.innerHTML = '<i class="ti ti-message-off" style="font-size:24px;display:block;margin-bottom:8px;opacity:0.35;"></i>No comments yet — be the first!';
        body.appendChild(emptyDiv);
      } else {
        topLevel.forEach(function(c) {
          var card = buildParaCommentCard(c, profileMap, replyMap[c.id] || [], profileMap);
          body.appendChild(card);
        });
      }

      renderParaFooter(footer);
    }

        footer.innerHTML =
          '<div class="para-input-row">' +
            '<input class="para-input" type="text" id="para-comment-input" placeholder="Comment on this paragraph…" maxlength="500"/>' +
            '<button class="para-send-btn" id="para-send-btn" onclick="submitParaComment()"><i class="ti ti-send"></i></button>' +

          '<button class="para-vote-btn downvote-btn' + (myVote==='down'?' voted-down':'') + '" data-id="'+c.id+'" data-dir="down"><i class="ti ti-thumb-down"></i> <span class="dn-count">'+downs+'</span></button>' +

    async function handleParaVote(commentId, dir, card) {
      if (!currentSession) { showToast('Sign in to vote', 'ti-lock'); return; }
      var current = paraVoteCache[commentId] || null;

      // Optimistic UI — scope to direct .para-cmt-actions child only, not nested replies
      var actionsEl = card.querySelector(':scope > .para-cmt-actions');
      var upBtn = actionsEl ? actionsEl.querySelector('.upvote-btn') : card.querySelector('[data-id="'+commentId+'"].upvote-btn');
      var dnBtn = actionsEl ? actionsEl.querySelector('.downvote-btn') : card.querySelector('[data-id="'+commentId+'"].downvote-btn');
      var upCount = upBtn ? upBtn.querySelector('.up-count') : null;
      var dnCount = dnBtn ? dnBtn.querySelector('.dn-count') : null;

      if (current === dir) {
        // Remove vote
        paraVoteCache[commentId] = null;
        if (upBtn) upBtn.classList.remove('voted-up');
        if (dnBtn) dnBtn.classList.remove('voted-down');
        if (dir === 'up' && upCount) upCount.textContent = Math.max(0, parseInt(upCount.textContent||0) - 1);
        if (dir === 'down' && dnCount) dnCount.textContent = Math.max(0, parseInt(dnCount.textContent||0) - 1);
        await db.from('paragraph_comment_votes').delete()
          .eq('comment_id', commentId).eq('user_id', currentSession.user.id);
        // Update counts on comment
        var upVal = parseInt(upCount ? upCount.textContent : 0);
        var dnVal = parseInt(dnCount ? dnCount.textContent : 0);
        await db.from('paragraph_comments').update({ upvotes: upVal, downvotes: dnVal }).eq('id', commentId);
      } else {
        // Switching or new vote
        if (current === 'up' && upCount) upCount.textContent = Math.max(0, parseInt(upCount.textContent||0) - 1);
        if (current === 'down' && dnCount) dnCount.textContent = Math.max(0, parseInt(dnCount.textContent||0) - 1);
        if (upBtn) upBtn.classList.remove('voted-up');
        if (dnBtn) dnBtn.classList.remove('voted-down');
        paraVoteCache[commentId] = dir;
        if (dir === 'up') { if(upBtn) upBtn.classList.add('voted-up'); if(upCount) upCount.textContent = parseInt(upCount.textContent||0) + 1; }
        if (dir === 'down') { if(dnBtn) dnBtn.classList.add('voted-down'); if(dnCount) dnCount.textContent = parseInt(dnCount.textContent||0) + 1; }
        await db.from('paragraph_comment_votes').upsert({
          comment_id: commentId, user_id: currentSession.user.id, vote_type: dir
        }, { onConflict: 'comment_id,user_id' });
        var upVal = parseInt(upCount ? upCount.textContent : 0);
        var dnVal = parseInt(dnCount ? dnCount.textContent : 0);
        await db.from('paragraph_comments').update({ upvotes: upVal, downvotes: dnVal }).eq('id', commentId);
        // Auto-delete at 7 downvotes
        if (dir === 'down' && dnVal >= 7) {
          await db.from('paragraph_comments').delete().eq('id', commentId);
          card.style.transition = 'opacity 0.4s';
          card.style.opacity = '0';
          setTimeout(function(){ card.remove(); }, 400);
          showToast('Comment removed by community votes', 'ti-shield');
          return;
        }
      }
    }

    function toggleParaReplyBox(parentId, parentCard, parentName) {
      var existing = parentCard.querySelector('.para-reply-input-wrap');
      if (existing) { existing.remove(); return; }
      var wrap = document.createElement('div');
      wrap.className = 'para-reply-input-wrap';
      wrap.innerHTML =
        '<textarea class="para-reply-ta" placeholder="Replying to ' + escHtml(parentName) + '…" maxlength="500"></textarea>' +
        '<div class="para-reply-actions">' +
          '<button class="para-reply-cancel">Cancel</button>' +
          '<button class="para-reply-submit"><i class="ti ti-send"></i> Reply</button>' +
        '</div>';
      var repliesList = parentCard.querySelector('.para-replies-list');
      parentCard.insertBefore(wrap, repliesList);
      wrap.querySelector('.para-reply-ta').focus();
      wrap.querySelector('.para-reply-cancel').addEventListener('click', function(){ wrap.remove(); });
      wrap.querySelector('.para-reply-submit').addEventListener('click', function(){
        submitParaReply(parentId, wrap, parentCard);
      });
