/* Height and weight: type either unit, the other fills itself in. Stored as
   one readable string ("180 cm (5 ft 11 in)") so the checks and the beta
   reader read it like any other answer, plus the metric number. */
function measureHtml(f, raw){
  var key = esc(f.field_key);
  if(f.input_type === 'height'){
    var cm = raw.cm != null ? Number(raw.cm) : parseHeightCm(raw.v);
    var ft = '', inch = '';
    if(cm){ var tot = Math.round(cm / 2.54); ft = Math.floor(tot / 12); inch = tot % 12; }
    return '<div class="measure">'
      + '<input type="number" min="0" id="hft-' + key + '" value="' + esc(ft) + '" oninput="syncHeight(\'' + key + '\',\'imp\')"/><span>ft</span>'
      + '<input type="number" min="0" max="11" id="hin-' + key + '" value="' + esc(inch) + '" oninput="syncHeight(\'' + key + '\',\'imp\')"/><span>in</span>'
      + '<span style="margin:0 4px;">or</span>'
      + '<input type="number" min="0" id="hcm-' + key + '" value="' + esc(cm ? Math.round(cm) : '') + '" oninput="syncHeight(\'' + key + '\',\'cm\')"/><span>cm</span>'
      + '</div>';
  }
  var kg = raw.kg != null ? Number(raw.kg) : parseWeightKg(raw.v);
  return '<div class="measure">'
    + '<input type="number" min="0" id="wlb-' + key + '" value="' + esc(kg ? Math.round(kg * 2.20462) : '') + '" oninput="syncWeight(\'' + key + '\',\'lb\')"/><span>lb</span>'
    + '<span style="margin:0 4px;">or</span>'
    + '<input type="number" min="0" id="wkg-' + key + '" value="' + esc(kg ? Math.round(kg) : '') + '" oninput="syncWeight(\'' + key + '\',\'kg\')"/><span>kg</span>'
    + '</div>';
}
function parseHeightCm(v){
  if(v == null) return null;
  var t = String(v).toLowerCase();
  var m = t.match(/([\d.]+)\s*cm/); if(m) return parseFloat(m[1]);
  m = t.match(/([\d.]+)\s*m\b/); if(m) return parseFloat(m[1]) * 100;
  m = t.match(/(\d+)\s*(?:ft|foot|feet|')\s*(\d+)?/);
  if(m) return (parseInt(m[1], 10) * 12 + (parseInt(m[2] || '0', 10))) * 2.54;
  return null;
}
function parseWeightKg(v){
  if(v == null) return null;
  var t = String(v).toLowerCase();
  var m = t.match(/([\d.]+)\s*kg/); if(m) return parseFloat(m[1]);
  m = t.match(/([\d.]+)\s*(?:lb|lbs|pound)/); if(m) return parseFloat(m[1]) / 2.20462;
  m = t.match(/(\d+)\s*st(?:one)?\s*(\d+)?/); if(m) return (parseInt(m[1],10) * 14 + parseInt(m[2] || '0',10)) / 2.20462;
  return null;
}
function syncHeight(key, from){
  var ft = document.getElementById('hft-' + key), inch = document.getElementById('hin-' + key), cm = document.getElementById('hcm-' + key);
  if(from === 'cm'){
    var c = parseFloat(cm.value);
    if(!c){ ft.value = ''; inch.value = ''; return; }
    var tot = Math.round(c / 2.54); ft.value = Math.floor(tot / 12); inch.value = tot % 12;
  } else {
    var f = parseInt(ft.value || '0', 10), i = parseInt(inch.value || '0', 10);
    cm.value = (f || i) ? Math.round((f * 12 + i) * 2.54) : '';
  }
}
function syncWeight(key, from){
  var lb = document.getElementById('wlb-' + key), kg = document.getElementById('wkg-' + key);
  if(from === 'kg'){ var k = parseFloat(kg.value); lb.value = k ? Math.round(k * 2.20462) : ''; }
  else { var l = parseFloat(lb.value); kg.value = l ? Math.round(l / 2.20462) : ''; }
}

/* Follow-up questions. "button": behind a small button under the parent,
   shown straight away if it already has an answer. "yes": shown when the
   parent answer is Yes. "many": shown when the parent list has 2+ entries. */
function revealField(key){
  var w = document.getElementById('wrap-' + key);
  if(w){ w.setAttribute('data-open', '1'); w.style.display = ''; }
  var b = document.getElementById('rbtn-' + key);
  if(b) b.style.display = 'none';
  var inp = w && w.querySelector('input,textarea');
  if(inp) inp.focus();
}
function syncReveals(){
  document.querySelectorAll('#sheet .f[data-under]').forEach(function(w){
    var parent = w.getAttribute('data-under'), mode = w.getAttribute('data-mode');
    var key = w.id.replace(/^wrap-/, '');
    var show;
    if(mode === 'value'){
      // Shown when the parent answer is one of the listed choices, e.g. the
      // regression questions when "Does their age ever shift?" is "Both".
      var pv = document.getElementById('fld-' + parent);
      var list = [];
      try { list = JSON.parse(w.getAttribute('data-when') || '[]'); } catch(e) {}
      var cur = pv ? String(pv.value || '').trim().toLowerCase() : '';
      show = !!cur && list.some(function(x){ return String(x).toLowerCase() === cur; });
      if(!show && w.getAttribute('data-has') === '1' && !pv) show = true;
    } else if(mode === 'filled'){
      // Shown as soon as the parent has ANY answer — e.g. the questions about
      // coming back only matter once "Died in chapter" is filled in.
      var pf = document.getElementById('fld-' + parent);
      show = !!(pf && String(pf.value || '').trim()) || (w.getAttribute('data-has') === '1' && !pf);
    } else if(mode === 'yes'){
      var pe = document.getElementById('fld-' + parent);
      show = !!(pe && /^\s*yes\s*$/i.test(pe.value)) || (w.getAttribute('data-has') === '1' && !pe);
    } else if(mode === 'many'){
      var chips = document.getElementById('chips-' + parent);
      show = !!(chips && chips.children.length >= 2);
    } else {
      show = w.getAttribute('data-has') === '1' || w.getAttribute('data-open') === '1';
      var b = document.getElementById('rbtn-' + key);
      if(b) b.style.display = show ? 'none' : '';
    }
    // A question the reader just filled in is always shown. Several live
    // behind a reveal ("What they did before the events of chapter 1" sits
    // under a button), and filling one without opening it left the author
    // looking at an unchanged card with nothing to scroll to.
    if(!show && w.classList.contains('suggested')) show = true;
    w.style.display = show ? '' : 'none';
  });
}
document.addEventListener('input', function(e){ if(e.target.closest && e.target.closest('#sheet')) syncReveals(); });
document.addEventListener('change', function(e){ if(e.target.closest && e.target.closest('#sheet')) syncReveals(); });
document.addEventListener('click', function(e){ if(e.target.closest && e.target.closest('#sheet')) setTimeout(syncReveals, 0); });
document.addEventListener('keyup', function(e){ if(e.key === 'Enter' && e.target.closest && e.target.closest('#sheet')) syncReveals(); });

var SAVING_CARD = false;
async function saveCard(){
  var c = cardById(EDIT_ID);
  if(!c) return;
  if(SAVING_CARD) return;          // a second click while the first save is in flight
  SAVING_CARD = true;
  try {
    return await saveCardInner(c);
  } finally {
    SAVING_CARD = false;
  }
}
async function saveCardInner(c){
  var defs = FIELDS[c.kind] || [];
  var missing = null;

  // Start from what is already stored and only overwrite the keys this form
  // actually rendered. Anything under a renamed or retired field key is
  // carried through untouched instead of being wiped by a save.
  var rendered = {};
  defs.forEach(function(f){ rendered[f.field_key] = true; });
  var data = {};
  Object.keys(c.data || {}).forEach(function(k){
    if(!rendered[k]) data[k] = c.data[k];
  });

  defs.forEach(function(f){
    var box = document.getElementById('skip-' + f.field_key);
    if(box && box.checked){ data[f.field_key] = { skipped:true }; return; }

    var entry = null;

    if(f.input_type === 'list'){
      var wrap = document.getElementById('chips-' + f.field_key);
      var itemsWhen = {};
      var items = wrap ? Array.prototype.map.call(wrap.children, function(el){
        var v = el.getAttribute('data-v') || '';
        var fr = el.getAttribute('data-from') || '', un = el.getAttribute('data-until') || '';
        if(v && (fr || un)) itemsWhen[v] = Object.assign(fr ? { from: fr } : {}, un ? { until: un } : {});
        return v;
      }).filter(Boolean) : [];
      // Anything left in the add box counts too: an author who types a last
      // entry and hits Save should not silently lose it.
      var pending = document.getElementById('fld-' + f.field_key);
      if(pending && String(pending.value).trim()){
        var pw2 = chipAddWhen(f.field_key);
        String(pending.value).split(',').map(function(x){ return x.trim(); })
          .filter(Boolean).forEach(function(x){
            items.push(x);
            if(pw2.from || pw2.until) itemsWhen[x] = Object.assign(pw2.from ? { from: pw2.from } : {}, pw2.until ? { until: pw2.until } : {});
          });
      }
      if(items.length){
        entry = { v: items };
        if(Object.keys(itemsWhen).length) entry.items = itemsWhen;
      }

    } else if(f.input_type === 'pairs'){
      var pw = document.getElementById('pairs-' + f.field_key);
      var rowsWhen = [], anyWhen = false;
      var plabels = (Array.isArray(f.options) && f.options.length >= 2) ? f.options : ['', ''];
      var aIsCh = /chapter/i.test(plabels[0] || ''), bIsCh = /chapter/i.test(plabels[1] || '');
      var rows = pw ? Array.prototype.filter.call(pw.children, function(row){
        var a = row.querySelector('.pair-a'), b = row.querySelector('.pair-b');
        return (a && a.value.trim()) || (b && b.value.trim());
      }).map(function(row){
        var a = row.querySelector('.pair-a'), b = row.querySelector('.pair-b');
        var pre = row.querySelector('.pair-pre'), fr = row.querySelector('.pair-from'), un = row.querySelector('.pair-until');
        var w = {};
        var pend = row.querySelector('.pair-end');
        var frv = (pre && pre.checked) ? '0' : (fr ? chNum(fr.value) : '');
        var unv = (pend && pend.checked) ? 'end' : (un ? chNum(un.value) : '');
        if(frv) w.from = frv;
        if(unv) w.until = unv;
        if(frv || unv) anyWhen = true;
        rowsWhen.push(w);
        return [a ? (aIsCh ? chNum(a.value) : a.value.trim()) : '',
                b ? (bIsCh ? chNum(b.value) : b.value.trim()) : ''];
      }) : [];
      if(rows.length){
        entry = { v: rows };
        if(anyWhen) entry.rows_when = rowsWhen;
      }

    } else if(f.input_type === 'height'){
      var cmv = parseFloat((document.getElementById('hcm-' + f.field_key) || {}).value);
      if(cmv > 0){
        var tot = Math.round(cmv / 2.54);
        entry = { v: Math.round(cmv) + ' cm (' + Math.floor(tot / 12) + ' ft ' + (tot % 12) + ' in)', cm: Math.round(cmv) };
      }

    } else if(f.input_type === 'weight'){
      var kgv = parseFloat((document.getElementById('wkg-' + f.field_key) || {}).value);
      var lbv = parseFloat((document.getElementById('wlb-' + f.field_key) || {}).value);
      if(!(kgv > 0) && lbv > 0) kgv = lbv / 2.20462;
      if(kgv > 0) entry = { v: Math.round(kgv) + ' kg (' + Math.round(kgv * 2.20462) + ' lb)', kg: Math.round(kgv) };

    } else {
      var pre1 = f.before_ch1 && document.getElementById('pre-' + f.field_key);
      var el = document.getElementById('fld-' + f.field_key);
      var v = (pre1 && pre1.checked) ? BEFORE_CH1 : (el ? String(el.value).trim() : '');
      // A chapter box stores the NUMBER, the way per-item, pair and timeline
      // chapters already do. Storing the raw text meant the checks read it with
      // "first run of digits": "chapter four" had none and was ignored, and a
      // typed "Before chapter 1" was read as chapter 1.
      if(v !== '' && f.input_type === 'chapter' && v !== BEFORE_CH1) v = chNum(v);
      if(v !== '') entry = { v: v };
    }

    // A follow-up question that is not showing (Religious? No) is not saved,
    // but anything already on file under it is kept rather than wiped.
    var wrapEl = document.getElementById('wrap-' + f.field_key);
    if(f.reveal_under && wrapEl && wrapEl.style.display === 'none' && f.reveal_mode !== 'button'){
      // "value" follow-ups are dropped when the parent answer rules them out
      // (age shift set back to "No"), so the beta reader never reads stale
      // regression details for a character who does not regress.
      if(f.reveal_mode !== 'value' && c.data && c.data[f.field_key]) data[f.field_key] = c.data[f.field_key];
      return;
    }

    // Timeline: the chapter the current value became true, plus what it was
    // before. Only attached when the author actually filled it in.
    if(f.timeline){
      var sinceEl = document.getElementById('since-' + f.field_key);
      var preSince = document.getElementById('presince-' + f.field_key);
      var since = (preSince && preSince.checked) ? '0' : (sinceEl ? chNum(sinceEl.value) : '');
      var logWrap = document.getElementById('logwrap-' + f.field_key);
      var logBox = document.getElementById('log-' + f.field_key);
      var log = (logWrap && logWrap.style.display !== 'none' && logBox) ? Array.prototype.map.call(logBox.children, function(row){
        var chEl = row.querySelector('.log-ch'), vEl = row.querySelector('.log-v');
        return { ch: chEl ? chNum(chEl.value) : '', v: vEl ? vEl.value.trim() : '' };
      }).filter(function(x){ return x.ch !== '' && x.v; })
        .sort(function(a, b){ return Number(a.ch) - Number(b.ch); }) : [];
      var wasWrap = document.getElementById('was-' + f.field_key);
      var was = wasWrap ? Array.prototype.map.call(wasWrap.children, function(row){
        var vEl = row.querySelector('.was-v'), uEl = row.querySelector('.was-until');
        return { v: vEl ? vEl.value.trim() : '', until: uEl ? chNum(uEl.value) : '' };
      }).filter(function(x){ return x.v; }) : [];
      // A blank current value with a filled-in past is meaningful, so the
      // entry is created rather than dropped.
      if(!entry && (since || was.length || log.length)) entry = { v: '' };
      if(entry && since) entry.since = since;
      if(entry && was.length) entry.was = was;
      if(entry && log.length) entry.log = log;
    }

    if(entry) data[f.field_key] = entry;
    else if(!f.allow_skip && !missing) missing = f.label;
  });

  var name = String(document.getElementById('lb-name').value || '').trim();
  if(!name){ toast('A card needs a name', 'ti-alert-triangle', true); return; }
  if(missing){ toast(missing + ' is needed', 'ti-alert-triangle', true); return; }

  var res = await db.from('lore_cards').update({
    name: name,
    subtitle: String(document.getElementById('lb-subtitle').value || '').trim() || null,
    data: data
  }).eq('id', c.id).select().maybeSingle();

  if(res.error || !res.data){
    var smsg = res.error ? res.error.message : 'Could not save';
    // Renaming a card onto another card's name hits the no-duplicates rule.
    if(/duplicate|unique/i.test(smsg)){
      smsg = 'You already have a ' + c.kind + ' card with that name \u2014 pick a different one, '
        + 'or add these answers to that card instead.';
    }
    toast(smsg, 'ti-x', true);
    return;
  }
  for(var i=0;i<CARDS.length;i++) if(CARDS[i].id === c.id) CARDS[i] = res.data;
  var fromNote = PENDING_NOTE;
  var fromFinding = PENDING_FINDING || (PENDING_FILL && PENDING_FILL.finding_id) || FILL_FINDING;
  FILL_FINDING = null;
  closeSheet();
  // Saving the card is the author answering the finding, so it is marked
  // resolved rather than left sitting in the list.
  if(fromFinding){
    try { await respond(fromFinding, 'resolve', true); } catch(e) {}
  }
  if(fromNote){
    var ok = await noteSet(fromNote, 'applied', true);
    toast(ok ? 'Card saved — note moved to Done' : 'Card saved');
    if(!ok) render();
  } else {
    toast('Card saved');
    render();
  }
}

/* Deleting a card takes relationships and findings with it (ON DELETE
   CASCADE), so it gets the same centred confirm as a dismissed check. */
function deleteCardAsk(){
  var c = cardById(EDIT_ID);
  var ties = RELATIONS.filter(function(r){
    return r.from_card_id === c.id || r.to_card_id === c.id;
  }).length;
  document.getElementById('lb-del').innerHTML =
    '<div class="confirm">'
    + '<div class="confirm-title">Delete ' + esc(c.name) + '?</div>'
    + '<div class="confirm-body">This cannot be undone'
    + (ties ? ', and it removes ' + ties + ' relationship' + (ties === 1 ? '' : 's') + ' from the other cards too' : '')
    + '.</div>'
    + '<button class="btn danger" id="lb-del-go" disabled onclick="deleteCard()">Yes, delete it</button>'
    + '<button class="keep" onclick="document.getElementById(\'lb-del\').innerHTML=\'\'">Keep the card</button>'
    + '</div>';
  armConfirm('lb-del-go', 'Yes, delete it');
}

async function deleteCard(){
  var c = cardById(EDIT_ID);
  var res = await db.from('lore_cards').delete().eq('id', c.id);
  if(res.error){ toast(res.error.message, 'ti-x', true); return; }
  if(c.image_path){ try { await db.storage.from(LORE_BUCKET).remove([c.image_path]); } catch(e){} }
  CARDS = CARDS.filter(function(x){ return x.id !== c.id; });
  RELATIONS = RELATIONS.filter(function(r){
    return r.from_card_id !== c.id && r.to_card_id !== c.id;
  });
  toast('Card deleted');
  closeSheet();
  render();
}

// Unsaved answers are easy to lose in a long card, so leaving by the edge or
// the Escape key asks first. Save and Delete pass no argument and never ask.
// The in-page Close paths ask before discarding edits, but closing the tab or
// hitting Back did not. A character sheet holds ~190 questions; losing a long
// sitting to a stray Ctrl-W is the worst outcome in the Lorebook.
window.addEventListener('beforeunload', function(e){
  if(!sheetIsDirty()) return;
  e.preventDefault();
  e.returnValue = '';   // browsers show their own wording
});

function closeSheet(ask){
  // Returns false when the author backs out, so callers that also switch view
  // (Open checks / Open the board) stay put instead of navigating away from a
  // sheet that is still open with unsaved work in it.
  if(ask && sheetIsDirty() && !confirm('Close this card? Anything you have typed since the last save will be lost.')) return false;
  document.getElementById('sheet-back').classList.remove('open');
  document.body.style.overflow = '';
  EDIT_ID = null;
  PENDING_NOTE = null;
  PENDING_FINDING = null;
  PENDING_FILL = null;
  SHEET_SNAPSHOT = '';
  return true;
}
// Closing by clicking the dark edge must not fire when a drag STARTED inside
// the card — selecting text and releasing outside the panel used to count as
// a click on the backdrop and threw away everything unsaved.
var backDownOnSelf = false;
document.getElementById('sheet-back').addEventListener('mousedown', function(e){
  backDownOnSelf = (e.target === this);
});
document.getElementById('sheet-back').addEventListener('click', function(e){
  if(e.target === this && backDownOnSelf) closeSheet(true);
  backDownOnSelf = false;
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if(!document.getElementById('sheet-back').classList.contains('open') && OPEN_DECK){
      collapseDeck(OPEN_DECK);
      return;
    }
    closeSheet(true);
  }
});

/* A destructive button that is dead for a moment cannot be reached by the
   second half of a double-click, and the countdown says why it is waiting. */
function armConfirm(id, label){
  var btn = document.getElementById(id);
  if(!btn) return;
  var left = 2;
  btn.textContent = label + ' (' + left + ')';
  var t = setInterval(function(){
    left--;
    if(left <= 0){
      clearInterval(t);
      btn.disabled = false;
      btn.textContent = label;
      btn.focus();
    } else {
      btn.textContent = label + ' (' + left + ')';
    }
  }, 500);
}

/* ── RELATIONSHIP BOARD ────────────────────────────────────────────── */
function renderBoard(){
  var chars = CARDS.filter(function(c){ return c.kind === 'character'; });
  var body = document.getElementById('view-body');

  if(chars.length < 2){
    body.innerHTML = '<div class="board-help">Relationships need two character cards. '
      + 'Add another and they can be dragged together here.</div>'
      + '<div class="state-wrap"><i class="ti ti-arrows-shuffle state-icon"></i>'
      + '<div class="state-title">Not enough cards yet</div>'
      + '<div class="state-body">Make a second character in the Characters deck, then come back.</div></div>';
    return;
  }

  body.innerHTML =
    '<div class="board-help">Drag a card onto another to write what is between them. '
    + 'Or use the <b>+ tie</b> button on a card. Positions are saved, so a family left of a rival stays that way.</div>'
    + '<div class="board" id="board">'
    +   '<svg class="board-lines" id="board-lines"></svg>'
    + '</div>'
    + '<div class="board-legend">'
    +   REL_GROUPS.map(function(g){
          var st = relStyle(g[0]);
          return '<span class="legend-item"><span class="legend-line" style="background:' + st.c + ';'
            + (st.d ? 'background-image:repeating-linear-gradient(90deg,' + st.c + ' 0 6px,transparent 6px 11px);background-color:transparent;' : '')
            + '"></span>' + esc(g[1]) + '</span>';
        }).join('')
    + '</div>';
  var board = document.getElementById('board');

  // Default spots for cards that have never been placed. Anything already
  // placed keeps its spot; overlaps are sorted out by separateCards() below,
  // once the cards exist and can actually be measured.
  chars.forEach(function(c, i){
    if(c.pos_x == null) c.pos_x = 20 + (i % 5) * 170;
    if(c.pos_y == null) c.pos_y = 20 + Math.floor(i / 5) * 130;
  });

  chars.forEach(function(c, i){
    var el = document.createElement('div');
    el.className = 'bcard';
    el.dataset.id = c.id;
    var x = c.pos_x, y = c.pos_y;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    var ties = RELATIONS.filter(function(r){
      return r.from_card_id === c.id || r.to_card_id === c.id;
    }).length;
    el.innerHTML =
      '<div class="bcard-name">' + esc(c.name) + '</div>'
      + '<div class="bcard-sub">' + esc(c.subtitle || '') + '</div>'
      + (ties ? '<div class="bcard-ties">' + ties + ' tie' + (ties === 1 ? '' : 's') + '</div>' : '')
      + '<button class="bcard-add" title="Write a tie with someone" '
      + 'onclick="event.stopPropagation();pickTiePartner(\'' + esc(c.id) + '\')">'
      + '<i class="ti ti-plus"></i> tie</button>';
    board.appendChild(el);
    makeDraggable(el, board);
  });
  separateCards(board);
  drawRelLines();
}

/* Cards saved on top of each other are invisible and impossible to grab. The
   old check used fixed guesses (40px across, 30px down) that were far smaller
   than a card, so overlapping cards were judged "fine". This measures the
   cards as they actually render and steps each one aside until it sits clear
   of everything already placed. */
function separateCards(board){
  var els = Array.prototype.slice.call(board.querySelectorAll('.bcard'));
  var GAP = 14, placed = [], maxBottom = 0;
  els.forEach(function(el){
    var w = el.offsetWidth, h = el.offsetHeight;
    var x0 = parseInt(el.style.left, 10) || 0;
    var y0 = parseInt(el.style.top, 10) || 0;
    var x = x0, y = y0;
    var wide = Math.max(board.clientWidth, w + 40);
    var guard = 0;
    var clash = function(){
      return placed.some(function(p){
        return x < p.x + p.w + GAP && x + w + GAP > p.x
            && y < p.y + p.h + GAP && y + h + GAP > p.y;
      });
    };
    while(guard++ < 300 && clash()){
      x += w + GAP;
      if(x + w > wide){ x = 20; y += h + GAP; }
    }
    if(x !== x0 || y !== y0){
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      var c = cardById(el.dataset.id);
      if(c){ c.pos_x = x; c.pos_y = y; }
      savePos(el.dataset.id, x, y);
    }
    placed.push({ x:x, y:y, w:w, h:h });
    maxBottom = Math.max(maxBottom, y + h);
  });
  // Grow the board so a card pushed onto a new row is never cut off.
  board.style.minHeight = Math.max(520, maxBottom + 24) + 'px';
}

/* Lines between cards. Up to three ties per pair, fanned apart so a pair who
   are lovers AND enemies shows both. Click a line to open that tie. */
var REL_MAX_PER_PAIR = 3;
function pairKey(a, b){ return [a, b].sort().join('|'); }
function relsForPair(a, b){
  return RELATIONS.filter(function(r){
    return pairKey(r.from_card_id, r.to_card_id) === pairKey(a, b);
  });
}
function drawRelLines(){
  var svg = document.getElementById('board-lines');
  var board = document.getElementById('board');
  if(!svg || !board) return;
  var pos = {};
  Array.prototype.forEach.call(board.querySelectorAll('.bcard'), function(el){
    pos[el.dataset.id] = {
      x: (parseInt(el.style.left, 10) || 0) + el.offsetWidth / 2,
      y: (parseInt(el.style.top, 10) || 0) + el.offsetHeight / 2
    };
  });
  var seen = {}, out = '';
  RELATIONS.forEach(function(r){
    var k = pairKey(r.from_card_id, r.to_card_id);
    if(seen[k]) return;
    seen[k] = true;
    var group = relsForPair(r.from_card_id, r.to_card_id).slice(0, REL_MAX_PER_PAIR);
    var a = pos[r.from_card_id], b = pos[r.to_card_id];
    if(!a || !b) return;
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    var dx = b.x - a.x, dy = b.y - a.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = -dy / len, ny = dx / len;      // perpendicular, to fan the lines
    group.forEach(function(rel, i){
      var off = (i - (group.length - 1) / 2) * 34;
      var st = relStyle(rel.group_key);
      var cx = mx + nx * off * 1.6, cy = my + ny * off * 1.6;
      var d = 'M' + a.x + ' ' + a.y + ' Q' + cx + ' ' + cy + ' ' + b.x + ' ' + b.y;
      out += '<path class="rel-hit" d="' + d + '" data-rel="' + esc(rel.id) + '"></path>'
        + '<path class="rel-line" d="' + d + '" stroke="' + st.c + '"'
        + (st.d ? ' stroke-dasharray="' + st.d + '"' : '') + ' data-rel="' + esc(rel.id) + '"></path>'
        + '<text class="rel-tag" x="' + (mx + nx * off * 0.9) + '" y="' + (my + ny * off * 0.9) + '"'
        + ' fill="' + st.c + '" text-anchor="middle">' + esc(relKindLabel(rel.group_key, rel)) + '</text>';
    });
  });
  svg.innerHTML = out;
  svg.setAttribute('width', board.clientWidth);
  svg.setAttribute('height', Math.max(board.clientHeight, 520));
  Array.prototype.forEach.call(svg.querySelectorAll('.rel-hit'), function(el){
    el.addEventListener('click', function(){ openRelation(el.getAttribute('data-rel')); });
  });
}

function makeDraggable(el, board){
  var startX = 0, startY = 0, origX = 0, origY = 0, moved = false, target = null;

  el.addEventListener('pointerdown', function(e){
    if(e.button !== 0 && e.pointerType === 'mouse') return;
    el.setPointerCapture(e.pointerId);
    startX = e.clientX; startY = e.clientY;
    origX = parseInt(el.style.left, 10) || 0;
    origY = parseInt(el.style.top, 10) || 0;
    moved = false;
    el.classList.add('dragging');
  });

  el.addEventListener('pointermove', function(e){
    if(!el.classList.contains('dragging')) return;
    var dx = e.clientX - startX, dy = e.clientY - startY;
    if(Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    var nx = Math.max(0, Math.min(board.clientWidth - el.offsetWidth, origX + dx));
    var ny = Math.max(0, Math.min(Math.max(board.clientHeight, 520) - el.offsetHeight, origY + dy));
    el.style.left = nx + 'px';
    el.style.top  = ny + 'px';

    // Overlap test against the other cards, so the drop target is whatever
    // the card is actually sitting on rather than whatever is under the
    // cursor (which is usually the dragged card itself).
    // It uses the CENTRE of the dragged card, not any touching of edges:
    // dropping on a target springs the card back, so a mere graze used to
    // undo every drag and make the cards look stuck.
    var prev = target;
    target = null;
    var a = el.getBoundingClientRect();
    var cx = a.left + a.width / 2, cy = a.top + a.height / 2;
    Array.prototype.forEach.call(board.children, function(other){
      if(other === el || !other.classList || !other.classList.contains('bcard')) return;
      var b = other.getBoundingClientRect();
      var over = cx >= b.left && cx <= b.right && cy >= b.top && cy <= b.bottom;
      other.classList.toggle('drop-target', over && !target);
      if(over && !target) target = other;
    });
    if(prev && prev !== target) prev.classList.remove('drop-target');
    drawRelLines();
  });

  function finish(e){
    if(!el.classList.contains('dragging')) return;
    el.classList.remove('dragging');
    Array.prototype.forEach.call(board.children, function(o){ o.classList.remove('drop-target'); });

    if(!moved){ openCard(el.dataset.id); target = null; return; }

    if(target){
      // Dropping one card on another means "write a tie", not "park it here".
      // Leaving it stacked hid the card underneath, so it springs back.
      el.style.left = origX + 'px';
      el.style.top  = origY + 'px';
      drawRelLines();
      var a = el.dataset.id, b = target.dataset.id;
      target = null;
      openPairTies(a, b);
      return;
    }

    var x = parseInt(el.style.left, 10) || 0;
    var y = parseInt(el.style.top, 10) || 0;
    savePos(el.dataset.id, x, y);
    drawRelLines();
  }
  el.addEventListener('pointerup', finish);
  el.addEventListener('pointercancel', finish);
}

async function savePos(id, x, y){
  var c = cardById(id);
  if(c){ c.pos_x = x; c.pos_y = y; }
  var res = await db.from('lore_cards').update({ pos_x:x, pos_y:y }).eq('id', id);
  if(res.error) console.warn('savePos:', res.error.message);
}

/* ── RELATIONSHIP EDITOR ───────────────────────────────────────────── */
var REL_A = null, REL_B = null, REL_ID = null;

// Ties without dragging: pick who the tie is with.
function pickTiePartner(aId){
  var a = cardById(aId);
  if(!a) return;
  var others = CARDS.filter(function(c){ return c.kind === 'character' && c.id !== aId; });
  if(!others.length){ toast('Make another character first', 'ti-alert-triangle', true); return; }
  document.getElementById('sheet').innerHTML =
    '<h2 id="sheet-title">' + esc(a.name) + '</h2>'
    + '<div class="sub">Who is the tie with?</div>'
    + '<div class="grp"><div class="grp-h">Characters</div>'
    + others.map(function(c){
        var n = relsForPair(aId, c.id).length;
        return '<div class="tie-row" onclick="openPairTies(\'' + esc(aId) + '\', \'' + esc(c.id) + '\')">'
          + '<span class="tie-what">' + esc(c.name) + '</span>'
          + (n ? '<span class="tie-sub"> \u00b7 ' + n + ' tie' + (n === 1 ? '' : 's') + ' already</span>' : '')
          + '<i class="ti ti-chevron-right" style="margin-left:auto;color:var(--text3);"></i></div>';
      }).join('')
    + '</div>'
    + '<div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()">Close</button></div>';
  document.getElementById('sheet-back').classList.add('open');
  document.body.style.overflow = 'hidden';
}

// A pair can hold up to three ties, so dropping on an existing pair asks
// which one to open rather than always reopening the first.
function openPairTies(aId, bId){
  var a = cardById(aId), b = cardById(bId);
  if(!a || !b) return;
  var ties = relsForPair(aId, bId);
  if(!ties.length) return openRelationFor(aId, bId);

  document.getElementById('sheet').innerHTML =
    '<h2 id="sheet-title">' + esc(a.name) + ' &amp; ' + esc(b.name) + '</h2>'
    + '<div class="sub">' + ties.length + ' tie' + (ties.length === 1 ? '' : 's') + ' between them</div>'
    + '<div class="grp"><div class="grp-h">Open one</div>'
    + ties.map(function(r){
        var st = relStyle(r.group_key);
        return '<div class="tie-row" onclick="openRelation(\'' + esc(r.id) + '\')">'
          + '<span class="tie-dot" style="background:' + st.c + ';"></span>'
          + '<span><span class="tie-what">' + esc(relKindLabel(r.group_key, r)) + '</span>'
          + (r.tie_label ? '<span class="tie-sub"> \u00b7 ' + esc(r.tie_label) + '</span>' : '')
          + '</span><i class="ti ti-chevron-right" style="margin-left:auto;color:var(--text3);"></i></div>';
      }).join('')
    + (ties.length < REL_MAX_PER_PAIR
        ? '<button class="btn" onclick="openRelationFor(\'' + esc(aId) + '\', \'' + esc(bId) + '\', null, true)">'
          + '<i class="ti ti-plus"></i> Add another tie</button>'
        : '<div class="board-help">Three ties is the most a pair can have \u2014 open one above to change it.</div>')
    + '</div>'
    + '<div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()">Close</button></div>';
  document.getElementById('sheet-back').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openRelation(id){
  var r = RELATIONS.filter(function(x){ return x.id === id; })[0];
  if(!r) return;
  openRelationFor(r.from_card_id, r.to_card_id, r);
}

// One question in the relationship sheet, laid out like a card question.
function relF(id, label, help, type, value, opts, placeholder){
  var input;
  if(type === 'long'){
    input = '<textarea id="' + id + '" rows="2">' + esc(value || '') + '</textarea>';
  } else if(type === 'pick'){
    input = pickInputHtml('id="' + id + '" placeholder="Pick one, or type your own"', value || '', opts || []);
  } else if(type === 'chapter'){
    input = chInputHtml('id="' + id + '"', value || '', opts === 'pre1');
  } else {
    input = '<input id="' + id + '" maxlength="120"' + (placeholder ? ' placeholder="' + esc(placeholder) + '"' : '')
      + ' value="' + esc(value || '') + '"/>';
  }
  return '<div class="f' + (type === 'long' ? ' wide' : '') + '"><label class="q">' + label + '</label>'
    + '<div class="ans">' + input + '</div>'
    + '<div class="help">' + (help ? esc(help) : '') + '</div><div class="f-foot"></div></div>';
}
function relData(found, key){
  var d = found && found.data ? found.data : {};
  return d[key] == null ? '' : d[key];
}
function addRelTurn(){
  var wrap = document.getElementById('pairs-relturns');
  if(wrap) wrap.insertAdjacentHTML('beforeend', pairRowHtml('relturns', ['', ''], wrap.children.length, ['Chapter', 'What changes between them']));
}
function relVal(id){ var el = document.getElementById(id); return el ? el.value.trim() : ''; }

function openRelationFor(aId, bId, existing, forceNew){
  var a = cardById(aId), b = cardById(bId);
  if(!a || !b) return;
  if(forceNew && relsForPair(aId, bId).length >= REL_MAX_PER_PAIR){
    toast('Three ties is the most a pair can have', 'ti-alert-triangle', true);
    return;
  }

  // One row per pair per group, so an existing relationship must be found
  // in either direction before offering to make a second one.
  var found = existing || (forceNew ? null : RELATIONS.filter(function(r){
    return (r.from_card_id === aId && r.to_card_id === bId)
        || (r.from_card_id === bId && r.to_card_id === aId);
  })[0]) || null;

  REL_A = aId; REL_B = bId; REL_ID = found ? found.id : null;
  // The row's own direction decides which note belongs to which card.
  var aIsFrom = !found || found.from_card_id === aId;

  var kindItems = REL_GROUPS.map(function(g){ return g[1]; });
  // Kinds this author has already invented, so they can be reused.
  RELATIONS.forEach(function(r){
    var l = relKindLabel(r.group_key, r);
    if(l && kindItems.indexOf(l) < 0) kindItems.push(l);
  });
  var kindValue = found ? relKindLabel(found.group_key, found) : '';
  var others = relsForPair(aId, bId).filter(function(r){ return !found || r.id !== found.id; });

  document.getElementById('sheet').innerHTML =
    '<h2 id="sheet-title">' + esc(a.name) + ' &amp; ' + esc(b.name) + '</h2>'
    + '<div class="sub">' + (found ? 'Edit what is between them' : 'A new relationship') + '</div>'

async function saveRelation(andAnother){
  var payload = {
    work_id: workId,
    author_id: uid,
    from_card_id: REL_A,
    to_card_id: REL_B,
    group_key: relKeyFor(relVal('rel-group')),
    tie_label: document.getElementById('rel-tie').value.trim() || null,
    how_started: document.getElementById('rel-started').value.trim() || null,
    what_now: document.getElementById('rel-now').value.trim() || null,
    data: (function(){
      var turns = Array.prototype.map.call(
        (document.getElementById('pairs-relturns') || { children: [] }).children, function(row){
          var chEl = row.querySelector('.pair-a'), vEl = row.querySelector('.pair-b');
          return [chEl ? chNum(chEl.value) : '', vEl ? vEl.value.trim() : ''];
        }).filter(function(r){ return r[0] || r[1]; });
      var d = {
        kind_label: relVal('rel-group'),
        power: relVal('rel-power'), trust: relVal('rel-trust'), public: relVal('rel-public'),
        unspoken: relVal('rel-unspoken'), owes: relVal('rel-owes'), last: relVal('rel-last'),
        from_ch: chNum(relVal('rel-from-ch')), end_ch: chNum(relVal('rel-end-ch')),
        // Stored in the row's own direction, like from_note/to_note below.
        from_wants: relVal('rel-a-wants'), to_wants: relVal('rel-b-wants'), turns: turns
      };
      Object.keys(d).forEach(function(k){
        if(d[k] === '' || (Array.isArray(d[k]) && !d[k].length)) delete d[k];
      });
      return d;
    })(),
    what_would_end: document.getElementById('rel-end').value.trim() || null,
    from_note: document.getElementById('rel-a-note').value.trim() || null,
    to_note: document.getElementById('rel-b-note').value.trim() || null
  };

  var res;
  if(REL_ID){
    // The stored row may run B->A; the notes were rendered in that direction,
    // so they are sent back the same way rather than being swapped.
    var existing = RELATIONS.filter(function(r){ return r.id === REL_ID; })[0];
    if(existing && existing.from_card_id !== REL_A){
      payload.from_card_id = existing.from_card_id;
      payload.to_card_id = existing.to_card_id;
      var t = payload.from_note; payload.from_note = payload.to_note; payload.to_note = t;
      var w = payload.data.from_wants; payload.data.from_wants = payload.data.to_wants; payload.data.to_wants = w;
      if(payload.data.from_wants === undefined) delete payload.data.from_wants;
      if(payload.data.to_wants === undefined) delete payload.data.to_wants;
    }
    res = await db.from('lore_relations').update(payload).eq('id', REL_ID).select().maybeSingle();
  } else {
    res = await db.from('lore_relations').insert(payload).select().maybeSingle();
  }

  if(res.error || !res.data){
    var msg = res.error ? res.error.message : 'Could not save';
    // The unique index on the pair is the likeliest failure, and "duplicate
    // key value violates unique constraint" means nothing to an author.
    if(/duplicate|unique/i.test(msg)){
      msg = 'These two already have a relationship in that group \u2014 open it instead.';
    }
    toast(msg, 'ti-x', true);
    return;
  }

  if(REL_ID){
    for(var i=0;i<RELATIONS.length;i++) if(RELATIONS[i].id === REL_ID) RELATIONS[i] = res.data;
  } else {
    RELATIONS.push(res.data);
  }
  toast('Saved');
  var pairA = REL_A, pairB = REL_B;
  closeSheet();
  render();
  if(andAnother && relsForPair(pairA, pairB).length < REL_MAX_PER_PAIR){
    openRelationFor(pairA, pairB, null, true);
  }
}

    + '</div>'

    + '</div>';

  // Lorekeeper is not a lock on this page: the rule-based checks are part of

  var pitch = LOREKEEPER
    ? '<div class="finding ai" style="border-left-color:#a78bfa;">'
      + '<div class="finding-msg"><i class="ti ti-eye"></i> Lorekeeper is reading your drafts. '

    : '<div class="finding" style="border-left-color:#a78bfa;">'
      + '<div class="finding-msg"><i class="ti ti-book-2"></i> '
      + 'Card checks are part of your Lorebook and always run. Lorekeeper adds a beta reader that reads '
      + 'the prose itself \u2014 loose threads, characters drifting, the same beat written three times.</div>'
