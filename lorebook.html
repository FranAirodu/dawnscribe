<!DOCTYPE html>
<html lang="en">
<head>
  <script src="accent.js"></script>
  <script>(function(){var t=localStorage.getItem('ds_theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DawnScribe — The Lorebook</title>
  <!-- Author-private by definition: every card here is a spoiler. -->
  <meta name="robots" content="noindex,nofollow" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css"/>
  <script src="accessibilityPrefs.js"></script>
  <style>
    :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--bg4:#22223a;--accent:#2dd4bf;--accent2:#0d9488;--accent-rgb:45, 212, 191;--text:#f1f0ff;--text2:#9b9bc0;--text3:#8a8aa8;--border:rgba(255,255,255,0.07);--red:#f87171;--green:#34d399;--gold:#f0c040;--amber:#f59e0b;--card-w:180px;--card-h:250px;}
    html[data-theme="light"]{--bg:#f4f4f8;--bg2:#ffffff;--bg3:#ebebf2;--bg4:#d8d8e8;--border:rgba(0,0,0,0.10);--text:#0a0a0f;--text2:#3a3a5c;--text3:#5a5a76;--accent:#0a6b63;--accent2:#075e56;--accent-rgb:10, 107, 99;--red:#b01818;--green:#036b4e;--gold:#7d5205;}
    html[data-theme="dim"]{--bg:#1c1c21;--bg2:#24242c;--bg3:#2c2c38;--bg4:#34344c;--border:rgba(255,255,255,0.12);--text2:#9b9bc0;--text3:#9e9eb4;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    @keyframes spin{to{transform:rotate(360deg);}}

    nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:14px;}
    .logo{font-family:'Cinzel',serif;font-size:22px;color:var(--accent);text-decoration:none;letter-spacing:1px;flex-shrink:0;}
    .logo span{color:var(--text);}
    .nav-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
    .back-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 14px;color:var(--text2);font-size:13px;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;text-decoration:none;}
    .back-btn:hover{border-color:var(--accent);color:var(--accent);}
    .back-btn.warn{border-color:rgba(245,158,11,0.45);color:var(--amber);}

    .page{max-width:1120px;margin:0 auto;padding:28px 22px 70px;width:100%;}
    .page-header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
    .page-header i{font-size:25px;color:var(--gold);}
    .page-title{font-family:'Cinzel',serif;font-size:23px;font-weight:700;}
    .page-subtitle{font-size:13px;color:var(--text3);margin:3px 0 26px;}

    .picker-card{display:flex;align-items:center;gap:14px;padding:14px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;text-decoration:none;color:inherit;transition:border-color 0.2s;}
    .picker-card:hover{border-color:var(--accent);}
    .picker-cover{width:44px;height:62px;border-radius:6px;flex-shrink:0;background:var(--bg4);display:flex;align-items:center;justify-content:center;color:var(--text3);overflow:hidden;}
    .picker-cover img{width:100%;height:100%;object-fit:cover;}
    .picker-title{font-size:15px;font-weight:700;}
    .picker-stats{font-size:12px;color:var(--text3);margin-top:3px;}

    .state-wrap{text-align:center;padding:70px 20px;}
    .state-icon{font-size:40px;color:var(--text3);}
    .state-title{font-family:'Cinzel',serif;font-size:19px;margin:12px 0 6px;}
    .state-body{font-size:13.5px;color:var(--text2);max-width:52ch;margin:0 auto;line-height:1.7;}
    .state-body a{color:var(--accent);}

    .view-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
    .vt{background:none;border:1px solid var(--border);border-radius:20px;padding:6px 15px;color:var(--text3);font-size:12.5px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;}
    .vt:hover{border-color:var(--accent);color:var(--accent);}
    .vt.active{background:rgba(var(--accent-rgb),0.1);border-color:var(--accent);color:var(--accent);}
    .vt .pip{background:var(--amber);color:#1a1a26;border-radius:10px;padding:0 6px;font-size:11px;}

    /* ── DECKS ──────────────────────────────────────────────────── */
    .decks{display:flex;flex-wrap:wrap;gap:30px;align-items:flex-start;}
    .pile-wrap{width:var(--card-w);}
    .pile{position:relative;width:var(--card-w);height:var(--card-h);cursor:pointer;transition:height .3s cubic-bezier(.2,.7,.3,1);}
    .pile:focus-visible{outline:2px solid var(--accent);outline-offset:6px;border-radius:14px;}
    .pile-label{margin-top:13px;display:flex;align-items:baseline;gap:8px;font-family:'Cinzel',serif;font-size:15px;}
    .pile-label .count{font-family:'Lato',sans-serif;font-size:12px;color:var(--text3);}
    .pile-hint{font-size:11.5px;color:var(--text3);margin-top:3px;min-height:16px;}
    .pile-add{margin-top:8px;width:100%;background:var(--bg3);border:1px dashed var(--border);border-radius:9px;padding:7px;color:var(--text2);font-size:12px;font-family:'Lato',sans-serif;cursor:pointer;}
    .pile-add:hover{border-color:var(--accent);color:var(--accent);}

    .card{position:absolute;left:0;top:0;width:var(--card-w);height:var(--card-h);border-radius:13px;background:linear-gradient(160deg,var(--bg3),var(--bg2));border:1px solid var(--border);box-shadow:0 10px 22px rgba(0,0,0,0.42);padding:14px 13px;overflow:hidden;transition:transform .32s cubic-bezier(.2,.7,.3,1),border-color .2s;}
    .card:hover{border-color:rgba(240,192,64,0.45);}
    .pile:not(.fanned) .card{transform:translate(var(--sx),var(--sy)) rotate(var(--sr));}
    .pile.fanned .card{transform:translateY(var(--fy));}
    .pile.fanned .card:hover{transform:translateY(var(--fy)) translateX(8px);}
    .card-topline{height:3px;border-radius:3px;margin:-3px -3px 10px;background:var(--gold);opacity:.75;}
    .card.k-society .card-topline{background:var(--accent);}
    .card.k-organisation .card-topline{background:#a78bfa;}
    .card.k-artifact .card-topline{background:var(--green);}
    .card.k-event .card-topline{background:#60a5fa;}
    .card-name{font-family:'Cinzel',serif;font-size:15px;line-height:1.25;margin-bottom:3px;height:38px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;}
    .card-role{font-size:11.5px;color:var(--text3);margin-bottom:10px;height:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
    .card-glyph img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block;}
    /* A picture gets the tallest box the card can spare; most pictures are
       portraits, and a short wide box cut them off at the chest. The crop
       leans toward the top, where faces sit. */
    .card-glyph.has-pic{height:122px;}
    .card-glyph{overflow:hidden;height:90px;border-radius:9px;background:var(--bg4);display:flex;align-items:center;justify-content:center;color:var(--text3);font-family:'Cinzel',serif;font-size:24px;margin-bottom:10px;border:1px solid var(--border);}
    .pic-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
    .pic-prev{width:84px;height:84px;border-radius:10px;background:var(--bg4);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Cinzel',serif;font-size:26px;color:var(--text3);flex-shrink:0;}
    .pic-prev img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block;}
    .pic-btns{display:flex;flex-direction:column;gap:6px;}
    .pic-btns .btn{padding:6px 12px;font-size:12px;}
    .pic-note{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.5;}
    .card-stat{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--text2);padding:2px 0;}
    .card-stat b{color:var(--text);font-weight:400;}
    .card-flag{position:absolute;bottom:10px;left:13px;right:13px;font-size:10.5px;color:var(--amber);display:flex;align-items:center;gap:5px;}
    .card-fill{position:absolute;bottom:10px;right:13px;font-size:10.5px;color:var(--text3);}

    /* ── BOARD ──────────────────────────────────────────────────── */
    .board{position:relative;min-height:520px;background:
        linear-gradient(var(--border) 1px, transparent 1px) 0 0/34px 34px,
        linear-gradient(90deg, var(--border) 1px, transparent 1px) 0 0/34px 34px,
        var(--bg2);
      border:1px solid var(--border);border-radius:14px;overflow:hidden;touch-action:none;}
    .board .bcard{position:absolute;width:150px;background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:11px 12px;cursor:grab;user-select:none;box-shadow:0 6px 16px rgba(0,0,0,0.35);}
    .board .bcard.dragging{cursor:grabbing;z-index:20;border-color:var(--accent);}
    .board .bcard.drop-target{border-color:var(--gold);box-shadow:0 0 0 2px rgba(240,192,64,0.35);}
    .bcard-name{font-family:'Cinzel',serif;font-size:13.5px;}
    .bcard-sub{font-size:11px;color:var(--text3);margin-top:2px;}
    .bcard-ties{font-size:10.5px;color:var(--accent);margin-top:7px;}
    .board-help{font-size:12.5px;color:var(--text3);margin-bottom:12px;line-height:1.6;}

    /* ── SHEET ──────────────────────────────────────────────────── */
    .sheet-back{position:fixed;inset:0;background:rgba(4,4,8,0.8);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;}
    .sheet-back.open{display:flex;}
    .sheet{width:100%;max-width:700px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:24px;}
    .sheet h2{font-family:'Cinzel',serif;font-size:21px;margin-bottom:3px;}
    .sheet .sub{color:var(--text3);font-size:13px;}
    .private{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--accent);border:1px solid rgba(var(--accent-rgb),0.3);border-radius:20px;padding:4px 11px;margin:12px 0 4px;}
    .grp{margin-top:20px;}
    .grp-h{font-family:'Cinzel',serif;font-size:13.5px;color:var(--gold);border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;}
    .grp-h .gcount{font-family:'Lato',sans-serif;font-size:11px;color:var(--text3);font-weight:400;}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:22px 22px;}
    .f{font-size:13px;}
    .f.wide{grid-column:1/-1;}
    .f label{display:block;color:var(--text3);font-size:11.5px;margin-bottom:3px;}
    .f .help{font-size:11px;color:var(--text3);font-style:italic;margin:-2px 0 6px;}
    /* The question itself is the loudest thing in a field; every control
       under the answer (Does it change?, stop asking, extra buttons) is
       deliberately quiet until hovered. */
    .f label.q{display:flex;align-items:center;gap:7px;color:var(--text);font-size:14px;font-weight:700;letter-spacing:.1px;margin-bottom:6px;line-height:1.35;}
    .f label.q::before{content:'';width:3px;height:14px;border-radius:2px;background:var(--accent);flex-shrink:0;opacity:.85;}
    .f.child label.q{font-size:13px;}
    .f.child label.q::before{opacity:.45;}
    .f .f-extras{display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;margin-top:5px;opacity:.6;transition:opacity .15s;}
    .f:hover .f-extras,.f:focus-within .f-extras{opacity:1;}
    .f .f-extras .skip,.f .f-extras .tl-open{margin-top:0;}
    .f.skipped label.q{color:var(--text3);}
    .f input,.f textarea,.f select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-family:'Lato',sans-serif;font-size:13px;}
    .f input:focus,.f textarea:focus{outline:none;border-color:var(--accent);}
    .f textarea{resize:vertical;min-height:64px;}
    .f.skipped input,.f.skipped textarea{opacity:.35;}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px;}
    .chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg4);border:1px solid var(--border);border-radius:16px;padding:4px 6px 4px 11px;font-size:12.5px;}
    .chip button{background:none;border:none;color:var(--text3);cursor:pointer;padding:0 2px;display:flex;}
    .chip button:hover{color:var(--red);}
    .chip-add{display:flex;gap:6px;}
    .chip-add input{flex:1;}
    .pair-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
    .pair-row.timed{flex-wrap:wrap;padding-bottom:6px;border-bottom:1px dashed var(--border);}
    .pair-row.timed .pair-a{flex:1 1 30%;}
    .pair-row.timed .pair-b{flex:1 1 45%;}
    .pair-when{display:flex;align-items:center;gap:6px;flex-basis:100%;}
    .f .pair-when input.tl-in{width:70px;flex:0 0 auto;padding:6px 8px;}
    .pair-row .pair-a{flex:0 0 34%;}
    .pair-row .pair-b{flex:1;}
    .pair-row button,.was-row button{background:none;border:none;color:var(--text3);cursor:pointer;display:flex;padding:4px;}
    .pair-row button:hover,.was-row button:hover{color:var(--red);}
    .tl{margin-top:8px;padding:9px 11px;background:var(--bg3);border:1px solid var(--border);border-radius:9px;}
    .tl-row{display:flex;align-items:center;gap:7px;margin-bottom:6px;}
    .tl-lbl{font-size:11px;color:var(--text3);white-space:nowrap;}
    .tl-in{width:70px;flex:0 0 auto;}
    .f .tl-row input.tl-in,.f .chip-add input.tl-in{width:70px;flex:0 0 auto;padding:6px 8px;}
    .f input[type=checkbox]{width:auto;flex:0 0 auto;padding:0;margin:0;accent-color:var(--accent);}
    .f .tl-row .log-v,.f .tl-row .was-v{flex:1;min-width:0;}
    .chip-when{font-size:10.5px;color:var(--accent);background:rgba(var(--accent-rgb),0.12);border-radius:10px;padding:1px 7px;white-space:nowrap;}
    .chip-add.timed{flex-wrap:wrap;align-items:center;}
    .chip-add.timed input.chip-text{flex:1 1 180px;}
    .chip-tip{font-size:11px;color:var(--text3);margin-top:5px;line-height:1.5;}
    .was-row .was-v{flex:1;}
    .tl-btn,.tl-open{background:none;border:none;color:var(--accent);font-size:11.5px;font-family:'Lato',sans-serif;cursor:pointer;padding:2px 0;display:inline-flex;align-items:center;gap:5px;}
    .tl-open{color:var(--text3);margin-top:6px;}
    .tl-open:hover{color:var(--accent);}
    .tl-q{font-size:12px;font-weight:700;color:var(--text2);margin:2px 0 7px;}
    .tl-sub{font-size:11.5px;color:var(--text2);margin:8px 0 5px;}
    .tl-chk{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);cursor:pointer;white-space:nowrap;}
    .tl-yn{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
    .tl-yn button{background:none;border:none;color:var(--text3);font-size:11.5px;font-weight:700;padding:4px 12px;cursor:pointer;font-family:'Lato',sans-serif;}
    .tl-yn button.on{background:var(--accent2);color:#fff;}
    .tl-no{background:none;border:none;color:var(--text3);font-size:11px;cursor:pointer;margin-left:auto;font-family:'Lato',sans-serif;}
    .tl-no:hover{color:var(--red);}
    .reveal-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
    .reveal-btn{background:none;border:1px dashed var(--border);border-radius:14px;color:var(--text3);font-size:11.5px;padding:3px 10px;cursor:pointer;font-family:'Lato',sans-serif;}
    .reveal-btn:hover{border-color:var(--accent);color:var(--accent);}
    .f.child{border-left:2px solid var(--border);padding-left:10px;}
    .measure{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
    .measure input{width:74px;flex:0 0 auto;}
    .measure span{font-size:11.5px;color:var(--text3);}
    .notes-how{background:rgba(var(--accent-rgb),0.06);border:1px solid rgba(var(--accent-rgb),0.25);border-radius:11px;padding:12px 16px;margin-bottom:16px;font-size:12.5px;color:var(--text2);line-height:1.6;}
    .notes-how-h{font-weight:700;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:6px;}
    .notes-how-h i{color:var(--accent);}
    .notes-how ol{margin:0;padding-left:20px;}
    .notes-how b{color:var(--text);}
    .note-undo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:12.5px;color:var(--text2);}
    .note-undo .btn{margin-left:auto;padding:5px 11px;font-size:12px;}
    .note-sep{font-size:11px;color:var(--text3);margin:0 2px;}
    .note-acts .btn.on{border-color:var(--accent);color:var(--accent);}
    .note-acts .btn:disabled{opacity:.45;cursor:not-allowed;}
    .note-pin{background:rgba(var(--accent-rgb),0.07);border:1px solid rgba(var(--accent-rgb),0.35);border-left:3px solid var(--accent);border-radius:11px;padding:11px 14px;margin:14px 0 4px;}
    .note-pin-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:4px;display:flex;align-items:center;gap:6px;}
    .note-pin-tip{font-size:11.5px;color:var(--text2);margin-top:6px;line-height:1.55;}
    .note-pin-tip b{color:var(--text);}
    .note-card{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:11px;padding:13px 15px;margin-bottom:10px;}
    .note-card.done{opacity:.6;border-left-color:var(--border);}
    .note-meta{font-size:11px;color:var(--text3);margin-bottom:5px;}
    .note-body{font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
    .note-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center;}
    .note-acts .btn{padding:6px 12px;font-size:12px;}
    .note-acts select{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:12px;max-width:220px;}
    .skip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text3);margin-top:4px;cursor:pointer;}
    .skip input{width:auto;}

    .rel{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:9px 11px;margin-bottom:7px;font-size:13px;flex-wrap:wrap;}
    .rel .who{font-weight:700;}
    .rel .what{color:var(--text2);font-size:12px;}
    .rel .tie{margin-left:auto;font-size:11px;color:var(--text3);}

    .btn{background:var(--bg4);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:9px 16px;font-family:'Lato',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
    .btn:hover{border-color:var(--accent);}
    .btn.primary{background:var(--accent2);border-color:var(--accent2);color:#f1f0ff;}
    .btn.ghost{background:transparent;}
    .btn.danger{border-color:rgba(248,113,113,0.45);color:var(--red);}
    .sheet-actions{display:flex;gap:9px;margin-top:24px;flex-wrap:wrap;}

    /* ── FINDINGS ───────────────────────────────────────────────── */
    .finding{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:11px;padding:14px 16px;margin-bottom:11px;}
    .finding.ai{border-left-color:#a78bfa;}
    .finding.answered{border-left-color:var(--border);opacity:.62;}
    .finding-msg{font-size:14px;line-height:1.6;}
    .finding-meta{font-size:11.5px;color:var(--text3);margin-top:5px;display:flex;gap:12px;flex-wrap:wrap;}
    .finding-acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
    .finding-acts .btn{padding:6px 12px;font-size:12px;}

    /* The confirm sits centred INSIDE the finding, so the button a stray
       second click would land on is never where the first click was. */
    .confirm{margin-top:12px;background:var(--bg3);border:1px solid rgba(248,113,113,0.35);border-radius:11px;padding:16px;text-align:center;}
    .confirm-title{font-family:'Cinzel',serif;font-size:15px;margin-bottom:7px;}
    .confirm-body{font-size:12.5px;color:var(--text2);line-height:1.6;max-width:46ch;margin:0 auto 14px;}
    .confirm .btn{display:block;margin:0 auto;}

<script>
/* ── THE LOREBOOK ──────────────────────────────────────────────────────
   Author-private story notes, included with every author account. The paid
   tier (Lorekeeper) does not gate anything on this page — it adds findings
   with source='ai' to the same queue.

   Everything here is owner-only at the database level (lore_* RLS), so this
   page never needs to decide who may see a card. It only asks.
*/

var session = null, uid = null, workId = null, work = null;
var FIELDS = {};        // kind -> [field defs]
var CARDS = [];         // every card in this work
var RELATIONS = [];
var FINDINGS = [];
var NOTES = [];
var IMG_URLS = {};   // image_path -> short-lived signed URL (private bucket)
var NOTES_SHOW_DONE = false;
var LOREKEEPER = false;
var CHAPTERS = [];
var CREDIT = null;      // { chapters_remaining, words_remaining, ... }
var QUOTES = {};        // chapter_id -> what a read would cost
var FIELDS_BY_KEY = {}; // field_key -> definition, for the editor controls
var view = 'decks';

/* Deck order is deliberate: characters first because that is what an author
   opens the Lorebook to do, events last because most stories never need one. */
var DECKS = [
  { kind:'character',    title:'Characters',    icon:'ti-user',         hint:'People, and what they will not admit' },
  { kind:'society',      title:'Societies',     icon:'ti-map-2',        hint:'Dimension down to establishment' },
  { kind:'organisation', title:'Organisations', icon:'ti-hierarchy-2',  hint:'Ranks, roles, tenets, secrets' },
  { kind:'artifact',     title:'Artifacts',     icon:'ti-diamond',      hint:'Where a thing is, and who held it' },
  { kind:'event',        title:'Events',        icon:'ti-flag',         hint:'Dated things chapters can point at' }
];

var REL_GROUPS = [
  ['family','Family'], ['friends','Friends'], ['allies','Allies'], ['enemies','Enemies'],
  ['rivals','Rivals'], ['mentors','Mentors and students'], ['loves','Loves'],
  ['past_loves','Past loves'], ['debts','Debts'], ['wronged','People they have wronged'],
  ['unaware','Does not know they exist'], ['first_impression','First impressions']
];
var REL_LABEL = {};
REL_GROUPS.forEach(function(g){ REL_LABEL[g[0]] = g[1]; });

/* Three or four "headline" fields per kind, shown on the small card face so a
   stacked deck is readable without opening anything. */
var FACE = {
  character:    ['age','eyes','height'],
  society:      ['tier','ruler','population'],
  organisation: ['org_type','head_name','size'],
  artifact:     ['item_type','holder','location'],
  event:        ['when','where','who_knows']
};

/* ── HELPERS ───────────────────────────────────────────────────────── */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function safeUrl(u){
  var s = String(u||'').trim();
  if(!s) return '';
  if(/^https?:\/\//i.test(s)) return s;
  if(/^\/(?!\/)/.test(s)) return s;
  return '';
}
var toastTimer;
function toast(msg, icon, bad){
  var el = document.getElementById('lb-toast');
  document.getElementById('lb-toast-msg').textContent = msg;
  document.getElementById('lb-toast-icon').className = 'ti ' + (icon || 'ti-check');
  el.style.color = bad ? 'var(--red)' : 'var(--text)';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 3400);
}
function showState(icon, title, body){
  document.getElementById('page').innerHTML =
    '<div class="state-wrap"><i class="ti ' + icon + ' state-icon"></i>'
    + '<div class="state-title">' + title + '</div>'
    + '<div class="state-body">' + body + '</div></div>';
}
/* A field value is either {v:'…'} or {skipped:true}. The distinction matters:
   blank means not got to yet, skipped means asked and answered "I do not
   know" — so a half-finished card and a deliberately sparse one look
   different, and the fill count below does not nag about skipped fields. */
function fval(card, key){
  var d = (card.data || {})[key];
  if(!d || d.skipped) return '';
  if(d.v == null) return '';
  // Lists and pairs have their own controls; joining them here is only for
  // the small card face, never for an input.
  if(Array.isArray(d.v)){
    return d.v.map(function(x){ return Array.isArray(x) ? x.filter(Boolean).join(': ') : x; })
              .filter(Boolean).join(', ');
  }
  return String(d.v);
}
function fskipped(card, key){
  var d = (card.data || {})[key];
  return !!(d && d.skipped);
}
function fillCount(card){
  var defs = FIELDS[card.kind] || [];
  var answered = 0;
  var total = 0;
  defs.forEach(function(f){
    var d = (card.data || {})[f.field_key];
    var has = d && (d.skipped || (d.v != null && String(d.v) !== ''));
    // Follow-up questions only count once they apply, so a card is never
    // "incomplete" for a question that was never going to be asked.
    if(f.reveal_under && !has) return;
    total++;
    if(has) answered++;
  });
  return { answered: answered, total: total };
}
function deckTitle(kind){
  for(var i=0;i<DECKS.length;i++) if(DECKS[i].kind === kind) return DECKS[i].title;
  return kind || 'Card';
}
function cardById(id){
  for(var i=0;i<CARDS.length;i++) if(CARDS[i].id === id) return CARDS[i];
  return null;
}
function openFindingsFor(cardId){
  return FINDINGS.filter(function(f){ return f.card_id === cardId && f.status === 'open'; });
}

/* ── INIT ──────────────────────────────────────────────────────────── */
(async function init(){
  var r = await db.auth.getSession();
  session = r.data.session;
  if(!session){
    showState('ti-lock', 'Sign in to open your Lorebook',
      'Your Lorebook is private to you. <a href="auth.html">Sign in</a> to continue.');
    return;
  }
  uid = session.user.id;
  var params = new URLSearchParams(window.location.search);
  workId = params.get('work');
  if(params.get('view') === 'notes') view = 'notes';

  // Returning from a block checkout. The webhook may not have landed yet, so
  // the balance is polled briefly rather than read once.
  var blocks = params.get('blocks');
  if(blocks){
    if(blocks === 'success'){
      view = 'reader';
      setTimeout(async function(){
        for(var i = 0; i < 4; i++){
          await new Promise(function(r){ setTimeout(r, 1500); });
          try {
            var b = await db.rpc('my_lorekeeper_balance');
            if(b.data && b.data.ok){
              var grew = !CREDIT || b.data.chapters_remaining > (CREDIT.chapters_remaining || 0);
              CREDIT = b.data;
              if(grew){
                toast('Block added \u2014 50 chapter reads or 150,000 words.', 'ti-check');
                // Only repaint if the work has finished loading; render() reads
                // work.title, and on a slow connection this poll can win.
                if(work) render();
                break;
              }
            }
          } catch(e){}
        }
      }, 0);
    } else if(blocks === 'cancelled'){
      setTimeout(function(){ toast('Checkout cancelled \u2014 no charge was made.', 'ti-x'); }, 400);
    }
    params.delete('blocks');
    window.history.replaceState({}, '',
      window.location.pathname + (params.toString() ? '?' + params.toString() : ''));
  }
  if(workId){ loadWork(); } else { loadPicker(); }
})();

/* ── WORK PICKER ───────────────────────────────────────────────────── */
async function loadPicker(){
  // Promise.resolve wrapper: Supabase query builders implement .then() but
  // not .catch(), so chaining .catch() directly throws.
  var res = await Promise.resolve(
    db.from('works').select('id,title,cover_url,chapters_count,created_at')
      .eq('author_id', uid).order('created_at', { ascending:false })
  ).catch(function(){ return { error:true }; });

  if(res.error){
    showState('ti-plug-x', 'Connection hiccup',
      'Could not load your stories. <a href="javascript:location.reload()">Try again</a>.');
    return;
  }
  var works = res.data || [];
  if(!works.length){
    showState('ti-books-off', 'No stories yet',
      'A Lorebook belongs to a story. <a href="publish.html">Publish one</a> and its cards will live here.');
    return;
  }

  // Card counts for every work in one query, so the picker says something
  // useful rather than listing bare titles.
  var counts = {};
  try{
    var cRes = await db.from('lore_cards').select('work_id').eq('author_id', uid);
    (cRes.data || []).forEach(function(c){ counts[c.work_id] = (counts[c.work_id] || 0) + 1; });
  }catch(e){}

  document.getElementById('page').innerHTML =
    '<div class="page-header"><i class="ti ti-book-2"></i><div class="page-title">The Lorebook</div></div>'
    + '<div class="page-subtitle">Pick a story. Nothing in a Lorebook is ever visible to readers.</div>'
    + works.map(function(w){
        var u = safeUrl(w.cover_url);
        var cover = u ? '<img loading="lazy" decoding="async" src="' + esc(u) + '" alt=""/>' : '<i class="ti ti-book"></i>';
        var n = counts[w.id] || 0;
        return '<a class="picker-card" href="lorebook.html?work=' + encodeURIComponent(w.id) + '">'
          + '<div class="picker-cover">' + cover + '</div>'
          + '<div style="flex:1;min-width:0;">'
            + '<div class="picker-title">' + esc(w.title) + '</div>'
            + '<div class="picker-stats">' + (w.chapters_count || 0) + ' chapters &middot; '
              + (n ? n + ' card' + (n === 1 ? '' : 's') : 'no cards yet') + '</div>'
          + '</div>'
          + '<i class="ti ti-chevron-right picker-arrow"></i></a>';
      }).join('');
}

/* ── LOAD ONE WORK ─────────────────────────────────────────────────── */
async function loadWork(){
  var back = document.getElementById('nav-back');
  back.href = 'lorebook.html';
  back.innerHTML = '<i class="ti ti-arrow-left"></i> Your Lorebooks';

  var sum = await db.rpc('my_lorebook', { p_work_id: workId });

  }
  LOREKEEPER = sum.data.lorekeeper === true;

  var out = await Promise.all([
    Promise.resolve(db.from('works').select('id,title').eq('id', workId).maybeSingle()).catch(function(){ return {}; }),
    Promise.resolve(db.from('lore_fields').select('*').eq('is_active', true)
      .order('group_order').order('sort_order')).catch(function(){ return {}; }),
    Promise.resolve(db.from('lore_cards').select('*').eq('work_id', workId)
      .order('kind').order('sort_order')).catch(function(){ return {}; }),
    Promise.resolve(db.from('lore_relations').select('*').eq('work_id', workId)).catch(function(){ return {}; }),
    Promise.resolve(db.from('lore_findings').select('*').eq('work_id', workId)
      .order('created_at', { ascending:false })).catch(function(){ return {}; }),
    Promise.resolve(db.from('lore_notes').select('*').eq('work_id', workId)
      .order('created_at', { ascending:false }).limit(300)).catch(function(){ return {}; })
  ]);

  work      = out[0].data || { title:'This story' };

  (out[1].data || []).forEach(function(f){
    (FIELDS[f.kind] = FIELDS[f.kind] || []).push(f);
    FIELDS_BY_KEY[f.field_key] = f;
  });
  CARDS     = out[2].data || [];

/* ── CARD PICTURES ─────────────────────────────────────────────────────
   Private bucket, owner-only folder. Each picture is shrunk in the browser
   to at most 512px WebP before upload (usually 25–60 KB), so a Lorebook of
   a hundred faces is a few megabytes — storage cost is effectively zero. */
var LORE_BUCKET = 'lore-images';
async function loadCardImages(paths){
  var want = (paths || CARDS.map(function(c){ return c.image_path; })).filter(function(p){ return p && !IMG_URLS[p]; });
  if(!want.length) return;
  try {
    var r = await db.storage.from(LORE_BUCKET).createSignedUrls(want, 60 * 60 * 6);
    (r.data || []).forEach(function(x){ if(x && x.signedUrl && x.path) IMG_URLS[x.path] = x.signedUrl; });
  } catch(e) { console.warn('card pictures:', e); }
}
function cardGlyph(c){
  var url = c.image_path && IMG_URLS[c.image_path];
  return url ? '<img src="' + esc(url) + '" alt="" loading="lazy" decoding="async"/>'
             : esc(String(c.name || '').trim().charAt(0).toUpperCase() || '?');
}
function shrinkImage(file, max){
  return new Promise(function(resolve, reject){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var scale = Math.min(1, max / Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){
        if(b && b.type === 'image/webp') return resolve(b);
        cv.toBlob(function(j){ j ? resolve(j) : reject(new Error('Could not read that picture')); }, 'image/jpeg', 0.85);
      }, 'image/webp', 0.82);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('That file is not a picture we can read')); };
    img.src = url;
  });
}
async function pickCardPicture(input){
  var c = cardById(EDIT_ID);
  var file = input.files && input.files[0];
  input.value = '';
  if(!c || !file) return;
  if(!/^image\//.test(file.type)){ toast('Pick an image file', 'ti-alert-triangle', true); return; }
  if(file.size > 20 * 1024 * 1024){ toast('That picture is over 20 MB', 'ti-alert-triangle', true); return; }
  var prev = document.getElementById('pic-prev');
  if(prev) prev.innerHTML = '<i class="ti ti-loader" style="animation:spin 1s linear infinite;font-size:20px;"></i>';
  try {
    var blob = await shrinkImage(file, 512);
    if(blob.size > 500 * 1024) throw new Error('That picture is still too large after shrinking');
    var ext = blob.type === 'image/webp' ? 'webp' : 'jpg';
    // New name every time so the old signed URL never shows a stale picture.
    var path = uid + '/' + c.id + '-' + Date.now() + '.' + ext;
    var up = await db.storage.from(LORE_BUCKET).upload(path, blob, { contentType: blob.type, upsert: false });
    if(up.error) throw up.error;
    var res = await db.from('lore_cards').update({ image_path: path }).eq('id', c.id).select().maybeSingle();
    if(res.error || !res.data){
      await db.storage.from(LORE_BUCKET).remove([path]);
      throw res.error || new Error('Could not save the picture');
    }
    var old = c.image_path;
    c.image_path = path;
    if(old) { try { await db.storage.from(LORE_BUCKET).remove([old]); } catch(e){} delete IMG_URLS[old]; }
    await loadCardImages([path]);
    refreshPicUI(c);
    toast('Picture added');
  } catch(e) {
    refreshPicUI(c);
    toast(e.message || 'Could not upload that picture', 'ti-x', true);
  }
}
async function removeCardPicture(){
  var c = cardById(EDIT_ID);
  if(!c || !c.image_path) return;
  var old = c.image_path;
  var res = await db.from('lore_cards').update({ image_path: null }).eq('id', c.id);
  if(res.error){ toast(res.error.message, 'ti-x', true); return; }
  c.image_path = null;
  try { await db.storage.from(LORE_BUCKET).remove([old]); } catch(e){}
  delete IMG_URLS[old];
  refreshPicUI(c);
  toast('Picture removed');
}
function picFieldHtml(c){
  return '<div class="f wide"><label>Picture</label>'
    + '<div class="pic-row"><div class="pic-prev" id="pic-prev">' + cardGlyph(c) + '</div>'
    + '<div class="pic-btns">'
    +   '<label class="btn ghost" style="cursor:pointer;"><i class="ti ti-photo-up"></i> <span id="pic-up-label">' + (c.image_path ? 'Change picture' : 'Add a picture') + '</span>'
    +     '<input type="file" accept="image/*" style="display:none;" onchange="pickCardPicture(this)"/></label>'
    +   '<button type="button" class="btn ghost" id="pic-remove" onclick="removeCardPicture()"' + (c.image_path ? '' : ' style="display:none;"') + '>Remove</button>'
    + '</div></div>'
    + '<div class="pic-note">A face, a sketch, a map \u2014 anything that helps you remember. Only you can see it. Saves straight away.</div>'
    + '</div>';
}
function refreshPicUI(c){
  var prev = document.getElementById('pic-prev'); if(prev) prev.innerHTML = cardGlyph(c);
  var lab = document.getElementById('pic-up-label'); if(lab) lab.textContent = c.image_path ? 'Change picture' : 'Add a picture';
  var rm = document.getElementById('pic-remove'); if(rm) rm.style.display = c.image_path ? '' : 'none';
}

function render(){
  var open = FINDINGS.filter(function(f){ return f.status === 'open'; }).length;
  var html =
    '<div class="page-header"><i class="ti ti-book-2"></i>'
    + '<div class="page-title">' + esc(work.title) + '</div></div>'
    + '<div class="page-subtitle">Your Lorebook. Private to you \u2014 readers never see any of it.</div>'
    + '<div class="view-tabs">'
      + tab('decks', 'ti-cards', 'Decks')
      + tab('board', 'ti-arrows-shuffle', 'Relationships')
      + tab('notes', 'ti-notebook', 'Notes', NOTES.filter(function(n){ return n.status === 'open'; }).length)
      + tab('checks', 'ti-shield-check', 'Checks', open)
      + tab('reader', 'ti-eye', 'Beta reader')
      + tab('export', 'ti-download', 'Export')
    + '</div>'
    + '<div id="view-body"></div>';
  document.getElementById('page').innerHTML = html;
  renderView();
}
function tab(key, icon, label, pip){
  return '<button class="vt' + (view === key ? ' active' : '') + '" onclick="setView(\'' + key + '\')">'
    + '<i class="ti ' + icon + '"></i> ' + label
    + (pip ? '<span class="pip">' + pip + '</span>' : '') + '</button>';
}
function setView(v){ view = v; render(); }

function renderView(){
  if(view === 'decks')  return renderDecks();
  if(view === 'board')  return renderBoard();
  if(view === 'notes')  return renderNotes();
  if(view === 'checks') return renderChecks();
  if(view === 'reader') return renderReader();
  if(view === 'export') return renderExport();
}

/* ── DECKS ─────────────────────────────────────────────────────────── */
function renderDecks(){
  var body = document.getElementById('view-body');
  body.innerHTML = '<div class="decks" id="decks"></div>';
  var wrap = document.getElementById('decks');

  DECKS.forEach(function(deck){
    var cards = CARDS.filter(function(c){ return c.kind === deck.kind; });
    var w = document.createElement('div');
    w.className = 'pile-wrap';

    var pile = document.createElement('div');
    pile.className = 'pile';
    pile.tabIndex = 0;
    pile.setAttribute('role', 'button');
    pile.setAttribute('aria-expanded', 'false');
    pile.setAttribute('aria-label', deck.title + ', ' + cards.length + ' cards');

    if(!cards.length){
      pile.innerHTML = '<div class="card ' + 'k-' + deck.kind + '" style="transform:none;display:flex;'
        + 'flex-direction:column;align-items:center;justify-content:center;text-align:center;'
        + 'border-style:dashed;box-shadow:none;">'
        + '<i class="ti ' + deck.icon + '" style="font-size:26px;color:var(--text3);margin-bottom:8px;"></i>'
        + '<div style="font-size:12px;color:var(--text3);padding:0 10px;line-height:1.5;">'
        + 'Empty deck. The first card is the hardest.</div></div>';
      pile.style.cursor = 'default';
      pile.removeAttribute('role');
    } else {
      // Reversed so card 0 is appended last and sits on top of the stack.
      cards.slice().reverse().forEach(function(c, ri){
        var i = cards.length - 1 - ri;
        pile.appendChild(buildCardEl(c, deck, i));
      });
    }

    function toggle(){
      if(!cards.length) return;
      var open = pile.classList.toggle('fanned');
      pile.setAttribute('aria-expanded', String(open));
      // Without growing the pile, a fanned deck sits on top of its own label.
      pile.style.height = open ? ((cards.length - 1) * 112 + 250) + 'px' : '';
      hint.textContent = open ? 'Click a card to open it' : deck.hint;
    }
    pile.addEventListener('click', toggle);
    pile.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); }
    });

    var label = document.createElement('div');
    label.className = 'pile-label';
    label.innerHTML = '<i class="ti ' + deck.icon + '"></i> ' + deck.title
      + '<span class="count">' + cards.length + '</span>';

    var hint = document.createElement('div');
    hint.className = 'pile-hint';
    hint.textContent = deck.hint;

    var add = document.createElement('button');
    add.className = 'pile-add';
    add.innerHTML = '<i class="ti ti-plus"></i> New card';
    add.addEventListener('click', function(e){ e.stopPropagation(); newCard(deck.kind); });

    w.appendChild(pile); w.appendChild(label); w.appendChild(hint); w.appendChild(add);
    wrap.appendChild(w);
  });
}

function buildCardEl(c, deck, i){
  var el = document.createElement('div');
  el.className = 'card k-' + c.kind;
  el.style.setProperty('--sx', (i * 3) + 'px');
  el.style.setProperty('--sy', (i * 5) + 'px');
  el.style.setProperty('--sr', ((i % 2 ? 1 : -1) * Math.min(i, 3) * 0.7) + 'deg');
  el.style.setProperty('--fy', (i * 112) + 'px');

  var flags = openFindingsFor(c.id);
  var face = (FACE[c.kind] || []).map(function(key){
    var def = (FIELDS[c.kind] || []).filter(function(f){ return f.field_key === key; })[0];
    if(!def) return '';
    var v = fval(c, key);
    if(!v) return '';
    return '<div class="card-stat"><span>' + esc(def.label) + '</span><b>' + esc(v) + '</b></div>';
  }).join('');
  var fill = fillCount(c);

  el.innerHTML =
    '<div class="card-topline"></div>'
    + '<div class="card-name">' + esc(c.name) + '</div>'
    + '<div class="card-role">' + esc(c.subtitle || '') + '</div>'
    + '<div class="card-glyph' + (c.image_path && IMG_URLS[c.image_path] ? ' has-pic' : '') + '">' + cardGlyph(c) + '</div>'
    + face
    + (flags.length
        ? '<div class="card-flag"><i class="ti ti-alert-triangle"></i> '
          + flags.length + ' to look at</div>'
        : '<div class="card-fill">' + fill.answered + '/' + fill.total + '</div>');

  el.addEventListener('click', function(ev){
    // First click on a stacked deck spreads it; only a fanned card opens.
    var pile = el.parentElement;
    if(pile && !pile.classList.contains('fanned')) return;
    ev.stopPropagation();
    openCard(c.id);
  });
  return el;
}

async function newCard(kind){
  var name = window.prompt('Name for the new ' + kind + ' card:');
  if(name === null) return;
  name = name.trim();
  if(!name){ toast('A card needs a name', 'ti-alert-triangle', true); return; }
  var res = await db.from('lore_cards')
    .insert({ work_id: workId, author_id: uid, kind: kind, name: name, data: {} })
    .select().maybeSingle();
  if(res.error || !res.data){
    toast(res.error ? res.error.message : 'Could not create the card', 'ti-x', true);
    return;
  }
  CARDS.push(res.data);
  render();
  openCard(res.data.id);
}

var SUBTITLE_HELP = {
  character:    'Shows under the name on the card \u2014 e.g. "Sellsword, chapters 1 onward"',
  society:      'What makes this society stand out \u2014 e.g. "A city of scholars", "Always sick", "Famous for their horses"',
  organisation: 'What they are known for \u2014 e.g. "Smugglers who run the docks"',
  artifact:     'What it is known as \u2014 e.g. "The sword that cannot be sheathed"',
  event:        'The short version \u2014 e.g. "The night the river burned"'
};

/* ── CARD SHEET ────────────────────────────────────────────────────── */
var EDIT_ID = null;

function openCard(id){
  var c = cardById(id);
  if(!c) return;
  EDIT_ID = id;
  var defs = FIELDS[c.kind] || [];

  // Group the definitions, keeping the database's group_order/sort_order.
  var groups = [], seen = {};
  defs.forEach(function(f){
    if(!seen[f.group_key]){
      seen[f.group_key] = { key:f.group_key, label:f.group_label, fields:[] };
      groups.push(seen[f.group_key]);
    }
    seen[f.group_key].fields.push(f);
  });

  var fill = fillCount(c);
  var flags = openFindingsFor(c.id);

  var html =
    '<h2 id="sheet-title">' + esc(c.name) + '</h2>'
    + '<div class="sub">' + esc(c.subtitle || deckTitle(c.kind)) + '</div>'
    + '<div class="private"><i class="ti ti-eye-off"></i> Only you can see this card</div>'
    + pendingNoteBanner()
    + '<div style="font-size:11.5px;color:var(--text3);">' + fill.answered + ' of ' + fill.total
      + ' questions answered</div>'
    + (flags.length
        ? '<div class="finding" style="margin-top:14px;">'
          + '<div class="finding-msg"><i class="ti ti-alert-triangle" style="color:var(--amber);"></i> '
          + flags.length + ' thing' + (flags.length === 1 ? '' : 's') + ' to look at on this card</div>'
          + '<div class="finding-acts"><button class="btn ghost" onclick="closeSheet();setView(\'checks\')">'
          + 'Open checks</button></div></div>'
        : '')
    + '<div class="grp"><div class="grp-h">The card itself</div><div class="fields">'
      + '<div class="f"><label>Name</label><input id="lb-name" maxlength="120" value="' + esc(c.name) + '"/></div>'
      + '<div class="f"><label>Subtitle</label>'
        + '<div class="help">' + esc(SUBTITLE_HELP[c.kind] || SUBTITLE_HELP.character) + '</div>'
        + '<input id="lb-subtitle" maxlength="160" value="' + esc(c.subtitle || '') + '"/></div>'
      + picFieldHtml(c)
    + '</div></div>'
    + groups.map(function(g){
        var answered = g.fields.filter(function(f){
          var d = (c.data || {})[f.field_key];
          return d && (d.skipped || (d.v != null && String(d.v) !== ''));
        }).length;
        return '<div class="grp"><div class="grp-h">' + esc(g.label)
          + '<span class="gcount">' + answered + '/' + g.fields.length + '</span></div>'
          + '<div class="fields">' + g.fields.map(function(f){ return fieldHtml(c, f); }).join('') + '</div></div>';
      }).join('')
    + (c.kind === 'character' ? relSection(c) : '')
    + '<div class="sheet-actions">'
      + '<button class="btn primary" onclick="saveCard()"><i class="ti ti-check"></i> Save card</button>'
      + '<button class="btn ghost" onclick="closeSheet()">Close</button>'
      + '<button class="btn danger" style="margin-left:auto;" onclick="deleteCardAsk()">Delete card</button>'
    + '</div>'
    + '<div id="lb-del"></div>';

  document.getElementById('sheet').innerHTML = html;
  syncReveals();
  document.getElementById('sheet-back').classList.add('open');
  document.body.style.overflow = 'hidden';
}

/* A field's stored value is one of:
     {v:"grey"}                         a plain answer
     {v:["Ilvish","cant"]}              a list
     {v:[["sword","two-handed"],...]}   weapon-style pairs
     {skipped:true}                     asked and answered "not yet"
   plus, on timeline fields, {since:6,was:[{v:"brown",until:5}]} — because a
   character who dyes their hair in chapter 25 was not contradicting himself
   in chapter 2. */
function fraw(c, key){
  var d = (c.data || {})[key];
  return (d && !d.skipped) ? d : null;
}
function flist(c, key){
  var d = fraw(c, key);
  if(!d) return [];
  if(Array.isArray(d.v)) return d.v;
  if(d.v == null || String(d.v) === '') return [];
  // An older comma-string value still has to render: split it rather than
  // showing one chip containing everything.
  return String(d.v).split(',').map(function(x){ return x.trim(); }).filter(Boolean);
}

function fieldHtml(c, f){
  var v = fval(c, f.field_key);
  var skipped = fskipped(c, f.field_key);
  var raw = fraw(c, f.field_key) || {};
  var wide = (f.input_type === 'long' || f.input_type === 'list' || f.input_type === 'pairs');
  var id = 'fld-' + f.field_key;
  var key = esc(f.field_key);
  var input;

  if(f.input_type === 'list'){
    // One entry at a time, so nobody has to guess whether commas or periods
    // separate things. Each chip is its own answer.
    var items = flist(c, f.field_key);
    var itemWhen = (raw.items && typeof raw.items === 'object') ? raw.items : {};
    var enter = 'onkeydown="if(event.key===\'Enter\'){event.preventDefault();addChip(\'' + key + '\');}"';
    input = '<div class="chips" id="chips-' + key + '">'
      + items.map(function(it, i){ return chipHtml(f.field_key, it, i, itemWhen[it]); }).join('')
      + '</div>'
      + (f.timeline
          // Each entry can have its own chapter: English from the start,
          // Elvish learned in chapter 2, a sword lost in chapter 9.
          ? '<div class="chip-add timed">'
            + '<input class="chip-text" id="' + id + '" placeholder="Type one" ' + enter + '/>'
            + '<span class="tl-lbl">from ch.</span><input class="tl-in" id="cfrom-' + key + '" placeholder="#" ' + enter + '/>'
            + '<label class="tl-chk"><input type="checkbox" id="cpre-' + key + '" onchange="preCh1(\'' + key + '\', \'cfrom-\')"/> Before ch.1</label>'
            + '<span class="tl-lbl">until ch.</span><input class="tl-in" id="cuntil-' + key + '" placeholder="#" ' + enter + '/>'
            + '<button type="button" class="btn ghost" style="padding:6px 12px;font-size:12px;" onclick="addChip(\'' + key + '\')">Add</button>'
            + '</div>'
            + '<div class="chip-tip">Chapters are optional. Leave them blank if it has always been true. '
            + 'Learned something new in chapter 2? Add it with <b>from ch. 2</b>. Lost something? Add <b>until</b> the chapter it was lost.</div>'
          : '<div class="chip-add">'
            + '<input id="' + id + '" placeholder="Type one, then press Enter" ' + enter + '/>'
            + '<button type="button" class="btn ghost" style="padding:6px 12px;font-size:12px;" onclick="addChip(\'' + key + '\')">Add</button>'
            + '</div>');

  } else if(f.input_type === 'pairs'){
    // Defaults matter: a pairs field saved without options would otherwise
    // crash the whole card editor on labels[0].toLowerCase().
    var labels = (Array.isArray(f.options) && f.options.length >= 2)
      ? f.options : ['Item', 'Detail'];
    var rows = flist(c, f.field_key);
    var rowsWhen = Array.isArray(raw.rows_when) ? raw.rows_when : [];
    input = '<div id="pairs-' + key + '">'
      + rows.map(function(r, i){ return pairRowHtml(f.field_key, r, i, labels, rowsWhen[i]); }).join('')
      + '</div>'
      + '<button type="button" class="btn ghost" style="padding:6px 12px;font-size:12px;margin-top:6px;" '
      +   'onclick="addPair(\'' + key + '\')"><i class="ti ti-plus"></i> Add ' + esc(labels[0].toLowerCase()) + '</button>'
      + (f.timeline ? '<div class="chip-tip">Chapters are optional \u2014 leave them blank if it has always been true.</div>' : '');

  } else if(f.input_type === 'height' || f.input_type === 'weight'){
    input = measureHtml(f, raw);

  } else if(f.input_type === 'chapter' && f.before_ch1){
    var pre = (v === BEFORE_CH1);
    input = '<div class="measure">'
      + '<input id="' + id + '" value="' + esc(pre ? '' : v) + '" placeholder="#"' + (pre ? ' disabled' : '') + '/>'
      + '<label class="tl-chk"><input type="checkbox" id="pre-' + key + '"' + (pre ? ' checked' : '')
      +   ' onchange="preCh1(\'' + key + '\', \'fld-\')"/> ' + esc(f.label.replace(/ in chapter$/i, '')) + ' before chapter 1</label>'
      + '</div>';

  } else if(f.input_type === 'long'){
    input = '<textarea id="' + id + '" rows="3">' + esc(v) + '</textarea>';

  } else if(f.options){
    // A datalist, not a <select>: the options are the commonest answers in
    // order as a shortcut, and anything else can still be typed. A closed
    // dropdown would tell an author their character is not allowed to exist.
    var opts = (Array.isArray(f.options) ? f.options : []).map(function(o){
      return '<option value="' + esc(o) + '"></option>';
    }).join('');
    input = '<input id="' + id + '" list="dl-' + key + '" value="' + esc(v) + '" '
      + 'placeholder="Start typing, or pick one"/>'
      + '<datalist id="dl-' + key + '">' + opts + '</datalist>';

  } else if(f.input_type === 'number'){
    input = '<input id="' + id + '" type="number" value="' + esc(v) + '"/>';

  } else {
    input = '<input id="' + id + '" value="' + esc(v) + '"/>';
  }

  // "Does it change?" — asked on every question where the answer can move.
  // Hidden behind one small button so the question itself stays clean.
  var tl = (f.timeline && f.input_type !== 'list' && f.input_type !== 'pairs') ? timelineHtml(f, raw) : '';
  var tlCut = tl.indexOf('<div class="tl" id=');
  var tlOpenBtn = tlCut > 0 ? tl.slice(0, tlCut) : '';
  var tlPanel = tlCut >= 0 ? tl.slice(tlCut) : tl;

  // Secondary questions that live behind a button under this one.
  var kids = (FIELDS[c.kind] || []).filter(function(k){ return k.reveal_under === f.field_key && k.reveal_mode === 'button'; });
  var reveal = kids.length
    ? '<div class="reveal-btns" id="rb-' + key + '">' + kids.map(function(k){
        return '<button type="button" class="reveal-btn" id="rbtn-' + esc(k.field_key) + '" onclick="revealField(\'' + esc(k.field_key) + '\')">'
          + '<i class="ti ti-plus"></i> ' + esc(k.label) + '</button>';
      }).join('') + '</div>'
    : '';

  return '<div class="f' + (wide ? ' wide' : '') + (skipped ? ' skipped' : '') + (f.reveal_under ? ' child' : '') + '" id="wrap-' + key + '"'
    + (f.reveal_under ? ' data-under="' + esc(f.reveal_under) + '" data-mode="' + esc(f.reveal_mode || 'button') + '"'
        + (Array.isArray(f.reveal_when) ? ' data-when="' + esc(JSON.stringify(f.reveal_when)) + '"' : '')
        + ' data-has="' + ((raw.v != null && String(raw.v) !== '') || skipped ? '1' : '') + '"' : '')
    + '>'
    + '<label class="q">' + esc(f.label) + (f.allow_skip ? '' : ' <span style="color:var(--red);">*</span>') + '</label>'
    + (f.help ? '<div class="help">' + esc(f.help) + '</div>' : '')
    + input
    + reveal
    // One quiet row under the answer: "Does it change?" and "stop asking"
    // side by side, then the timeline panel itself when it is opened.
    + ((tlOpenBtn || f.allow_skip)
        ? '<div class="f-extras">' + tlOpenBtn
          + (f.allow_skip
              ? '<label class="skip"><input type="checkbox" id="skip-' + key + '"'
                + (skipped ? ' checked' : '') + ' onchange="toggleSkip(\'' + key + '\')"/> '
                + 'I do not know yet \u2014 stop asking</label>'
              : '')
          + '</div>'
        : '')
    + tlPanel
    + '</div>';
}

function chipWhen(from, until){
  var f = from === '0' ? 'before ch.1' : (from ? 'from ch.' + from : '');
  var u = until ? 'until ch.' + until : '';
  return [f, u].filter(Boolean).join(' \u00b7 ');
}
function chipHtml(key, value, i, when){
  when = when || {};
  var label = chipWhen(when.from, when.until);
  return '<span class="chip" data-v="' + esc(value) + '" data-from="' + esc(when.from || '') + '" data-until="' + esc(when.until || '') + '">' + esc(value)
    + (label ? '<span class="chip-when">' + esc(label) + '</span>' : '')
    + '<button type="button" onclick="this.parentElement.remove()" aria-label="Remove">'
    + '<i class="ti ti-x"></i></button></span>';
}
function addChip(key){
  var box = document.getElementById('fld-' + key);
  var wrap = document.getElementById('chips-' + key);
  if(!box || !wrap) return;
  var val = String(box.value || '').trim();
  if(!val) return;
  var when = chipAddWhen(key);
  // Typing "a, b, c" out of habit still works: it becomes three chips rather
  // than one chip with commas in it.
  val.split(',').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(part){
    var dupe = Array.prototype.some.call(wrap.children, function(el){
      return (el.getAttribute('data-v') || '').toLowerCase() === part.toLowerCase();
    });
    if(!dupe) wrap.insertAdjacentHTML('beforeend', chipHtml(key, part, 0, when));
  });
  box.value = '';
  ['cfrom-', 'cuntil-'].forEach(function(p){ var el = document.getElementById(p + key); if(el){ el.value = ''; el.disabled = false; } });
  var pre = document.getElementById('cpre-' + key); if(pre) pre.checked = false;
  box.focus();
}

function chipAddWhen(key){
  var pre = document.getElementById('cpre-' + key);
  var fr = document.getElementById('cfrom-' + key), un = document.getElementById('cuntil-' + key);
  return {
    from: (pre && pre.checked) ? '0' : (fr ? String(fr.value).replace(/\D/g, '') : ''),
    until: un ? String(un.value).replace(/\D/g, '') : ''
  };
}

function pairRowHtml(key, row, i, labels, when){
  var a = Array.isArray(row) ? (row[0] || '') : (row || '');
  var b = Array.isArray(row) ? (row[1] || '') : '';
  var f = FIELDS_BY_KEY[key];
  var timed = !!(f && f.timeline);
  when = when || {};
  var pre = when.from === '0';
  return '<div class="pair-row' + (timed ? ' timed' : '') + '">'
    + '<input class="pair-a" value="' + esc(a) + '" placeholder="' + esc(labels[0] || '') + '"/>'
    + '<input class="pair-b" value="' + esc(b) + '" placeholder="' + esc(labels[1] || '') + '"/>'
    + (timed
        // Same idea as list chips: each row can have its own chapters.
        ? '<div class="pair-when">'
          + '<span class="tl-lbl">from ch.</span><input class="tl-in pair-from" value="' + esc(pre ? '' : (when.from || '')) + '" placeholder="#"' + (pre ? ' disabled' : '') + '/>'
          + '<label class="tl-chk"><input type="checkbox" class="pair-pre"' + (pre ? ' checked' : '')
          +   ' onchange="var r=this.closest(\'.pair-row\').querySelector(\'.pair-from\');r.disabled=this.checked;if(this.checked)r.value=\'\';"/> Before ch.1</label>'
          + '<span class="tl-lbl">until ch.</span><input class="tl-in pair-until" value="' + esc(when.until || '') + '" placeholder="#"/>'
          + '</div>'
        : '')
    + '<button type="button" onclick="this.parentElement.remove()" aria-label="Remove">'
    + '<i class="ti ti-x"></i></button></div>';
}
function addPair(key){
  var wrap = document.getElementById('pairs-' + key);
  if(!wrap) return;
  var def = (FIELDS_BY_KEY[key] && FIELDS_BY_KEY[key].options) || ['', ''];
  wrap.insertAdjacentHTML('beforeend', pairRowHtml(key, ['', ''], wrap.children.length, def));
}

var BEFORE_CH1 = 'Before chapter 1';

function timelineHtml(f, raw){
  var key = esc(f.field_key);
  var was = Array.isArray(raw.was) ? raw.was : [];
  var log = Array.isArray(raw.log) ? raw.log : [];
  var hasSince = raw.since != null && raw.since !== '';
  var open = was.length > 0 || hasSince || log.length > 0;
  var pre = hasSince && String(raw.since) === '0';
  return (open ? '' : '<button type="button" class="tl-open" id="tlo-' + key + '" onclick="openTl(\'' + key + '\')">'
      + '<i class="ti ti-history"></i> Does it change?</button>')
    + '<div class="tl" id="tl-' + key + '"' + (open ? '' : ' style="display:none;"') + '>'
    +   '<div class="tl-row"><span class="tl-q">Does it change? Yes</span>'
    +     '<button type="button" class="tl-no" onclick="closeTl(\'' + key + '\')">No, it never changes</button></div>'
    +   '<div class="tl-row"><span class="tl-lbl">In what chapter?</span>'
    +     '<input class="tl-in" id="since-' + key + '" value="' + esc(pre || !hasSince ? '' : raw.since) + '" placeholder="#"' + (pre ? ' disabled' : '') + '/>'
    +     '<label class="tl-chk"><input type="checkbox" id="presince-' + key + '"' + (pre ? ' checked' : '')
    +       ' onchange="preCh1(\'' + key + '\', \'since-\')"/> Before chapter 1</label></div>'
    +   '<div class="tl-sub">What was it before?</div>'
    +   '<div id="was-' + key + '">' + was.map(function(w){ return wasRowHtml(f.field_key, w); }).join('') + '</div>'
    +   '<button type="button" class="tl-btn" onclick="addWas(\'' + key + '\')"><i class="ti ti-plus"></i> Add what it was before</button>'
    +   '<div class="tl-row" style="margin-top:10px;"><span class="tl-lbl">Does it change per chapter?</span>'
    +     '<span class="tl-yn"><button type="button" id="logno-' + key + '" class="' + (log.length ? '' : 'on') + '" onclick="setLog(\'' + key + '\', false)">No</button>'
    +     '<button type="button" id="logyes-' + key + '" class="' + (log.length ? 'on' : '') + '" onclick="setLog(\'' + key + '\', true)">Yes</button></span></div>'
    +   '<div id="logwrap-' + key + '"' + (log.length ? '' : ' style="display:none;"') + '>'
    +     '<div class="tl-sub">One line for each chapter it changes in \u2014 the newest line at or before a chapter is what the checks use.</div>'
    +     '<div id="log-' + key + '">' + log.map(function(e){ return logRowHtml(e); }).join('') + '</div>'
    +     '<button type="button" class="tl-btn" onclick="addLog(\'' + key + '\')"><i class="ti ti-plus"></i> Add a chapter</button>'
    +   '</div>'
    + '</div>';
}
function wasRowHtml(key, w){
  var pre = w && String(w.until) === '0';
  return '<div class="tl-row was-row">'
    + '<input class="was-v" value="' + esc(w && w.v != null ? w.v : '') + '" placeholder="what it was"/>'
    + '<span class="tl-lbl">until ch.</span>'
    + '<input class="tl-in was-until" value="' + esc(w && w.until != null && !pre ? w.until : '') + '" placeholder="#"/>'
    + '<button type="button" onclick="this.parentElement.remove()" aria-label="Remove">'
    + '<i class="ti ti-x"></i></button></div>';
}
function logRowHtml(e){
  return '<div class="tl-row log-row">'
    + '<span class="tl-lbl">ch.</span>'
    + '<input class="tl-in log-ch" value="' + esc(e && e.ch != null ? e.ch : '') + '" placeholder="#"/>'
    + '<input class="log-v" value="' + esc(e && e.v != null ? e.v : '') + '" placeholder="what it is in that chapter"/>'
    + '<button type="button" onclick="this.parentElement.remove()" aria-label="Remove">'
    + '<i class="ti ti-x"></i></button></div>';
}
function addWas(key){
  var wrap = document.getElementById('was-' + key);
  if(wrap) wrap.insertAdjacentHTML('beforeend', wasRowHtml(key, {}));
}
function addLog(key){
  var wrap = document.getElementById('log-' + key);
  if(wrap) wrap.insertAdjacentHTML('beforeend', logRowHtml({}));
}
function setLog(key, on){
  var w = document.getElementById('logwrap-' + key);
  if(w) w.style.display = on ? '' : 'none';
  var y = document.getElementById('logyes-' + key), n = document.getElementById('logno-' + key);
  if(y) y.classList.toggle('on', on);
  if(n) n.classList.toggle('on', !on);
  if(on){ var l = document.getElementById('log-' + key); if(l && !l.children.length) addLog(key); }
}
function openTl(key){
  var el = document.getElementById('tl-' + key);
  if(el) el.style.display = '';
  var btn = document.getElementById('tlo-' + key);
  if(btn) btn.style.display = 'none';
}
// "No" clears everything the timeline held, so a mistaken Yes leaves nothing behind.
function closeTl(key){
  var el = document.getElementById('tl-' + key);
  if(!el) return;
  el.querySelectorAll('input').forEach(function(i){ if(i.type === 'checkbox') i.checked = false; else { i.value = ''; i.disabled = false; } });
  ['was-', 'log-'].forEach(function(p){ var w = document.getElementById(p + key); if(w) w.innerHTML = ''; });
  setLog(key, false);
  el.style.display = 'none';
  var btn = document.getElementById('tlo-' + key);
  if(btn) btn.style.display = '';
}
function preCh1(key, prefix){
  var box = document.getElementById((prefix === 'since-' ? 'presince-' : prefix === 'cfrom-' ? 'cpre-' : 'pre-') + key);
  var inp = document.getElementById(prefix + key);
  if(!box || !inp) return;
  inp.disabled = box.checked;
  if(box.checked) inp.value = '';
}

/* Height and weight: type either unit, the other fills itself in. Stored as
   one readable string ("180 cm (5 ft 11 in)") so the checks and the beta
   reader read it like any other answer, plus the metric number. */
function measureHtml(f, raw){
  var key = esc(f.field_key);
  if(f.input_type === 'height'){
    var cm = raw.cm != null ? Number(raw.cm) : parseHeightCm(raw.v);
    var ft = '', inch = '';
    if(cm){ var tot = Math.round(cm / 2.54); ft = Math.floor(tot / 12); inch = tot % 12; }
    return '<div class="measure">'
      + '<input type="number" min="0" id="hft-' + key + '" value="' + esc(ft) + '" oninput="syncHeight(\'' + key + '\',\'imp\')"/><span>ft</span>'
      + '<input type="number" min="0" max="11" id="hin-' + key + '" value="' + esc(inch) + '" oninput="syncHeight(\'' + key + '\',\'imp\')"/><span>in</span>'
      + '<span style="margin:0 4px;">or</span>'
      + '<input type="number" min="0" id="hcm-' + key + '" value="' + esc(cm ? Math.round(cm) : '') + '" oninput="syncHeight(\'' + key + '\',\'cm\')"/><span>cm</span>'
      + '</div>';
  }
  var kg = raw.kg != null ? Number(raw.kg) : parseWeightKg(raw.v);
  return '<div class="measure">'
    + '<input type="number" min="0" id="wlb-' + key + '" value="' + esc(kg ? Math.round(kg * 2.20462) : '') + '" oninput="syncWeight(\'' + key + '\',\'lb\')"/><span>lb</span>'
    + '<span style="margin:0 4px;">or</span>'
    + '<input type="number" min="0" id="wkg-' + key + '" value="' + esc(kg ? Math.round(kg) : '') + '" oninput="syncWeight(\'' + key + '\',\'kg\')"/><span>kg</span>'
    + '</div>';
}
function parseHeightCm(v){
  if(v == null) return null;
  var t = String(v).toLowerCase();
  var m = t.match(/([\d.]+)\s*cm/); if(m) return parseFloat(m[1]);
  m = t.match(/([\d.]+)\s*m\b/); if(m) return parseFloat(m[1]) * 100;
  m = t.match(/(\d+)\s*(?:ft|foot|feet|')\s*(\d+)?/);
  if(m) return (parseInt(m[1], 10) * 12 + (parseInt(m[2] || '0', 10))) * 2.54;
  return null;
}
function parseWeightKg(v){
  if(v == null) return null;
  var t = String(v).toLowerCase();
  var m = t.match(/([\d.]+)\s*kg/); if(m) return parseFloat(m[1]);
  m = t.match(/([\d.]+)\s*(?:lb|lbs|pound)/); if(m) return parseFloat(m[1]) / 2.20462;
  m = t.match(/(\d+)\s*st(?:one)?\s*(\d+)?/); if(m) return (parseInt(m[1],10) * 14 + parseInt(m[2] || '0',10)) / 2.20462;
  return null;
}
function syncHeight(key, from){
  var ft = document.getElementById('hft-' + key), inch = document.getElementById('hin-' + key), cm = document.getElementById('hcm-' + key);
  if(from === 'cm'){
    var c = parseFloat(cm.value);
    if(!c){ ft.value = ''; inch.value = ''; return; }
    var tot = Math.round(c / 2.54); ft.value = Math.floor(tot / 12); inch.value = tot % 12;
  } else {
    var f = parseInt(ft.value || '0', 10), i = parseInt(inch.value || '0', 10);
    cm.value = (f || i) ? Math.round((f * 12 + i) * 2.54) : '';
  }
}
function syncWeight(key, from){
  var lb = document.getElementById('wlb-' + key), kg = document.getElementById('wkg-' + key);
  if(from === 'kg'){ var k = parseFloat(kg.value); lb.value = k ? Math.round(k * 2.20462) : ''; }
  else { var l = parseFloat(lb.value); kg.value = l ? Math.round(l / 2.20462) : ''; }
}

/* Follow-up questions. "button": behind a small button under the parent,
   shown straight away if it already has an answer. "yes": shown when the
   parent answer is Yes. "many": shown when the parent list has 2+ entries. */
function revealField(key){
  var w = document.getElementById('wrap-' + key);
  if(w){ w.setAttribute('data-open', '1'); w.style.display = ''; }
  var b = document.getElementById('rbtn-' + key);
  if(b) b.style.display = 'none';
  var inp = w && w.querySelector('input,textarea');
  if(inp) inp.focus();
}
function syncReveals(){
  document.querySelectorAll('#sheet .f[data-under]').forEach(function(w){
    var parent = w.getAttribute('data-under'), mode = w.getAttribute('data-mode');
    var key = w.id.replace(/^wrap-/, '');
    var show;
    if(mode === 'value'){
      // Shown when the parent answer is one of the listed choices, e.g. the
      // regression questions when "Does their age ever shift?" is "Both".
      var pv = document.getElementById('fld-' + parent);
      var list = [];
      try { list = JSON.parse(w.getAttribute('data-when') || '[]'); } catch(e) {}
      var cur = pv ? String(pv.value || '').trim().toLowerCase() : '';
      show = !!cur && list.some(function(x){ return String(x).toLowerCase() === cur; });
      if(!show && w.getAttribute('data-has') === '1' && !pv) show = true;
    } else if(mode === 'yes'){
      var pe = document.getElementById('fld-' + parent);
      show = !!(pe && /^\s*yes\s*$/i.test(pe.value)) || (w.getAttribute('data-has') === '1' && !pe);
    } else if(mode === 'many'){
      var chips = document.getElementById('chips-' + parent);
      show = !!(chips && chips.children.length >= 2);
    } else {
      show = w.getAttribute('data-has') === '1' || w.getAttribute('data-open') === '1';
      var b = document.getElementById('rbtn-' + key);
      if(b) b.style.display = show ? 'none' : '';
    }
    w.style.display = show ? '' : 'none';
  });
}
document.addEventListener('input', function(e){ if(e.target.closest && e.target.closest('#sheet')) syncReveals(); });
document.addEventListener('change', function(e){ if(e.target.closest && e.target.closest('#sheet')) syncReveals(); });
document.addEventListener('click', function(e){ if(e.target.closest && e.target.closest('#sheet')) setTimeout(syncReveals, 0); });
document.addEventListener('keyup', function(e){ if(e.key === 'Enter' && e.target.closest && e.target.closest('#sheet')) syncReveals(); });

function toggleSkip(key){
  var wrap = document.getElementById('wrap-' + key);
  var box = document.getElementById('skip-' + key);
  if(wrap && box) wrap.classList.toggle('skipped', box.checked);
}

function relSection(c){
  var mine = RELATIONS.filter(function(r){
    return r.from_card_id === c.id || r.to_card_id === c.id;
  });
  var byGroup = {};
  mine.forEach(function(r){ (byGroup[r.group_key] = byGroup[r.group_key] || []).push(r); });

  var blocks = Object.keys(byGroup).map(function(k){
    return '<div class="grp"><div class="grp-h">' + esc(REL_LABEL[k] || k) + '</div>'
      + byGroup[k].map(function(r){
          var otherId = r.from_card_id === c.id ? r.to_card_id : r.from_card_id;
          var other = cardById(otherId);
          return '<div class="rel">'
            + '<span class="who">' + esc(other ? other.name : 'a card that no longer exists') + '</span>'
            + '<span class="what">' + esc(r.what_now || 'nothing written yet') + '</span>'
            + (r.tie_label ? '<span class="tie">' + esc(r.tie_label) + '</span>' : '')
            + '<button class="btn ghost" style="padding:4px 10px;font-size:11.5px;" '
            + 'onclick="openRelation(\'' + r.id + '\')">Open</button>'
            + '</div>';
        }).join('')
      + '</div>';
  }).join('');

  return blocks
    + '<div class="grp"><div class="grp-h">Relationships</div>'
    + '<div style="font-size:12.5px;color:var(--text2);line-height:1.6;">'
    + 'Drag two cards together on the Relationships board to start one. '
    + 'What you write in the middle \u2014 how it started, what it is now, what would end it \u2014 '
    + 'shows on both cards; the note you write here does not.</div>'
    + '<div class="finding-acts"><button class="btn ghost" onclick="closeSheet();setView(\'board\')">'
    + '<i class="ti ti-arrows-shuffle"></i> Open the board</button></div></div>';
}

async function saveCard(){
  var c = cardById(EDIT_ID);
  if(!c) return;
  var defs = FIELDS[c.kind] || [];
  var missing = null;

  // Start from what is already stored and only overwrite the keys this form
  // actually rendered. Anything under a renamed or retired field key is
  // carried through untouched instead of being wiped by a save.
  var rendered = {};
  defs.forEach(function(f){ rendered[f.field_key] = true; });
  var data = {};
  Object.keys(c.data || {}).forEach(function(k){
    if(!rendered[k]) data[k] = c.data[k];
  });

  defs.forEach(function(f){
    var box = document.getElementById('skip-' + f.field_key);
    if(box && box.checked){ data[f.field_key] = { skipped:true }; return; }

    var entry = null;

    if(f.input_type === 'list'){
      var wrap = document.getElementById('chips-' + f.field_key);
      var itemsWhen = {};
      var items = wrap ? Array.prototype.map.call(wrap.children, function(el){
        var v = el.getAttribute('data-v') || '';
        var fr = el.getAttribute('data-from') || '', un = el.getAttribute('data-until') || '';
        if(v && (fr || un)) itemsWhen[v] = Object.assign(fr ? { from: fr } : {}, un ? { until: un } : {});
        return v;
      }).filter(Boolean) : [];
      // Anything left in the add box counts too: an author who types a last
      // entry and hits Save should not silently lose it.
      var pending = document.getElementById('fld-' + f.field_key);
      if(pending && String(pending.value).trim()){
        var pw2 = chipAddWhen(f.field_key);
        String(pending.value).split(',').map(function(x){ return x.trim(); })
          .filter(Boolean).forEach(function(x){
            items.push(x);
            if(pw2.from || pw2.until) itemsWhen[x] = Object.assign(pw2.from ? { from: pw2.from } : {}, pw2.until ? { until: pw2.until } : {});
          });
      }
      if(items.length){
        entry = { v: items };
        if(Object.keys(itemsWhen).length) entry.items = itemsWhen;
      }

    } else if(f.input_type === 'pairs'){
      var pw = document.getElementById('pairs-' + f.field_key);
      var rowsWhen = [], anyWhen = false;
      var rows = pw ? Array.prototype.filter.call(pw.children, function(row){
        var a = row.querySelector('.pair-a'), b = row.querySelector('.pair-b');
        return (a && a.value.trim()) || (b && b.value.trim());
      }).map(function(row){
        var a = row.querySelector('.pair-a'), b = row.querySelector('.pair-b');
        var pre = row.querySelector('.pair-pre'), fr = row.querySelector('.pair-from'), un = row.querySelector('.pair-until');
        var w = {};
        var frv = (pre && pre.checked) ? '0' : (fr ? fr.value.replace(/\D/g, '') : '');
        var unv = un ? un.value.replace(/\D/g, '') : '';
        if(frv) w.from = frv;
        if(unv) w.until = unv;
        if(frv || unv) anyWhen = true;
        rowsWhen.push(w);
        return [a ? a.value.trim() : '', b ? b.value.trim() : ''];
      }) : [];
      if(rows.length){
        entry = { v: rows };
        if(anyWhen) entry.rows_when = rowsWhen;
      }

    } else if(f.input_type === 'height'){
      var cmv = parseFloat((document.getElementById('hcm-' + f.field_key) || {}).value);
      if(cmv > 0){
        var tot = Math.round(cmv / 2.54);
        entry = { v: Math.round(cmv) + ' cm (' + Math.floor(tot / 12) + ' ft ' + (tot % 12) + ' in)', cm: Math.round(cmv) };
      }

    } else if(f.input_type === 'weight'){
      var kgv = parseFloat((document.getElementById('wkg-' + f.field_key) || {}).value);
      var lbv = parseFloat((document.getElementById('wlb-' + f.field_key) || {}).value);
      if(!(kgv > 0) && lbv > 0) kgv = lbv / 2.20462;
      if(kgv > 0) entry = { v: Math.round(kgv) + ' kg (' + Math.round(kgv * 2.20462) + ' lb)', kg: Math.round(kgv) };

    } else {
      var pre1 = f.before_ch1 && document.getElementById('pre-' + f.field_key);
      var el = document.getElementById('fld-' + f.field_key);
      var v = (pre1 && pre1.checked) ? BEFORE_CH1 : (el ? String(el.value).trim() : '');
      if(v !== '') entry = { v: v };
    }

    // A follow-up question that is not showing (Religious? No) is not saved,
    // but anything already on file under it is kept rather than wiped.
    var wrapEl = document.getElementById('wrap-' + f.field_key);
    if(f.reveal_under && wrapEl && wrapEl.style.display === 'none' && f.reveal_mode !== 'button'){
      // "value" follow-ups are dropped when the parent answer rules them out
      // (age shift set back to "No"), so the beta reader never reads stale
      // regression details for a character who does not regress.
      if(f.reveal_mode !== 'value' && c.data && c.data[f.field_key]) data[f.field_key] = c.data[f.field_key];
      return;
    }

    // Timeline: the chapter the current value became true, plus what it was
    // before. Only attached when the author actually filled it in.
    if(f.timeline){
      var sinceEl = document.getElementById('since-' + f.field_key);
      var preSince = document.getElementById('presince-' + f.field_key);
      var since = (preSince && preSince.checked) ? '0' : (sinceEl ? String(sinceEl.value).replace(/\D/g, '') : '');
      var logWrap = document.getElementById('logwrap-' + f.field_key);
      var logBox = document.getElementById('log-' + f.field_key);
      var log = (logWrap && logWrap.style.display !== 'none' && logBox) ? Array.prototype.map.call(logBox.children, function(row){
        var chEl = row.querySelector('.log-ch'), vEl = row.querySelector('.log-v');
        return { ch: chEl ? chEl.value.replace(/\D/g, '') : '', v: vEl ? vEl.value.trim() : '' };
      }).filter(function(x){ return x.ch !== '' && x.v; })
        .sort(function(a, b){ return Number(a.ch) - Number(b.ch); }) : [];
      var wasWrap = document.getElementById('was-' + f.field_key);
      var was = wasWrap ? Array.prototype.map.call(wasWrap.children, function(row){
        var vEl = row.querySelector('.was-v'), uEl = row.querySelector('.was-until');
        return { v: vEl ? vEl.value.trim() : '', until: uEl ? uEl.value.replace(/\D/g, '') : '' };
      }).filter(function(x){ return x.v; }) : [];
      // A blank current value with a filled-in past is meaningful, so the
      // entry is created rather than dropped.
      if(!entry && (since || was.length || log.length)) entry = { v: '' };
      if(entry && since) entry.since = since;
      if(entry && was.length) entry.was = was;
      if(entry && log.length) entry.log = log;
    }

    if(entry) data[f.field_key] = entry;
    else if(!f.allow_skip && !missing) missing = f.label;
  });

  var name = String(document.getElementById('lb-name').value || '').trim();
  if(!name){ toast('A card needs a name', 'ti-alert-triangle', true); return; }
  if(missing){ toast(missing + ' is needed', 'ti-alert-triangle', true); return; }

  var res = await db.from('lore_cards').update({
    name: name,
    subtitle: String(document.getElementById('lb-subtitle').value || '').trim() || null,
    data: data
  }).eq('id', c.id).select().maybeSingle();

  if(res.error || !res.data){
    toast(res.error ? res.error.message : 'Could not save', 'ti-x', true);
    return;
  }
  for(var i=0;i<CARDS.length;i++) if(CARDS[i].id === c.id) CARDS[i] = res.data;
  var fromNote = PENDING_NOTE;
  closeSheet();
  if(fromNote){
    var ok = await noteSet(fromNote, 'applied', true);
    toast(ok ? 'Card saved — note moved to Done' : 'Card saved');
    if(!ok) render();
  } else {
    toast('Card saved');
    render();
  }
}

/* Deleting a card takes relationships and findings with it (ON DELETE
   CASCADE), so it gets the same centred confirm as a dismissed check. */
