function findingSuggest(f){
  var sg = f && f.detail && f.detail.raw ? f.detail.raw.suggest : null;
  if(!sg || !Array.isArray(sg.fields) || !sg.fields.length) return null;
  // Where the facts go is the SUGGESTION's card, never the finding's. A fact
  // about Melissa can surface in a line of Ashner's thoughts; the finding is
  // filed under Ashner, but the facts belong to Melissa. A suggestion with no
  // card but a name means "this subject", found by name or made new.
  var card = null;
  if(sg.card_id) card = cardById(sg.card_id);
  else if(sg.name && sg.kind) card = cardByName(sg.name, sg.kind);
  else if(f.card_id) card = cardById(f.card_id);
  if(!card && !(sg.name && sg.kind)) return null;
  return { sg: sg, card: card };
}
/* ── Card vs chapter ────────────────────────────────────────────────
   When the chapter and a card disagree, neither side is assumed right.
   The author picks: fix the chapter (the notice stays as a to-do until the
   chapter is read again), or take the chapter's word and update the card. */
function chapterNumOf(f){
  var c = f && f.chapter_id ? CHAPTERS.filter(function(x){ return x.id === f.chapter_id; })[0] : null;
  return c ? c.chapter_number : null;
}
function findingQuote(f){
  var q = f && f.detail && f.detail.raw ? f.detail.raw.quote : null;
  return q && String(q).trim() ? String(q).trim() : '';
}
function cardValueText(card, key){
  var cur = (card && card.data || {})[key];
  if(!cur || cur.v == null) return '';
  if(Array.isArray(cur.v)){
    return cur.v.map(function(x){ return Array.isArray(x) ? (x[0] || '') : String(x); })
      .filter(function(x){ return String(x).trim(); }).join(', ');
  }
  return String(cur.v).trim();
}
function sameAnswer(a, b){
  var n = function(x){ return String(x || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); };
  return n(a) === n(b);
}
function contradictionInfo(f){
  if(!f) return null;
  // Card checks hand over the field and the chapter's value directly.
  if(f.source !== 'ai' && f.detail && f.detail.field && f.detail.text_value && f.card_id){
    var c0 = cardById(f.card_id);
    if(!c0) return null;
    var d0 = FIELDS_BY_KEY[f.detail.field];
    return { card: c0, key: f.detail.field, label: d0 ? d0.label : f.detail.field,
             list: !!(d0 && (d0.input_type === 'list' || d0.input_type === 'pairs')),
             cardVal: cardValueText(c0, f.detail.field), chapVal: String(f.detail.text_value) };
  }
  var hit = findingSuggest(f);
  if(!hit || !hit.card) return null;
  for(var i = 0; i < hit.sg.fields.length; i++){
    var fl = hit.sg.fields[i];
    var def = (FIELDS[hit.card.kind] || []).filter(function(x){ return x.field_key === fl.key; })[0];
    if(!def) continue;
    var isList = def.input_type === 'list' || def.input_type === 'pairs';
    var have = cardValueText(hit.card, fl.key);
    if(!have || sameAnswer(have, fl.value)) continue;
    // A list gaining a new item is a new fact, not a disagreement, unless
    // the reader called it a contradiction.
    if(isList && f.code !== 'contradiction') continue;
    return { card: hit.card, key: fl.key, label: def.label, list: isList,
             cardVal: have, chapVal: fl.value };
  }
  return null;
}
function quoteHtml(f){
  var q = findingQuote(f);
  if(!q) return '';
  var n = chapterNumOf(f);
  return '<div class="sg-quote"><i class="ti ti-search"></i> '
    + (n ? 'Find it in chapter ' + esc(n) + ': ' : 'Find it: ')
    + '<q>' + esc(q) + '</q>'
    + ' <button class="sg-copy" title="Copy, then paste into your editor\u2019s search" '
    + 'onclick="copyQuote(\'' + esc(f.id) + '\')"><i class="ti ti-copy"></i></button></div>';
}
function copyQuote(id){
  var f = FINDINGS.filter(function(x){ return x.id === id; })[0];
  var q = findingQuote(f);
  if(!q) return;
  try { navigator.clipboard.writeText(q).then(function(){ toast('Copied \u2014 paste it into your editor\u2019s search'); }); }
  catch(e) { toast('Could not copy', 'ti-x', true); }
}
function disagreeHtml(f, ci){
  var n = chapterNumOf(f);
  var chWord = n ? 'chapter ' + n : 'the chapter';
  return '<div class="sg sg-clash">'
    + '<div class="sg-h"><i class="ti ti-arrows-diff"></i> '
    + 'Card and ' + esc(chWord) + ' disagree \u2014 <b>' + esc(ci.card.name) + '</b> \u203a ' + esc(ci.label) + '</div>'
    + '<div class="sg-line"><span class="sg-q">The card says</span><span class="sg-v">' + esc(ci.cardVal) + '</span></div>'
    + '<div class="sg-line"><span class="sg-q">' + esc(n ? 'Chapter ' + n : 'The chapter') + ' says</span>'
    + '<span class="sg-v">' + esc(ci.chapVal) + '</span></div>'
    + quoteHtml(f)
    + '<div class="sg-foot">Which one is right?</div>'
    + '<div class="clash-choices">'
    + '<button class="clash-btn" onclick="respond(\'' + esc(f.id) + '\',\'fixing\')">'
    +   '<span class="clash-t"><i class="ti ti-pencil"></i> The card is right</span>'
    +   '<span class="clash-s">I\u2019ll fix ' + esc(chWord) + '. This stays on your list until '
    +   esc(chWord) + ' is read again.</span></button>'
    + '<button class="clash-btn" onclick="takeChapterValue(\'' + esc(f.id) + '\')">'
    +   '<span class="clash-t"><i class="ti ti-arrow-back-up"></i> The chapter is right</span>'
    +   '<span class="clash-s">' + esc(ci.card.name) + ' \u203a ' + esc(ci.label) + ': '
    +   esc(ci.cardVal) + ' \u2192 ' + esc(ci.chapVal)
    +   (ci.list ? ' (opens the card so you can check the list)' : '') + '</span></button>'
    + '</div></div>';
}
async function takeChapterValue(findingId){
  var f = FINDINGS.filter(function(x){ return x.id === findingId; })[0];
  var ci = contradictionInfo(f);
  if(!ci) return;
  // A list is edited by hand: which item the new answer replaces is the
  // author's call, not a guess.
  if(ci.list) return openFindingOnCard(findingId, ci.card.id);
  var card = ci.card;
  var prevData = JSON.parse(JSON.stringify(card.data || {}));
  var prevStatus = f.status;
  var data = JSON.parse(JSON.stringify(card.data || {}));
  data[ci.key] = Object.assign({}, data[ci.key] || {}, { v: ci.chapVal });
  var res = await db.from('lore_cards').update({ data: data }).eq('id', card.id).select().maybeSingle();
  if(res.error || !res.data){ toast(res.error ? res.error.message : 'Could not save that', 'ti-x', true); return; }
  for(var i = 0; i < CARDS.length; i++) if(CARDS[i].id === card.id) CARDS[i] = res.data;
  try { await respond(findingId, 'resolve', true); } catch(e) {}
  toast(card.name + ' \u2014 ' + ci.label + ' is now ' + ci.chapVal, 'ti-check', false,
    function(){ return undoCardWrite(card.id, prevData, findingId, prevStatus); });
  render();
}

function suggestHtml(f){
  var hit = findingSuggest(f);
  if(!hit) return '';
  var ci = contradictionInfo(f);
  if(ci) return disagreeHtml(f, ci);
  var kindWord = hit.card ? deckTitle(hit.card.kind) : deckTitle(hit.sg.kind);
  var lines = hit.sg.fields.map(function(fl){
    var def = FIELDS_BY_KEY[fl.key];
    return '<div class="sg-line"><span class="sg-q">' + esc(def ? def.label : fl.key) + '</span>'
      + '<span class="sg-v">' + esc(fl.value) + '</span>'
      + (fl.chapter ? '<span class="sg-ch">from ch.' + esc(fl.chapter) + '</span>' : '')
      + '</div>';
  }).join('');
  var nAdd = suggestWouldAdd(hit);
  if(nAdd === 0){
    // Already on the card. Offering to add it again only leads to a dead end
    // ("nothing changed"), so the offer goes and the finding says why.
    return '<div class="sg"><div class="sg-h"><i class="ti ti-check"></i> '
      + 'Already on <b>' + esc(hit.card.name) + '</b>\u2019s card</div>'
      + lines
      + '<div class="sg-foot">Nothing to add \u2014 these questions are answered. '
      + 'Use <b>Leave it \u2014 stop asking</b> to clear it from the queue.</div></div>';
  }
  return '<div class="sg">'
    + '<div class="sg-h"><i class="ti ti-wand"></i> '
    + (hit.card
        ? 'Goes to <b>' + esc(hit.card.name) + '</b>\u2019s card'
          + (hit.card.id !== f.card_id && f.card_id ? ' <span class="sg-note">(not ' + esc((cardById(f.card_id) || {}).name || 'the card above') + '\u2019s)</span>' : '')
        : 'Goes on a <b>new ' + esc(String(kindWord).toLowerCase().replace(/s$/, '')) + ' card: ' + esc(hit.sg.name) + '</b>')
    + '</div>'
    + lines
    + quoteHtml(f)
    + '<div class="sg-foot">Each line shows the question it will answer. Add it in one tap, or open the card to change the wording first. '
    + 'Anything you have already answered is left alone.</div>'
    + '<div class="finding-acts">'
    + '<button class="btn primary" onclick="quickAddSuggestion(\'' + esc(f.id) + '\')"><i class="ti ti-bolt"></i> '
    // Same action as "This is true \u2014 update the card" on a finding with no
    // suggestion. It used to read only "Add to X's card", so the two looked
    // like different things and this one looked like a missing option.
    + (hit.card ? 'This is true \u2014 add to ' + esc(hit.card.name) + '\u2019s card'
                : 'This is true \u2014 make the card') + '</button>'
    + '<button class="btn ghost" onclick="applySuggestion(\'' + esc(f.id) + '\')">'
    + '<i class="ti ti-pencil"></i> Edit the card instead</button>'
    + (hit.card
        ? '<button class="btn ghost" onclick="findingToCard(\'' + esc(f.id) + '\', true)">'
          + '<i class="ti ti-arrow-right"></i> Add to a different card</button>'
        : '')
    + '</div></div>';
}

// The suggestion is filled into the editor, highlighted, and left for the
// author to check. Nothing reaches a card until they press Save card.
// A second finding about the same subject must land on the SAME card, not a
// second one with the same name.
function cardByName(name, kind){
  var n = String(name || '').trim().toLowerCase();
  if(!n) return null;
  return CARDS.filter(function(c){
    return String(c.name || '').trim().toLowerCase() === n && (!kind || c.kind === kind);
  })[0] || null;
}
// Two cards in a work can no longer share a kind and a name (enforced in the
// database too), so a clash means "use the one already there".
async function findOrMakeCard(name, kind){
  var existing = cardByName(name, kind);
  if(existing) return { card: existing, made: false };
  var res = await db.from('lore_cards').insert({
    work_id: workId, author_id: uid, kind: kind, name: String(name).trim()
  }).select().maybeSingle();
  if(res.error || !res.data){
    if(res.error && /duplicate|unique/i.test(res.error.message || '')){
      var again = await db.from('lore_cards').select('*')
        .eq('work_id', workId).eq('kind', kind).ilike('name', String(name).trim()).maybeSingle();
      if(again.data){
        if(!cardByName(again.data.name, kind)) CARDS.push(again.data);
        return { card: again.data, made: false };
      }
    }
    return { card: null, error: res.error ? res.error.message : 'Could not make that card' };
  }
  CARDS.push(res.data);
  return { card: res.data, made: true };
}

/* The finding usually names its subject, so the card can be worked out
   without asking. Longest name first, so "Dead God" wins over "God". */
function cardFromMessage(msg){
  var low = String(msg || '').toLowerCase();
  var hits = CARDS.filter(function(c){
    var n = String(c.name || '').trim().toLowerCase();
    return n.length > 2 && low.indexOf(n) >= 0;
  }).sort(function(a, b){ return b.name.length - a.name.length; });
  return hits[0] || null;
}
function findingCard(f){
  if(!f) return null;
  var hit = findingSuggest(f);
  if(hit && hit.card) return hit.card;
  if(f.card_id && cardById(f.card_id)) return cardById(f.card_id);
  return cardFromMessage(f.message);
}

/* Would a one-tap add actually change anything? Same rules quickAddSuggestion
   uses, so what the finding OFFERS and what the button DOES can never drift
   apart: an answer already on the card is never overwritten, and a list item
   already there is not added twice. */
function suggestWouldAdd(hit){
  if(!hit || !hit.card) return -1;            // no card yet: it would make one
  var data = hit.card.data || {};
  var n = 0;
  hit.sg.fields.forEach(function(fl){
    var def = (FIELDS[hit.card.kind] || []).filter(function(x){ return x.field_key === fl.key; })[0];
    if(!def) return;
    var cur = data[fl.key] || {};
    if(def.input_type === 'list'){
      var items = Array.isArray(cur.v) ? cur.v : (cur.v ? [cur.v] : []);
      if(!items.some(function(x){ return String(x).toLowerCase() === String(fl.value).toLowerCase(); })) n++;
    } else if(def.input_type === 'pairs'){
      var rows = Array.isArray(cur.v) ? cur.v : [];
      if(!rows.some(function(r){ return String((r || [])[0] || '').toLowerCase() === String(fl.value).toLowerCase(); })) n++;
    } else if(cur.v == null || String(cur.v).trim() === ''){
      n++;
    }
  });
  return n;
}

/* One-tap filing: the suggested answers are written straight to the card.
   Answers already on the card are never touched, and the toast says what
   landed so a wrong guess is easy to spot and undo by hand. */
async function quickAddSuggestion(findingId){
  var f = FINDINGS.filter(function(x){ return x.id === findingId; })[0];
  var hit = f && findingSuggest(f);
  if(!hit) return;
  var card = hit.card;
  if(!card){
    var made = await findOrMakeCard(hit.sg.name, hit.sg.kind);
    if(!made.card){ toast(made.error, 'ti-x', true); return; }
    card = made.card;
  }

  var data = JSON.parse(JSON.stringify(card.data || {}));
  var prevData = JSON.parse(JSON.stringify(card.data || {}));   // for Undo
  var prevStatus = f.status;
  var added = [], skipped = 0;
  hit.sg.fields.forEach(function(fl){
    var def = (FIELDS[card.kind] || []).filter(function(x){ return x.field_key === fl.key; })[0];
    if(!def) { skipped++; return; }
    var cur = data[fl.key] || {};
    var ch = fl.chapter ? String(fl.chapter) : '';
    if(def.input_type === 'list'){
      var items = Array.isArray(cur.v) ? cur.v.slice() : (cur.v ? [cur.v] : []);
      if(items.some(function(x){ return String(x).toLowerCase() === String(fl.value).toLowerCase(); })){ skipped++; return; }
      items.push(fl.value);
      var when = cur.items && typeof cur.items === 'object' ? cur.items : {};
      if(ch) when[fl.value] = { from: ch };
      data[fl.key] = Object.assign({}, cur, { v: items });
      if(Object.keys(when).length) data[fl.key].items = when;
    } else if(def.input_type === 'pairs'){
      var rows = Array.isArray(cur.v) ? cur.v.slice() : [];
      if(rows.some(function(r){ return String((r || [])[0] || '').toLowerCase() === String(fl.value).toLowerCase(); })){ skipped++; return; }
      rows.push([fl.value, '']);
      data[fl.key] = Object.assign({}, cur, { v: rows });
    } else {
      // Never overwrite something the author wrote themselves.
      if(cur.v != null && String(cur.v).trim() !== ''){ skipped++; return; }
      data[fl.key] = Object.assign({}, cur, { v: fl.value });
      if(ch && def.timeline) data[fl.key].since = ch;
    }
    added.push(def.label);
  });

  if(!added.length){
    // Nothing to write: the card already says it. Clear it from the queue
    // instead of leaving a button that can only ever say "nothing changed".
    var wasStatus = f.status;
    try { await respond(findingId, 'accept', true); } catch(e) {}
    toast('Already on ' + card.name + '\u2019s card \u2014 cleared from the queue',
      'ti-check', false,
      function(){ return respond(findingId, 'reopen'); });
    render();
    return;
  }

  var res = await db.from('lore_cards').update({ data: data }).eq('id', card.id).select().maybeSingle();
  if(res.error || !res.data){
    toast(res.error ? res.error.message : 'Could not save that', 'ti-x', true);
    return;
  }
  for(var i = 0; i < CARDS.length; i++) if(CARDS[i].id === card.id) CARDS[i] = res.data;
  try { await respond(findingId, 'resolve', true); } catch(e) {}
  toast('Added to ' + card.name + ': ' + added.join(', ')
    + (skipped ? ' (' + skipped + ' already answered)' : ''),
    'ti-check', false,
    function(){ return undoCardWrite(card.id, prevData, findingId, prevStatus); });
  render();
}

var PENDING_FILL = null;
var FILL_FINDING = null;   // survives openCard, which clears PENDING_FILL
async function applySuggestion(findingId){
  var f = FINDINGS.filter(function(x){ return x.id === findingId; })[0];
  var hit = f && findingSuggest(f);
  if(!hit) return;
  var card = hit.card;

  if(!card){
    var made = await findOrMakeCard(hit.sg.name, hit.sg.kind);
    if(!made.card){ toast(made.error, 'ti-x', true); return; }
    card = made.card;
    toast(made.made ? 'Card made \u2014 check the answers and save'
                    : 'Adding to the ' + card.name + ' card you already have');
  }

  PENDING_FILL = { fields: hit.sg.fields, finding_id: findingId };
  FILL_FINDING = findingId;
  PENDING_FINDING = findingId;
  openCard(card.id);
}
// Applied right after the sheet is built, so it lands in the real controls.
function applyPendingFill(){
  if(!PENDING_FILL) return;
  var filled = 0;
  PENDING_FILL.fields.forEach(function(fl){
    var def = FIELDS_BY_KEY[fl.key];
    var wrap = document.getElementById('wrap-' + fl.key);
    var appended = false;
    if(!def || !wrap) return;
    if(def.input_type === 'list'){
      var box = document.getElementById('fld-' + fl.key);
      var chips = document.getElementById('chips-' + fl.key);
      if(!box || !chips) return;
      var dupe = Array.prototype.some.call(chips.children, function(el){
        return (el.getAttribute('data-v') || '').toLowerCase() === String(fl.value).toLowerCase();
      });
      if(!dupe){
        var from = document.getElementById('cfrom-' + fl.key);
        if(from && fl.chapter) from.value = chLabel(fl.chapter);
        box.value = fl.value;
        addChip(fl.key);
      }
    } else if(def.input_type === 'pairs'){
      var pw = document.getElementById('pairs-' + fl.key);
      if(!pw) return;
      addPair(fl.key);
      var row = pw.lastElementChild;
      var a = row && row.querySelector('.pair-a');
      if(a) a.value = fl.value;
      var fr = row && row.querySelector('.pair-from');
      if(fr && fl.chapter) fr.value = chLabel(fl.chapter);
    } else {
      var el = document.getElementById('fld-' + fl.key);
      if(!el) return;
      var had = String(el.value).trim();
      if(had){
        /* One question can hold several facts — "Japan was destroyed in WW3"
           and "China is in ruins" both belong in the same box. For prose
           answers we add the new fact on its own line and leave the author's
           own words untouched. Short answers and dropdowns hold ONE value
           (an eye colour, a rank), so appending there would corrupt them —
           those are still skipped. */
        if(def.input_type !== 'long') return;              // never overwrite an answer
        var seen = had.toLowerCase();
        var adding = String(fl.value).trim();
        if(!adding || seen.indexOf(adding.toLowerCase()) >= 0) return;  // already said
        el.value = had + '\n' + adding;
        appended = true;
        if(el.tagName === 'TEXTAREA'){ el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
      } else {
        el.value = fl.value;
        if(fl.chapter && def.timeline){
          openTl(fl.key);
          var since = document.getElementById('since-' + fl.key);
          if(since) since.value = chLabel(fl.chapter);
        }
      }
    }
    wrap.classList.add('suggested');
    filled++;
    if(!wrap.querySelector('.sg-tag')){
      var tag = document.createElement('div');
      tag.className = 'sg-tag';
      tag.innerHTML = '<i class="ti ti-wand"></i> '
        + (appended ? 'Added underneath your answer, from Chapter '
                    : 'Filled in from Chapter ')
        + (fl.chapter || '') + ' \u2014 check it before saving';
      // .f is a subgrid of exactly four rows (label, answer, hint, foot), so a
      // fifth child gets no row of its own and is drawn ON TOP of the "I do not
      // know yet" line. It belongs inside the foot.
      var foot = wrap.querySelector('.f-foot');
      (foot || wrap).appendChild(tag);
    }
  });
  if(filled){
    // The scroller is #sheet-back, not #sheet, and this has to run AFTER
    // syncReveals() — revealing and hiding questions moves everything below
    // them, so a position worked out before that is stale by the time it is
    // used. A card runs to ~2,500px, so landing on the right question matters.
    syncReveals();
    setTimeout(function(){
      var hits = document.querySelectorAll('#sheet .f.suggested');
      var first = hits[0];
      if(!first) return;
      var box = document.getElementById('sheet-back');
      // offsetTop walk rather than getBoundingClientRect: the rects read as 0
      // while the sheet is still being shown, which sent this to the top.
      var y = 0, n = first;
      while(n && n !== box && n.offsetParent){ y += n.offsetTop; n = n.offsetParent; }
      if(box && box.scrollHeight > box.clientHeight && y > 0){
        box.scrollTo({ top: Math.max(0, y - box.clientHeight / 2 + first.offsetHeight / 2),
                       behavior: 'smooth' });
      } else {
        first.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
      // Five seconds of something brighter than the resting tint, so what
      // changed is obvious the moment the scroll lands.
      Array.prototype.forEach.call(hits, function(el){ el.classList.add('just-changed'); });
      setTimeout(function(){
        Array.prototype.forEach.call(hits, function(el){ el.classList.remove('just-changed'); });
      }, 5000);
    }, 80);
  } else {
    toast('Those questions already have answers \u2014 nothing was changed');
  }
  syncReveals();
  PENDING_FILL = null;
}

/* Any finding can be sent to a card by hand: pick the card, or make one, and
   the finding is pinned at the top of the editor while you fill it in. */
function findingToCard(findingId, force){
  // force: show the chooser even when the read already suggested a card. A
  // finding inherits the card that triggered it, so a line about ANOTHER
  // character arrives pointing at the wrong card.
  var f = FINDINGS.filter(function(x){ return x.id === findingId; })[0];
  if(!f) return;
  var hit = findingSuggest(f);
  if(hit && !force) return applySuggestion(findingId);
  var guess = findingCard(f);

  var kinds = [['character','Character'],['society','Society'],['organisation','Organisation'],
               ['artifact','Artifact'],['location','Location'],['event','Event']];
  document.getElementById('sheet').innerHTML =
    '<h2 id="sheet-title">Put this on a card</h2>'
    + '<div class="sub">' + esc(f.message) + '</div>'
    + (guess
        ? '<div class="board-help">This looks like it belongs to <b>' + esc(guess.name) + '</b>.</div>'
        : '')
    + (CARDS.length
        ? '<div class="grp"><div class="grp-h">An existing card</div>'
          + CARDS.slice().sort(function(a, b){ return String(a.name).localeCompare(String(b.name)); })
              .map(function(c){
                return '<div class="tie-row" onclick="openFindingOnCard(\'' + esc(findingId) + '\', \'' + esc(c.id) + '\')">'
                  + '<span class="tie-what">' + esc(c.name) + '</span>'
                  + '<span class="tie-sub"> \u00b7 ' + esc(deckTitle(c.kind)) + '</span>'
                  + '<i class="ti ti-chevron-right" style="margin-left:auto;color:var(--text3);"></i></div>';
              }).join('')
          + '</div>'
        : '')
    + '<div class="grp"><div class="grp-h">Or make a new card</div>'
    + '<div class="fields"><div class="f"><label class="q">Name</label>'
    + '<div class="ans"><input id="fc-name" maxlength="120" placeholder="Luna"/></div>'
    + '<div class="help"></div><div class="f-foot"></div></div>'
    + '<div class="f"><label class="q">What kind of card</label>'
    + '<div class="ans">' + pickInputHtml('id="fc-kind" placeholder="Pick one"', 'Character',
        kinds.map(function(k){ return k[1]; })) + '</div>'
    + '<div class="help"></div><div class="f-foot"></div></div></div>'
    + '<div class="finding-acts"><button class="btn primary" onclick="makeCardForFinding(\'' + esc(findingId) + '\')">'
    + '<i class="ti ti-plus"></i> Make the card and open it</button></div></div>'
    + '<div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()">Close</button></div>';
  document.getElementById('sheet-back').classList.add('open');
  document.body.style.overflow = 'hidden';
}
// The finding rides along so it sits at the top of the editor while you work.
var PENDING_FINDING = null;
async function openFindingOnCard(findingId, cardId){
  PENDING_FINDING = findingId;
  var f = FINDINGS.filter(function(x){ return x.id === findingId; })[0];
  var hit = f && findingSuggest(f);
  // Already worked out (by the read, or by an earlier click): fill straight in.
  if(hit && hit.card && hit.card.id === cardId){
    PENDING_FILL = { fields: hit.sg.fields, finding_id: findingId };
    FILL_FINDING = findingId;
    openCard(cardId);
    return;
  }
  // Otherwise ask the reader which questions this finding answers. Free, and
  // it never writes: the boxes are filled in for the author to check.
  toast('Working out what to fill in\u2026', 'ti-wand');
  try {
    var sess = await db.auth.getSession();
    var token = sess.data.session ? sess.data.session.access_token : null;
    if(token){
      var resp = await fetch(SUPABASE_URL + '/functions/v1/lorekeeper-suggest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ finding_id: findingId, card_id: cardId })
      });
      var out = await resp.json();
      if(out && out.ok && out.fields && out.fields.length){
        PENDING_FILL = { fields: out.fields, finding_id: findingId };
        FILL_FINDING = findingId;
        // Keep it in memory too, so reopening the card does not ask again.
        for(var i=0;i<FINDINGS.length;i++){
          if(FINDINGS[i].id === findingId){
            FINDINGS[i].detail = FINDINGS[i].detail || {};
            FINDINGS[i].detail.raw = FINDINGS[i].detail.raw || {};
            FINDINGS[i].detail.raw.suggest = { card_id: cardId, fields: out.fields };
          }
        }
      } else if(out && out.ok){
        toast('Nothing it could fill in by itself \u2014 the finding is pinned at the top', 'ti-info-circle');
      } else if(out && out.error){
        toast(out.error, 'ti-info-circle');
      }
    }
  } catch(e) {
    console.warn('suggest fill:', e);
  }
  openCard(cardId);
}
async function makeCardForFinding(findingId){
  var name = (document.getElementById('fc-name') || {}).value;
  name = String(name || '').trim();
  if(!name){ toast('Give the card a name first', 'ti-alert-triangle', true); return; }
  var kindWord = String((document.getElementById('fc-kind') || {}).value || 'Character').toLowerCase();
  var kind = ({ character:'character', society:'society', organisation:'organisation',
                artifact:'artifact', location:'location', event:'event' })[kindWord] || 'character';
  var made = await findOrMakeCard(name, kind);
  if(!made.card){ toast(made.error, 'ti-x', true); return; }
  if(!made.made) toast('That card already exists \u2014 opening it');
  PENDING_FINDING = findingId;
  openCard(made.card.id);
}
function pendingFindingBanner(){
  var f = PENDING_FINDING && FINDINGS.filter(function(x){ return x.id === PENDING_FINDING; })[0];
  if(!f) return '';
  return '<div class="note-pin"><div class="note-pin-h"><i class="ti ti-eye"></i> What the reader noticed</div>'
    + '<div class="note-body">' + esc(f.message) + '</div>'
    + '<div class="note-pin-tip">Fill in the questions below that this answers, then press '
    + '<b>Save card</b>. The finding is marked as handled for you.</div></div>';
}

function findingHtml(f){
  var card = f.card_id ? cardById(f.card_id) : null;
  var answered = f.status !== 'open';
  var statusWord = {
    ignored_once: 'ignored here',
    accepted: 'part of the story now',
    dismissed: 'check switched off',
    resolved: 'fixed',
    fixing: 'you are fixing ' + (chapterNumOf(f) ? 'chapter ' + chapterNumOf(f) : 'the chapter')
  }[f.status];
  var clash = !answered && contradictionInfo(f);

  return '<div class="finding' + (f.source === 'ai' ? ' ai' : '') + (answered ? ' answered' : '') + '" id="fnd-' + f.id + '">'
    + '<div class="finding-msg">' + esc(f.message) + '</div>'
    + '<div class="finding-meta">'
      + '<span><i class="ti ' + (f.source === 'ai' ? 'ti-eye' : 'ti-shield-check') + '"></i> '
        + (f.source === 'ai' ? 'Lorekeeper' : 'Card check') + '</span>'
      + (card ? '<span><i class="ti ti-cards"></i> ' + esc(card.name) + '</span>' : '')
      + (answered ? '<span><i class="ti ti-check"></i> ' + statusWord + '</span>' : '')
    + '</div>'
    + (answered
        ? '<div class="finding-acts"><button class="btn ghost" onclick="respond(\'' + f.id + '\',\'reopen\')">'
          + 'Put it back</button></div>'
        : '<div class="finding-acts">'
          + (findingSuggest(f)
              ? ''   // the suggestion box below carries its own buttons
              : (function(){
                  var c = findingCard(f);
                  return c
                    ? '<button class="btn ghost" onclick="openFindingOnCard(\'' + f.id + '\', \'' + c.id + '\')">'
                      + '<i class="ti ti-cards"></i> Edit ' + esc(c.name) + '\u2019s card</button>'
                      + '<button class="btn ghost" onclick="findingToCard(\'' + f.id + '\')">Another card\u2026</button>'
                    : '<button class="btn ghost" onclick="findingToCard(\'' + f.id + '\')">'
                      + '<i class="ti ti-cards"></i> Put this on a card</button>';
                })())
          + ((!clash && f.card_id && ((f.detail && f.detail.field && f.detail.text_value) || !findingSuggest(f)))
              ? '<button class="btn ghost" onclick="acceptChapterValue(\'' + f.id + '\')">'
                + '<i class="ti ti-arrow-back-up"></i> This is true \u2014 update the card</button>'
              : '')
          + (clash ? '' : '<button class="btn ghost" onclick="respond(\'' + f.id + '\',\'resolve\')">'
          + '<i class="ti ti-check"></i> I changed the chapter</button>')
          + '<button class="btn ghost" onclick="respond(\'' + f.id + '\',\'ignore_once\')">Skip for now</button>'
          + '<button class="btn ghost" title="Nothing is written to a card \u2014 this only stops the reader raising it again" '
          + 'onclick="respond(\'' + f.id + '\',\'accept\')">Leave it \u2014 stop asking</button>'
          + '<button class="btn danger" onclick="dismissAsk(\'' + f.id + '\')">The check is wrong</button>'
          + '</div>')
    + (answered
        ? (f.status === 'fixing' ? quoteHtml(f) : '')
        : (suggestHtml(f) || (clash ? disagreeHtml(f, clash) : quoteHtml(f))))
    + '<div id="cnf-' + f.id + '"></div>'
    + '</div>';
}

/* A contradiction finding already knows both sides: the field, what the card
   says, what the chapter says. This takes the chapter's word for it, writes it
   straight onto the card and marks the finding fixed \u2014 with Undo on the
   toast, because nothing is shown before it is written. */
async function acceptChapterValue(findingId){
  var f = FINDINGS.filter(function(x){ return x.id === findingId; })[0];
  if(!f || !f.detail) return;
  var key = f.detail.field, val = f.detail.text_value;
  var card = f.card_id ? cardById(f.card_id) : null;
  if(!card){ toast('Nothing to update here', 'ti-x', true); return; }

  // The card checks hand over the field and the chapter's value, so the card
  // can be written straight away. Lorekeeper describes a contradiction in
  // prose and names no field, so the reader is asked which questions it
  // answers first, and the card opens with the boxes filled in to check.
  if(!key || !val) return openFindingOnCard(findingId, card.id);

  var prevData = JSON.parse(JSON.stringify(card.data || {}));
  var prevStatus = f.status;
  var data = JSON.parse(JSON.stringify(card.data || {}));
  var cur = data[key] || {};
  data[key] = Object.assign({}, cur, { v: val });

  var res = await db.from('lore_cards').update({ data: data }).eq('id', card.id).select().maybeSingle();
  if(res.error || !res.data){ toast(res.error ? res.error.message : 'Could not save that', 'ti-x', true); return; }
  for(var i = 0; i < CARDS.length; i++) if(CARDS[i].id === card.id) CARDS[i] = res.data;
  try { await respond(findingId, 'resolve', true); } catch(e) {}

  var label = (FIELDS_BY_KEY[key] && FIELDS_BY_KEY[key].label) || key;
  toast(card.name + ' \u2014 ' + label + ' is now ' + val, 'ti-check', false,
    function(){ return undoCardWrite(card.id, prevData, findingId, prevStatus); });
  render();
}

/* "The check is wrong" is the only answer that cannot be undone by writing,
   so it asks twice — and the second button is centred in a box below, well
   away from where the first click landed, and dead for a beat. */
function dismissAsk(id){
  var f = FINDINGS.filter(function(x){ return x.id === id; })[0];
  if(!f) return;
  document.getElementById('cnf-' + id).innerHTML =
    '<div class="confirm">'
    + '<div class="confirm-title">Never raise this again?</div>'
    + '<div class="confirm-body">' + esc(f.message) + '<br><br>'
    + 'This switches the check off for good. If it is only deliberate in this one place, '
    + '<b>Ignore once</b> keeps it watching everywhere else.</div>'
    + '<button class="btn danger" id="cnf-go-' + id + '" disabled onclick="respond(\'' + id + '\',\'dismiss\')">'
    + 'Yes, the check is wrong</button>'
    + '<button class="keep" onclick="document.getElementById(\'cnf-' + id + '\').innerHTML=\'\'">Keep the check</button>'
    + '</div>';
  armConfirm('cnf-go-' + id, 'Yes, the check is wrong');
}

/* ── EXPORT ─────────────────────────────────────────────────────────
   A Lorekeeper perk. The membership check here decides what the page SHOWS;
   the real gate is in the edge function, because a hidden button is not a
   gate. */
/* ── BETA READER ───────────────────────────────────────────────────────
   The paid half. Everything about cost is shown BEFORE the button is
   pressed: how much is left, what this chapter would use, and whether it
   is free. Nobody should ever learn the price after paying it. */
function renderReader(){
  var body = document.getElementById('view-body');
  var ch = (CREDIT && CREDIT.chapters_remaining) || 0;
  var wd = (CREDIT && CREDIT.words_remaining) || 0;
  var hasCredit = ch > 0 && wd > 0;

  var intro =
    '<div class="board-help">A beta reader that has read the whole thing. It tells you what it '
    + 'noticed \u2014 loose threads, characters drifting, the same beat written three times. '
    + 'It never writes for you, and it never touches your draft.</div>';

  // The balance panel. Both numbers matter: a block runs out on whichever
  // hits zero first, so showing only one would mislead.
  var balance =
    '<div class="finding" style="border-left-color:var(--gold);">'
    + '<div class="finding-msg">'
    +   (hasCredit
          ? '<b>' + ch + ' chapter read' + (ch === 1 ? '' : 's') + '</b> and <b>'
            + wd.toLocaleString() + ' words</b> left.'
          : '<b>Nothing left to read with.</b> A block is $5 or 700 Quills: '
            + '50 chapter reads or 150,000 words, whichever you use up first. It never expires.')
    + '</div>'
    + '<div style="font-size:12px;color:var(--text3);margin-top:7px;line-height:1.55;">'
    +   'Every read of a chapter costs one read, including after you edit it. '
    +   'Reading the exact same text again is free, because nothing changed and the findings on file still stand.'
    + '</div>'
    + '<div class="finding-meta"><span><i class="ti ti-infinity"></i> Blocks never expire</span>'
    +   (CREDIT && CREDIT.lifetime_blocks
          ? '<span><i class="ti ti-receipt"></i> ' + CREDIT.lifetime_blocks + ' bought so far</span>' : '')
    + '</div>'
    + '<div class="finding-acts">'
    +   '<button class="btn primary" onclick="buyBlockCard(this)"><i class="ti ti-credit-card"></i> 50 chapter reads \u2014 $5</button>'
    +   '<button class="btn" onclick="buyBlockQuills(this)"><i class="ti ti-feather"></i> 700 Quills</button>'
    + '</div></div>';

  if(!CHAPTERS.length){
    body.innerHTML = intro + balance
      + '<div class="state-wrap"><i class="ti ti-book-off state-icon"></i>'
      + '<div class="state-title">No chapters yet</div>'
      + '<div class="state-body">The beta reader reads chapters. Write one and it will show up here.</div></div>';
    return;
  }

  // Chapters, newest first: a serial author is almost always asking about
  // what they just wrote.
  var rows = CHAPTERS.slice().reverse().map(function(c){
    var q = QUOTES[c.id];
    var label = 'Chapter ' + c.chapter_number + (c.title ? ' \u2014 ' + esc(c.title) : '');
    var cost = q
      ? (q.ok === false
          ? esc(q.error || 'Cannot read this one')
          : (q.free ? 'Free \u2014 ' + (q.reason === 'already_read'
                        ? 'unchanged since the last read, findings are still on file'
                        : 'nothing changed')
                    : q.words.toLocaleString() + ' words of your block'))
      : (c.word_count ? Number(c.word_count).toLocaleString() + ' words' : '');

    var disabled = q && (q.ok === false || q.affordable === false);

    // The outcome of this session's read, shown on the row itself. The toast
    // is gone in seconds and the findings appear on another tab, which left
    // a finished read looking like nothing had happened.
    var done = READ_RESULT[c.id];
    var doneLine = '';
    if(done){
      if(done.state === 'found'){
        doneLine = '<div class="read-done found"><i class="ti ti-alert-triangle"></i> '
          + 'Finished reading \u2014 <b>' + done.findings + ' thing'
          + (done.findings === 1 ? '' : 's') + '</b> to look at '
          + '<button class="btn ghost" onclick="setView(\'checks\')">See them</button></div>';
      } else if(done.state === 'clean'){
        doneLine = '<div class="read-done"><i class="ti ti-check"></i> '
          + 'Finished reading \u2014 nothing worth raising.</div>';
      } else if(done.state === 'unchanged'){
        doneLine = '<div class="read-done"><i class="ti ti-check"></i> '
          + 'Nothing changed since the last read \u2014 nothing charged.</div>';
      } else {
        doneLine = '<div class="read-done bad"><i class="ti ti-x"></i> '
          + esc(done.note || 'That read did not finish.') + '</div>';
      }
    }

    return '<div class="finding" style="border-left-color:'
      + (q && q.free ? 'var(--green)' : 'var(--border)') + ';">'
      + '<div class="finding-msg">' + label + '</div>'
      + '<div class="finding-meta"><span>' + cost + '</span>'
      +   (c.status !== 'published' ? '<span><i class="ti ti-pencil"></i> ' + esc(c.status) + '</span>' : '')
      + '</div>'
      + '<div class="finding-acts">'
      +   '<button class="btn' + (disabled ? '' : ' primary') + '" ' + (disabled ? 'disabled style="opacity:.45;"' : '')
      +     ' onclick="askForRead(\'' + c.id + '\', this)"><i class="ti ti-eye"></i> '
      +     (done ? 'Read it again' : 'Ask for a read') + '</button>'
      + '</div>' + doneLine + '</div>';
  }).join('');

  body.innerHTML = intro + balance
    + '<div class="grp"><div class="grp-h">Your chapters'
    + '<span class="gcount">' + CHAPTERS.length + '</span></div>'
    + '<div style="font-size:12.5px;color:var(--text2);margin-bottom:12px;line-height:1.6;">'
    + 'Each read costs one read from your block. After you edit a chapter, reading it again is a new read. '
    + 'If nothing in it changed, it is free: the reader is not asked, because the findings on file are still right.'
    + '</div>' + rows + '</div>';
}

/* Quotes are fetched per chapter rather than up front: one RPC per chapter on
   a 300-chapter novel would be 300 round trips for numbers the author has not
   asked about yet. */
// What the last read of each chapter came back with, so the answer stays on
// the page after the toast has gone. A read takes 15-30 seconds and its
// findings land in the Checks tab, so without this the reader tab looks
// exactly as it did before you pressed the button.
var READ_RESULT = {};

async function askForRead(chapterId, btn){
  var original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader" style="animation:spin 1s linear infinite;"></i> Reading\u2026';
  try {
    // Quote first, so the refusal cases (too long, out of credit) are shown
    // without a pointless server round trip through the reader.
    var q = await db.rpc('lorekeeper_quote_read', { p_chapter_id: chapterId });
    if(q.data) QUOTES[chapterId] = q.data;
    if(q.data && q.data.ok === false){
      toast(q.data.error || 'Cannot read that chapter', 'ti-x', true);
      render();
      return;
    }
    if(q.data && q.data.affordable === false){
      toast('Not enough left in your block for this chapter.', 'ti-wallet', true);
      render();
      return;
    }

    var sess = await db.auth.getSession();
    var token = sess.data.session ? sess.data.session.access_token : null;
    if(!token){ toast('Please sign in again', 'ti-lock', true); btn.disabled=false; btn.innerHTML=original; return; }

    var resp = await fetch(SUPABASE_URL + '/functions/v1/lorekeeper-read', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ chapter_id: chapterId })
    });
    var result = await resp.json();

    if(!resp.ok || !result.ok){
      toast(result.error || 'The beta reader could not run', 'ti-x', true);
      btn.disabled = false; btn.innerHTML = original;
      return;
    }

    // Per-chapter outcome, not just the overall call: a run can succeed as a
    // request and still have refused this chapter.
    var r = (result.results || [])[0] || {};
    var seeChecks = function(){ setView('checks'); };
    if(r.ok === false){
      READ_RESULT[chapterId] = { state: 'failed', note: r.error || 'could not be read' };
      toast(r.error || 'That chapter could not be read', 'ti-alert-triangle', true);
    } else if(r.unchanged){
      READ_RESULT[chapterId] = { state: 'unchanged' };
      toast('Nothing changed since the last read \u2014 findings are unchanged, nothing charged.', 'ti-check');
    } else if((r.findings || 0) === 0){
      READ_RESULT[chapterId] = { state: 'clean' };
      toast('Finished reading \u2014 nothing worth raising.', 'ti-check');
    } else {
      READ_RESULT[chapterId] = { state: 'found', findings: r.findings };
      toast('Finished reading \u2014 ' + r.findings + ' thing' + (r.findings === 1 ? '' : 's')
        + ' to look at.', 'ti-alert-triangle', false, seeChecks, 'See them');
    }

    if(result.balance) {
      CREDIT = Object.assign({}, CREDIT || {}, result.balance);
    }
    // Re-read the queue so the Checks tab and the card faces both update.
    var fRes = await Promise.resolve(db.from('lore_findings').select('*')
      .eq('work_id', workId).order('created_at', { ascending:false })).catch(function(){ return {}; });
    FINDINGS = fRes.data || FINDINGS;
    QUOTES[chapterId] = null;
    render();
  } catch(e){
    console.error('askForRead:', e);
    toast('Something went wrong', 'ti-alert-triangle', true);
    btn.disabled = false; btn.innerHTML = original;
  }
}

/* ── NOTES INBOX ─────────────────────────────────────────────────────
   Jotted from the chapter editor while writing. A note never edits a card
   by itself: the author opens the card, changes the answer, saves — and
   saving from a note marks that note done automatically. */
var PENDING_NOTE = null;     // note being worked on in the card sheet
var NOTE_JUST_DONE = null;   // {id, prev} for the inline Undo bar

function renderNotes(){
  var body = document.getElementById('view-body');
  var open = NOTES.filter(function(n){ return n.status === 'open'; });
  var done = NOTES.filter(function(n){ return n.status !== 'open'; });
  var list = NOTES_SHOW_DONE ? done : open;
  var cardOpts = CARDS.slice().sort(function(a, b){ return String(a.name).localeCompare(String(b.name)); })
    .map(function(c){ return '<option value="' + esc(c.id) + '">' + esc(c.name) + ' \u2014 ' + esc(deckTitle(c.kind)) + '</option>'; }).join('');
  var justDone = NOTE_JUST_DONE && NOTES.filter(function(n){ return n.id === NOTE_JUST_DONE.id; })[0];

  body.innerHTML =
    '<div class="notes-how">'
    +   '<div class="notes-how-h"><i class="ti ti-info-circle"></i> Notes are reminders \u2014 they do not change your cards on their own</div>'
    +   '<ol>'
    +     '<li><b>Pick the card</b> the note is about from the dropdown.</li>'
    +     '<li><b>Open card</b> and change the answer yourself. The note stays pinned at the top while you edit.</li>'
    +     '<li>If it changed partway through the story (new hair, lost a sword), use <b>Does it change?</b> under that question and enter the chapter.</li>'
    +     '<li><b>Save card.</b> The note is marked done for you. Nothing to change? Press <b>Done</b> or <b>Dismiss</b> here instead.</li>'
    +   '</ol>'
    + '</div>'
    + (justDone
        ? '<div class="note-undo"><i class="ti ti-circle-check" style="color:var(--green);"></i> '
          + (justDone.status === 'dismissed' ? 'Note dismissed' : 'Note moved to Done')
          + ' \u2014 \u201c' + esc(String(justDone.body).slice(0, 60)) + (String(justDone.body).length > 60 ? '\u2026' : '') + '\u201d'
          + '<button class="btn ghost" onclick="noteUndo()"><i class="ti ti-arrow-back-up"></i> Undo</button></div>'
        : '')
    + '<div class="note-acts" style="margin:0 0 14px;">'
    +   '<button class="btn' + (NOTES_SHOW_DONE ? ' ghost' : ' on') + '" onclick="NOTES_SHOW_DONE=false;NOTE_JUST_DONE=null;renderView()">Waiting (' + open.length + ')</button>'
    +   '<button class="btn' + (NOTES_SHOW_DONE ? ' on' : ' ghost') + '" onclick="NOTES_SHOW_DONE=true;NOTE_JUST_DONE=null;renderView()">Done (' + done.length + ')</button>'
    + '</div>'
    + (list.length ? list.map(function(n){
        var meta = (n.chapter_number ? 'Chapter ' + n.chapter_number : 'Written before the chapter was first saved') + ' \u00b7 '
          + new Date(n.created_at).toLocaleDateString()
          + (n.status === 'applied' ? ' \u00b7 done' : n.status === 'dismissed' ? ' \u00b7 dismissed' : '');
        return '<div class="note-card' + (n.status === 'open' ? '' : ' done') + '" id="note-' + esc(n.id) + '">'
          + '<div class="note-meta">' + esc(meta) + '</div>'
          + '<div class="note-body">' + esc(n.body) + '</div>'
          + '<div class="note-acts">'
          + (n.status === 'open'
              ? (CARDS.length
                  ? '<select id="nc-' + esc(n.id) + '" aria-label="Pick the card to update" onchange="noteCardPicked(\'' + esc(n.id) + '\')">'
                    + '<option value="">1. Pick the card to update\u2026</option>' + cardOpts + '</select>'
                    + '<button class="btn" id="nob-' + esc(n.id) + '" disabled onclick="noteOpenCard(\'' + esc(n.id) + '\')"><i class="ti ti-cards"></i> 2. Open card</button>'
                  : '<button class="btn ghost" onclick="setView(\'decks\')"><i class="ti ti-plus"></i> Make a card first</button>')
                + '<span class="note-sep">or</span>'
                + '<button class="btn ghost" title="Already handled, or nothing to change" onclick="noteSet(\'' + esc(n.id) + '\', \'applied\')"><i class="ti ti-check"></i> Done</button>'
                + '<button class="btn ghost" title="Not needed after all" onclick="noteSet(\'' + esc(n.id) + '\', \'dismissed\')">Dismiss</button>'
              : '<button class="btn ghost" onclick="noteSet(\'' + esc(n.id) + '\', \'open\')"><i class="ti ti-arrow-back-up"></i> Move back to waiting</button>')
          + '</div></div>';
      }).join('')
      : '<div class="board-help" style="text-align:center;padding:30px 0;">'
        + (NOTES_SHOW_DONE ? 'Nothing done yet.' : 'No notes waiting. Use the <b>Lore notes</b> button in the chapter editor to jot one while you write.')
        + '</div>');
}
function noteCardPicked(id){
  var sel = document.getElementById('nc-' + id), b = document.getElementById('nob-' + id);
  if(b) b.disabled = !(sel && sel.value);
}
function noteOpenCard(id){
  var sel = document.getElementById('nc-' + id);
  if(!sel || !sel.value){ toast('Pick the card this note is about first', 'ti-alert-triangle', true); return; }
  PENDING_NOTE = id;
  openCard(sel.value);
}
// Shown pinned at the top of the card sheet while working from a note.
function pendingNoteBanner(){
  var n = PENDING_NOTE && NOTES.filter(function(x){ return x.id === PENDING_NOTE; })[0];
  if(!n) return '';
  return '<div class="note-pin"><div class="note-pin-h"><i class="ti ti-notebook"></i> Your note'
    + (n.chapter_number ? ' \u00b7 Chapter ' + n.chapter_number : '') + '</div>'
    + '<div class="note-body">' + esc(n.body) + '</div>'
    + '<div class="note-pin-tip">Find the question below and change the answer. If it changed partway through the story, '
    + 'press <b>Does it change?</b> under it. When you press <b>Save card</b>, this note is marked done.</div></div>';
}
async function noteSet(id, status, quiet){
  var before = NOTES.filter(function(n){ return n.id === id; })[0];
  var prev = before ? before.status : 'open';
  var res = await db.from('lore_notes').update({ status: status }).eq('id', id).select().maybeSingle();
  if(res.error || !res.data){ toast(res.error ? res.error.message : 'Could not update that note', 'ti-x', true); return false; }
  for(var i=0;i<NOTES.length;i++) if(NOTES[i].id === id) NOTES[i] = res.data;
  NOTE_JUST_DONE = (status === 'open') ? null : { id: id, prev: prev };
  if(!quiet) toast(status === 'applied' ? 'Note moved to Done' : status === 'dismissed' ? 'Note dismissed' : 'Moved back to waiting');
  render();
  return true;
}
function noteUndo(){
  if(!NOTE_JUST_DONE) return;
  var j = NOTE_JUST_DONE; NOTE_JUST_DONE = null;
  noteSet(j.id, j.prev || 'open');
}

async function exportManuscript(format, btn){
  var original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader" style="animation:spin 1s linear infinite;"></i> Building\u2026';
  var url = null;
  try {
    var sess = await db.auth.getSession();
    var token = sess.data.session ? sess.data.session.access_token : null;
    if(!token){ toast('Please sign in again', 'ti-lock', true); return; }

    var resp = await fetch(SUPABASE_URL + '/functions/v1/export-manuscript', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ work_id: workId, format: format })
    });

    // A failure comes back as JSON, a success as file bytes — so the
    // content type decides how to read the body. Reading it as a blob either
    // way would hand the author a .epub containing an error message.
    var ctype = resp.headers.get('Content-Type') || '';
    if(!resp.ok || ctype.indexOf('application/json') === 0){
      var err = await resp.json().catch(function(){ return {}; });
      toast(err.error || 'Could not build the file', 'ti-x', true);
      return;
    }

    var blob = await resp.blob();
    url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = (work.title || 'manuscript').toLowerCase()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) + '.' + format;
    document.body.appendChild(a);
    a.click();
    a.remove();
    var n = resp.headers.get('X-Chapter-Count');
    toast(n ? n + ' chapter' + (n === '1' ? '' : 's') + ' exported' : 'Manuscript ready');
  } catch(e){
    console.error('exportManuscript:', e);
    toast('Something went wrong', 'ti-alert-triangle', true);
  } finally {
    // Revoked on a delay: revoking immediately can cancel the download in
    // some browsers before it has actually started.
    if(url) setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

/* The checks read every chapter of the work, so this is on a button rather
   than on every page load. The nightly sweep covers authors who never press
   it; pressing it is for the moment right after fixing something. */
async function runChecks(btn){
  var original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader" style="animation:spin 1s linear infinite;"></i> Reading your chapters\u2026';
  try {
    var res = await db.rpc('run_lore_checks', { p_work_id: workId });
    if(res.error || !res.data || res.data.ok !== true){
      toast((res.data && res.data.error) || (res.error && res.error.message) || 'Could not run the checks', 'ti-x', true);
      btn.disabled = false; btn.innerHTML = original;
      return;
    }
    var n = parseInt(res.data.new_findings, 10) || 0;
    var ch = parseInt(res.data.chapters_checked, 10) || 0;
    toast(ch === 0
      ? 'No chapters to read yet'
      : (n === 0
          ? 'Read ' + ch + ' chapter' + (ch === 1 ? '' : 's') + ' \u2014 nothing new'
          : n + ' new thing' + (n === 1 ? '' : 's') + ' to look at'),
      n ? 'ti-alert-triangle' : 'ti-check');

    // Re-read the queue rather than trusting the count: answered findings
    // stay answered, and the page should show exactly what the table holds.
    var fRes = await Promise.resolve(db.from('lore_findings').select('*')
      .eq('work_id', workId).order('created_at', { ascending:false })).catch(function(){ return {}; });
    FINDINGS = fRes.data || FINDINGS;
    render();
  } catch(e){
    console.error('runChecks:', e);
    toast('Something went wrong', 'ti-alert-triangle', true);
    btn.disabled = false; btn.innerHTML = original;
  }
}

async function respond(id, action, quiet){
  var res = await db.rpc('lore_finding_respond', { p_finding_id: id, p_action: action });
  if(res.error || !res.data || res.data.ok !== true){
    toast((res.data && res.data.error) || (res.error && res.error.message) || 'Could not do that', 'ti-x', true);
    return;
  }
  for(var i=0;i<FINDINGS.length;i++){
    if(FINDINGS[i].id === id) FINDINGS[i].status = res.data.status;
  }
  if(!quiet){
    // Undo on the answer buttons too: these do not write to a card, but a
    // misclick still takes a finding out of the queue. "The check is wrong"
    // is left out on purpose — it asks twice already.
    var back = (action !== 'dismiss' && action !== 'reopen')
      ? function(){ return respond(id, 'reopen'); }
      : null;
    toast({
      open: 'Back in the queue',
      resolved: 'Marked fixed',
      fixing: 'On your list \u2014 it clears when the chapter is read again',
      ignored_once: 'Ignored here only',
      accepted: 'Left as is \u2014 it will not be raised again',
      dismissed: 'Check switched off'
    }[res.data.status] || 'Done', 'ti-check', false, back);
  }
  render();
}
</script>
<script src="footer.js"></script>
</body>
