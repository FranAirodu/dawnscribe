<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function(){
      var t=localStorage.getItem('ds_theme');if(t==='light'){t='dim';localStorage.setItem('ds_theme',t);}if(t){document.documentElement.setAttribute('data-theme',t);}
    })();
  </script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Community Activity — DawnScribe</title>
  <meta name="description" content="Live feed of collaborations, comments and chapter updates happening across DawnScribe right now." />
  <meta property="og:site_name" content="DawnScribe" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Community Activity — DawnScribe" />
  <meta property="og:description" content="DawnScribe is a creative platform where web novel authors and artists collaborate, share, and build community together." />
  <meta property="og:url" content="https://www.dawnscribe.com/activity.html" />
  <meta property="og:image" content="https://www.dawnscribe.com/og-default.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="canonical" href="https://www.dawnscribe.com/activity.html" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#0f1117; --bg2:#161b27; --bg3:#1e2535; --bg4:#252d3d;
      --border:#2a3347; --text:#e8eaf0; --text2:#9ba3b8; --text3:#5c6480;
      --accent:#2dd4bf; --gold:#f59e0b; --red:#f87171; --pink:#f472b6;
    }
    /* DIM — a softer dark, not a darker light. Only SURFACES move;
       every foreground colour is inherited from :root, which is why
       this theme cannot develop the contrast faults light mode has. */
    html[data-theme="dim"]{--bg:#212329;--bg2:#282d39;--bg3:#303747;--bg4:#373f4f;--border:#3e475b;--text2:#a2a9bd;--text3:#a5aab9;}

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Lato', sans-serif; min-height: 100vh; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* NAV */
    nav { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .nav-left { display: flex; align-items: center; gap: 16px; }
    .logo { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 700; color: var(--text); text-decoration: none; }
    .logo span { color: var(--accent); }
    .back-btn { display: flex; align-items: center; gap: 6px; color: var(--text2); font-size: 13px; font-weight: 700; text-decoration: none; transition: color 0.2s; }
    .back-btn:hover { color: var(--accent); }

    /* PAGE */
    .page-wrap { max-width: 900px; margin: 0 auto; padding: 40px 20px 80px; }
    .page-header { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; }
    .page-icon { width: 48px; height: 48px; border-radius: 12px; background: rgba(45,212,191,0.1); border: 1px solid rgba(45,212,191,0.2); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 22px; flex-shrink: 0; }
    .page-title { font-family: 'Cinzel', serif; font-size: 26px; font-weight: 700; }
    .page-title span { color: var(--accent); }
    .page-subtitle { color: var(--text3); font-size: 13px; margin-top: 3px; }

    /* TOP TABS */
    .tabs-bar { display: flex; gap: 4px; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 32px; }
    .tab-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 8px; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; font-family: 'Lato', sans-serif; cursor: pointer; transition: all 0.2s; background: transparent; color: var(--text3); }
    .tab-btn:hover { color: var(--text2); }
    .tab-btn.active { background: var(--bg3); color: var(--accent); }
    .tab-badge { background: var(--accent); color: #0f1117; font-size: 10px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; display: inline-flex; align-items: center; justify-content: center; }

    /* PANELS */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* SECTION HEADER */
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .section-title { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .section-count { font-size: 12px; font-weight: 700; background: rgba(45,212,191,0.12); color: var(--accent); padding: 3px 10px; border-radius: 20px; }

    /* COLLAB GRID */
    .collab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .collab-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; gap: 14px; transition: border-color 0.2s; }
    .collab-card:hover { border-color: rgba(45,212,191,0.3); }
    .collab-cover { width: 56px; height: 76px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-size: 22px; font-weight: 700; flex-shrink: 0; }
    .collab-body { flex: 1; min-width: 0; }
    .collab-type-label { display: inline-flex; align-items: center; gap: 3px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
    .collab-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .collab-names { font-size: 12px; color: var(--accent); margin-bottom: 4px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .collab-names a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
    .collab-names a:hover { color: var(--text); text-decoration: underline; }
    .collab-time { font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 4px; margin-bottom: 10px; }
    .collab-btns { display: flex; gap: 6px; }
    .collab-btn { flex: 1; padding: 5px 8px; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; color: var(--text2); font-size: 11px; font-weight: 700; font-family: 'Lato', sans-serif; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 4px; text-decoration: none; }
    .collab-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* COMMENT LIST */
    .comment-list { display: flex; flex-direction: column; gap: 12px; }
    .comment-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; gap: 14px; cursor: pointer; transition: border-color 0.2s; }
    .comment-card:hover { border-color: rgba(45,212,191,0.3); }
    .comment-thumb { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-weight: 700; flex-shrink: 0; font-size: 18px; overflow: hidden; }
    .comment-body { flex: 1; min-width: 0; }
    .comment-on { font-size: 12px; color: var(--text2); margin-bottom: 5px; display: flex; align-items: center; gap: 7px; }
    .comment-type { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; flex-shrink: 0; }
    .comment-type.novel { background: rgba(45,212,191,0.15); color: var(--accent); }
    .comment-type.art { background: rgba(244,114,182,0.15); color: var(--pink); }
    .comment-text { font-size: 13px; color: var(--text2); line-height: 1.55; margin-bottom: 8px; }
    .comment-meta { display: flex; justify-content: space-between; align-items: center; }
    .comment-user { font-size: 12px; color: var(--accent); font-weight: 700; text-decoration: none; }
    .comment-user:hover { text-decoration: underline; }
    .comment-time { font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 4px; }

    /* UPDATES — filter sub-tabs */
    .filter-tabs { display: flex; gap: 4px; background: var(--bg3); border-radius: 10px; padding: 4px; margin-bottom: 20px; width: fit-content; }
    .filter-tab { padding: 7px 18px; border: none; border-radius: 7px; font-size: 13px; font-weight: 700; font-family: 'Lato', sans-serif; cursor: pointer; background: transparent; color: var(--text3); display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .filter-tab:hover { color: var(--text2); }
    .filter-tab.active { background: var(--bg2); color: var(--accent); }

    .update-list { display: flex; flex-direction: column; gap: 12px; }
    .update-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; transition: border-color 0.2s; }
    .update-card:hover { border-color: rgba(45,212,191,0.3); }
    .update-cover { width: 46px; height: 62px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; flex-shrink: 0; }
    .update-cover.art-thumb { width: 62px; height: 62px; }
    .update-body { flex: 1; min-width: 0; }
    .update-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .update-chapter { font-size: 12px; color: var(--accent); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .update-author { font-size: 12px; color: var(--text3); }
    .update-author a { color: var(--text2); text-decoration: none; font-weight: 700; }
    .update-author a:hover { color: var(--accent); text-decoration: underline; }
    .update-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
    .update-time { font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    .type-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
    .type-badge.novel { background: rgba(45,212,191,0.15); color: var(--accent); }
    .type-badge.art { background: rgba(244,114,182,0.15); color: var(--pink); }
    .read-btn { padding: 7px 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: 7px; color: var(--text2); font-size: 12px; font-weight: 700; font-family: 'Lato', sans-serif; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 5px; white-space: nowrap; text-decoration: none; }
    .read-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* LOAD MORE */
    .load-more-btn { width: 100%; margin-top: 16px; padding: 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; color: var(--text2); font-size: 13px; font-weight: 700; font-family: 'Lato', sans-serif; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .load-more-btn:hover { border-color: var(--accent); color: var(--accent); }
    .load-more-btn.hidden { display: none; }

    /* EMPTY */
    .empty-state { padding: 48px 24px; text-align: center; color: var(--text3); }
    .empty-state i { font-size: 36px; display: block; margin-bottom: 12px; opacity: 0.4; }
    .empty-state p { font-size: 14px; }

    /* COVER COLORS */
    .cover-purple { background: linear-gradient(160deg,#1e0040,#6b21a8); color:#c084fc; }
    .cover-blue   { background: linear-gradient(160deg,#001030,#1d4ed8); color:#60a5fa; }
    .cover-red    { background: linear-gradient(160deg,#200010,#9f1239); color:#fb7185; }
    .cover-green  { background: linear-gradient(160deg,#001a10,#065f46); color:#34d399; }
    .cover-gold   { background: linear-gradient(160deg,#1a0e00,#92400e); color:#fbbf24; }
    .cover-pink   { background: linear-gradient(160deg,#1a0020,#86198f); color:#f0abfc; }

    /* FOOTER */
    footer { background: var(--bg2); border-top: 1px solid var(--border); padding: 32px; text-align: center; color: var(--text3); font-size: 13px; }
    footer .footer-logo { font-family: 'Cinzel', serif; font-size: 20px; color: var(--accent); margin-bottom: 10px; }
    footer .footer-links { display: flex; justify-content: center; gap: 24px; margin: 12px 0; flex-wrap: wrap; }
    footer .footer-links a { color: var(--text3); text-decoration: none; transition: color 0.2s; }
    footer .footer-links a:hover { color: var(--accent); }
  </style>
  <script src="accessibilityPrefs.js"></script>
  <script src="contentWarnings.js"></script>
  <script src="tagPrefs.js"></script>
</head>
<body>

<nav>
  <div class="nav-left">
    <a class="logo" href="index.html">Dawn<span>Scribe</span></a>
    <a class="back-btn" href="index.html"><i class="ti ti-arrow-left"></i> Back to home</a>
  </div>
</nav>

<div class="page-wrap">

  <div class="page-header">
    <div class="page-icon"><i class="ti ti-activity"></i></div>
    <div>
      <div class="page-title">Community <span>Activity</span></div>
      <div class="page-subtitle">All collabs, comments, and chapter updates happening on DawnScribe right now.</div>
    </div>
  </div>

  <!-- TOP TABS -->
  <div class="tabs-bar">
    <button class="tab-btn active" id="tab-btn-collabs" onclick="switchTab('collabs')">
      <i class="ti ti-users"></i> Collabs
    </button>
    <button class="tab-btn" id="tab-btn-comments" onclick="switchTab('comments')">
      <i class="ti ti-message-circle"></i> Comments
    </button>
    <button class="tab-btn" id="tab-btn-updates" onclick="switchTab('updates')">
      <i class="ti ti-bell"></i> Updates
    </button>
  </div>

  <!-- COLLABS PANEL -->
  <div class="tab-panel active" id="panel-collabs">
    <div class="section-head">
      <div class="section-title"><i class="ti ti-users" style="color:var(--accent);"></i> Collabs</div>
      <span class="section-count" id="section-collab-count">Loading…</span>
    </div>
    <div class="collab-grid" id="collab-grid">
      <div style="grid-column:1/-1;text-align:center;padding:32px;color:var(--text3);font-size:13px;"><i class="ti ti-loader" style="animation:spin 1s linear infinite;"></i></div>
    </div>
    <button class="load-more-btn hidden" id="collab-load-more" onclick="loadMoreCollabs()">
      <i class="ti ti-chevron-down"></i> Load more collabs
    </button>
  </div>

  <!-- COMMENTS PANEL -->
  <div class="tab-panel" id="panel-comments">
    <div class="section-head">
      <div class="section-title"><i class="ti ti-message-circle" style="color:var(--accent);"></i> Comments</div>
      <span class="section-count" id="section-comment-count">Loading…</span>
    </div>
    <div class="comment-list" id="comment-list">
      <div style="text-align:center;padding:32px;color:var(--text3);font-size:13px;"><i class="ti ti-loader" style="animation:spin 1s linear infinite;"></i></div>
    </div>
    <button class="load-more-btn hidden" id="comment-load-more" onclick="loadMoreComments()">
      <i class="ti ti-chevron-down"></i> Load more comments
    </button>
  </div>

  <!-- UPDATES PANEL -->
  <div class="tab-panel" id="panel-updates">
    <div class="section-head">
      <div class="section-title"><i class="ti ti-bell" style="color:var(--accent);"></i> Updates</div>
      <span class="section-count" id="updates-count">Loading…</span>
    </div>
    <!-- Filter sub-tabs -->
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="filterUpdates('all',this)"><i class="ti ti-layout-grid"></i> All</button>
      <button class="filter-tab" onclick="filterUpdates('novel',this)"><i class="ti ti-book"></i> Novels</button>
      <button class="filter-tab" onclick="filterUpdates('art',this)"><i class="ti ti-palette"></i> Artwork</button>
    </div>
    <div class="update-list" id="update-list">
      <div style="text-align:center;padding:32px;color:var(--text3);font-size:13px;"><i class="ti ti-loader" style="animation:spin 1s linear infinite;"></i></div>
    </div>
    <button class="load-more-btn hidden" id="update-load-more" onclick="loadMoreUpdates()">
      <i class="ti ti-chevron-down"></i> Load more updates
    </button>
  </div>

</div>

<!-- footer.js injects the shared footer here -->
<footer></footer>

<script src="escapeUtils.js"></script>
<script src="blockUtils.js"></script>
<script>
  var SUPABASE_URL = 'https://cajjyyskpmjnpcxcfeuk.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_ZZjE1u_pQn5YkrMKH4P3KQ_HSGqTjzx';
  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var allCollabs = [], shownCollabs = 0;
  var allComments = [], shownComments = 0;
  var allUpdates = [], shownUpdates = 0;
  var currentFilter = 'all';
  var collabWorkMap = {}, collabProfMap = {};
  var PAGE = 8;
  var myUid = null;

  // Hide anything authored by someone in a block relationship with me.
  function isHidden(uid){
    if(!uid) return false;
    try { return !!(window.dsBlock && dsBlock.either(uid)); } catch(e) { return false; }
  }

  // ── UTILS ──────────────────────────────────────────────────────────
  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function timeAgo(s){
    if(!s) return '';
    var d=Math.floor((Date.now()-new Date(s))/1000);
    if(d<60) return 'just now';
    if(d<3600) return Math.floor(d/60)+'m ago';
    if(d<86400) return Math.floor(d/3600)+'h ago';
    return Math.floor(d/86400)+'d ago';
  }
  function coverLetter(t){ return (t||'?').charAt(0).toUpperCase(); }
  // Truncating raw text can cut a ||spoiler|| pair in half and leak it as plain
  // text. Cut back to the last complete pair boundary instead.
  function truncateSpoilerSafe(s,n){
    if(s.length<=n) return s;
    var cut=s.slice(0,n);
    var marks=(cut.match(/\|\|/g)||[]).length;
    if(marks%2===1){
      var last=cut.lastIndexOf('||');
      cut=cut.slice(0,last);
    }
    return cut;
  }
  var COLORS=['cover-purple','cover-blue','cover-red','cover-green','cover-gold','cover-pink'];
  function coverColor(id){ var h=0; for(var i=0;i<(id||'').length;i++) h=(h*31+id.charCodeAt(i))&0xffff; return COLORS[h%COLORS.length]; }

  // ── TABS ──────────────────────────────────────────────────────────
  function switchTab(tab){
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
    document.getElementById('tab-btn-'+tab).classList.add('active');
    document.getElementById('panel-'+tab).classList.add('active');
    window.location.hash = tab;
  }

  // ── LOAD COLLABS ──────────────────────────────────────────────────
  async function loadCollabs(){
    var grid = document.getElementById('collab-grid');
    try {
    var [scRes, acRes] = await Promise.all([
      db.from('artwork_collabs').select('id,artwork_id,work_id,author_id,created_at').eq('status','approved').order('created_at',{ascending:false}).limit(20),
      db.from('story_collabs').select('id,work_id,artist_id,image_url,description,created_at').eq('status','approved').order('created_at',{ascending:false}).limit(20)
    ]);

    var combined = [];
    (scRes.data||[]).forEach(function(c){ combined.push({type:'story',data:c,created_at:c.created_at}); });
    (acRes.data||[]).forEach(function(c){ combined.push({type:'art',data:c,created_at:c.created_at}); });
    combined.sort(function(a,b){ return new Date(b.created_at)-new Date(a.created_at); });

    if(!combined.length){
      grid.innerHTML='<div style="grid-column:1/-1;" class="empty-state"><i class="ti ti-user-off"></i><p>No active collabs yet.</p></div>';
      document.getElementById('section-collab-count').textContent='0 active';
      return;
    }

    var workIds=[...new Set([
      ...(scRes.data||[]).map(function(c){return c.work_id;}),
      ...(scRes.data||[]).map(function(c){return c.artwork_id;}),
      ...(acRes.data||[]).map(function(c){return c.work_id;})
    ].filter(Boolean))];
    if(workIds.length){
      var {data:works}=await db.from('works').select('id,title,cover_url,author_id,type').in('id',workIds);
      (works||[]).forEach(function(w){collabWorkMap[w.id]=w;});
    }
    var userIds=[...new Set([
      ...(scRes.data||[]).map(function(c){return c.author_id;}),
      ...(acRes.data||[]).map(function(c){return c.artist_id;}),
      ...Object.values(collabWorkMap).map(function(w){return w.author_id;})
    ].filter(Boolean))];
    if(userIds.length){
      var {data:profs}=await db.from('profiles').select('id,username,display_name,avatar_url').in('id',userIds);
      (profs||[]).forEach(function(p){collabProfMap[p.id]=p;});
    }

    allCollabs = combined.filter(function(item){
      var d=item.data;
      if(item.type==='story'){
        var artworkOwner=(collabWorkMap[d.artwork_id]||{}).author_id;
        return !isHidden(d.author_id) && !isHidden(artworkOwner);
      }
      var novelOwner=(collabWorkMap[d.work_id]||{}).author_id;
      return !isHidden(d.artist_id) && !isHidden(novelOwner);
    });
    if(!allCollabs.length){
      grid.innerHTML='<div style="grid-column:1/-1;" class="empty-state"><i class="ti ti-user-off"></i><p>No active collabs yet.</p></div>';
      document.getElementById('section-collab-count').textContent='0 active';
      return;
    }
    grid.innerHTML='';
    shownCollabs=0;
    renderMoreCollabs();
    document.getElementById('section-collab-count').textContent=allCollabs.length+(allCollabs.length>=40?'+ recent':' recent');
    } catch(e) { grid.innerHTML='<div style="grid-column:1/-1;" class="empty-state"><i class="ti ti-alert-circle"></i><p>Could not load collabs.</p></div>'; }
  }

  function renderMoreCollabs(){
    var grid=document.getElementById('collab-grid');
    var batch=allCollabs.slice(shownCollabs,shownCollabs+PAGE);
    batch.forEach(function(item){
      var card=document.createElement('div'); card.className='collab-card';
      if(item.type==='story'){
        var c=item.data;

        var artwork=collabWorkMap[c.artwork_id]||{};
        var author=collabProfMap[c.author_id]||{};
        var artist=collabProfMap[artwork.author_id]||{};
        var authorName=author.display_name||author.username||'Author';
        var artistName=artist.display_name||artist.username||'Artist';
        card.style.borderColor='rgba(245,158,11,0.15)';
        var storyCover=artwork.cover_url||novel.cover_url;
        card.innerHTML=
          (storyCover
            ?'<div class="collab-cover" style="padding:0;overflow:hidden;border:1.5px solid rgba(245,158,11,0.3);"><img src="'+esc(storyCover)+'" style="width:100%;height:100%;object-fit:cover;border-radius:8px;" alt=""/></div>'
            :'<div class="collab-cover" style="background:rgba(245,158,11,0.1);color:#f59e0b;">✍</div>')
          +'<div class="collab-body">'
            +'<div class="collab-type-label" style="color:#f59e0b;"><i class="ti ti-writing"></i> Collab Story</div>'
            +'<div class="collab-title">'+esc(novel.title||'Untitled Story')+'</div>'
            +'<div class="collab-names"><i class="ti ti-feather"></i> '+DSEscape.userLink(author,{fallback:'Author'})+' &nbsp;×&nbsp; <i class="ti ti-palette"></i> '+DSEscape.userLink(artist,{fallback:'Artist'})+'</div>'
            +'<div class="collab-time"><i class="ti ti-clock"></i> '+timeAgo(c.created_at)+'</div>'
            +'<div class="collab-btns">'
              +'<a class="collab-btn" href="story.html?id='+esc(c.work_id||'')+'"><i class="ti ti-book"></i> Story</a>'
              +'<a class="collab-btn" href="artwork.html?id='+esc(c.artwork_id||'')+'"><i class="ti ti-palette"></i> Artwork</a>'
            +'</div>'
          +'</div>';
      } else {
        var c2=item.data;
        var novel2=collabWorkMap[c2.work_id]||{};
        var novelOwner=collabProfMap[novel2.author_id]||{};
        var artist2=collabProfMap[c2.artist_id]||{};
        var novelOwnerName=novelOwner.display_name||novelOwner.username||'Author';
        var artistName2=artist2.display_name||artist2.username||'Artist';
        card.style.borderColor='rgba(245,158,11,0.15)';
        card.innerHTML=
          (c2.image_url
            ?'<div class="collab-cover" style="padding:0;overflow:hidden;border:1.5px solid rgba(245,158,11,0.3);"><img src="'+esc(c2.image_url)+'" style="width:100%;height:100%;object-fit:cover;border-radius:8px;" alt=""/></div>'
            :'<div class="collab-cover" style="background:rgba(245,158,11,0.08);color:#f59e0b;">🎨</div>')
          +'<div class="collab-body">'
            +'<div class="collab-type-label" style="color:#f59e0b;"><i class="ti ti-palette"></i> Collab Art</div>'
            +'<div class="collab-title">'+esc(c2.description||'Untitled Artwork')+'</div>'
            +'<div class="collab-names"><i class="ti ti-palette"></i> '+DSEscape.userLink(artist2,{fallback:'Artist',style:'color:var(--accent);'})+' &nbsp;×&nbsp; <i class="ti ti-book"></i> '+DSEscape.userLink(novelOwner,{fallback:'Author',style:'color:var(--accent);'})+'</div>'
            +'<div class="collab-time"><i class="ti ti-clock"></i> '+timeAgo(c2.created_at)+'</div>'
            +'<div class="collab-btns">'
              +'<a class="collab-btn" href="story.html?id='+esc(c2.work_id||'')+'"><i class="ti ti-book"></i> Novel</a>'
            +'</div>'
          +'</div>';
      }
      grid.appendChild(card);
    });
    shownCollabs+=batch.length;
    document.getElementById('collab-load-more').classList.toggle('hidden', shownCollabs>=allCollabs.length);
  }
  function loadMoreCollabs(){ renderMoreCollabs(); }

  // ── LOAD COMMENTS ─────────────────────────────────────────────────
  async function loadComments(){
    try {
    var [chapRes,artRes]=await Promise.all([
      db.from('chapter_comments').select('id,content,created_at,chapter_id,user_id,parent_id').order('created_at',{ascending:false}).limit(80),
      db.from('artwork_comments').select('id,content,created_at,work_id,user_id,parent_id').order('created_at',{ascending:false}).limit(80)
    ]);
    var chapRows=(chapRes.data||[]).filter(function(r){return !r.parent_id && !isHidden(r.user_id);}).map(function(r){r._src='chapter';return r;});
    var artRows=(artRes.data||[]).filter(function(r){return !r.parent_id && !isHidden(r.user_id);}).map(function(r){r._src='artwork';return r;});

    var chMap={},cwMap={};
    if(chapRows.length){
      var chIds=[...new Set(chapRows.map(function(r){return r.chapter_id;}).filter(Boolean))];
      if(chIds.length){
        var chRes2=await db.from('chapters').select('id,work_id').in('id',chIds);
        (chRes2.data||[]).forEach(function(c){chMap[c.id]=c;});
        var cwIds=[...new Set((chRes2.data||[]).map(function(c){return c.work_id;}).filter(Boolean))];
        if(cwIds.length){
          var cwRes=await db.from('works').select('id,title,type').in('id',cwIds);
          (cwRes.data||[]).forEach(function(w){cwMap[w.id]=w;});
        }
      }
      chapRows.forEach(function(r){var ch=chMap[r.chapter_id]||null;r.work_id=ch?ch.work_id:null;});
    }
    var awMap={};
    if(artRows.length){
      var awIds=[...new Set(artRows.map(function(r){return r.work_id;}).filter(Boolean))];
      if(awIds.length){
        var awRes=await db.from('works').select('id,title,type').in('id',awIds);
        (awRes.data||[]).forEach(function(w){awMap[w.id]=w;});
      }
    }
    var rows=chapRows.concat(artRows).sort(function(a,b){return new Date(b.created_at)-new Date(a.created_at);}).slice(0,50);
    if(!rows.length){
      document.getElementById('comment-list').innerHTML='<div class="empty-state"><i class="ti ti-message-off"></i><p>No comments yet.</p></div>';
      document.getElementById('section-comment-count').textContent='0 recent';
      return;
    }
    var userIds=[...new Set(rows.map(function(r){return r.user_id;}).filter(Boolean))];
    var profsMap={};
    if(userIds.length){
      var pRes=await db.from('profiles').select('id,username,display_name,avatar_url').in('id',userIds);
      (pRes.data||[]).forEach(function(p){profsMap[p.id]=p;});
    }
    var worksMap=Object.assign({},cwMap,awMap);
    allComments=rows.map(function(r){return{cm:r,user:profsMap[r.user_id],work:worksMap[r.work_id]||null};});
    shownComments=0;
    document.getElementById('comment-list').innerHTML='';
    renderMoreComments();
    document.getElementById('section-comment-count').textContent=allComments.length+' recent';
    } catch(e) { document.getElementById('comment-list').innerHTML='<div class="empty-state"><i class="ti ti-alert-circle"></i><p>Could not load comments.</p></div>'; }
  }

  function renderMoreComments(){
    var list=document.getElementById('comment-list');
    var batch=allComments.slice(shownComments,shownComments+PAGE);
    batch.forEach(function(item){
      var cm=item.cm,user=item.user||{},work=item.work||{};
      var userName=user.display_name||user.username||'Unknown';
      var userHandle=user.username||'';
      var workTitle=work.title||'Unknown';
      var workType=work.type==='artwork'?'art':'novel';
      var destUrl=work.id?(work.type==='artwork'?'artwork.html?id='+work.id:'story.html?id='+work.id):'#';
      var card=document.createElement('div'); card.className='comment-card';
      card.onclick=function(){if(work.id) window.location.href=destUrl;};
      var avH=user.avatar_url?'<img src="'+esc(user.avatar_url)+'" style="width:100%;height:100%;object-fit:cover;" alt=""/>':esc((userName.charAt(0)||'?').toUpperCase());
      card.innerHTML=
        '<div class="comment-thumb '+coverColor(cm.user_id||cm.id)+'">'+avH+'</div>'+
        '<div class="comment-body">'+
          '<div class="comment-on"><span class="comment-type '+workType+'">'+workType.charAt(0).toUpperCase()+workType.slice(1)+'</span> '+esc(workTitle)+'</div>'+
          '<div class="comment-text">"'+dsSpoiler.render(esc(truncateSpoilerSafe(cm.content||'',160)))+((cm.content&&cm.content.length>160)?'…':'')+'"</div>'+
          '<div class="comment-meta">'+
            '<a class="comment-user" href="profile.html?user='+esc(userHandle)+'">'+esc(userName)+'</a>'+
            '<span class="comment-time"><i class="ti ti-clock"></i> '+timeAgo(cm.created_at)+'</span>'+
          '</div>'+
        '</div>';
      list.appendChild(card);
    });
    shownComments+=batch.length;
    document.getElementById('comment-load-more').classList.toggle('hidden',shownComments>=allComments.length);
  }
  function loadMoreComments(){ renderMoreComments(); }

  // ── CONTENT FILTERS ───────────────────────────────────────────────
  // activity.html previously applied NO content filter at all, so mature works
  // surfaced in the updates and artwork feeds regardless of the viewer's
  // settings — including for logged-out visitors. ALLOW semantics, matching
  // browse/search/library: gore/erotica true = viewer MAY see it.
  var actContentFilters = { gore: false, erotica: false, safe: true };
  async function loadActContentFilters() {
    try {
      var r = await db.rpc('get_my_private_profile');
      var prof = (r && r.data && r.data.length) ? r.data[0] : null;
      if (!prof) return;                 // logged out keeps the restrictive default
      actContentFilters.safe    = prof.settings_filter_safe === true;
      actContentFilters.gore    = prof.settings_filter_gore !== false;
      actContentFilters.erotica = prof.settings_filter_erotica !== false;
    } catch (e) { /* keep restrictive default */ }
    try { await DSWarn.init(db); } catch (e) {}
    try { await DSTags.init(db); } catch (e) {}
    try { await loadLangPrefs(); } catch (e) {}
  }
  // Language & Region. These three pages applied no language handling at all:
  // a reader with a strict language filter still saw every other language here.
  var myLangPrefs = { pref_language: 'any', lang_original: true, lang_strict: false };
  async function loadLangPrefs() {
    try {
      var r = await db.rpc('get_my_private_profile');
      var row = (r && !r.error && r.data && r.data.length) ? r.data[0] : null;
      if (row) {
        if (row.pref_story_language) myLangPrefs.pref_language = row.pref_story_language;
        if (row.lang_original !== null && row.lang_original !== undefined) myLangPrefs.lang_original = row.lang_original;
        if (row.lang_strict   !== null && row.lang_strict   !== undefined) myLangPrefs.lang_strict   = row.lang_strict;
      }
    } catch (e) { /* keep permissive default */ }
  }
  function langBlocked(w) {
    if (!w) return false;
    if (!myLangPrefs.lang_original && w.is_fan_translation === true) return true;
    if (myLangPrefs.lang_strict && myLangPrefs.pref_language !== 'any'
        && w.language && w.language !== myLangPrefs.pref_language) return true;
    return false;
  }

  function actPassesFilter(w) {
    if (!w) return false;
    // Content warnings the viewer opted out of. activity.html applied no
    // warning filter at all before this. Chapter rows filter through their
    // parent work, which is why this sits in the shared predicate.
    if (window.DSWarn && DSWarn.isBlocked(w)) return false;
    // Blocked tags. activity.html applied no tag filter at all before this.
    if (window.DSTags && DSTags.isBlocked(w)) return false;
    if (langBlocked(w)) return false;
    if ((actContentFilters.safe || !actContentFilters.gore) && w.content_rating_gore === true) return false;
    if ((actContentFilters.safe || !actContentFilters.erotica) && w.content_rating_erotica === true) return false;
    return true;
  }

  // ── LOAD UPDATES ──────────────────────────────────────────────────
  async function loadUpdates(){
    try {
    var [chapRes,artRes]=await Promise.all([
      db.from('chapters').select('id,chapter_number,title,created_at,work_id,author_id').in('status',['published','one-shot']).order('created_at',{ascending:false}).limit(60),
      db.from('works').select('id,title,cover_url,author_id,created_at,type,content_rating_gore,content_rating_erotica,content_warnings,tags_all,language,is_fan_translation').eq('type','artwork').eq('is_published',true).order('created_at',{ascending:false}).limit(40)
    ]);
    await loadActContentFilters();
    var chapters=(chapRes.data||[]).filter(function(c){return !isHidden(c.author_id);});
    var artworks=(artRes.data||[]).filter(function(a){return !isHidden(a.author_id) && actPassesFilter(a);});

    var chapWorkIds=chapters.map(function(c){return c.work_id;}).filter(Boolean);
    var allAuthorIds=chapters.map(function(c){return c.author_id;}).concat(artworks.map(function(a){return a.author_id;})).filter(function(id,i,arr){return id&&arr.indexOf(id)===i;});

    var worksMap={};
    if(chapWorkIds.length){
      var wRes=await db.from('works').select('id,title,type,cover_url,author_id,content_rating_gore,content_rating_erotica,content_warnings,tags_all,language,is_fan_translation').in('id',chapWorkIds);
      (wRes.data||[]).forEach(function(w){ if(actPassesFilter(w)) worksMap[w.id]=w; });
      // A chapter whose work was filtered out has no worksMap entry, so it
      // drops out of the feed with it.
      chapters = chapters.filter(function(c){ return worksMap[c.work_id]; });
    }
    var profsMap={};
    if(allAuthorIds.length){
      var pRes=await db.from('profiles').select('id,username,display_name').in('id',allAuthorIds);
      (pRes.data||[]).forEach(function(p){profsMap[p.id]=p;});
    }

    var chapUpdates=chapters.map(function(ch){
      var work=worksMap[ch.work_id]||{};
      var prof=profsMap[work.author_id]||{};
      return {
        id:ch.id, type:'novel',
        title:work.title||'Unknown',
        chapter:ch.title?'Chapter '+ch.chapter_number+' — "'+ch.title+'"':'Chapter '+ch.chapter_number,
        author:prof.display_name||prof.username||'Unknown',
        authorHandle:prof.username||'',
        workId:work.id||null, chapterId:ch.id, ownerId:work.author_id||null,
        cover:work.cover_url||null, created_at:ch.created_at, colorKey:ch.work_id
      };
    }).filter(function(u){return u.workId && !isHidden(u.ownerId);});

    var artUpdates=artworks.map(function(a){
      var prof=profsMap[a.author_id]||{};
      return {
        id:a.id, type:'art',
        title:a.title||'Unknown',
        chapter:'New artwork posted',
        author:prof.display_name||prof.username||'Unknown',
        authorHandle:prof.username||'',
        workId:a.id, chapterId:null,
        cover:a.cover_url||null, created_at:a.created_at, colorKey:a.id
      };
    });

    allUpdates=chapUpdates.concat(artUpdates).sort(function(a,b){return new Date(b.created_at)-new Date(a.created_at);});
    shownUpdates=0;
    document.getElementById('update-list').innerHTML='';
    if(!allUpdates.length){
      document.getElementById('update-list').innerHTML='<div class="empty-state"><i class="ti ti-bell-off"></i><p>No updates yet.</p></div>';
      document.getElementById('updates-count').textContent='0 new';
      return;
    }
    renderMoreUpdates();
    document.getElementById('updates-count').textContent=allUpdates.length+' recent';
    } catch(e) { document.getElementById('update-list').innerHTML='<div class="empty-state"><i class="ti ti-alert-circle"></i><p>Could not load updates.</p></div>'; }
  }

  function renderMoreUpdates(){
    var list=document.getElementById('update-list');
    var filtered=allUpdates.filter(function(u){return currentFilter==='all'||u.type===currentFilter;});
    var batch=filtered.slice(shownUpdates,shownUpdates+PAGE);
    batch.forEach(function(u){
      var card=document.createElement('div'); card.className='update-card';
      card.dataset.type=u.type;
      var coverHtml=u.cover
        ?'<img src="'+esc(u.cover)+'" style="width:46px;height:62px;border-radius:7px;object-fit:cover;flex-shrink:0;" alt=""/>'
        :'<div class="update-cover '+coverColor(u.colorKey||u.id)+'">'+esc(coverLetter(u.title))+'</div>';
      card.innerHTML=
        coverHtml+
        '<div class="update-body">'+
          '<div class="update-title">'+esc(u.title)+'</div>'+
          '<div class="update-chapter">'+esc(u.chapter)+'</div>'+
          '<div class="update-author">by <a href="profile.html?user='+esc(u.authorHandle)+'">'+esc(u.author)+'</a></div>'+
        '</div>'+
        '<div class="update-right">'+
          '<span class="type-badge '+u.type+'">'+u.type.charAt(0).toUpperCase()+u.type.slice(1)+'</span>'+
          '<span class="update-time"><i class="ti ti-clock"></i> '+timeAgo(u.created_at)+'</span>'+
          '<a class="read-btn" href="'+(u.type==='art'?'artwork.html?id='+u.workId:(u.workId?(u.chapterId?'chapter.html?id='+u.chapterId:'story.html?id='+u.workId):'#'))+'"><i class="ti ti-'+(u.type==='art'?'photo':'book-open')+'"></i> '+(u.type==='art'?'View Art':'Read')+'</a>'+
        '</div>';
      list.appendChild(card);
    });
    shownUpdates+=batch.length;
    document.getElementById('update-load-more').classList.toggle('hidden',shownUpdates>=filtered.length);
  }
  function loadMoreUpdates(){ renderMoreUpdates(); }

  function filterUpdates(type,btn){
    currentFilter=type;
    document.querySelectorAll('.filter-tab').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    shownUpdates=0;
    document.getElementById('update-list').innerHTML='';
    renderMoreUpdates();
    var count=allUpdates.filter(function(u){return type==='all'||u.type===type;}).length;
    document.getElementById('updates-count').textContent=count+' shown';
  }

  // ── REALTIME ──────────────────────────────────────────────────────
  // Re-fetch each section when relevant inserts happen
  var _timers={};
  function debounced(fn,key){
    return function(){
      clearTimeout(_timers[key]);
      _timers[key]=setTimeout(fn,1200);
    };
  }
  var reComments=debounced(loadComments,'comments');
  var reUpdates=debounced(loadUpdates,'updates');
  var reCollabs=debounced(loadCollabs,'collabs');

  function startRealtime(){
    db.channel('activity-live')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'chapter_comments'},function(){ reComments(); })
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'artwork_comments'},function(){ reComments(); })
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'chapters'},function(){ reUpdates(); })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'chapters'},function(){ reUpdates(); })
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'works'},function(){ reUpdates(); })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'works'},function(){ reUpdates(); })
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'artwork_collabs'},function(p){ if(p.new&&p.new.status==='approved') reCollabs(); })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'artwork_collabs'},function(p){ if(p.new&&p.new.status==='approved') reCollabs(); })
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'story_collabs'},function(p){ if(p.new&&p.new.status==='approved') reCollabs(); })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'story_collabs'},function(p){ if(p.new&&p.new.status==='approved') reCollabs(); })
      .subscribe();
  }

  // ── INIT ──────────────────────────────────────────────────────────
  window.addEventListener('DOMContentLoaded',async function(){
    var hash=window.location.hash.replace('#','');
    if(['collabs','comments','updates'].indexOf(hash)!==-1) switchTab(hash);
    // Block lists must be loaded BEFORE the first render, or blocked users'
    // content flashes in and only disappears on the next refetch.
    try {
      var sessionRes=await db.auth.getSession();
      var session=sessionRes&&sessionRes.data?sessionRes.data.session:null;
      if(session){ myUid=session.user.id; await dsBlock.load(myUid); }
    } catch(e) {}
    await Promise.all([loadCollabs(),loadComments(),loadUpdates()]).catch(function(){});
    startRealtime();
  });
</script>
