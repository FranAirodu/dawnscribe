<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var t=localStorage.getItem('ds_theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fan Art Gallery — DawnScribe</title>
  <meta property="og:site_name" content="DawnScribe" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Fan Art Gallery — DawnScribe" />
  <meta property="og:description" content="DawnScribe is a creative platform where web novel authors and artists collaborate, share, and build community together." />
  <meta property="og:url" content="https://www.dawnscribe.com/collab-gallery.html" />
  <meta property="og:image" content="https://www.dawnscribe.com/og-default.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="canonical" href="https://www.dawnscribe.com/collab-gallery.html" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- blockUtils must load before the inline script: init() calls dsBlock.load()
       synchronously on parse, and both the gallery grid and the comment list
       filter through dsBlock.either(). -->
  <script src="blockUtils.js"></script>
  <style>
    :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--bg4:#22223a;--accent:#2dd4bf;--accent2:#0d9488;--text:#f1f0ff;--text2:#9b9bc0;--text3:#5a5a80;--border:rgba(255,255,255,0.07);--red:#f87171;--gold:#f59e0b;--green:#34d399;}
    html[data-theme="light"]{--bg:#f4f4f8;--bg2:#ffffff;--bg3:#ebebf2;--bg4:#d8d8e8;--accent:#0d9488;--accent2:#0f766e;--text:#0a0a0f;--text2:#3a3a5c;--text3:#7a7a9a;--border:rgba(0,0,0,0.08);--red:#dc2626;--green:#059669;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh;}

    /* ── NAV ── */
    nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .logo{font-family:'Cinzel',serif;font-size:22px;color:var(--accent);text-decoration:none;letter-spacing:1px;}
    .logo span{color:var(--text);}
    .back-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 16px;color:var(--text2);font-size:13px;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;text-decoration:none;}
    .back-btn:hover{border-color:var(--accent);color:var(--accent);}

    /* ── HERO ── */
    .hero{padding:48px 32px 32px;max-width:1100px;margin:0 auto;}
    .hero-eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
    .hero-title{font-family:'Cinzel',serif;font-size:32px;font-weight:700;color:var(--text);margin-bottom:6px;}
    .hero-title span{color:var(--gold);}
    .hero-sub{font-size:14px;color:var(--text3);}

    /* ── CONTROLS ── */
    .controls-bar{max-width:1100px;margin:0 auto;padding:0 32px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
    .sort-btn{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 14px;color:var(--text2);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:5px;}
    .sort-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(45,212,191,0.07);}
    .sort-btn:hover:not(.active){border-color:var(--text3);color:var(--text);}
    .search-input{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);font-size:12px;font-family:'Lato',sans-serif;outline:none;transition:border-color 0.2s;width:180px;}
    .search-input:focus{border-color:var(--accent);}
    .search-input::placeholder{color:var(--text3);}
    .results-count{font-size:12px;color:var(--text3);margin-left:auto;}

    /* ── GALLERY ── */
    .gallery-wrap{max-width:1100px;margin:0 auto;padding:0 32px 80px;}
    /* Masonry via CSS columns */
    .gallery-grid{column-count:5;column-gap:14px;}
    .gallery-card{break-inside:avoid;margin-bottom:14px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform 0.2s,border-color 0.2s,box-shadow 0.2s;display:block;}
    .gallery-card:hover{transform:translateY(-3px);border-color:rgba(245,158,11,0.35);box-shadow:0 8px 24px rgba(0,0,0,0.3);}
    .gallery-card img{width:100%;display:block;object-fit:cover;}
    .gallery-card-placeholder{width:100%;aspect-ratio:2/3;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--text3);}
    .gallery-card-body{padding:10px 12px;}
    .gallery-card-artist{display:flex;align-items:center;gap:7px;margin-bottom:6px;}
    .gallery-card-avatar{width:22px;height:22px;border-radius:50%;background:var(--bg4);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--text2);}
    .gallery-card-avatar img{width:100%;height:100%;object-fit:cover;}
    .gallery-card-name{font-size:11px;font-weight:700;color:var(--accent);text-decoration:none;}
    .gallery-card-name:hover{text-decoration:underline;}
    .gallery-card-desc{font-size:11px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px;}
    .gallery-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:5px;}
    .gallery-card-time{font-size:10px;color:var(--text3);}
    .gallery-card-likes{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--text3);}
    .gallery-card-likes.liked{color:var(--red);}

    /* ── DETAIL MODAL ── */
    .detail-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity 0.2s;}
    .detail-backdrop.show{opacity:1;pointer-events:all;}
    .detail-modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:860px;max-height:92vh;display:flex;overflow:hidden;transform:translateY(12px);transition:transform 0.2s;}
    .detail-backdrop.show .detail-modal{transform:translateY(0);}

    /* Image column — click to zoom */
    .detail-img-col{flex:0 0 340px;background:#000;position:relative;cursor:zoom-in;overflow:hidden;}
    .detail-img-col img{width:100%;height:100%;object-fit:contain;display:block;transition:transform 0.3s;}
    .detail-img-col.zoomed{cursor:zoom-out;}
    .detail-img-col.zoomed img{transform:scale(1.85);transform-origin:var(--zoom-x,50%) var(--zoom-y,50%);}
    .detail-zoom-hint{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.55);border-radius:6px;padding:3px 8px;font-size:10px;color:rgba(255,255,255,0.7);pointer-events:none;display:flex;align-items:center;gap:4px;transition:opacity 0.3s;}
    .detail-img-col.zoomed .detail-zoom-hint{opacity:0;}

    .detail-right{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
    .detail-top{padding:16px;border-bottom:1px solid var(--border);}
    .detail-top-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
    .detail-close{background:transparent;border:none;color:var(--text3);font-size:20px;cursor:pointer;line-height:1;padding:2px;flex-shrink:0;transition:color 0.2s;}
    .detail-close:hover{color:var(--text);}
    .detail-artist-row{display:flex;align-items:center;gap:8px;}
    .detail-avatar{width:30px;height:30px;border-radius:50%;background:var(--bg4);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text2);}
    .detail-avatar img{width:100%;height:100%;object-fit:cover;}
    .detail-artist-name{font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;}
    .detail-artist-name:hover{text-decoration:underline;}
    .collab-tag{font-size:10px;padding:1px 7px;border-radius:4px;font-weight:700;margin-left:4px;}
    .collab-tag-artist{background:rgba(167,139,250,0.15);color:#a78bfa;border:1px solid rgba(167,139,250,0.3);}
    .detail-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:6px;}
    .detail-inspo{font-size:12px;color:var(--text3);font-style:italic;line-height:1.5;margin-bottom:6px;}

    /* Like row in modal */
    .detail-like-row{display:flex;align-items:center;gap:10px;margin-top:8px;}
    .like-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:5px 14px;font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--text3);transition:all 0.18s;}
    .like-btn:hover{border-color:var(--red);color:var(--red);}
    .like-btn.liked{border-color:var(--red);color:var(--red);background:rgba(248,113,113,0.08);}
    .like-btn i{font-size:14px;}
    .like-count{font-size:12px;font-weight:700;color:var(--text3);}

    /* Comments */
    .detail-comments{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px;}
    .detail-comments::-webkit-scrollbar{width:4px;}
    .detail-comments::-webkit-scrollbar-thumb{background:var(--accent);border-radius:4px;}
    .dc-card{background:var(--bg3);border-radius:8px;padding:10px 12px;}
    .dc-header{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap;}
    .dc-avatar{width:20px;height:20px;border-radius:50%;background:var(--bg4);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--text2);}
    .dc-avatar img{width:100%;height:100%;object-fit:cover;}
    .dc-name{font-size:12px;font-weight:700;color:var(--text);}
    .dc-time{font-size:10px;color:var(--text3);margin-left:auto;}
    .dc-text{font-size:12px;color:var(--text2);line-height:1.55;white-space:pre-wrap;word-break:break-word;}

    /* Comment input */
    .detail-input-row{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;}
    .detail-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:12px;font-family:'Lato',sans-serif;outline:none;resize:none;transition:border-color 0.2s;line-height:1.5;max-height:100px;overflow-y:auto;}
    .detail-input:focus{border-color:var(--accent);}
    .spoiler-btn{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text3);cursor:pointer;font-size:13px;flex-shrink:0;transition:all 0.2s;}
    .spoiler-btn:hover{border-color:var(--accent);color:var(--accent);}
    .detail-post-btn{background:var(--accent2);border:none;border-radius:8px;padding:8px 14px;color:#fff;font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;flex-shrink:0;transition:background 0.2s;}
    .detail-post-btn:hover{background:var(--accent);}
    .detail-post-btn:disabled{opacity:0.5;cursor:default;}

    /* Comments error */
    .comment-error{font-size:11px;color:var(--red);padding:4px 0;}

    /* Empty / loading states */
    .empty-state{text-align:center;padding:64px 24px;color:var(--text3);}
    .empty-state i{font-size:40px;display:block;margin-bottom:12px;opacity:0.3;}
    .empty-state p{font-size:14px;}

    /* Fullscreen zoom overlay */
    .zoom-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:500;display:none;align-items:center;justify-content:center;cursor:zoom-out;}
    .zoom-overlay.show{display:flex;}
    .zoom-overlay img{max-width:95vw;max-height:95vh;object-fit:contain;border-radius:4px;}
    .zoom-close{position:fixed;top:16px;right:20px;background:transparent;border:none;color:rgba(255,255,255,0.7);font-size:28px;cursor:pointer;z-index:501;line-height:1;}
    .zoom-close:hover{color:#fff;}

    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes heartPop{0%{transform:scale(1);}50%{transform:scale(1.4);}100%{transform:scale(1);}}
    .heart-pop{animation:heartPop 0.25s ease;}

    @media(max-width:900px){.gallery-grid{column-count:3;}}
    @media(max-width:640px){
      .detail-modal{flex-direction:column;}
      .detail-img-col{flex:0 0 220px;}
      .gallery-grid{column-count:2;}
      .controls-bar{gap:8px;}
      .search-input{width:100%;}
    }
    @media(max-width:400px){.gallery-grid{column-count:1;}}
  </style>
</head>
<body>
  <nav>
    <a class="logo" href="index.html">Dawn<span>Scribe</span></a>
    <a class="back-btn" id="back-to-story" href="index.html"><i class="ti ti-arrow-left"></i> Back to story</a>
  </nav>

  <div class="hero">
    <div class="hero-eyebrow"><i class="ti ti-palette"></i> Fan Art &amp; Collaborations</div>
    <div class="hero-title" id="page-title">Fan Art Gallery</div>
    <div class="hero-sub" id="hero-sub">All fan art submitted for this novel.</div>
  </div>

  <div class="controls-bar" id="controls-bar" style="display:none;">
    <button class="sort-btn active" id="sort-newest" onclick="setSort('newest')"><i class="ti ti-clock"></i> Newest</button>
    <button class="sort-btn" id="sort-oldest" onclick="setSort('oldest')"><i class="ti ti-history"></i> Oldest</button>
    <button class="sort-btn" id="sort-liked" onclick="setSort('liked')"><i class="ti ti-heart"></i> Most Liked</button>
    <input class="search-input" id="search-input" type="text" placeholder="Search by artist…" oninput="filterGallery()"/>
    <span class="results-count" id="results-count"></span>
  </div>

  <div class="gallery-wrap">
    <div class="gallery-grid" id="gallery-grid">
      <div style="column-span:all;text-align:center;padding:48px;color:var(--text3);">
        <i class="ti ti-loader" style="font-size:28px;animation:spin 1s linear infinite;display:block;margin-bottom:8px;"></i>Loading…
      </div>
    </div>
  </div>

  <!-- Detail modal -->
  <div class="detail-backdrop" id="detail-backdrop" role="dialog" aria-modal="true" aria-label="Fan art detail">
    <div class="detail-modal" id="detail-modal">
      <div class="detail-img-col" id="detail-img-col">
        <img id="detail-img" src="" alt="Fan art"/>
        <div class="detail-zoom-hint"><i class="ti ti-zoom-in" style="font-size:10px;"></i> Click to zoom</div>
      </div>
      <div class="detail-right">
        <div class="detail-top">
          <div class="detail-top-row">
            <div class="detail-artist-row" id="detail-artist-row"></div>
            <button class="detail-close" id="detail-close" aria-label="Close"><i class="ti ti-x"></i></button>
          </div>
          <div class="detail-desc" id="detail-desc"></div>
          <div class="detail-inspo" id="detail-inspo" style="display:none;"></div>
          <div class="detail-like-row">
            <button class="like-btn" id="modal-like-btn" onclick="toggleLike()">
              <i class="ti ti-heart" id="modal-like-icon"></i> <span id="modal-like-label">Like</span>
            </button>
            <span class="like-count" id="modal-like-count"></span>
          </div>
        </div>
        <div class="detail-comments" id="detail-comments"></div>
        <div class="detail-input-row" id="detail-input-row" style="display:none;">
          <textarea class="detail-input" id="detail-input" placeholder="Leave a comment…" rows="1" maxlength="500"></textarea>
          <button type="button" class="spoiler-btn" title="Wrap selection as spoiler" onclick="dsSpoiler.wrapSelection(document.getElementById('detail-input'))"><i class="ti ti-eye-off"></i></button>
          <button class="detail-post-btn" id="detail-post-btn"><i class="ti ti-send"></i></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Fullscreen zoom overlay -->
  <div class="zoom-overlay" id="zoom-overlay">
    <button class="zoom-close" id="zoom-close" aria-label="Close zoom"><i class="ti ti-x"></i></button>
    <img id="zoom-img" src="" alt=""/>
  </div>

  <script>
    var SUPABASE_URL = 'https://cajjyyskpmjnpcxcfeuk.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhamp5eXNrcG1qbnBjeGNmZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDUyMDUsImV4cCI6MjA5NTMyMTIwNX0.s93zWwRYymTsoW5BfUhUDli13ArCtk4S-tegAs54A2c';
    var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var workId = new URLSearchParams(window.location.search).get('work');
    var currentSession = null;
    var workData = null;
    var allCollabs = [];   // raw from DB
    var myLikes = {};      // collab_id → true
    var activeId = null;
    var currentSort = 'newest';
    var searchQuery = '';

    /* ── HELPERS ── */
    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function safeUrl(u){
      u = String(u||'').trim();
      return /^(https?:\/\/|\/)/i.test(u) ? u : '';
    }
    function timeAgo(s) {
      var d = Math.floor((Date.now() - new Date(s)) / 1000);
      if (d < 60) return 'just now';
      if (d < 3600) return Math.floor(d/60) + 'm ago';
      if (d < 86400) return Math.floor(d/3600) + 'h ago';
      if (d < 2592000) return Math.floor(d/86400) + 'd ago';
      return new Date(s).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
    }
    function avatarHtml(profile, size) {
      var raw = (profile && (profile.display_name || profile.username)) || '?';
      var n = esc(raw);
      var initial = esc(raw.charAt(0).toUpperCase());
      if (profile && safeUrl(profile.avatar_url)) {
        return '<img src="' + esc(safeUrl(profile.avatar_url)) + '" alt="' + n + '" loading="lazy"/>';
      }
      return initial;
    }

    /* ── SORT & FILTER ── */
    function setSort(mode) {
      currentSort = mode;
      ['newest','oldest','liked'].forEach(function(m) {
        document.getElementById('sort-' + m).classList.toggle('active', m === mode);
      });
      renderGrid();
    }
    function filterGallery() {
      searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
      renderGrid();
    }
    function getSorted() {
      var list = allCollabs.slice();
      if (searchQuery) {
        list = list.filter(function(c) {
          return (c._artistName || '').toLowerCase().indexOf(searchQuery) !== -1;
        });
      }
      if (currentSort === 'newest') list.sort(function(a,b){ return new Date(b.created_at) - new Date(a.created_at); });
      else if (currentSort === 'oldest') list.sort(function(a,b){ return new Date(a.created_at) - new Date(b.created_at); });
      else if (currentSort === 'liked') list.sort(function(a,b){ return (b.likes_count||0) - (a.likes_count||0); });
      return list;
    }

    /* ── RENDER GRID ── */
    function renderGrid() {
      var list = getSorted();
      var grid = document.getElementById('gallery-grid');
      var countEl = document.getElementById('results-count');
      if (countEl) countEl.textContent = list.length + ' work' + (list.length === 1 ? '' : 's');

      if (!list.length) {
        grid.innerHTML = '<div class="empty-state" style="column-span:all;"><i class="ti ti-photo-off"></i><p>' + (searchQuery ? 'No results for "' + esc(searchQuery) + '".' : 'No fan art yet.') + '</p></div>';
        return;
      }

      grid.innerHTML = '';
      list.forEach(function(c) {
        var liked = !!myLikes[c.id];
        var card = document.createElement('div');
        card.className = 'gallery-card';
        card.dataset.id = c.id;

        var imgHtml = c.image_url
          ? '<img src="' + esc(safeUrl(c.image_url)) + '" alt="Fan art by ' + esc(c._artistName) + '" loading="lazy"/>'
          : '<div class="gallery-card-placeholder"><i class="ti ti-photo"></i></div>';

        var ah = c._artistHref;
        card.innerHTML =
          imgHtml +
          '<div class="gallery-card-body">' +
            '<div class="gallery-card-artist">' +
              '<div class="gallery-card-avatar">' + avatarHtml(c._artist, 22) + '</div>' +
              '<a class="gallery-card-name" href="' + esc(ah) + '">' + esc(c._artistName) + '</a>' +
            '</div>' +
            (c.description ? '<div class="gallery-card-desc">' + esc(c.description) + '</div>' : '') +
            '<div class="gallery-card-footer">' +
              '<span class="gallery-card-time">' + timeAgo(c.created_at) + '</span>' +
              '<span class="gallery-card-likes' + (liked ? ' liked' : '') + '">' +
                '<i class="ti ' + (liked ? 'ti-hearts' : 'ti-heart') + '"></i> ' + (c.likes_count || 0) +
              '</span>' +
            '</div>' +
          '</div>';

        // Click card body → open detail; click artist link → navigate (stop propagation)
        card.addEventListener('click', function(e) {
          if (e.target.closest('a')) return;
          openDetail(c.id);
        });
        grid.appendChild(card);
      });
    }

    /* ── INIT ── */
    (async function init() {
      var sr = await db.auth.getSession();
      currentSession = (sr.data && sr.data.session) ? sr.data.session : null;

      if (!workId) {
        document.getElementById('gallery-grid').innerHTML = '<div class="empty-state" style="column-span:all;"><i class="ti ti-alert-circle"></i><p>No story specified.</p></div>';
        return;
      }

      // Block list — must resolve before any artist or commenter is rendered.
      // Never fatal: a failed blocks fetch degrades to showing everything rather
      // than showing nothing.
      if (currentSession && window.dsBlock) {
        try { await dsBlock.load(currentSession.user.id); } catch (e) {}
      }

      // Load work metadata
      var wRes = await db.from('works').select('id,title,author_id').eq('id', workId).maybeSingle();
      if (wRes.error) {
        document.getElementById('gallery-grid').innerHTML = '<div class="empty-state" style="column-span:all;"><i class="ti ti-plug-x"></i><p>Could not load story. Please try again.</p></div>';
        return;
      }
      // A null row here is not "no error" — the work is deleted, unpublished, or
      // hidden by the age/visibility policy. Previously the page carried on with an
      // unset title and a dead back-link, then said "No fan art yet."
      workData = wRes.data || null;
      if (!workData) {
        document.getElementById('gallery-grid').innerHTML = '<div class="empty-state" style="column-span:all;"><i class="ti ti-book-off"></i><p>This story isn\'t available.</p></div>';
        return;
      }
      document.getElementById('page-title').innerHTML = 'Fan Art — <span>' + esc(workData.title) + '</span>';
      document.getElementById('back-to-story').href = 'story.html?id=' + workId;
      document.getElementById('hero-sub').textContent = 'All fan art submitted for this story.';

      // Load approved collabs + likes_count
      var cRes = await db.from('story_collabs')
        .select('id,image_url,artist_id,created_at,description,inspiration,likes_count')
        .eq('work_id', workId)
        .eq('status', 'approved')
        .order('created_at', {ascending: false});
      if (cRes.error) {
        document.getElementById('gallery-grid').innerHTML = '<div class="empty-state" style="column-span:all;"><i class="ti ti-plug-x"></i><p>Could not load gallery. Please try again.</p></div>';
        return;
      }
      allCollabs = cRes.data || [];

      // Hide submissions from users either side of a block, matching artwork.html.
      if (window.dsBlock) {
        allCollabs = allCollabs.filter(function(c){ return !dsBlock.either(c.artist_id); });
      }

      if (!allCollabs.length) {
        document.getElementById('gallery-grid').innerHTML = '<div class="empty-state" style="column-span:all;"><i class="ti ti-photo-off"></i><p>No fan art yet.</p></div>';
        return;
      }

      // Batch-load artist profiles
      var aIds = [...new Set(allCollabs.map(function(c){ return c.artist_id; }))];
      var pMap = {};
      if (aIds.length) {
        var pRes = await db.from('profiles').select('id,username,display_name,avatar_url').in('id', aIds);
        (pRes.data || []).forEach(function(p){ pMap[p.id] = p; });
      }

      // Cache display values on each collab for sorting/search
      allCollabs.forEach(function(c) {
        var a = pMap[c.artist_id] || {};
        c._artist = a;
        c._artistName = a.display_name || a.username || 'Artist';
        c._artistHref = a.username ? 'profile.html?user=' + encodeURIComponent(a.username) : '#';
        c.likes_count = c.likes_count || 0;
      });

      // Load current user's likes
      if (currentSession) {
        var lRes = await db.from('story_collab_likes')
          .select('collab_id')
          .eq('user_id', currentSession.user.id)
          .in('collab_id', allCollabs.map(function(c){ return c.id; }));
        (lRes.data || []).forEach(function(l){ myLikes[l.collab_id] = true; });
      }

      document.getElementById('controls-bar').style.display = 'flex';
      renderGrid();
    })();

    /* ── DETAIL MODAL ── */
    async function openDetail(collabId) {
      var c = allCollabs.find(function(x){ return x.id === collabId; });
      if (!c) return;
      activeId = collabId;

      // Image
      var imgEl = document.getElementById('detail-img');
      var imgCol = document.getElementById('detail-img-col');
      var zoomHint = imgCol.querySelector('.detail-zoom-hint');
      imgEl.src = c.image_url || '';
      imgEl.alt = 'Fan art by ' + esc(c._artistName);
      // Only allow zoom interaction when there's an actual image
      var hasImage = !!c.image_url;
      imgCol.style.cursor = hasImage ? 'zoom-in' : 'default';
      if (zoomHint) zoomHint.style.display = hasImage ? '' : 'none';

      // Reset zoom
      imgCol.classList.remove('zoomed');

      // Artist row — no "Author" tag since every submitter here is a fan artist
      var avH = avatarHtml(c._artist, 30);
      var tag = '<span class="collab-tag collab-tag-artist">Artist</span>';
      document.getElementById('detail-artist-row').innerHTML =
        '<div class="detail-avatar">' + avH + '</div>' +
        '<a class="detail-artist-name" href="' + esc(c._artistHref) + '">' + esc(c._artistName) + '</a>' +
        tag;

      // Description & inspiration
      document.getElementById('detail-desc').textContent = c.description || '';
      var inspoEl = document.getElementById('detail-inspo');
      if (c.inspiration) {
        inspoEl.innerHTML = '<i class="ti ti-bulb" style="font-size:11px;"></i> ' + esc(c.inspiration);
        inspoEl.style.display = 'block';
      } else {
        inspoEl.style.display = 'none';
      }

      // Like button state
      updateLikeUI(collabId);

      // Comment input
      document.getElementById('detail-input-row').style.display = currentSession ? 'flex' : 'none';
      document.getElementById('detail-input').value = '';
      autoResizeTextarea(document.getElementById('detail-input'));

      document.getElementById('detail-backdrop').classList.add('show');
      document.body.style.overflow = 'hidden';

      // Trap focus on modal
      document.getElementById('detail-close').focus();

      loadDetailComments(collabId);
    }

    function updateLikeUI(collabId) {
      var c = allCollabs.find(function(x){ return x.id === collabId; });
      if (!c) return;
      var liked = !!myLikes[collabId];
      var btn = document.getElementById('modal-like-btn');
      var icon = document.getElementById('modal-like-icon');
      var label = document.getElementById('modal-like-label');
      var count = document.getElementById('modal-like-count');
      if (!btn) return;
      btn.classList.toggle('liked', liked);
      icon.className = 'ti ' + (liked ? 'ti-hearts' : 'ti-heart');
      label.textContent = liked ? 'Liked' : 'Like';
      var n = c.likes_count || 0;
      count.textContent = n > 0 ? (n + ' ' + (n === 1 ? 'like' : 'likes')) : '';
    }

    async function toggleLike() {
      if (!currentSession) {
        window.location.href = 'auth.html';
        return;
      }
      if (!activeId) return;
      var c = allCollabs.find(function(x){ return x.id === activeId; });
      if (!c) return;

      var wasLiked = !!myLikes[activeId];

      // Optimistic update
      if (wasLiked) {
        delete myLikes[activeId];
        c.likes_count = Math.max((c.likes_count || 1) - 1, 0);
      } else {
        myLikes[activeId] = true;
        c.likes_count = (c.likes_count || 0) + 1;
      }
      updateLikeUI(activeId);

      // Heart pop animation
      var icon = document.getElementById('modal-like-icon');
      if (icon) { icon.classList.remove('heart-pop'); void icon.offsetWidth; icon.classList.add('heart-pop'); }

      // Persist.
      // supabase-js RESOLVES with {error} rather than throwing, so the old
      // try/catch revert was dead code and a failed like silently stayed lit.
      // A .delete() matching zero rows also resolves successfully, so the unlike
      // path needs .select() and must treat [] as failure.
      var failed = false;
      try {
        if (wasLiked) {
          var dRes = await db.from('story_collab_likes')
            .delete()
            .eq('collab_id', activeId)
            .eq('user_id', currentSession.user.id)
            .select('collab_id');
          failed = !!dRes.error || !dRes.data || !dRes.data.length;
        } else {
          var iRes = await db.from('story_collab_likes')
            .insert({ collab_id: activeId, user_id: currentSession.user.id })
            .select('collab_id');
          failed = !!iRes.error || !iRes.data || !iRes.data.length;
        }
      } catch(e) {
        failed = true;
      }

      if (failed) {
        // Revert the optimistic update — the server did not record this.
        if (wasLiked) {
          myLikes[activeId] = true;
          c.likes_count = (c.likes_count || 0) + 1;
        } else {
          delete myLikes[activeId];
          c.likes_count = Math.max((c.likes_count || 1) - 1, 0);
        }
        updateLikeUI(activeId);
      }

      // likes_count is maintained by trg_sync_collab_likes, so re-read the
      // authoritative value instead of trusting the optimistic arithmetic.
      var fresh = await db.from('story_collabs').select('likes_count').eq('id', activeId).maybeSingle();
      if (!fresh.error && fresh.data) {
        c.likes_count = fresh.data.likes_count || 0;
        updateLikeUI(activeId);
      }

      // Re-render card in grid to reflect updated count/state
      renderGrid();
    }

    function closeDetail() {
      document.getElementById('detail-backdrop').classList.remove('show');
      document.body.style.overflow = '';
      activeId = null;
      // Reset zoom
      document.getElementById('detail-img-col').classList.remove('zoomed');
    }

    /* ── COMMENTS ── */
    async function loadDetailComments(collabId) {
      var el = document.getElementById('detail-comments');
      el.innerHTML = '<div style="font-size:12px;color:var(--text3);text-align:center;padding:8px;"><i class="ti ti-loader" style="animation:spin 1s linear infinite;"></i></div>';

      var cRes = await db.from('collab_comments')
        .select('id,content,created_at,user_id')
        .eq('collab_id', collabId)
        .is('parent_id', null)
        .order('created_at', {ascending: true});
      // An error here is NOT an empty thread. `cRes.data || []` used to render
      // "No comments yet — be the first!" on a failed fetch.
      if (cRes.error) {
        el.innerHTML = '<div style="font-size:12px;color:var(--text3);text-align:center;padding:12px;">Could not load comments — please try again.</div>';
        return;
      }
      var comments = cRes.data || [];

      // Drop comments from users either side of a block, matching artwork.html.
      if (window.dsBlock) {
        comments = comments.filter(function(cm){ return !dsBlock.either(cm.user_id); });
      }

      if (!comments.length) {
        el.innerHTML = '<div style="font-size:12px;color:var(--text3);text-align:center;padding:12px;">No comments yet — be the first!</div>';
        return;
      }

      var uIds = [...new Set(comments.map(function(c){ return c.user_id; }))];
      var pMap = {};
      if (uIds.length) {
        var pRes = await db.from('profiles').select('id,username,display_name,avatar_url').in('id', uIds);
        (pRes.data || []).forEach(function(p){ pMap[p.id] = p; });
      }

      el.innerHTML = '';
      comments.forEach(function(cm) {
        var p = pMap[cm.user_id] || {};
        var n = p.display_name || p.username || 'User';
        var avH = avatarHtml(p, 20);
        var card = document.createElement('div');
        card.className = 'dc-card';
        card.innerHTML =
          '<div class="dc-header">' +
            '<div class="dc-avatar">' + avH + '</div>' +
            '<span class="dc-name">' + esc(n) + '</span>' +
            '<span class="dc-time">' + timeAgo(cm.created_at) + '</span>' +
          '</div>' +
          '<div class="dc-text">' + dsSpoiler.render(esc(cm.content)) + '</div>';
        el.appendChild(card);
      });
      el.scrollTop = el.scrollHeight;
    }

    async function postDetailComment() {
      if (!currentSession || !activeId) return;
      // Ensure the collab is still known/approved before posting
      if (!allCollabs.find(function(x){ return x.id === activeId; })) return;
      var input = document.getElementById('detail-input');
      var text = input.value.trim();
      if (!text) return;

      var btn = document.getElementById('detail-post-btn');
      var errEl = document.getElementById('comment-error');
      btn.disabled = true;
      if (errEl) errEl.remove();

      var res = await db.from('collab_comments').insert({
        collab_id: activeId,
        user_id: currentSession.user.id,
        content: text
      });

      btn.disabled = false;

      if (res.error) {
        var err = document.createElement('div');
        err.id = 'comment-error';
        err.className = 'comment-error';
        err.textContent = 'Could not post comment — please try again.';
        document.getElementById('detail-input-row').before(err);
        return;
      }

      input.value = '';
      autoResizeTextarea(input);
      loadDetailComments(activeId);
    }

    /* ── TEXTAREA AUTO-RESIZE ── */
    function autoResizeTextarea(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 100) + 'px';
    }

    /* ── IMAGE ZOOM ── */
    function setupZoom() {
      var col = document.getElementById('detail-img-col');
      var img = document.getElementById('detail-img');
      var overlay = document.getElementById('zoom-overlay');
      var zoomImg = document.getElementById('zoom-img');

      col.addEventListener('click', function(e) {
        if (!img.src || img.src === window.location.href) return; // no image — skip
        // Open fullscreen zoom overlay on click
        zoomImg.src = img.src;
        overlay.classList.add('show');
        // body.overflow already 'hidden' from modal open — no change needed
      });

      overlay.addEventListener('click', function(e) {
        if (e.target === overlay || e.target === document.getElementById('zoom-close')) {
          overlay.classList.remove('show');
          // body.overflow stays 'hidden' — detail modal is still open
        }
      });
      document.getElementById('zoom-close').addEventListener('click', function() {
        overlay.classList.remove('show');
      });
    }

    /* ── EVENT LISTENERS ── */
    document.getElementById('detail-close').addEventListener('click', closeDetail);

    document.getElementById('detail-backdrop').addEventListener('click', function(e) {
      if (e.target === this) closeDetail();
    });

    document.getElementById('detail-post-btn').addEventListener('click', postDetailComment);

    document.getElementById('detail-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); postDetailComment(); }
    });
    document.getElementById('detail-input').addEventListener('input', function() {
      autoResizeTextarea(this);
    });

    // Escape key: close zoom first, then modal
    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Escape') return;
      var zoom = document.getElementById('zoom-overlay');
      if (zoom.classList.contains('show')) {
        zoom.classList.remove('show');
        return;
      }
      if (document.getElementById('detail-backdrop').classList.contains('show')) closeDetail();
    });

    // Focus trap: keep Tab inside modal when open
    document.getElementById('detail-modal').addEventListener('keydown', function(e) {
      if (e.key !== 'Tab') return;
      var focusable = this.querySelectorAll('a,button,textarea,[tabindex]:not([tabindex="-1"])');
      var first = focusable[0], last = focusable[focusable.length - 1];
      if (e.shiftKey ? document.activeElement === first : document.activeElement === last) {
        e.preventDefault();
        (e.shiftKey ? last : first).focus();
      }
    });

    setupZoom();
  </script>
<script src="footer.js"></script>
<script src="spoilerUtils.js"></script>
