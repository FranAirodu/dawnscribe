<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var t=localStorage.getItem('ds_theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fan Art Gallery — DawnScribe</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="spoilerUtils.js"></script>
  <style>
    :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--bg4:#22223a;--accent:#2dd4bf;--accent2:#0d9488;--text:#f1f0ff;--text2:#9b9bc0;--text3:#5a5a80;--border:rgba(255,255,255,0.07);--red:#f87171;--gold:#f59e0b;}
    html[data-theme="light"]{--bg:#f4f4f8;--bg2:#ffffff;--bg3:#ebebf2;--bg4:#d8d8e8;--accent:#0d9488;--accent2:#0f766e;--text:#0a0a0f;--text2:#3a3a5c;--text3:#7a7a9a;--border:rgba(0,0,0,0.08);}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh;}
    nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .logo{font-family:'Cinzel',serif;font-size:22px;color:var(--accent);text-decoration:none;letter-spacing:1px;}
    .logo span{color:var(--text);}
    .back-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 16px;color:var(--text2);font-size:13px;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;text-decoration:none;}
    .back-btn:hover{border-color:var(--accent);color:var(--accent);}
    .hero{padding:48px 32px 32px;max-width:1100px;margin:0 auto;}
    .hero-eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
    .hero-title{font-family:'Cinzel',serif;font-size:32px;font-weight:700;color:var(--text);margin-bottom:6px;}
    .hero-title span{color:var(--gold);}
    .hero-sub{font-size:14px;color:var(--text3);}
    .gallery-wrap{max-width:1100px;margin:0 auto;padding:0 32px 80px;}
    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
    .gallery-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform 0.2s,border-color 0.2s;}
    .gallery-card:hover{transform:translateY(-3px);border-color:rgba(245,158,11,0.35);}
    .gallery-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;}
    .gallery-card-body{padding:10px 12px;}
    .gallery-card-artist{display:flex;align-items:center;gap:7px;margin-bottom:6px;}
    .gallery-card-avatar{width:22px;height:22px;border-radius:50%;background:var(--bg4);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--text2);}
    .gallery-card-avatar img{width:100%;height:100%;object-fit:cover;}
    .gallery-card-name{font-size:11px;font-weight:700;color:var(--accent);text-decoration:none;}
    .gallery-card-desc{font-size:11px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .gallery-card-time{font-size:10px;color:var(--text3);margin-top:5px;}
    .detail-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity 0.2s;}
    .detail-backdrop.show{opacity:1;pointer-events:all;}
    .detail-modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:800px;max-height:90vh;display:flex;overflow:hidden;transform:translateY(10px);transition:transform 0.2s;}
    .detail-backdrop.show .detail-modal{transform:translateY(0);}
    .detail-img-col{flex:0 0 320px;background:#000;}
    .detail-img-col img{width:100%;height:100%;object-fit:contain;display:block;}
    .detail-right{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .detail-top{padding:16px;border-bottom:1px solid var(--border);}
    .detail-close{float:right;background:transparent;border:none;color:var(--text3);font-size:20px;cursor:pointer;line-height:1;}
    .detail-artist-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
    .detail-avatar{width:30px;height:30px;border-radius:50%;background:var(--bg4);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text2);}
    .detail-avatar img{width:100%;height:100%;object-fit:cover;}
    .detail-artist-name{font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;}
    .collab-tag{font-size:10px;padding:1px 7px;border-radius:4px;font-weight:700;margin-left:4px;}
    .collab-tag-author{background:rgba(245,158,11,0.15);color:#f59e0b;border:1px solid rgba(245,158,11,0.3);}
    .collab-tag-artist{background:rgba(167,139,250,0.15);color:#a78bfa;border:1px solid rgba(167,139,250,0.3);}
    .detail-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:6px;}
    .detail-inspo{font-size:12px;color:var(--text3);font-style:italic;line-height:1.5;}
    .detail-comments{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px;}
    .dc-card{background:var(--bg3);border-radius:8px;padding:10px 12px;}
    .dc-header{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap;}
    .dc-avatar{width:20px;height:20px;border-radius:50%;background:var(--bg4);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--text2);}
    .dc-avatar img{width:100%;height:100%;object-fit:cover;}
    .dc-name{font-size:12px;font-weight:700;color:var(--text);}
    .dc-time{font-size:10px;color:var(--text3);margin-left:auto;}
    .dc-text{font-size:12px;color:var(--text2);line-height:1.55;}
    .detail-input-row{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;}
    .detail-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:12px;font-family:'Lato',sans-serif;outline:none;resize:none;transition:border-color 0.2s;}
    .detail-input:focus{border-color:var(--accent);}
    .detail-post-btn{background:var(--accent2);border:none;border-radius:8px;padding:8px 14px;color:#fff;font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;}
    .empty-state{text-align:center;padding:64px 24px;color:var(--text3);}
    .empty-state i{font-size:40px;display:block;margin-bottom:12px;opacity:0.3;}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @media(max-width:640px){.detail-modal{flex-direction:column;}.detail-img-col{flex:0 0 200px;}.gallery-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}}
  </style>
</head>
<body>
  <nav>
    <a class="logo" href="index.html">Dawn<span>Scribe</span></a>
    <a class="back-btn" id="back-to-story" href="index.html"><i class="ti ti-arrow-left"></i> Back to story</a>
  </nav>
  <div class="hero">
    <div class="hero-eyebrow"><i class="ti ti-palette"></i> Fan Art &amp; Collaborations</div>
    <div class="hero-title" id="page-title">Fan Art Gallery</div>
    <div class="hero-sub">All fan art submitted for this novel.</div>
  </div>
  <div class="gallery-wrap">
    <div class="gallery-grid" id="gallery-grid">
      <div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--text3);"><i class="ti ti-loader" style="font-size:28px;animation:spin 1s linear infinite;display:block;margin-bottom:8px;"></i>Loading…</div>
    </div>
  </div>
  <div class="detail-backdrop" id="detail-backdrop">
    <div class="detail-modal">
      <div class="detail-img-col"><img id="detail-img" src="" alt=""/></div>
      <div class="detail-right">
        <div class="detail-top">
          <button class="detail-close" id="detail-close"><i class="ti ti-x"></i></button>
          <div class="detail-artist-row" id="detail-artist-row"></div>
          <div class="detail-desc" id="detail-desc"></div>
          <div class="detail-inspo" id="detail-inspo" style="display:none;"></div>
        </div>
        <div class="detail-comments" id="detail-comments"></div>
        <div class="detail-input-row" id="detail-input-row" style="display:none;">
          <textarea class="detail-input" id="detail-input" placeholder="Leave a comment…" rows="1" maxlength="500"></textarea>
          <button type="button" class="spoiler-btn" onclick="dsSpoiler.wrapSelection(document.getElementById('detail-input'))"><i class="ti ti-eye-off"></i></button>
          <button class="detail-post-btn" id="detail-post-btn"><i class="ti ti-send"></i></button>
        </div>
      </div>
    </div>
  </div>
  <script>
    var SUPABASE_URL='https://cajjyyskpmjnpcxcfeuk.supabase.co';
    var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhamp5eXNrcG1qbnBjeGNmZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDUyMDUsImV4cCI6MjA5NTMyMTIwNX0.s93zWwRYymTsoW5BfUhUDli13ArCtk4S-tegAs54A2c';
    var db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    var workId=new URLSearchParams(window.location.search).get('work');
    var currentSession=null; var workData=null; var allCollabs=[]; var activeId=null;
    function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    function timeAgo(s){var d=Math.floor((Date.now()-new Date(s))/1000);if(d<60)return 'just now';if(d<3600)return Math.floor(d/60)+'m ago';if(d<86400)return Math.floor(d/3600)+'h ago';if(d<2592000)return Math.floor(d/86400)+'d ago';return new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
    (async function init(){
      var sr=await db.auth.getSession(); currentSession=sr.data&&sr.data.session?sr.data.session:null;
      if(!workId){document.getElementById('gallery-grid').innerHTML='<div class="empty-state"><i class="ti ti-alert-circle"></i>No story specified.</div>';return;}
      var {data:w}=await db.from('works').select('id,title,author_id').eq('id',workId).maybeSingle();
      if(w){workData=w;document.getElementById('page-title').innerHTML='Fan Art — <span>'+esc(w.title)+'</span>';document.getElementById('back-to-story').href='story.html?id='+workId;}
      var {data:collabs}=await db.from('story_collabs').select('id,image_url,artist_id,created_at,description,inspiration').eq('work_id',workId).eq('status','approved').order('created_at',{ascending:false});
      allCollabs=collabs||[];
      if(!allCollabs.length){document.getElementById('gallery-grid').innerHTML='<div class="empty-state"><i class="ti ti-photo-off"></i>No fan art yet.</div>';return;}
      var aIds=[...new Set(allCollabs.map(function(c){return c.artist_id;}))]; var pMap={};
      if(aIds.length){var {data:ps}=await db.from('profiles').select('id,username,display_name,avatar_url').in('id',aIds);(ps||[]).forEach(function(p){pMap[p.id]=p;});}
      var grid=document.getElementById('gallery-grid'); grid.innerHTML='';
      allCollabs.forEach(function(c){
        var a=pMap[c.artist_id]||{}; var an=a.display_name||a.username||'Artist'; var ah=a.username?'profile.html?user='+encodeURIComponent(a.username):'#';
        var avH=a.avatar_url?'<img src="'+esc(a.avatar_url)+'" alt=""/>':esc(an.charAt(0).toUpperCase());
        var card=document.createElement('div'); card.className='gallery-card';
        card.innerHTML='<img src="'+esc(c.image_url)+'" alt="Fan art by '+esc(an)+'"/><div class="gallery-card-body"><div class="gallery-card-artist"><div class="gallery-card-avatar">'+avH+'</div><a class="gallery-card-name" href="'+esc(ah)+'" onclick="event.stopPropagation()">'+esc(an)+'</a></div>'+(c.description?'<div class="gallery-card-desc">'+esc(c.description)+'</div>':'')+'<div class="gallery-card-time">'+timeAgo(c.created_at)+'</div></div>';
        card.addEventListener('click',function(){openDetail(c.id);}); grid.appendChild(card);
      });
    })();
    async function openDetail(collabId){
      var c=allCollabs.find(function(x){return x.id===collabId;}); if(!c) return; activeId=collabId;
      document.getElementById('detail-img').src=c.image_url;
      var {data:a}=await db.from('profiles').select('id,username,display_name,avatar_url').eq('id',c.artist_id).maybeSingle(); a=a||{};
      var an=a.display_name||a.username||'Artist'; var ah=a.username?'profile.html?user='+encodeURIComponent(a.username):'#';
      var avH=a.avatar_url?'<img src="'+esc(a.avatar_url)+'" alt=""/>':esc(an.charAt(0).toUpperCase());
      var tag=workData&&c.artist_id===workData.author_id?'<span class="collab-tag collab-tag-author">Author</span>':'<span class="collab-tag collab-tag-artist">Artist</span>';
      document.getElementById('detail-artist-row').innerHTML='<div class="detail-avatar">'+avH+'</div><a class="detail-artist-name" href="'+esc(ah)+'">'+esc(an)+'</a>'+tag;
      document.getElementById('detail-desc').textContent=c.description||'';
      var ie=document.getElementById('detail-inspo'); if(c.inspiration){ie.innerHTML='<i class="ti ti-bulb" style="font-size:11px;"></i> '+esc(c.inspiration);ie.style.display='block';}else{ie.style.display='none';}
      document.getElementById('detail-input-row').style.display=currentSession?'flex':'none';
      document.getElementById('detail-input').value='';
      document.getElementById('detail-backdrop').classList.add('show');
      loadDetailComments(collabId);
    }
    function closeDetail(){document.getElementById('detail-backdrop').classList.remove('show');activeId=null;}
    async function loadDetailComments(collabId){
      var el=document.getElementById('detail-comments');
      el.innerHTML='<div style="font-size:12px;color:var(--text3);text-align:center;padding:8px;"><i class="ti ti-loader" style="animation:spin 1s linear infinite;"></i></div>';
      var {data:comments}=await db.from('collab_comments').select('id,content,created_at,user_id').eq('collab_id',collabId).order('created_at',{ascending:true});
      comments=comments||[];
      if(!comments.length){el.innerHTML='<div style="font-size:12px;color:var(--text3);text-align:center;padding:12px;">No comments yet.</div>';return;}
      var uIds=[...new Set(comments.map(function(c){return c.user_id;}))]; var pMap={};
      if(uIds.length){var {data:ps}=await db.from('profiles').select('id,username,display_name,avatar_url').in('id',uIds);(ps||[]).forEach(function(p){pMap[p.id]=p;});}
      var col=allCollabs.find(function(x){return x.id===collabId;}); var artId=col?col.artist_id:null; var authId=workData?workData.author_id:null;
      el.innerHTML='';
      comments.forEach(function(cm){
        var p=pMap[cm.user_id]||{}; var n=p.display_name||p.username||'User';
        var avH=p.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt=""/>':esc(n.charAt(0).toUpperCase());
        var tag=cm.user_id===authId?'<span class="collab-tag collab-tag-author">Author</span>':(cm.user_id===artId?'<span class="collab-tag collab-tag-artist">Artist</span>':'');
        var card=document.createElement('div'); card.className='dc-card';
        card.innerHTML='<div class="dc-header"><div class="dc-avatar">'+avH+'</div><span class="dc-name">'+esc(n)+'</span>'+tag+'<span class="dc-time">'+timeAgo(cm.created_at)+'</span></div><div class="dc-text">'+dsSpoiler.render(esc(cm.content))+'</div>';
        el.appendChild(card);
      });
      el.scrollTop=el.scrollHeight;
    }
    async function postDetailComment(){
      if(!currentSession||!activeId) return;
      var input=document.getElementById('detail-input'); var text=input.value.trim(); if(!text) return;
      var btn=document.getElementById('detail-post-btn'); btn.disabled=true;
      var {error}=await db.from('collab_comments').insert({collab_id:activeId,user_id:currentSession.user.id,content:text});
      btn.disabled=false; if(error) return; input.value=''; loadDetailComments(activeId);
    }
    document.addEventListener('DOMContentLoaded',function(){
      document.getElementById('detail-close').addEventListener('click',closeDetail);
      document.getElementById('detail-backdrop').addEventListener('click',function(e){if(e.target===this)closeDetail();});
      document.getElementById('detail-post-btn').addEventListener('click',postDetailComment);
      document.getElementById('detail-input').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();postDetailComment();}});
    });
  </script>
</body>
</html>
