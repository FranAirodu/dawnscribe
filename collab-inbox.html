<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var t=localStorage.getItem('ds_theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DawnScribe — Collab Requests</title>
  <meta name="robots" content="noindex,nofollow" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css"/>
  <style>
    :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--bg4:#22223a;--accent:#2dd4bf;--accent2:#0d9488;--text:#f1f0ff;--text2:#9b9bc0;--text3:#5a5a80;--border:rgba(255,255,255,0.07);--red:#f87171;--green:#34d399;}
    html[data-theme="light"]{--bg:#f4f4f8;--bg2:#ffffff;--bg3:#ebebf2;--bg4:#d8d8e8;--accent:#0d9488;--accent2:#0f766e;--text:#0a0a0f;--text2:#3a3a5c;--text3:#7a7a9a;--border:rgba(0,0,0,0.08);--red:#dc2626;--green:#059669;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    @keyframes spin{to{transform:rotate(360deg);}}

    nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .logo{font-family:'Cinzel',serif;font-size:22px;color:var(--accent);text-decoration:none;}
    .logo span{color:var(--text);}
    .back-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 16px;color:var(--text2);font-size:13px;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;text-decoration:none;}
    .back-btn:hover{border-color:var(--accent);color:var(--accent);}

    .page{max-width:760px;margin:0 auto;padding:40px 24px 80px;flex:1;}

    .page-header{margin-bottom:32px;}
    .page-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#f59e0b;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
    .page-title{font-family:'Cinzel',serif;font-size:28px;font-weight:700;color:var(--text);margin-bottom:6px;}
    .page-sub{font-size:14px;color:var(--text3);line-height:1.6;}

    /* SECTION */
    .section{margin-bottom:36px;}
    .section-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
    .section-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
    .section-icon.gold{background:rgba(245,158,11,0.12);color:#f59e0b;}
    .section-icon.teal{background:rgba(45,212,191,0.1);color:var(--accent);}
    .section-title{font-family:'Cinzel',serif;font-size:16px;font-weight:700;color:var(--text);}
    .section-count{font-size:11px;font-weight:700;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);border-radius:8px;padding:2px 8px;color:#f59e0b;margin-left:auto;}
    .section-count.zero{background:var(--bg3);border-color:var(--border);color:var(--text3);}

    /* COLLAPSIBLE reviewed sections */
    .section-toggle{background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:12px;font-family:'Lato',sans-serif;display:flex;align-items:center;gap:5px;padding:0;margin-left:auto;transition:color 0.2s;}
    .section-toggle:hover{color:var(--accent);}
    .section-toggle i{transition:transform 0.25s;}
    .section-toggle.collapsed i.ti-chevron-up{transform:rotate(180deg);}
    .section-body{overflow:hidden;transition:max-height 0.3s ease,opacity 0.3s ease;max-height:9999px;opacity:1;}
    .section-body.collapsed{max-height:0;opacity:0;}

    /* ROW */
    .collab-row{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:10px;transition:border-color 0.2s;}
    .collab-row:last-child{margin-bottom:0;}
    .collab-row.pending{border-color:rgba(245,158,11,0.2);}
    .collab-row.stale{border-color:rgba(245,158,11,0.45);background:rgba(245,158,11,0.03);}
    .collab-cover{width:42px;height:60px;border-radius:7px;flex-shrink:0;background:var(--bg4);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:18px;overflow:hidden;}
    .collab-cover img{width:100%;height:100%;object-fit:cover;}
    .collab-info{flex:1;min-width:0;}
    .collab-title{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
    .collab-meta{font-size:12px;color:var(--text3);line-height:1.5;}
    .collab-meta em{color:var(--text2);font-style:normal;}
    .collab-actions{display:flex;gap:8px;flex-shrink:0;align-items:center;flex-wrap:wrap;justify-content:flex-end;}

    /* stale nudge chip */
    .stale-chip{font-size:10px;font-weight:700;color:#f59e0b;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);border-radius:6px;padding:2px 7px;white-space:nowrap;}

    /* BUTTONS */
    .btn-review{background:#f59e0b;border:none;border-radius:8px;padding:7px 16px;color:#0a0a0f;font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:5px;transition:all 0.2s;white-space:nowrap;}
    .btn-review:hover{background:#fbbf24;}
    .btn-view{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 14px;color:var(--text2);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;text-decoration:none;display:flex;align-items:center;gap:5px;transition:all 0.2s;white-space:nowrap;}
    .btn-view:hover{border-color:var(--accent);color:var(--accent);}
    .btn-delete{background:transparent;border:1px solid rgba(248,113,113,0.25);border-radius:8px;padding:7px 12px;color:var(--red);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all 0.2s;white-space:nowrap;}
    .btn-delete:hover{background:rgba(248,113,113,0.08);border-color:var(--red);}
    .badge-approved{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:8px;padding:3px 10px;background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.3);color:var(--green);flex-shrink:0;}
    .badge-rejected{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:8px;padding:3px 10px;background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.25);color:var(--red);flex-shrink:0;}

    /* EMPTY */
    .empty{text-align:center;padding:36px 24px;color:var(--text3);background:var(--bg2);border:1px solid var(--border);border-radius:12px;}
    .empty i{font-size:32px;display:block;margin-bottom:10px;}
    .empty p{font-size:13px;line-height:1.6;}
    .empty-full{text-align:center;padding:80px 24px;color:var(--text3);}
    .empty-full i{font-size:40px;display:block;margin-bottom:16px;}
    .empty-full h2{font-family:'Cinzel',serif;font-size:20px;color:var(--text);margin-bottom:8px;}
    .empty-full p{font-size:14px;line-height:1.6;}
    .empty-full a{color:var(--accent);text-decoration:none;font-weight:700;}

    .loading{text-align:center;padding:32px;color:var(--text3);font-size:13px;}
    .not-logged{text-align:center;padding:80px 24px;color:var(--text3);}
    .not-logged i{font-size:40px;display:block;margin-bottom:16px;}
    .not-logged h2{font-family:'Cinzel',serif;font-size:20px;color:var(--text);margin-bottom:8px;}
    .not-logged a{color:var(--accent);text-decoration:none;font-weight:700;}
  </style>
</head>

<nav style="display:flex;align-items:center;justify-content:space-between;gap:12px;">

<div class="page">

    <div class="page-label"><i class="ti ti-inbox"></i> Inbox</div>

  </div>

<script>
  const SUPA_URL = 'https://cajjyyskpmjnpcxcfeuk.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhamp5eXNrcG1qbnBjeGNmZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDUyMDUsImV4cCI6MjA5NTMyMTIwNX0.s93zWwRYymTsoW5BfUhUDli13ArCtk4S-tegAs54A2c';
  const db = window.supabase.createClient(SUPA_URL, SUPA_KEY);

  function showToast(msg,icon){
    var t=document.getElementById('ds-toast');
    if(!t){t=document.createElement('div');t.id='ds-toast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg2);border:1px solid rgba(45,212,191,0.3);border-radius:10px;padding:10px 20px;color:var(--text);font-size:13px;font-weight:700;font-family:Lato,sans-serif;display:flex;align-items:center;gap:8px;opacity:0;transition:all 0.3s;z-index:500;pointer-events:none;';document.body.appendChild(t);}
    t.innerHTML='<i class="ti '+(icon||'ti-check')+'"></i> '+esc(msg||'Done!');
    t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';
    setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(-50%) translateY(20px)';},3000);
  }
  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  // Build a JS string literal safe for an HTML on* attribute. JSON.stringify does
  // the JS-level escaping; the entity encoding does the HTML-level. Without the
  // second layer the raw double quotes terminate the attribute early — which
  // silently broke every handler built this way.
  function attrJson(v){
    return JSON.stringify(v === undefined ? null : v)
      .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function safeUrl(u){
    u = String(u||'').trim();
    return /^(https?:\/\/|\/)/i.test(u) ? u : '';
  }


  // Returns a human-friendly relative time string
  function timeAgo(isoStr){
    if(!isoStr) return '';
    var diff = Math.floor((Date.now() - new Date(isoStr).getTime()) / 1000);
    if(diff < 60) return 'just now';
    if(diff < 3600) return Math.floor(diff/60) + 'm ago';
    if(diff < 86400) return Math.floor(diff/3600) + 'h ago';
    var d = Math.floor(diff/86400);
    return d === 1 ? 'yesterday' : d + ' days ago';
  }

  // Returns true if submission is older than 7 days
  function isStale(isoStr){
    if(!isoStr) return false;
    return (Date.now() - new Date(isoStr).getTime()) > 7 * 86400 * 1000;
  }

  // BUG FIX: table mapping corrected
  // artwork_collabs = story submissions on your artwork (author_id)
  // story_collabs   = fan artwork on your novels (artist_id)
  async function deleteInboxDeclined(collabId, tableKey, rowEl){
    if(!confirm('Remove this declined submission from your inbox?')) return;
    // tableKey 'story' = artwork_collabs row; tableKey 'fanart' = story_collabs row
    var tbl = tableKey === 'story' ? 'artwork_collabs' : (tableKey === 'landscape' ? 'story_landscapes' : 'story_collabs');
    // A .delete() matching no rows resolves SUCCESSFULLY with an empty array, so
    // the row used to fade out and then reappear on reload. .select() + treating
    // [] as failure makes that honest. (artwork_collabs previously had no DELETE
    // policy covering the artwork owner clearing a declined row at all — fixed in
    // migration artwork_collabs_recipient_can_clear_declined.)
    var delRes = await db.from(tbl).delete().eq('id', collabId).select('id');
    if(delRes.error){ showToast('Failed to delete: ' + delRes.error.message, 'ti-x'); return; }
    if(!delRes.data || !delRes.data.length){
      showToast('Could not remove that submission — please reload and try again.', 'ti-x');
      return;
    }
    if(rowEl){ rowEl.style.transition='opacity 0.3s,transform 0.3s'; rowEl.style.opacity='0'; rowEl.style.transform='translateX(-12px)'; setTimeout(function(){ rowEl.remove(); },300); }
  }

  // Accept or decline a Collab Scroll invite. All authority lives in the
  // respond_scroll_collab RPC (identity-guarded, and the only writer of
  // collab_novelist_accepted) — this just calls it and reports honestly.
  async function respondScrollCollab(scrollId, accept, btnEl){
    if(!accept && !confirm('Decline this Scroll collab? The artist can still sell it on its own.')) return;
    var row = btnEl ? btnEl.closest('.collab-row') : null;
    var btns = row ? row.querySelectorAll('button') : [];
    for(var i=0;i<btns.length;i++){ btns[i].disabled = true; }

    var res = await Promise.resolve(
      db.rpc('respond_scroll_collab', { p_scroll_id: scrollId, p_accept: !!accept })
    ).catch(function(e){ return { error: e }; });
    var err = res.error;
    if(!err && res.data && res.data.ok === false) err = { message: res.data.error || 'Not permitted' };
    if(err){
      showToast('Could not answer: ' + err.message, 'ti-x');
      for(var j=0;j<btns.length;j++){ btns[j].disabled = false; }
      return;
    }

    showToast(accept ? 'Scroll collab accepted \u2014 the artist can submit it now.' : 'Scroll collab declined.', accept ? 'ti-check' : 'ti-x');
    if(row){
      row.style.transition = 'opacity 0.3s,transform 0.3s';
      row.style.opacity = '0';
      row.style.transform = 'translateX(-12px)';
      setTimeout(function(){ row.remove(); }, 300);
    }
  }

  // Accept or decline a banner collab. All authority lives in the
  // respond_banner_collab RPC (identity-guarded, and the only writer of
  // novelist_approved) — this just calls it and reports honestly.
  async function respondBannerCollab(scrollId, accept, btnEl){
    if(!accept && !confirm('Decline this banner collab? The artist can still sell it on its own.')) return;
    var row = btnEl ? btnEl.closest('.collab-row') : null;
    var btns = row ? row.querySelectorAll('button') : [];
    for(var i=0;i<btns.length;i++){ btns[i].disabled = true; }

    var res = await db.rpc('respond_banner_collab', { p_scroll_id: scrollId, p_accept: !!accept });
    var err = res.error;
    if(!err && res.data && res.data.ok === false) err = { message: res.data.error || 'Not permitted' };
    if(err){
      showToast('Could not answer: ' + err.message, 'ti-x');
      for(var j=0;j<btns.length;j++){ btns[j].disabled = false; }
      return;
    }

    showToast(accept ? 'Banner collab accepted \u2014 the artist can submit it now.' : 'Banner collab declined.', accept ? 'ti-check' : 'ti-x');
    if(row){
      row.style.transition = 'opacity 0.3s,transform 0.3s';
      row.style.opacity = '0';
      row.style.transform = 'translateX(-12px)';
      setTimeout(function(){ row.remove(); }, 300);
    }
  }

  // Fan-art showcase collabs: an artist published a full artwork page and linked
  // it to one of your novels. It stays unpublished until you answer. collab_status
  // has no client write grant, so this must go through the RPC.
  async function respondShowcaseCollab(artworkId, accept, btnEl){
    if(!accept && !confirm('Decline this collab link? The artwork will be published on its own, without a link to your novel.')) return;
    var row = btnEl ? btnEl.closest('.collab-row') : null;
    var btns = row ? row.querySelectorAll('button') : [];
    for(var i=0;i<btns.length;i++){ btns[i].disabled = true; }

    var res = await db.rpc('respond_showcase_collab', { p_artwork_id: artworkId, p_accept: !!accept });
    var err = res.error;
    if(!err && res.data && res.data.ok === false) err = { message: res.data.error || 'Not permitted' };
    if(err){
      showToast('Could not answer: ' + err.message, 'ti-x');
      for(var j=0;j<btns.length;j++){ btns[j].disabled = false; }
      return;
    }

    showToast(accept ? 'Fan art approved \u2014 it is live now.' : 'Collab link declined.', accept ? 'ti-check' : 'ti-x');
    if(row){
      row.style.transition = 'opacity 0.3s,transform 0.3s';
      row.style.opacity = '0';
      row.style.transform = 'translateX(-12px)';
      setTimeout(function(){ row.remove(); }, 300);
    }
  }

  // Co-author invites: an author added you as a co-author of their work. The row
  // sits accepted=false until you answer, so no badge, credit or listing happens
  // before consent. `accepted` has no client write grant — only the RPC can set it.
  async function respondCoauthorInvite(workId, accept, btnEl){
    if(!accept && !confirm('Decline this co-author invite? Your name will be removed from the work entirely.')) return;
    var row = btnEl ? btnEl.closest('.collab-row') : null;
    var btns = row ? row.querySelectorAll('button') : [];
    for(var i=0;i<btns.length;i++){ btns[i].disabled = true; }

    var res = await db.rpc('respond_coauthor_invite', { p_work_id: workId, p_accept: !!accept });
    var err = res.error;
    if(!err && res.data && res.data.ok === false) err = { message: res.data.error || 'Not permitted' };
    if(err){
      showToast('Could not answer: ' + err.message, 'ti-x');
      for(var j=0;j<btns.length;j++){ btns[j].disabled = false; }
      return;
    }

    showToast(accept ? 'You are now credited as a co-author.' : 'Co-author invite declined.', accept ? 'ti-check' : 'ti-x');
    if(row){
      row.style.transition = 'opacity 0.3s,transform 0.3s';
      row.style.opacity = '0';
      row.style.transform = 'translateX(-12px)';
      setTimeout(function(){ row.remove(); }, 300);
    }
  }

  function makeToggle(bodyEl, label){
    var btn = document.createElement('button');
    btn.className = 'section-toggle';
    btn.innerHTML = label + ' <i class="ti ti-chevron-up"></i>';
    btn.onclick = function(){
      var collapsed = bodyEl.classList.toggle('collapsed');
      btn.classList.toggle('collapsed', collapsed);
    };
    return btn;
  }

  async function init(){
    var content = document.getElementById('content');

    var { data: { session } } = await db.auth.getSession();
    if(!session){
      content.innerHTML = '<div class="not-logged"><i class="ti ti-lock"></i><h2>Not logged in</h2><p><a href="auth.html">Log in</a> to view your collab requests.</p></div>';
      return;
    }
    var uid = session.user.id;
    // Block filtering here is client-side via dsBlock (not RLS), matching
    // artwork.html as the reference implementation.
    try { await dsBlock.load(uid); } catch(eB) {}
    try {

    // ── FIND USER'S ARTWORKS (receive story submissions)
    // These fetches discarded .error, so a failed request rendered the
    // "You haven't published any artworks or novels yet" empty state to authors who
    // in fact have works. supabase-js resolves with {error} instead of throwing, so
    // the page's existing catch/error state was unreachable — throwing wires it up.
    var artRes = await db.from('works')
      .select('id, title, cover_url')
      .eq('author_id', uid)
      .eq('type', 'artwork')
      .eq('is_published', true);
    if(artRes.error) throw artRes.error;
    var myArtworks = artRes.data;
    var myArtworkIds = (myArtworks||[]).map(function(a){ return a.id; });
    var artworkMap = {};
    (myArtworks||[]).forEach(function(a){ artworkMap[a.id] = a; });

    // ── FIND USER'S NOVELS (receive fan-art submissions)
    var novRes = await db.from('works')
      .select('id, title, cover_url')
      .eq('author_id', uid)
      .eq('type', 'novel')
      .eq('is_published', true);
    if(novRes.error) throw novRes.error;
    var myNovels = novRes.data;
    var myNovelIds = (myNovels||[]).map(function(n){ return n.id; });
    var novelMap = {};
    (myNovels||[]).forEach(function(n){ novelMap[n.id] = n; });

    // User has no published works at all — show friendly empty state
    if(!myArtworkIds.length && !myNovelIds.length){
      content.innerHTML =
        '<div class="empty-full"><i class="ti ti-inbox-off"></i>'
        + '<h2>Nothing here yet</h2>'
        + '<p>You haven\'t published any artworks or novels yet.<br>Once you do, collab submissions will appear here.</p>'
        + '<p style="margin-top:16px;"><a href="publish.html">Publish your first work →</a></p>'
        + '</div>';
      return;
    }

    // ── STORY SUBMISSIONS ON YOUR ARTWORK
    // Table: artwork_collabs — author submits their novel to be illustrated by your artwork
    var storyRequests = [];
    if(myArtworkIds.length){
      var srRes = await db.from('artwork_collabs')
        .select('id, artwork_id, work_id, author_id, status, novel_title, novel_cover_url, created_at')
        .in('artwork_id', myArtworkIds)
        .order('created_at', { ascending: false });
      if(srRes.error) throw srRes.error;
      storyRequests = (srRes.data || []).filter(function(r){ return !dsBlock.either(r.author_id); });
    }

    // Author profiles for story requests
    var authorIds = [...new Set(storyRequests.map(function(r){ return r.author_id; }).filter(Boolean))];
    var authorMap = {};
    if(authorIds.length){
      var { data: profs } = await db.from('profiles').select('id, username, display_name').in('id', authorIds);
      (profs||[]).forEach(function(p){ authorMap[p.id] = p; });
    }

    // ── FAN ARTWORK SUBMISSIONS ON YOUR NOVELS
    // Table: story_collabs — artist submits fan-art for your novel
    var artRequests = [];
    if(myNovelIds.length){
      var arRes = await db.from('story_collabs')
        .select('id, work_id, artist_id, image_url, description, status, created_at')
        .in('work_id', myNovelIds)
        .order('created_at', { ascending: false });
      if(arRes.error) throw arRes.error;
      artRequests = (arRes.data || []).filter(function(r){ return !dsBlock.either(r.artist_id); });
    }

    // ── LANDSCAPE SUBMISSIONS ON YOUR NOVELS
    // Table: story_landscapes — artist submits a scenic background for your novel
    var landscapeRequests = [];
    if(myNovelIds.length){
      var lrRes = await db.from('story_landscapes')
        .select('id, work_id, artist_id, image_url, description, status, created_at')
        .in('work_id', myNovelIds)
        .order('created_at', { ascending: false });
      if(lrRes.error) throw lrRes.error;
      landscapeRequests = (lrRes.data || []).filter(function(r){ return !dsBlock.either(r.artist_id); });

    // ── BANNER COLLAB OFFERS ON YOUR NOVELS
    // Table: scrolls (type='banner'). An artist offered a profile banner to be sold
    // alongside one of your novels. Visible to you via the
    // "invited novelist can view the collab scroll" policy; you answer through the
    // respond_banner_collab RPC, never by writing the row.
    var bannerOffers = [];
    if(myNovelIds.length){
      var boRes = await db.from('scrolls')
        .select('id, name, description, banner_url, banner_emoji, quill_price, novel_id, artist_id, collab_novelist_accepted, created_at')
        .eq('type', 'banner')
        .eq('collab_novelist_accepted', false)
        .in('novel_id', myNovelIds)
        .order('created_at', { ascending: false });
      if(boRes.error) throw boRes.error;
      bannerOffers = (boRes.data || []).filter(function(r){ return !dsBlock.either(r.artist_id); });

    // ── COLLAB SCROLL INVITES TO YOU
    // Table: scrolls (type='collab'). An artist invited you to co-create an
    // avatar Scroll. Unlike banner collabs this is not tied to one of your
    // novels, so it is keyed off collab_novelist_id. Visible via the
    // "invited novelist can view the collab scroll" policy; you answer through
    // the respond_scroll_collab RPC, never by writing the row.
    var scrollInvites = [];
    var siRes = await db.from('scrolls')
      .select('id, name, description, banner_url, banner_emoji, quill_price, artist_id, creator_id, collab_novelist_accepted, created_at')
      .eq('type', 'collab')
      .eq('collab_novelist_id', uid)
      .eq('collab_novelist_accepted', false)
      .order('created_at', { ascending: false });
    if(siRes.error) throw siRes.error;
    scrollInvites = (siRes.data || []).filter(function(r){ return !dsBlock.either(r.artist_id || r.creator_id); });

    // ── FAN-ART SHOWCASE COLLABS ON YOUR NOVELS
    // Table: works (type='artwork') linked via collab_work_id. An artist posted

    // is_novelist_of_pending_showcase(); you answer through the
    // respond_showcase_collab RPC, never by writing collab_status (no grant).
    var showcaseOffers = [];
    if(myNovelIds.length){
      var shRes = await db.from('works')
        .select('id, title, cover_url, author_id, collab_work_id, collab_character, collab_note, created_at')
        .eq('type', 'artwork')
        .eq('collab_status', 'pending')
        .in('collab_work_id', myNovelIds)
        .order('created_at', { ascending: false });
      if(shRes.error) throw shRes.error;
      showcaseOffers = (shRes.data || []).filter(function(r){ return !dsBlock.either(r.author_id); });
    }

    // ── CO-AUTHOR INVITES ADDRESSED TO YOU
    // Table: work_coauthors, accepted=false. Visible to you as a party to the
    // row; answered through respond_coauthor_invite.
    var coauthorInvites = [];
    var coRes = await db.from('work_coauthors')
      .select('work_id, invited_by, created_at')
      .eq('user_id', uid)
      .eq('accepted', false)
      .order('created_at', { ascending: false });
    if(coRes.error) throw coRes.error;
    coauthorInvites = (coRes.data || []).filter(function(r){ return !dsBlock.either(r.invited_by); });

    var coWorkMap = {};
    if(coauthorInvites.length){

        .in('id', coauthorInvites.map(function(r){ return r.work_id; }));
      (cwRes.data || []).forEach(function(w){ coWorkMap[w.id] = w; });
      // Drop invites whose work has since been deleted or is by a blocked author.
      coauthorInvites = coauthorInvites.filter(function(r){
        var w = coWorkMap[r.work_id];
        return w && !dsBlock.either(w.author_id);
      });
    }

    // Artist profiles for artwork requests
    var artistIds = [...new Set(artRequests.concat(landscapeRequests).concat(bannerOffers)
      .map(function(r){ return r.artist_id; })
      .concat(scrollInvites.map(function(r){ return r.artist_id || r.creator_id; }))
      .concat(showcaseOffers.map(function(r){ return r.author_id; }))
      .concat(coauthorInvites.map(function(r){ return r.invited_by; }))

    var artistMap = {};
    if(artistIds.length){

      (artists||[]).forEach(function(p){ artistMap[p.id] = p; });

    content.innerHTML = '';

    var pendingStories = storyRequests.filter(function(r){ return r.status === 'pending'; });

            + '</div>'

    // Section 3b — Reviewed fan artwork
    if(decidedArt.length){

      s3bheader.appendChild(s3bcount);
      s3bheader.appendChild(s3btoggle);
      s3b.appendChild(s3bheader);

      content.appendChild(s3b);
    }

    // ── SECTION 5: Banner collab offers on your novels
    if(myNovelIds.length){
      var s5 = document.createElement('div');
      s5.className = 'section';
      s5.innerHTML =
        '<div class="section-header">'
          + '<div class="section-icon teal"><i class="ti ti-photo"></i></div>'
          + '<div class="section-title">Banner Collabs \u2014 Awaiting You</div>'
          + '<div class="section-count' + (bannerOffers.length ? '' : ' zero') + '">' + bannerOffers.length + ' pending</div>'

      var s5body = document.createElement('div');

    } else {
      scrollInvites.forEach(function(row){

        var stale = isStale(row.created_at);

        var yours = pool - Math.round(pool * (5.0 / 8.0));
        div.innerHTML =
          '<div class="collab-cover">'
            + (row.banner_url ? '<img src="' + esc(row.banner_url) + '" alt=""/>' : '<i class="ti ti-sparkles"></i>')
          + '</div>'
          + '<div class="collab-info">'
            + '<div class="collab-title">' + esc(row.name || 'Untitled Scroll') + '</div>'

          + '</div>'

            + '<button class="btn-delete" onclick="respondScrollCollab(' + sid + ',false,this)"><i class="ti ti-x"></i> Decline</button>'
          + '</div>';
        s6body.appendChild(div);
      });

    s6.appendChild(s6body);
    content.appendChild(s6);

    // ── SECTION 7: Fan-art showcase collabs on your novels
    if(myNovelIds.length){

      s7.className = 'section';
      s7.innerHTML =
        '<div class="section-header">'
          + '<div class="section-icon gold"><i class="ti ti-photo"></i></div>'
          + '<div class="section-title">Fan Art \u2014 Awaiting You</div>'
          + '<div class="section-count' + (showcaseOffers.length ? '' : ' zero') + '">' + showcaseOffers.length + ' pending</div>'

      var s7body = document.createElement('div');
      if(!showcaseOffers.length){
        s7body.innerHTML = '<div class="empty"><i class="ti ti-photo"></i><p>No fan art awaiting your approval.</p></div>';
      } else {
        showcaseOffers.forEach(function(row){
          var novel = novelMap[row.collab_work_id] || {};
          var artist = artistMap[row.author_id] || {};
          var artistName = artist.display_name || artist.username || 'Artist';

          div.className = 'collab-row pending' + (stale ? ' stale' : '');
          var aid = attrJson(row.id);
          div.innerHTML =
            '<div class="collab-cover">'
              + (row.cover_url ? '<img src="' + esc(row.cover_url) + '" alt=""/>' : '<i class="ti ti-photo"></i>')
            + '</div>'
            + '<div class="collab-info">'

              + (row.collab_character ? '<div class="collab-meta" style="margin-top:3px;">Character: <em>' + esc(row.collab_character) + '</em></div>' : '')
              + (row.collab_note ? '<div class="collab-meta" style="margin-top:3px;">\u201c' + esc(row.collab_note) + '\u201d</div>' : '')
              + '<div class="collab-meta" style="margin-top:3px;">' + esc(timeAgo(row.created_at)) + (stale ? ' &nbsp;<span class="stale-chip">\u23f3 Awaiting your answer</span>' : '') + '</div>'
            + '</div>'
            + '<div class="collab-actions">'
              + '<a class="btn-view" href="artwork.html?id=' + esc(row.id) + '" title="View the artwork"><i class="ti ti-photo"></i> View</a>'
              + '<button class="btn-review" onclick="respondShowcaseCollab(' + aid + ',true,this)"><i class="ti ti-check"></i> Approve</button>'
              + '<button class="btn-delete" onclick="respondShowcaseCollab(' + aid + ',false,this)"><i class="ti ti-x"></i> Decline</button>'
            + '</div>';
          s7body.appendChild(div);
        });
      }
      s7.appendChild(s7body);
      content.appendChild(s7);
    }

    // ── SECTION 8: Co-author invites addressed to you
    var s8 = document.createElement('div');
    s8.className = 'section';
    s8.innerHTML =
      '<div class="section-header">'
        + '<div class="section-icon gold"><i class="ti ti-users"></i></div>'
        + '<div class="section-title">Co-Author Invites</div>'
        + '<div class="section-count' + (coauthorInvites.length ? '' : ' zero') + '">' + coauthorInvites.length + ' pending</div>'
      + '</div>';
    var s8body = document.createElement('div');
    if(!coauthorInvites.length){
      s8body.innerHTML = '<div class="empty"><i class="ti ti-users"></i><p>No co-author invites awaiting you.</p></div>';
    } else {
      coauthorInvites.forEach(function(row){
        var work = coWorkMap[row.work_id] || {};
        var inviter = artistMap[row.invited_by] || {};
        var inviterName = inviter.display_name || inviter.username || 'An author';
        var stale = isStale(row.created_at);
        var div = document.createElement('div');
        div.className = 'collab-row pending' + (stale ? ' stale' : '');
        var wid = attrJson(row.work_id);
        var viewHref = (work.type === 'artwork' ? 'artwork.html?id=' : 'story.html?id=') + esc(row.work_id);
        div.innerHTML =
          '<div class="collab-cover">'
            + (work.cover_url ? '<img src="' + esc(work.cover_url) + '" alt=""/>' : '<i class="ti ti-users"></i>')
          + '</div>'
          + '<div class="collab-info">'
            + '<div class="collab-title">' + esc(work.title || 'Untitled') + '</div>'
            + '<div class="collab-meta"><em>' + esc(inviterName) + '</em> invited you to co-author this work</div>'
            + '<div class="collab-meta" style="margin-top:3px;">Accepting credits you publicly and lists the work under your account.</div>'
            + '<div class="collab-meta" style="margin-top:3px;">' + esc(timeAgo(row.created_at)) + (stale ? ' &nbsp;<span class="stale-chip">\u23f3 Awaiting your answer</span>' : '') + '</div>'
          + '</div>'
          + '<div class="collab-actions">'
            + '<a class="btn-view" href="' + viewHref + '" title="View the work"><i class="ti ti-book"></i> View</a>'
            + '<button class="btn-review" onclick="respondCoauthorInvite(' + wid + ',true,this)"><i class="ti ti-check"></i> Accept</button>'
            + '<button class="btn-delete" onclick="respondCoauthorInvite(' + wid + ',false,this)"><i class="ti ti-x"></i> Decline</button>'
          + '</div>';
        s8body.appendChild(div);
      });
    }
    s8.appendChild(s8body);
    content.appendChild(s8);

    // ── SECTION 4: Book landscapes on your novels (pending/reviewed split)
    var validLand = landscapeRequests.filter(function(r){ return !!novelMap[r.work_id]; });
    var pendingLand = validLand.filter(function(r){ return r.status === 'pending'; });
    var decidedLand = validLand.filter(function(r){ return r.status !== 'pending'; });

    // Section 4a — Pending landscapes
    if(myNovelIds.length){
      var s4 = document.createElement('div');
      s4.className = 'section';
      s4.innerHTML =
        '<div class="section-header">'
          + '<div class="section-icon teal"><i class="ti ti-mountain"></i></div>'
          + '<div class="section-title">Book Landscapes — Pending</div>'
          + '<div class="section-count' + (pendingLand.length ? '' : ' zero') + '">' + pendingLand.length + ' pending</div>'
        + '</div>';
      var s4body = document.createElement('div');
      if(!pendingLand.length){
        s4body.innerHTML = '<div class="empty"><i class="ti ti-mountain"></i><p>No pending landscape submissions.</p></div>';
      } else {
        pendingLand.forEach(function(row){
          var novel = novelMap[row.work_id] || {};
          var artist = artistMap[row.artist_id] || {};
          var artistName = artist.display_name || artist.username || 'Artist';
          var stale = isStale(row.created_at);
          var div = document.createElement('div');
          div.className = 'collab-row pending' + (stale ? ' stale' : '');
          div.innerHTML =
            '<div class="collab-cover">'
              + (row.image_url ? '<img src="' + esc(row.image_url) + '" alt=""/>' : '<i class="ti ti-mountain"></i>')
            + '</div>'
            + '<div class="collab-info">'
              + '<div class="collab-title">' + esc(row.description || 'Book landscape') + '</div>'
              + '<div class="collab-meta">by <em>' + esc(artistName) + '</em> for your novel <em>' + esc(novel.title || 'Untitled') + '</em></div>'
              + '<div class="collab-meta" style="margin-top:3px;">' + esc(timeAgo(row.created_at)) + (stale ? ' &nbsp;<span class="stale-chip">\u23f3 Awaiting your review</span>' : '') + '</div>'
            + '</div>'
            + '<div class="collab-actions">'
              + '<a class="btn-view" href="story.html?id=' + esc(row.work_id) + '" title="View your novel"><i class="ti ti-book"></i> Novel</a>'
              + '<a class="btn-review" href="collab-review.html?landscape=' + esc(row.id) + '&novel=' + esc(row.work_id) + '"><i class="ti ti-eye"></i> Review</a>'
            + '</div>';
          s4body.appendChild(div);
        });
      }
      s4.appendChild(s4body);
      content.appendChild(s4);
    }

    // Section 4b — Reviewed landscapes
    if(decidedLand.length){
      var s4b = document.createElement('div');
      s4b.className = 'section';
      var s4bheader = document.createElement('div');
      s4bheader.className = 'section-header';
      s4bheader.innerHTML =
        '<div class="section-icon teal"><i class="ti ti-history"></i></div>'
        + '<div class="section-title">Book Landscapes — Reviewed</div>';
      var s4bbody = document.createElement('div');
      decidedLand.forEach(function(row){
        var novel = novelMap[row.work_id] || {};
        var artist = artistMap[row.artist_id] || {};
        var artistName = artist.display_name || artist.username || 'Artist';
        var div = document.createElement('div');
        div.className = 'collab-row';
        var deleteBtn = '';
        if(row.status !== 'approved'){
          var rowId = attrJson(row.id);
          deleteBtn = '<button class="btn-delete" onclick="deleteInboxDeclined(' + rowId + ',\'landscape\',this.closest(\'.collab-row\'))"><i class="ti ti-trash"></i> Delete</button>';
        }
        div.innerHTML =
          '<div class="collab-cover">'
            + (row.image_url ? '<img src="' + esc(row.image_url) + '" alt=""/>' : '<i class="ti ti-mountain"></i>')
          + '</div>'
          + '<div class="collab-info">'
            + '<div class="collab-title">' + esc(row.description || 'Book landscape') + '</div>'
            + '<div class="collab-meta">by <em>' + esc(artistName) + '</em> for your novel <em>' + esc(novel.title || 'Untitled') + '</em></div>'
            + '<div class="collab-meta" style="margin-top:2px;">' + esc(timeAgo(row.created_at)) + '</div>'
            + (row.status === 'approved' ? '<div class="collab-meta" style="margin-top:3px;"><a href="story.html?id=' + esc(row.work_id) + '" style="color:var(--accent);font-size:12px;text-decoration:none;"><i class="ti ti-external-link"></i> View novel</a></div>' : '')
          + '</div>'
          + '<div class="collab-actions">'
            + (row.status === 'approved'
              ? '<span class="badge-approved"><i class="ti ti-check"></i> Approved</span>'
              : '<span class="badge-rejected"><i class="ti ti-x"></i> Declined</span>' + deleteBtn)
          + '</div>';
        s4bbody.appendChild(div);
      });
      var s4bcount = document.createElement('div');
      s4bcount.className = 'section-count' + (decidedLand.length ? '' : ' zero');
      s4bcount.textContent = decidedLand.length;
      var s4btoggle = makeToggle(s4bbody, 'Show reviewed (' + decidedLand.length + ')');
      s4bheader.appendChild(s4bcount);
      s4bheader.appendChild(s4btoggle);
      s4b.appendChild(s4bheader);
      s4b.appendChild(s4bbody);
      content.appendChild(s4b);
    }

    } catch(err) {
      content.innerHTML = '<div class="empty-full"><i class="ti ti-alert-circle"></i><h2>Something went wrong</h2><p>Could not load your collab requests. Please try again.</p></div>';
      console.error('Inbox load error:', err);
    }
  }

  init();
</script>
<footer id="ds-footer"></footer>
<script src="blockUtils.js"></script>
<script src="spoilerUtils.js"></script>
<script src="footer.js"></script>
<script src="nav.js"></script>
</body>
</html>
