<!DOCTYPE html>
<html lang="en">
<head>
  <script src="accent.js"></script>
  <script>
    (function(){
      var t=localStorage.getItem('ds_theme');
      if(t){document.documentElement.setAttribute('data-theme',t);}
    })();
  </script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Characters — DawnScribe</title>
  <meta name="robots" content="noindex,nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="escapeUtils.js"></script>
  <script src="nameplate.js"></script>
  <style>
    :root {
      --bg:#0f1117; --bg2:#161b27; --bg3:#1e2535; --bg4:#252d3d;
      --border:#2a3347; --text:#e8eaf0; --text2:#9ba3b8; --text3:#9099b8;
      --accent:#2dd4bf; --gold:#f59e0b; --red:#f87171; --green:#189e74;
      --amber:#e0a458;
    }
    html[data-theme="light"]{--bg:#f4f5f8;--bg2:#ffffff;--bg3:#eef0f5;--bg4:#e4e7ef;--border:#c4cad9;--text:#1a1f2e;--text2:#4a5270;--text3:#5c6480;--accent:#0a6b63;--red:#b01818;--green:#036b4e;--gold:#7d5205;}
    html[data-theme="dim"]{--bg:#212329;--bg2:#282d39;--bg3:#303747;--bg4:#373f4f;--border:#3e475b;--text2:#a2a9bd;--text3:#a5aab9;}
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Lato', sans-serif; min-height: 100vh; }

    nav { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .nav-left { display: flex; align-items: center; gap: 16px; }
    .logo { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: 0.5px; }
    .logo span { color: var(--accent); }
    .back-btn { display: flex; align-items: center; gap: 6px; color: var(--text2); font-size: 13px; font-weight: 700; text-decoration: none; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); transition: all .2s; }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); }

    .page-wrap { max-width: 1040px; margin: 0 auto; padding: 32px 20px 90px; }
    .page-title { font-family: 'Cinzel', serif; font-size: 26px; font-weight: 700; }
    .page-title span { color: var(--accent); }
    .page-sub { color: var(--text2); font-size: 13.5px; margin-top: 5px; line-height: 1.6; }

    .tabs { display:flex; gap:7px; flex-wrap:wrap; margin: 22px 0 20px; }
    .tab { padding:8px 15px; border-radius:999px; border:1px solid var(--border); background:var(--bg2);
           color:var(--text2); font-size:12.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:6px; }
    .tab.on { border-color:var(--accent); color:var(--accent); background:rgba(var(--accent-rgb),0.08); }
    .tab .n { background:var(--bg4); color:var(--text2); border-radius:999px; padding:1px 7px; font-size:11px; }

    .roster { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:18px; }
    .ch-card { background:var(--bg2); border:1px solid var(--border); border-radius:14px; overflow:hidden;
               cursor:pointer; transition:border-color .2s, transform .2s; display:flex; flex-direction:column; }
    .ch-card:hover { border-color:var(--accent); transform:translateY(-2px); }
    .ch-art { aspect-ratio:2/3; background:var(--bg3); display:flex; align-items:flex-end; justify-content:center; overflow:hidden; position:relative; }
    .ch-art img { width:100%; height:100%; object-fit:contain; object-position:bottom; }
    .ch-glyph { font-family:'Cinzel',serif; font-size:40px; color:var(--text3); opacity:.5; align-self:center; }
    .ch-sil { width:100%; height:100%; display:flex; align-items:flex-end; justify-content:center; }
    .ch-sil svg { width:78%; max-width:220px; height:auto; filter:drop-shadow(0 0 18px rgba(var(--aura-rgb,45,212,191),.35)); }
    .ch-body { padding:11px 13px 13px; }
    .ch-name { font-family:'Cinzel',serif; font-size:15px; font-weight:700; }
    .ch-from { font-size:11.5px; color:var(--text3); margin-top:2px; }
    .ch-tag { position:absolute; top:8px; left:8px; background:rgba(0,0,0,.55); backdrop-filter:blur(3px);
              border-radius:999px; padding:3px 9px; font-size:10.5px; font-weight:700; color:#fff; }
    .ch-tag.mine { background:rgba(var(--accent-rgb),.85); }
    .ch-locked .ch-art { filter:grayscale(1) brightness(.5); }

    /* Crowd unlock progress */
    .bar { height:6px; background:var(--bg4); border-radius:999px; overflow:hidden; margin-top:9px; }
    .bar > i { display:block; height:100%; background:var(--accent); border-radius:999px; }
    .bar-note { font-size:11px; color:var(--text3); margin-top:5px; }

    /* The ??? slot: the EXISTENCE of a secret is shown, never the condition. */
    .secret-slot { background:var(--bg2); border:1px dashed var(--border); border-radius:14px;
                   display:flex; flex-direction:column; align-items:center; justify-content:center;
                   aspect-ratio:2/3; color:var(--text3); gap:8px; }
    .secret-slot .q { font-family:'Cinzel',serif; font-size:34px; opacity:.55; }
    .secret-slot .t { font-size:11.5px; text-align:center; padding:0 14px; line-height:1.5; }

    /* DETAIL */
    .detail { display:grid; grid-template-columns:minmax(0,340px) minmax(0,1fr); gap:28px; align-items:start; }
    @media (max-width:760px){ .detail { grid-template-columns:1fr; } }
    .stage { background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:16px;
             position:relative; }
    .figure-wrap { position:relative; aspect-ratio:2/3; background:var(--bg3); border-radius:11px; overflow:hidden; }
    .figure-wrap img.fig { width:100%; height:100%; object-fit:contain; object-position:bottom; display:block; }
    /* The face sits over the figure so a line can change the expression
       without reloading the whole illustration. */
    .face { position:absolute; top:6%; left:50%; transform:translateX(-50%); width:38%;
            border-radius:50%; overflow:hidden; opacity:0; transition:opacity .18s; pointer-events:none; }
    .face.show { opacity:1; }
    .face img { width:100%; display:block; }

    /* Tap zones. Invisible, but they are the whole interaction. */
    .zone { position:absolute; cursor:pointer; background:transparent; border:0; }
    .zone:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; border-radius:8px; }
    .zone.head { top:2%;  left:31%; width:38%; height:22%; }
    .zone.arm  { top:26%; left:6%;  width:24%; height:34%; }
    .zone.body { top:26%; left:32%; width:36%; height:42%; }

    .bubble { margin-top:13px; min-height:52px; background:var(--bg3); border:1px solid var(--border);
              border-radius:11px; padding:11px 13px; font-size:13.5px; line-height:1.55; color:var(--text);
              opacity:0; transition:opacity .18s; }
    .bubble.show { opacity:1; }
    .bubble .who { font-family:'Cinzel',serif; font-size:11.5px; color:var(--accent); display:block; margin-bottom:3px; }
    .hint { font-size:11.5px; color:var(--text3); margin-top:9px; line-height:1.5; }

    .panel { background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:16px; }
    .panel h3 { font-family:'Cinzel',serif; font-size:16px; margin-bottom:9px; }
    .panel p { font-size:13px; color:var(--text2); line-height:1.65; }

    .aff { display:flex; align-items:center; gap:10px; margin-top:12px; }
    .aff .bar { flex:1; margin:0; }
    .aff .v { font-size:12px; color:var(--text2); white-space:nowrap; }

    .poses { display:flex; gap:9px; flex-wrap:wrap; margin-top:13px; }
    .pose { width:54px; height:54px; border-radius:9px; background:var(--bg3); border:1px solid var(--border);
            overflow:hidden; display:flex; align-items:center; justify-content:center; cursor:pointer;
            color:var(--text3); font-size:16px; position:relative; }
    .pose img { width:100%; height:100%; object-fit:cover; }
    .pose.on { border-color:var(--accent); }
    .pose.locked { opacity:.45; cursor:not-allowed; }

    .btn { padding:9px 16px; border-radius:9px; border:1px solid var(--border); background:var(--bg3);
           color:var(--text); font-size:13px; font-weight:700; cursor:pointer; font-family:'Lato',sans-serif;
           display:inline-flex; align-items:center; gap:7px; }
    .btn:hover { border-color:var(--accent); }
    .btn.primary { background:var(--green); border-color:var(--green); color:#fff; }
    .btn.primary:hover { filter:brightness(1.08); }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .btn-row { display:flex; gap:9px; flex-wrap:wrap; margin-top:14px; }

    .give { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; }
    .give input { width:96px; background:var(--bg3); border:1px solid var(--border); border-radius:8px;
                  padding:8px 10px; color:var(--text); font-size:13px; font-family:'Lato',sans-serif; }

    .state { text-align:center; padding:60px 20px; color:var(--text2); }
    .state i { font-size:34px; display:block; margin-bottom:12px; opacity:.5; }

    #toast { position:fixed; bottom:22px; left:50%;
             transform:translateX(-50%) translateY(calc(100% + 40px));
             background:var(--bg3); border:1px solid var(--border); border-radius:11px;
             padding:12px 18px; font-size:13px; z-index:400; display:flex; gap:8px; align-items:center;
             opacity:0; visibility:hidden; pointer-events:none;
             transition:transform .28s, opacity .28s, visibility 0s .28s; }
    #toast.show { transform:translateX(-50%) translateY(0); opacity:1; visibility:visible;
                  pointer-events:auto; transition:transform .28s, opacity .28s, visibility 0s 0s; }
    /* ── sections ── */
    .sec-head{margin:30px 0 12px;}
    .sec-head:first-child{margin-top:8px;}
    .sec-title{font-family:'Cinzel',serif;font-size:19px;display:flex;align-items:center;gap:9px;}
    .sec-title i{color:var(--accent);}
    .sec-title .cnt{font-family:'Lato',sans-serif;font-size:12px;background:var(--bg3);border:1px solid var(--border);border-radius:999px;padding:1px 9px;color:var(--text2);}
    .sec-sub{font-size:13px;color:var(--text3);margin-top:3px;}
    .op-card{display:flex;gap:20px;align-items:stretch;background:linear-gradient(135deg,rgba(var(--aura-rgb,45,212,191),0.10),rgba(255,255,255,0.01));
      border:1px solid rgba(var(--aura-rgb,45,212,191),0.35);border-radius:18px;padding:16px;cursor:pointer;margin-bottom:12px;
      transition:transform .15s, box-shadow .15s;}
    .op-card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,0.35);}
    .op-art{width:150px;min-height:170px;border-radius:13px;background:radial-gradient(circle at 50% 35%,rgba(var(--aura-rgb,45,212,191),0.25),var(--bg3) 70%);
      display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .op-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}
    .op-kicker{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700;}
    .op-name{font-family:'Cinzel',serif;font-size:24px;margin-top:4px;}
    .op-sub{font-size:13px;color:var(--text2);margin-bottom:12px;}
    .op-cta{font-size:12.5px;color:var(--text3);margin-top:10px;line-height:1.5;}
    .op-go{color:var(--accent);font-weight:700;white-space:nowrap;}
    @media (max-width:560px){ .op-card{flex-direction:column;} .op-art{width:100%;min-height:140px;} }
    .empty-crew{display:flex;align-items:center;gap:12px;padding:18px;border:1px dashed var(--border);border-radius:14px;color:var(--text2);font-size:13.5px;}
    .empty-crew i{font-size:26px;color:var(--text3);}
    .mystery{border-radius:14px;min-height:230px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
      background:repeating-linear-gradient(135deg,rgba(255,255,255,0.025) 0 10px,transparent 10px 20px),var(--bg2);border:1px dashed rgba(255,255,255,0.14);}
    .mystery .q{font-family:'Cinzel',serif;font-size:58px;color:var(--text3);opacity:.55;line-height:1;}
    .mystery .m1{font-family:'Cinzel',serif;font-size:15px;margin-top:10px;}
    .mystery .m2{font-size:12px;color:var(--text3);margin-top:4px;line-height:1.5;}
      /* Aura picker (kept from the old avatar page) */
    .aura-card{background:var(--bg2,#12121a);border:1px solid var(--border,rgba(255,255,255,.07));border-radius:14px;padding:16px 18px;margin-top:18px;}
    .aura-head{font-family:'Cinzel',serif;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
    .aura-head i{color:var(--accent,#2dd4bf);}
    .aura-sub{font-size:12.5px;color:var(--text3,#8a8aa8);margin-top:3px;}
    .aura-row{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 8px;}
    /* ── aura flames ── */
    .flame{position:relative;width:42px;height:54px;padding:0;border:none;background:none;cursor:pointer;border-radius:10px;
      transform-origin:50% 90%;transition:transform .15s;}
    .flame svg{width:100%;height:100%;display:block;overflow:visible;}
    .flame .f-body{transform-origin:50% 90%;animation:sway 3.2s ease-in-out infinite;}
    .flame .f-mid{transform-origin:50% 88%;animation:lick 1.9s ease-in-out infinite;}
    .flame .f-core{transform-origin:50% 88%;animation:core 1.3s ease-in-out infinite;filter:blur(.4px);}
    .flame .f-glow{animation:glow 2.2s ease-in-out infinite;}
    /* every flame on its own rhythm, so the row never moves in step */
    .flame:nth-child(3n+1) .f-body{animation-duration:2.7s;animation-delay:-.4s;}
    .flame:nth-child(3n+2) .f-body{animation-duration:3.6s;animation-delay:-1.1s;}
    .flame:nth-child(4n) .f-mid{animation-duration:2.3s;animation-delay:-.7s;}
    .flame:nth-child(5n+1) .f-core{animation-duration:1.6s;animation-delay:-.3s;}
    .flame:hover{transform:translateY(-2px) scale(1.07);}
    .flame:focus-visible{outline:2px solid var(--accent,#2dd4bf);outline-offset:3px;}
    .flame.current svg{filter:drop-shadow(0 0 6px var(--fc));}
    .flame.current::after{content:'';position:absolute;left:50%;bottom:-6px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--fc);}
    .flame.picked{outline:2px solid var(--text,#f1f0ff);outline-offset:3px;}
    .flame.picked svg{filter:drop-shadow(0 0 11px var(--fc));}
    .flame.picked .f-body{animation:flicker 1.4s ease-in-out infinite;}
    .flame.dance{animation:dance .6s ease-out;}
    .flame .spark{position:absolute;top:1px;right:6px;width:5px;height:5px;border-radius:50%;background:#fff;
      box-shadow:0 0 6px 2px var(--fc);animation:twinkle 2.4s ease-in-out infinite;}
    @keyframes sway{0%,100%{transform:skewX(0) scaleY(1)}30%{transform:skewX(-2.5deg) scaleY(1.03)}65%{transform:skewX(2deg) scaleY(.98)}}
    @keyframes lick{0%,100%{transform:scale(1,1)}40%{transform:scale(.94,1.08)}70%{transform:scale(1.03,.96)}}
    @keyframes core{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.9,1.1);opacity:.85}}
    @keyframes glow{0%,100%{opacity:.8}50%{opacity:1}}
    @keyframes flicker{0%,100%{transform:scale(1,1) skewX(0)}20%{transform:scale(.96,1.07) skewX(-4deg)}45%{transform:scale(1.03,.95) skewX(3deg)}70%{transform:scale(.97,1.05) skewX(-2deg)}}
    @keyframes dance{0%{transform:scale(1)}30%{transform:scale(1.18,.9) rotate(-6deg)}60%{transform:scale(.94,1.12) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
    @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
    @media (prefers-reduced-motion:reduce){ .flame, .flame *{animation:none !important;transition:none !important;} }
.aura-sort{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0;}
    .aura-sort button{background:none;border:1px solid var(--border,rgba(255,255,255,.1));color:var(--text2,#9b9bc0);border-radius:999px;
      padding:4px 11px;font-size:12px;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
    .aura-sort button.on{border-color:var(--accent,#2dd4bf);color:var(--accent,#2dd4bf);}
    .aura-legend{font-size:11.5px;color:var(--text3,#8a8aa8);display:flex;align-items:center;gap:7px;margin-top:2px;}
    .lg-spark{width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 5px 2px rgba(255,255,255,.5);}
    .aura-reset:disabled{opacity:.5;cursor:not-allowed;}
    /* ── ROLL REVEAL (restored from the old avatar page) ───────────────
       One fire reveal for every random roll: aura, banner, character.
       Charging: the flame burns in your CURRENT aura, sparks rise, a ring
       pulses, "The ink takes flame". Revealed: the ring bursts and, for an
       aura roll, the flame becomes the colour you just won. */
    .roll-overlay{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;
      background:rgba(6,7,12,.88);backdrop-filter:blur(3px);opacity:0;transition:opacity .25s ease;--roll-hex:#2dd4bf;}
    .roll-overlay.open{opacity:1;}
    .roll-stage{position:relative;width:280px;height:300px;display:flex;align-items:center;justify-content:center;}
    .roll-flame{position:relative;width:120px;height:150px;transform-origin:50% 90%;
      animation:rollFlicker 1.05s ease-in-out infinite;filter:drop-shadow(0 0 24px var(--roll-hex));}
    .roll-flame svg{width:100%;height:100%;overflow:visible;}
    .roll-ring,.roll-burst{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;
      border-radius:50%;border:2px solid var(--roll-hex);opacity:0;}
    .roll-overlay.charging .roll-ring{animation:rollPulse 1.4s ease-out infinite;}
    .roll-overlay.revealed .roll-burst{border-width:3px;animation:rollBurst .85s cubic-bezier(.2,.7,.3,1) forwards;}
    .roll-overlay.revealed .roll-flame{animation:rollLand .7s cubic-bezier(.2,.7,.3,1) forwards;}
    .roll-spark{position:absolute;left:50%;top:38%;width:5px;height:5px;border-radius:50%;background:var(--roll-hex);
      box-shadow:0 0 6px var(--roll-hex);opacity:0;animation:rollRise 1.6s ease-out infinite;}
    .roll-label,.roll-charging-text{position:absolute;top:100%;left:0;right:0;text-align:center;}
    .roll-charging-text{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text3,#8a8aa8);}
    .roll-overlay.revealed .roll-charging-text{display:none;}
    .roll-label{opacity:0;transform:translateY(8px);}
    .roll-overlay.revealed .roll-label{animation:rollLabel .5s ease-out .3s forwards;}
    .roll-kicker{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--text3,#8a8aa8);margin-bottom:6px;}
    .roll-name{font-family:'Cinzel',serif;font-size:26px;font-weight:700;}
    .roll-rare{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
      padding:2px 10px;border-radius:999px;border:1px solid var(--roll-hex);color:#fff;}
    .roll-sub{font-size:13px;color:var(--text2,#9b9bc0);margin:8px auto 0;line-height:1.6;max-width:300px;}
    .roll-dismiss{margin-top:16px;font-size:11px;color:var(--text3,#8a8aa8);}
    @keyframes rollFlicker{0%,100%{transform:scale(1) skewX(0)}30%{transform:scale(.97,1.06) skewX(-3deg)}65%{transform:scale(1.04,.96) skewX(2deg)}}
    @keyframes rollPulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.2);opacity:0}}
    @keyframes rollRise{0%{transform:translate(0,0) scale(1);opacity:0}15%{opacity:.9}100%{transform:translate(var(--dx,0px),-130px) scale(.2);opacity:0}}
    @keyframes rollBurst{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.6);opacity:0}}
    @keyframes rollLand{0%{transform:scale(1.35)}60%{transform:scale(.94)}100%{transform:scale(1)}}
    @keyframes rollLabel{to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){
      .roll-flame,.roll-ring,.roll-spark,.roll-burst{animation:none !important;}
      .roll-spark{display:none;}
      .roll-label{opacity:1 !important;transform:none !important;animation:none !important;}
    }
    /* ── collection tabs ── */
    .ctabs{display:flex;gap:6px;margin:6px 0 18px;border-bottom:1px solid var(--border,rgba(255,255,255,.08));}
    .ctab{background:none;border:none;border-bottom:2px solid transparent;color:var(--text2,#9b9bc0);font:inherit;font-size:14px;font-weight:700;
      padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;margin-bottom:-1px;}
    .ctab.on{color:var(--text,#f1f0ff);border-bottom-color:var(--accent);}
    .ctab.on i{color:var(--accent);}
    /* ── banners ── */
    .bn-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
    .bn-tools input,.bn-tools select,.rot-row select{background:var(--bg3,#1a1a26);border:1px solid var(--border,rgba(255,255,255,.1));border-radius:9px;

    .flame.is-default::before{content:'';position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;
      background:var(--bg2,#12121a);border:1px solid var(--border,rgba(255,255,255,.12));
      -webkit-mask:none;box-shadow:inset 0 0 0 3px #2dd4bf;}
    .aura-preview{margin:12px 0 4px;border:1px solid rgba(var(--aura-rgb,45,212,191),.35);border-radius:14px;overflow:hidden;
      background:var(--bg,#0a0a0f);box-shadow:0 0 24px rgba(var(--aura-rgb,45,212,191),.12);max-width:560px;}
    .ap-label{font-size:12px;color:var(--text2,#9b9bc0);padding:8px 12px;background:rgba(var(--aura-rgb,45,212,191),.08);}
    .ap-label i{color:var(--accent);}
    .ap-label b{color:var(--text,#f1f0ff);}
    .ap-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2,#12121a);border-bottom:1px solid var(--border);}
    .ap-logo{color:var(--accent);font-size:20px;line-height:1;margin-right:auto;width:auto !important;justify-content:flex-start !important;--ds-logo-h:26px;}
    .ap-pill{background:var(--accent);color:#0a0a0f;font-weight:700;font-size:12px;border-radius:8px;padding:5px 10px;display:inline-flex;gap:4px;align-items:center;}
    .ap-av{width:28px;height:28px;border-radius:50%;background:var(--bg3,#1a1a26);display:flex;align-items:center;justify-content:center;color:var(--text2);
      box-shadow:0 0 0 2px var(--accent),0 0 10px rgba(var(--aura-rgb,45,212,191),.6);}
    .ap-body{padding:12px 14px 14px;}
    .ap-tabs{display:flex;gap:16px;font-size:13px;color:var(--text3,#8a8aa8);border-bottom:1px solid var(--border);margin-bottom:10px;}
    .ap-tabs span{padding-bottom:6px;}
    .ap-tabs .on{color:var(--accent);border-bottom:2px solid var(--accent);font-weight:700;}
    .ap-title{font-family:'Cinzel',serif;font-size:16px;font-weight:700;color:var(--accent);margin-bottom:4px;}
    .ap-title span{color:var(--text,#f1f0ff);}
    .ap-text{font-size:13px;color:var(--text2,#9b9bc0);line-height:1.6;}
    .ap-text a{color:var(--accent);text-decoration:underline;}
    .ap-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;}
    .ap-chip{font-size:11.5px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:3px 9px;
      background:rgba(var(--aura-rgb,45,212,191),.1);display:inline-flex;gap:4px;align-items:center;}
    .ap-prog{flex:1;min-width:120px;height:6px;border-radius:4px;background:var(--bg3,#1a1a26);overflow:hidden;}
    .ap-prog span{display:block;height:100%;background:var(--accent);box-shadow:0 0 8px rgba(var(--aura-rgb,45,212,191),.7);}
    .aura-roll,.aura-reset{font-family:'Lato',sans-serif;font-size:13px;font-weight:700;border-radius:9px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
    .aura-roll{background:var(--accent,#2dd4bf);color:#0a0a0f;border:none;}
    .aura-roll:disabled{opacity:.55;cursor:not-allowed;}
    .rand-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--border);}
    .aura-sub + .rand-row{border-top:none;}
    .rand-info{flex:1;min-width:220px;}
    .rand-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;}
    .aura-reset{background:transparent;color:var(--text2,#9b9bc0);border:1px solid var(--border,rgba(255,255,255,.07));}
    .aura-note{font-size:12.5px;color:var(--text3,#8a8aa8);margin-top:8px;}
  </style>
</head>
<body>
<nav>
  <div class="nav-left">
    <a class="logo" href="index.html">Dawn<span>Scribe</span></a>
    <a class="back-btn" href="index.html"><i class="ti ti-arrow-left"></i> Back to home</a>
  </div>
</nav>

<div class="page-wrap">
  <div id="head-area">
    <div class="page-title">Dawn<span>Scribe</span> Characters</div>
    <div class="page-sub">Everyone the ship has met on its way between universes. Some you win, some the
      whole community opens together, and a few you have to find.</div>
  </div>
  <div id="view"></div>
</div>

<div id="toast"><i class="ti ti-check" id="toast-icon"></i> <span id="toast-msg"></span></div>

<script>
  const SUPABASE_URL = 'https://cajjyyskpmjnpcxcfeuk.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_ZZjE1u_pQn5YkrMKH4P3KQ_HSGqTjzx';
  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  window.db = db;

  var ME = null;
  var CHARS = [];          // every character this viewer may see
  var AURA = { hex: '#2dd4bf', unlocked: [] };
  var AURA_INFO = {};      // hex -> { name, rare } from the aura list
  var AURA_COST = 15;      // from admin settings; the page never hard-codes a price
  var AURA_PICK = null;    // the flame tapped but not yet accepted
  var AURA_SORT = 'wheel'; // 'wheel' (colour spectrum) or 'rare' (rare first)
  try { if (localStorage.getItem('ds_aura_sort') === 'rare') AURA_SORT = 'rare'; } catch(e) {}
  window.setAuraSort = function(m){ AURA_SORT = m; try { localStorage.setItem('ds_aura_sort', m); } catch(e) {} render(); };
  // True once the viewer owns every aura that exists right now. Worked out
  // from the live list, so the moment a new aura is added the roll button
  // wakes up again by itself. The total is never shown.
  function allAurasOwned(){
    var have = {};
    AURA.unlocked.concat(['#2dd4bf']).forEach(function(h){ have[String(h).toLowerCase()] = 1; });
    var keys = Object.keys(AURA_INFO);
    return keys.length > 0 && keys.every(function(h){ return have[h]; });
  }
  // The free randomizer: DawnScribe's own banners and characters, won with Embers.
  var RAND = { banner: { cost: 10, pool: 0, owned: 0 }, character: { cost: 500, pool: 0, owned: 0 } };
  var MINE = {};           // character_id -> ownership row
  var SLOTS = { total: 0, found: 0 };
  var TEASERS = [];        // characters not open yet: only "after whom" is known
  var OPEN = null;         // the character being looked at
  // Tabs by WHAT you collect. Remembered, and reachable as characters.html#banners.
  // Spend Embers is the front door: every way to use Embers in one place.
  // A #hash link still opens a specific tab.
  var TABS = ['spend','characters','banners','nameplate','aura'];
  var TAB = 'spend';
  try { var _h = (location.hash || '').replace('#', ''); if (TABS.indexOf(_h) >= 0) TAB = _h; } catch(e) {}
  // Keep the top bar's Ember count honest after any roll or pledge. The aura
  // roll does not return a balance, so ask for it when none is given.
  async function refreshEmbers(bal){
    var el = document.getElementById('ds-ember-count');
    if (!el) return;
    if (typeof bal !== 'number') {
      var r = await db.from('user_embers').select('balance').eq('user_id', ME.id).maybeSingle();
      bal = r && r.data ? r.data.balance : null;
    }
    if (typeof bal === 'number') el.textContent = bal.toLocaleString();
  }
  // A link to characters.html#banners from this same page switches tab too.
  window.addEventListener('hashchange', function(){
    var h = (location.hash || '').replace('#', '');
    if (TABS.indexOf(h) >= 0 && h !== TAB) setTab(h);
  });
  window.setTab = function(t){ if (t !== 'aura' && AURA_PICK) { AURA_PICK = null; auraPreviewRevert(); } TAB = t; OPEN = null; try { localStorage.setItem('ds_collection_tab', t); history.replaceState(null, '', '#' + t); } catch(e) {} render(); };
  // Banners
  var BANNERS = [];        // owned banners
  var BROT = { active: null, ids: [], mode: 'manual', index: 0, last: null };
  var BSEL = null;         // ids ticked for a rotation (in order)
  var BMODE = null;        // chosen interval
  var BQ = '', BSORT = 'new', BSHOWN = 24;
  var BFAV = {};           // favourite banner ids
  var BVIEW = 'all';       // 'all' or 'fav'
  try { if (localStorage.getItem('ds_banner_view') === 'fav') BVIEW = 'fav'; } catch(e) {}
  window.setBannerView = function(v){ BVIEW = v; BSHOWN = 24; try { localStorage.setItem('ds_banner_view', v); } catch(e) {} render(); };
  window.toggleFav = async function(id, btn){
    var on = !BFAV[id];
    if (on) BFAV[id] = 1; else delete BFAV[id];
    render();                                   // instant; undone below if the save fails
    var r = on
      ? await db.from('user_banner_favorites').insert({ user_id: ME.id, cosmetic_item_id: id })
      : await db.from('user_banner_favorites').delete().eq('user_id', ME.id).eq('cosmetic_item_id', id);
    if (r.error && !(on && /duplicate/i.test(r.error.message || ''))) {
      if (on) delete BFAV[id]; else BFAV[id] = 1;
      render();
      toast('Could not save that favourite.', 'ti-alert-triangle', true);
    }
  };
  var LINES = [];          // lines the viewer has earned on OPEN
  var POSES = [];
  var FACES = {};          // slug -> image_path
  var CUR_POSE = 1;
  var faceTimer = null, toastTimer = null;

  function esc(s){
    if (window.DSEscape && window.DSEscape.esc) return window.DSEscape.esc(s);
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
    });
  }

  function assetUrl(path){
    if(!path) return '';
    return SUPABASE_URL + '/storage/v1/object/public/characters/' + path;
  }

  function toast(msg, icon, bad){
    var el = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    document.getElementById('toast-icon').className = 'ti ' + (icon || 'ti-check');
    el.style.color = bad ? 'var(--red)' : 'var(--text)';
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 3400);
  }

  async function boot(){
    var s = await db.auth.getSession();
    ME = s.data.session ? s.data.session.user : null;
    if(!ME){
      document.getElementById('view').innerHTML =
        '<div class="state"><i class="ti ti-lock"></i>Sign in to meet the crew.</div>';
      return;
    }
    // Secrets are granted by reading, so the check runs on arrival. It is
    // cheap, idempotent, and the only moment the user could be surprised.
    try { await db.rpc('ds_grant_secret_characters'); } catch(e){}
    await load();
  }

  async function load(){
    var res = await Promise.all([
      db.from('ds_characters').select('*').order('chain_order', { ascending:true, nullsFirst:false }),
      db.from('ds_user_characters').select('*').eq('user_id', ME.id),
      db.rpc('ds_secret_slots'),
      // The Aura outlived the dress-up avatar: it still recolours the whole
      // site for its owner, and is still won with Embers.
      db.from('user_avatars').select('accent_color, unlocked_accents').eq('user_id', ME.id).maybeSingle(),
      db.rpc('ds_randomizer_pool'),
      db.rpc('ds_randomizer_cost', { p_kind: 'aura' }),
      db.from('reroll_color_palette').select('hex,label,is_rare').eq('region_type', 'accent'),
      db.rpc('ds_character_teasers'),
      db.from('user_unlocked_items').select('cosmetic_item_id, unlocked_at, cosmetic_items(id, name, image_url, artist_name, slot)')
        .eq('user_id', ME.id),
      db.from('user_avatars').select('equipped, banner_rotation_ids, banner_rotation_mode, banner_rotation_index, banner_last_rotated_at')
        .eq('user_id', ME.id).maybeSingle(),
      db.from('user_banner_favorites').select('cosmetic_item_id').eq('user_id', ME.id),
      db.rpc('ensure_starter_title').then(function(){ return Promise.all([db.rpc('my_title_styles'), db.rpc('my_nameplate_rotation')]); })
        .then(function(x){ NP_ROT = (x[1] && x[1].data) || { looks: [], mode: 'daily', shuffle: false }; NP_ROT_SAVED = JSON.stringify(NP_ROT); return x[0]; }),
      db.from('user_nameplate_favs').select('kind,item').eq('user_id', ME.id).then(function(r){
        NP_FAV = { font: {}, color: {} }; (r.data || []).forEach(function(f){ NP_FAV[f.kind][f.item] = 1; }); return r; }),
      db.rpc('get_nameplates', { p_user_ids: [ME.id] })
    ]);
    npApply(res[11] && res[11].data);
    NP_ME = (res[13] && res[13].data && res[13].data[0]) || null;
    CHARS = res[0].data || [];
    MINE = {};
    (res[1].data || []).forEach(function(r){ MINE[r.character_id] = r; });
    SLOTS = res[2].data || { total:0, found:0 };
    var av = res[3] && res[3].data ? res[3].data : {};
    AURA = {
      hex: (av.accent_color && av.accent_color.hex) || '#2dd4bf',
      unlocked: Array.isArray(av.unlocked_accents) ? av.unlocked_accents : []
    };
    // Pool sizes come from the server: the randomizer's characters are not
    // readable one by one until you own them.
    var rp = (res[4] && res[4].data) || {};
    RAND = {
      banner: rp.banner || RAND.banner,
      character: rp.character || RAND.character
    };
    TEASERS = (res[7] && res[7].data) || [];
    BANNERS = ((res[8] && res[8].data) || [])
      .filter(function(u){ return u.cosmetic_items && u.cosmetic_items.slot === 'banner'; })
      .map(function(u){ var c = u.cosmetic_items; return { id: c.id, name: c.name || 'Banner', url: c.image_url, artist: c.artist_name || '', at: u.unlocked_at }; });
    var ba = (res[9] && res[9].data) || {};
    BFAV = {};
    ((res[10] && res[10].data) || []).forEach(function(f){ BFAV[String(f.cosmetic_item_id)] = 1; });
    BROT = {
      active: ba.equipped && ba.equipped.banner ? String(ba.equipped.banner) : null,
      ids: Array.isArray(ba.banner_rotation_ids) ? ba.banner_rotation_ids.map(String) : [],
      mode: ba.banner_rotation_mode || 'manual',
      index: ba.banner_rotation_index || 0,
      last: ba.banner_last_rotated_at || null
    };
    if (!BSEL) BSEL = BROT.mode !== 'manual' ? BROT.ids.slice() : [];
    if (!BMODE) BMODE = BROT.mode !== 'manual' ? BROT.mode : 'daily';
    AURA_COST = (res[5] && res[5].data) || 15;
    AURA_INFO = {};
    ((res[6] && res[6].data) || []).forEach(function(p){
      AURA_INFO[String(p.hex).toLowerCase()] = { name: p.label, rare: !!p.is_rare };
    });
    // Progress for every campaign on the page, so the bar shows without a click.
    var opening = CHARS.filter(isOpening);
    var progs = await Promise.all(opening.map(function(c){
      return db.rpc('ds_character_progress', { p_character_id: c.id });
    }));
    opening.forEach(function(c, i){ c._progress = (progs[i] && progs[i].data) || null; });
    render();
  }

  /* Placeholder until a character's art exists: a softly glowing silhouette
     in the viewer's aura colour, instead of a bare initial. Also used when an
     art file is missing, so a broken image never shows. */
  function silhouetteHtml(extra){
    return '<div class="ch-sil"' + (extra ? ' style="' + extra + '"' : '') + ' aria-hidden="true">'
      + '<svg viewBox="0 0 100 120" preserveAspectRatio="xMidYMax meet">'
      +   '<defs><radialGradient id="silg" cx="50%" cy="40%" r="60%">'
      +     '<stop offset="0" stop-color="rgb(var(--aura-rgb,45,212,191))" stop-opacity=".55"/>'
      +     '<stop offset="1" stop-color="rgb(var(--aura-rgb,45,212,191))" stop-opacity="0"/></radialGradient></defs>'
      +   '<ellipse cx="50" cy="55" rx="48" ry="55" fill="url(#silg)"/>'
      +   '<circle cx="50" cy="38" r="17" fill="rgba(10,10,15,.82)"/>'
      +   '<path d="M14 120 C16 86 32 66 50 66 C68 66 84 86 86 120 Z" fill="rgba(10,10,15,.82)"/>'
      + '</svg></div>';
  }
  window.silFallback = function(img){
    var d = document.createElement('div'); d.innerHTML = silhouetteHtml('margin:auto;');
    img.replaceWith(d.firstChild);
  };

  function isOpening(c){ return c.availability === 'ember_unlock' && !c.unlocked_at && !MINE[c.id]; }
  function backToList(){ OPEN = null; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

  function sectionHead(icon, title, sub){
    return '<div class="sec-head"><div class="sec-title"><i class="ti ' + icon + '"></i> ' + title + '</div>'
      + (sub ? '<div class="sec-sub">' + sub + '</div>' : '') + '</div>';
  }
  function progressOf(c){
    var p = c._progress || {};
    var goal = p.goal || c.ember_unlock_price || 0, have = p.pledged || 0;
    return { goal: goal, have: have, pct: goal ? Math.min(100, Math.round(have / goal * 100)) : 0, backers: p.backers || 0 };
  }
  function openingCard(c){
    var g = progressOf(c);
    return '<div class="op-card" onclick="openChar(\'' + esc(c.id) + '\')">'
      + '<div class="op-art">' + silhouetteHtml() + '</div>'
      + '<div class="op-body">'
      +   '<div class="op-kicker"><i class="ti ti-flame"></i> Being opened by the community</div>'
      +   '<div class="op-name">' + esc(c.name) + '</div>'
      +   '<div class="op-sub">' + esc(c.subtitle || sourceLabel(c)) + '</div>'
      +   '<div class="bar"><i style="width:' + g.pct + '%"></i></div>'
      +   '<div class="bar-note">' + g.have.toLocaleString() + ' of ' + g.goal.toLocaleString() + ' Embers'
      +     ' \u00b7 ' + g.backers + ' helping</div>'
      +   '<div class="op-cta">Give a few Embers. Everyone who helps gets them when the bar fills.'
      +     ' <span class="op-go">Take a look <i class="ti ti-arrow-right"></i></span></div>'
      + '</div></div>';
  }
  function mysteryCard(line1, line2){
    return '<div class="mystery"><div class="q">?</div>'
      + '<div class="m1">' + line1 + '</div><div class="m2">' + line2 + '</div></div>';
  }

  function charactersHtml(){
    var mine = CHARS.filter(function(c){ return MINE[c.id]; });
    var opening = CHARS.filter(isOpening);
    var secretsLeft = Math.max(0, SLOTS.total - SLOTS.found);

    var html = '';

    // Opening now and the character roll live on the Spend Embers tab.
    if (opening.length) html += spendLink('Help open ' + (opening.length === 1 ? esc(opening[0].name) : opening.length + ' characters') + ' or win one');

    // 2. Your crew.
    html += sectionHead('ti-users', 'Your crew' + (mine.length ? ' <span class="cnt">' + mine.length + '</span>' : ''),
      mine.length ? 'Tap one to talk, see their poses, and make them your character.' : '');
    html += mine.length
      ? '<div class="roster">' + mine.map(cardHtml).join('') + '</div>'
      : '<div class="empty-crew"><i class="ti ti-user-heart"></i><div>Nobody yet. Help open a character or win one on the '
        + '<a href="#spend" onclick="setTab(\'spend\');return false;" style="color:var(--accent);">Spend Embers</a> tab.</div></div>';

    // 3. Still to come: silhouettes only. Names and art stay on the server
    //    until each one steps forward.
    if (TEASERS.length || secretsLeft) {
      html += sectionHead('ti-sparkles', 'Still to come', 'Nobody knows who these are yet.')
        + '<div class="roster">'
        + TEASERS.map(function(t){
            return mysteryCard('Someone new', t.after ? 'Steps forward once ' + esc(t.after) + ' is opened.' : 'Arrives soon.');
          }).join('')
        + Array(secretsLeft).fill(0).map(function(){
            return mysteryCard('A secret', 'Found by readers who read the right things. Nobody will tell you which.');
          }).join('')
        + '</div>';
    }

    return html;
  }

  // ── SPEND EMBERS TAB ──────────────────────────────────────────
  /* Every way to spend Embers, in one place: open a character with the
     community, then roll for a character, a banner or an aura. Owning and
     arranging what you won stays on the other tabs. */
  function spendLink(label){
    return '<a class="spend-link" href="#spend" onclick="setTab(\'spend\');return false;">'
      + '<i class="ti ti-flame"></i> ' + label + ' <span>on Spend Embers \u2192</span></a>';
  }
  // ── NAMEPLATE TAB ─────────────────────────────────────────────
  /* Fonts and colours belong to ONE earned title. Roll a font for a title
     (it only works on that title); then, inside that font, roll colours
     for it. The same font rolled on two titles is two separate copies with
     their own colours. Starter fonts and White / your aura work anywhere;
     a tag's font comes with that tag's titles. Your nameplate shows the
     style of the title you're wearing. */
  var NP = null, NP_ME = null, NP_T = null, NP_PICK = null;
  function npApply(d){
    NP = d && d.ok ? d : null;
    if (!NP) return;
    if (!NP_T || !npTitle(NP_T)) NP_T = NP.active && npTitle(NP.active) ? NP.active : (NP.titles[0] && NP.titles[0].id) || null;
    npResetPick();
  }
  function npTitle(id){ return NP && NP.titles.filter(function(t){ return t.id === id; })[0]; }
  function npFont(key){ return NP ? NP.fonts.filter(function(f){ return f.key === key; })[0] : null; }
  function npColor(hex){ return NP && hex ? NP.colors.filter(function(c){ return c.hex === hex; })[0] : null; }
  function npResetPick(){
    var t = npTitle(NP_T);
    var st = (t && t.style) || {};
    NP_PICK = t ? { font: st.font || 'cinzel', color: st.color || null, tfont: st.tfont || null, tcolor: st.tcolor || null } : null;
  }
  /* Which line the pickers style: the name ('name') or the title ('title').
     A title with no font of its own keeps the plain small-caps look and
     draws its colours from the name's font (same rule as the server). */
  var NP_TGT = 'name';
  var NP_FAV = { font: {}, color: {} };
  function npFavFirst(list, kind, keyOf){
    return list.filter(function(x){ return NP_FAV[kind][keyOf(x)]; }).concat(list.filter(function(x){ return !NP_FAV[kind][keyOf(x)]; }));
  }
  function npStar(kind, item){
    var on = !!NP_FAV[kind][item];
    return '<span class="np-star' + (on ? ' on' : '') + '" role="button" tabindex="0" title="' + (on ? 'Remove from favourites' : 'Add to favourites') + '"'
      + ' onclick="event.stopPropagation();npToggleFav(\'' + kind + '\',\'' + esc(item) + '\')">' + (on ? '\u2605' : '\u2606') + '</span>';
  }
  window.npToggleFav = async function(kind, item){
    var on = !!NP_FAV[kind][item];
    if (on) delete NP_FAV[kind][item]; else NP_FAV[kind][item] = 1;
    render();
    var r = on ? await db.from('user_nameplate_favs').delete().eq('user_id', ME.id).eq('kind', kind).eq('item', item)

          + esc(((NP_ROT_MODES.filter(function(m){ return m[0] === NP_ROT.mode; })[0]) || [0, ''])[1].toLowerCase()) + (NP_ROT.shuffle ? ', shuffled' : '') + '.</div>'
          : '<div class="rot-now">While a rotation runs it takes over your nameplate. Stop it to go back to the title you\u2019re wearing.</div>')

  }
  window.npRotAdd = function(){ NP_ROT.looks.push({ title: NP_T, font: NP_PICK.font, color: NP_PICK.color || null, tfont: NP_PICK.tfont || null, tcolor: NP_PICK.tcolor || null }); render(); };

  function npRollFail(d, r){

    if (d.status === 'all_unlocked') { toast('Nothing left to roll here, for now.', 'ti-check'); return true; }

    return false;
  }
  /* Font shuffle: the name flickers through fonts like a slot machine,
     slows down and lands on the new one. Tap anywhere to close. */
  function npFontShuffle(plate, newFamily, label, titleName, isTitle){
    if (!window.DSNameplate) return;
    var pool = NP.fonts.map(function(f){ return f.family; }).filter(function(f){ return f && f !== newFamily; });
    for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
    pool = pool.slice(0, 14);
    pool.forEach(function(f){ DSNameplate.ensureFont(f); });
    DSNameplate.ensureFont(newFamily);
    var ov = document.createElement('div');
    ov.className = 'np-ink-ov np-fs-ov';
    ov.innerHTML = '<div class="np-ink-card"><div class="np-fs-stage">' + DSNameplate.html(plate, { size: 'lg' }) + '<span class="np-fs-flash"></span></div>'
      + '<div class="np-ink-txt"><b class="fs">' + esc(label) + '</b> unlocked for ' + esc(titleName) + '</div>'
      + '<div class="np-ink-hint">Tap anywhere to continue</div></div>';
    document.body.appendChild(ov);
    requestAnimationFrame(function(){ ov.classList.add('in'); });
    var stage = ov.querySelector('.np-fs-stage'), nameEl = ov.querySelector(isTitle ? '.ds-np-title' : '.ds-np-name');
    var setFam = function(f){ if (nameEl) nameEl.style.fontFamily = "'" + f.replace(/'/g, '') + "',Georgia,serif"; };
    var closed = false;
    var land = function(){
      if (closed) return;
      setFam(newFamily); stage.classList.remove('tick'); stage.classList.add('land'); ov.classList.add('done');
    };
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || !pool.length) land();
    else {
      var k = 0, delay = 60;
      var step = function(){
        if (closed) return;
        if (k >= pool.length) { land(); return; }
        setFam(pool[k++]); stage.classList.toggle('tick');
        delay = Math.round(delay * 1.18);
        setTimeout(step, delay);
      };
      setTimeout(step, 300);
    }
    var close = function(){ closed = true; ov.classList.remove('in'); setTimeout(function(){ ov.remove(); }, 250); document.removeEventListener('keydown', onKey); };
    var onKey = function(e){ if (e.key === 'Escape' || e.key === 'Enter') close(); };
    ov.addEventListener('click', close);
    document.addEventListener('keydown', onKey);
  }

  window.npRollFont = async function(tgt){

    var r = await db.rpc('roll_slot_font', { p_title: NP_T, p_slot: NP_TGT }); var d = (r && r.data) || {};
    if (npRollFail(d, r)) { render(); return; }
    if (window.DSNameplate) DSNameplate.ensureFont(d.family);
    refreshEmbers(d.balance);
    var keep = NP_T, pick = Object.assign({}, NP_PICK); await npReload(); NP_T = keep; NP_PICK = pick;
    var isTitle = NP_TGT !== 'name';
    var before = npPreviewPlate();

                        : Object.assign(before, { font_family: d.family, font_size: d.size || 1 });

  /* Ink drop: a drop of the new colour falls on the nameplate and spreads

  function npInkDrop(before, after, hex, label, fontLabel, isTitle){
    if (!window.DSNameplate) return;

  // type and skin tone, which no longer exist.
  function hexHsl(hex){
    var h = String(hex || '').replace('#', '');
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var r = parseInt(h.slice(0,2),16)/255, g = parseInt(h.slice(2,4),16)/255, b = parseInt(h.slice(4,6),16)/255;
    if (isNaN(r+g+b)) return { h: 999, s: 0, l: 0 };
    var mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2, d = mx - mn, hue = 0, sat = 0;
    if (d) {
      sat = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      hue = mx === r ? ((g - b) / d + (g < b ? 6 : 0)) : mx === g ? ((b - r) / d + 2) : ((r - g) / d + 4);
      hue *= 60;
    }
    // Pinks-into-reds (330°+) count as the start of the wheel, so every red sits together first.
    if (hue >= 330) hue -= 360;
    return { h: hue, s: sat, l: l };
  }

  function auraHtml(){
    var owned = AURA.unlocked.slice();
    if (owned.indexOf('#2dd4bf') === -1) owned.unshift('#2dd4bf');
    // Laid out like a colour wheel: red, orange, yellow, green, teal, blue,
    // purple, pink, and back round to red. Within the same hue, lighter first.
    // Near-greys (almost no colour) go at the end.
    owned = owned.filter(function(h, i, a){ return a.indexOf(h) === i; })
      .map(function(h){ return { hex: h, hsl: hexHsl(h) }; })
      .sort(function(a, b){
        var ga = a.hsl.s < 0.12, gb = b.hsl.s < 0.12;
        if (ga !== gb) return ga ? 1 : -1;
        if (ga) return b.hsl.l - a.hsl.l;
        var ha = Math.round(a.hsl.h / 12), hb = Math.round(b.hsl.h / 12);   // 30 hue bands
        if (ha !== hb) return ha - hb;
        return b.hsl.l - a.hsl.l;
      })
      .map(function(x){ return x.hex; });
    // The site's own colour always leads, so it is easy to go back to.
    owned = ['#2dd4bf'].concat(owned.filter(function(h){ return String(h).toLowerCase() !== '#2dd4bf'; }));
    if (AURA_SORT === 'rare') {

        + ' aria-label="' + esc(nm) + '"' + (h === pick ? ' aria-pressed="true"' : '') + '>'
        + flameSvg(hex, i, h === pick) + (info.rare ? '<span class="spark" aria-hidden="true"></span>' : '') + npStar('color', 'aura:' + h) + '</button>';
    }).join('');
    var pickName = pick ? (pick === '#2dd4bf' ? 'Default teal' : ((AURA_INFO[pick] || {}).name || 'this colour')) : '';

      + '</div>'
      + '<div class="aura-row">' + flames + '</div>'
      + '<div class="aura-legend"><span class="lg-spark"></span> Flames with a spark are rare. Hover a flame and tap \u2606 to favourite it; favourites come first.</div>'
      + '<div class="aura-pick">'
      +   (pick ? (canAccept ? 'Selected: <b>' + esc(pickName) + '</b>' : '<b>' + esc(pickName) + '</b> is already your aura.')
                : 'Your aura: <b>' + esc(cur === '#2dd4bf' ? 'Default teal' : ((AURA_INFO[cur] || {}).name || 'Default teal')) + '</b>')
      + '</div>'

  var FLAME_OUT  = 'M20 1 C23 9 35 15 34.5 29 C34 38.5 27.5 45.5 20 45.5 C12.5 45.5 5.5 38.5 5.5 29 C5.5 20 11 16 13 9.5 C15.5 15 17.5 17 19 17.5 C17 11.5 17.5 6.5 20 1 Z';

    return '<svg viewBox="0 0 40 50" aria-hidden="true">'

      +   '<linearGradient id="' + id + 'o" x1="0" y1="1" x2="0" y2="0">'

      +     '<stop offset="1" stop-color="' + darken(hex, 0.35) + '" stop-opacity="0.55"/>'
      +   '</linearGradient>'
      +   '<linearGradient id="' + id + 'm" x1="0" y1="1" x2="0" y2="0">'
      +     '<stop offset="0" stop-color="' + lighten(hex, 0.7) + '"/>'
      +     '<stop offset="1" stop-color="' + lighten(hex, 0.3) + '" stop-opacity="0.8"/>'
      +   '</linearGradient>'
      +   '<radialGradient id="' + id + 'g" cx="0.5" cy="0.5" r="0.5">'
      +     '<stop offset="0" stop-color="' + esc(hex) + '" stop-opacity="0.55"/>'
      +     '<stop offset="1" stop-color="' + esc(hex) + '" stop-opacity="0"/>'
      +   '</radialGradient>'
      +   (picked
          ? '<filter id="' + id + 'h" x="-20%" y="-20%" width="140%" height="140%">'
            + '<feTurbulence type="fractalNoise" baseFrequency="0.05 0.14" numOctaves="2" seed="' + (i + 3) + '">'
            +   '<animate attributeName="baseFrequency" dur="2.4s" values="0.05 0.14;0.06 0.2;0.05 0.14" repeatCount="indefinite"/>'
            + '</feTurbulence>'
            + '<feDisplacementMap in="SourceGraphic" scale="3"/></filter>'
          : '')
      + '</defs>'

      + '<g class="f-body"' + (picked ? ' filter="url(#' + id + 'h)"' : '') + '>'
      +   '<path class="f-out" d="' + FLAME_OUT + '" fill="url(#' + id + 'o)"/>'
      +   '<path class="f-mid" d="' + FLAME_MID + '" fill="url(#' + id + 'm)"/>'

  }
  function darken(hex, a){
    var h = String(hex).replace('#', '');
    var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
    return 'rgb(' + Math.round(r*(1-a)) + ',' + Math.round(g*(1-a)) + ',' + Math.round(b*(1-a)) + ')';
  }
  function lighten(hex, a){
    var h = String(hex).replace('#', '');
    var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
    return 'rgb(' + Math.round(r + (255-r)*a) + ',' + Math.round(g + (255-g)*a) + ',' + Math.round(b + (255-b)*a) + ')';
  }
  /* Live preview. Tapping a flame repaints the whole site in that colour
     (nav, logo, tabs, this panel) without saving anything. Accept keeps it;
     Cancel, tapping your own aura, or leaving this tab puts yours back. The
     saved colour in localStorage is never touched until Accept, so closing
     the page mid-preview also leaves the real aura in place. */
  function auraPreviewApply(hex){
    var h = String(hex || '').toLowerCase();
    if (window.dsApplyAccent) dsApplyAccent(!h || h === '#2dd4bf' ? null : hex);
    if (window.dsRefreshLogo) try { dsRefreshLogo(); } catch(e) {}

  function auraPreviewRevert(){

  // ── RANDOMIZER ────────────────────────────────────────────────
  // Free to enter with Embers. You never get a duplicate: each roll picks
  // something you do not have yet, and says so when you have them all.
  function randRow(kind, label, icon, where, example){
    var r = RAND[kind];
    var left = Math.max(0, r.pool - r.owned);
    // Totals are deliberately never shown. The button sleeps when you own
    // everything and wakes by itself when something new is added.
    var status = !r.pool ? 'Nothing to win yet. Check back soon.'
      : !left ? 'You have them all, for now. New ones will wake this button up.'
      : 'Every roll is something you don\u2019t have yet.';
    return '<div class="rand-row">'
      + (example || '')
      + '<div class="rand-info"><div class="rand-name"><i class="ti ' + icon + '"></i> ' + label + '</div>'
      + '<div class="aura-sub" style="margin:2px 0 0;">' + status + ' ' + where + '</div></div>'
      + '<button class="aura-roll" id="roll-' + kind + '" onclick="rollRandom(\'' + kind + '\')"'
      + (!left ? ' disabled' : '') + '><i class="ti ti-dice-5"></i> Roll &middot; ' + r.cost + ' Embers</button>'
      + '</div>';
  }
  /* Wax seal letter: an envelope sealed in your aura colour drops in, the
     seal cracks, the flap opens and the banner you won slides out. Only the
     prize is ever shown. */
  function wxLetter(b){
    return new Promise(function(resolve){
      var hex = AURA.hex || '#2dd4bf';
      var ov = document.createElement('div');
      ov.className = 'wx-ov';
      ov.style.setProperty('--wx', hex);
      var img = b.url ? '<img src="' + esc(b.url) + '" alt=""/>' : '';
      ov.innerHTML = '<div class="wx-scene">'
        + '<div class="wx-env"><div class="wx-back"></div><div class="wx-card">' + img + '</div><div class="wx-front"></div><div class="wx-flap"></div>'
        +   '<div class="wx-seal"><span class="wx-h l"><b>D</b></span><span class="wx-h r"><b>D</b></span></div></div>'
        + '<div class="wx-final">' + img + '</div>'
        + '<div class="wx-info"><div class="wx-kick">Banner unlocked</div><div class="wx-name">' + esc(b.name || 'A new banner') + '</div>'
        +   '<div class="wx-btns"><button class="aura-roll" data-wx="wear"><i class="ti ti-photo"></i> Put it on my profile</button>'
        +   '<button class="aura-reset" data-wx="close">Later</button></div>'
        +   '<div class="np-ink-hint" style="opacity:1;animation:none;">Tap anywhere to continue</div></div>'
        + '</div>';
      document.body.appendChild(ov);
      var env = ov.querySelector('.wx-env');
      var ready = false, closed = false;
      var at = function(ms, fn){ setTimeout(function(){ if (!closed) fn(); }, ms); };
      var finish = function(){ ov.classList.add('s1', 's2', 's3', 's4', 's5'); at(400, function(){ ready = true; }); };
      requestAnimationFrame(function(){ ov.classList.add('in'); });
      if (reducedMotion()) finish();
      else {
        at(60, function(){ ov.classList.add('s1'); });
        at(800, function(){ env.classList.add('shake'); });
        at(1300, function(){ ov.classList.add('s2'); });
        at(1750, function(){ ov.classList.add('s3'); });
        at(2300, function(){ ov.classList.add('s4'); });
        at(3150, finish);
      }
      var close = function(){
        if (closed) return; closed = true;
        ov.classList.remove('in'); setTimeout(function(){ ov.remove(); }, 250);
        document.removeEventListener('keydown', onKey); resolve();
      };
      var onKey = function(e){ if (e.key === 'Escape') close(); else if (e.key === 'Enter' && !ready) finish(); };
      document.addEventListener('keydown', onKey);
      ov.addEventListener('click', function(e){
        var act = e.target.closest && e.target.closest('[data-wx]');
        if (act && act.getAttribute('data-wx') === 'wear') { close(); useBanner(b.id); return; }
        if (!ready) { finish(); return; }   // first tap skips to the end
        close();
      });
    });
  }
  window.rollRandom = async function(kind){
    var btn = document.getElementById('roll-' + kind);
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader"></i> Rolling\u2026'; }
    if (kind !== 'banner') dsRollOpen();
    var r = await db.rpc('ds_randomizer_roll', { p_kind: kind });
    var d = r.data || {};
    if (r.error || d.status === 'error') { dsRollClose(); toast('Something went wrong. No Embers were taken.', 'ti-alert-triangle', true); await load(); return; }
    if (d.status === 'insufficient_embers') { dsRollClose(); toast('You need ' + d.cost + ' Embers for that.', 'ti-flame', true); await load(); return; }
    if (d.status === 'empty' || d.status === 'all_owned') { dsRollClose(); await load(); return; }
    if (kind === 'banner') {
      dsRollClose();
      await load();
      refreshEmbers(d.balance);
      var won = BANNERS.filter(function(x){ return x.id === d.id; })[0] || { id: d.id, name: d.name };
      if (won.url) await new Promise(function(ok){ var im = new Image(); im.onload = im.onerror = ok; im.src = won.url; setTimeout(ok, 2500); });
      await wxLetter(won);
      var bn = document.getElementById('rand-note');
      if (bn) bn.innerHTML = 'You won <b>' + esc(d.name || '') + '</b>. <a href="#banners" onclick="setTab(\'banners\');return false;" style="color:var(--accent);">See it in Banners</a>.';
      return;
    }
    await dsRollReveal({
      label: d.name || (kind === 'banner' ? 'A new banner' : 'A new character'),
      kicker: kind === 'banner' ? 'Banner unlocked' : 'Character unlocked',
      sub: kind === 'banner' ? 'Set it from your profile whenever you like.' : 'They\u2019ve joined your crew.'
    });
    await load();
    refreshEmbers(d.balance);
    var note = document.getElementById('rand-note');
    if (note) note.innerHTML = 'You won <b>' + esc(d.name || '') + '</b>. '
      + (kind === 'banner' ? '<a href="#banners" onclick="setTab(\'banners\');return false;" style="color:var(--accent);">See it in Banners</a> to put it on your profile.'
                          : '<a href="#characters" onclick="setTab(\'characters\');return false;" style="color:var(--accent);">Meet them in Characters</a>.');
  };

  window.setAura = async function(hex){
    var prev = AURA.hex;
    AURA.hex = hex || '#2dd4bf';
    if (window.dsApplyAccent) dsApplyAccent(hex || null);
    try { localStorage.setItem('ds_accent_hex', hex || ''); } catch(e){}
    render();
    var r = await db.rpc('ds_set_accent_color', { p_hex: hex });
    if (r.error || !r.data || r.data.status !== 'success'){
      AURA.hex = prev;
      if (window.dsApplyAccent) dsApplyAccent(prev === '#2dd4bf' ? null : prev);
      render();
      toast('Could not save that aura.', 'ti-alert-triangle', true);
    }
  };

  /* ── ROLL REVEAL ─────────────────────────────────────────────────
     dsRollOpen() goes up the moment Embers are committed; dsRollReveal()
     resolves once the user dismisses; dsRollClose() backs out silently when
     the roll fails or there was nothing left to win. The charge has a floor
     (1.2s, 0.5s with reduced motion): rolls often return in under 200ms and
     the reveal would be over before anyone noticed it. */
  var ROLL_MIN_CHARGE = 1200;
  var rollState = null;
  function reducedMotion(){ try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e) { return false; } }
  function dsRollOpen(){
    dsRollClose();
    var hex = AURA.hex || '#2dd4bf';
    var ov = document.createElement('div');
    ov.className = 'roll-overlay charging';
    ov.style.setProperty('--roll-hex', hex);
    var sparks = '';
    for (var i = 0; i < 7; i++) {
      sparks += '<div class="roll-spark" style="--dx:' + ((i - 3) * 14) + 'px;animation-delay:' + (i * 0.19).toFixed(2) + 's;"></div>';
    }
    ov.innerHTML = '<div class="roll-stage">' + sparks
      + '<div class="roll-ring"></div><div class="roll-burst"></div>'
      + '<div class="roll-flame" id="roll-flame">' + flameSvg(hex, 900, false) + '</div>'
      + '<div class="roll-charging-text">The ink takes flame</div>'
      + '<div class="roll-label" id="roll-label"></div></div>';
    document.body.appendChild(ov);
    void ov.offsetWidth;          // make the fade-in actually run
    ov.classList.add('open');
    rollState = { el: ov, t0: Date.now() };
  }
  function dsRollClose(){
    if (!rollState) return;
    var el = rollState.el; rollState = null;
    el.classList.remove('open');
    setTimeout(function(){ el.remove(); }, 250);
  }
  // A name in a very dark colour is lightened for reading; the flame keeps the true colour.
  function readableHex(hex){
    var h = hexHsl(hex);
    return h.l < 0.45 ? lighten(hex, 0.45) : hex;
  }
  function dsRollReveal(opts){
    return new Promise(function(resolve){
      if (!rollState) { resolve(); return; }
      var st = rollState;
      var floor = reducedMotion() ? 500 : ROLL_MIN_CHARGE;
      var wait = Math.max(0, floor - (Date.now() - st.t0));
      setTimeout(function(){
        if (rollState !== st) { resolve(); return; }
        if (opts.hex) {
          st.el.style.setProperty('--roll-hex', opts.hex);
          var fl = document.getElementById('roll-flame');
          if (fl) fl.innerHTML = flameSvg(opts.hex, 901, false);
        }
        document.getElementById('roll-label').innerHTML =
          '<div class="roll-kicker">' + esc(opts.kicker || 'Unlocked') + '</div>'
          + '<div class="roll-name" style="color:' + esc(readableHex(opts.hex || AURA.hex || '#2dd4bf')) + ';">' + esc(opts.label || '') + '</div>'
          + (opts.rare ? '<div class="roll-rare">\u2726 Rare</div>' : '')
          + (opts.sub ? '<div class="roll-sub">' + opts.sub + '</div>' : '')
          + '<div class="roll-dismiss">Tap anywhere to continue</div>';
        st.el.classList.remove('charging');
        st.el.classList.add('revealed');
        function done(){
          st.el.removeEventListener('click', done);
          document.removeEventListener('keydown', onKey);
          if (rollState === st) dsRollClose();
          resolve();
        }
        function onKey(e){ if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') done(); }
        // A beat before a tap counts, so a finger still on the Roll button
        // doesn't dismiss its own reveal.
        setTimeout(function(){
          if (rollState !== st) return;
          st.el.addEventListener('click', done);
          document.addEventListener('keydown', onKey);
        }, 450);
      }, wait);
    });
  }

  window.rollAura = async function(){
    var btn = document.getElementById('aura-roll');
    var note = document.getElementById('aura-note');
    btn.disabled = true;
    btn.innerHTML = '<i class="ti ti-loader"></i> Rolling\u2026';
    dsRollOpen();
    var r = await db.rpc('roll_accent_color', { p_user_id: ME.id });
    var d = r.data || {};
    if (r.error){ dsRollClose(); toast('Something went wrong. No Embers were taken.', 'ti-alert-triangle', true); btn.disabled = false; return; }
    if (d.status === 'insufficient_embers'){ dsRollClose(); toast('You need ' + (d.cost || AURA_COST) + ' Embers for that.', 'ti-flame', true); btn.disabled = false; return; }
    if (d.status === 'all_unlocked'){
      dsRollClose();
      if (note) note.textContent = 'You have them all, for now.';
      btn.disabled = false; return;
    }
    var info = AURA_INFO[String(d.hex || '').toLowerCase()] || {};
    await dsRollReveal({
      hex: d.hex, label: d.label || info.name || 'A new aura', rare: !!info.rare,
      kicker: 'Aura unlocked',
      sub: 'It\u2019s previewing now on the Aura tab. Press <b>Accept aura colour</b> to wear it.'

    // tap-then-Accept rule as every other aura change.
    AURA_PICK = d.hex || null;

    refreshEmbers();

  async function openChar(id){

    document.getElementById('view').innerHTML =
      '<div class="state"><i class="ti ti-loader"></i>A moment…</div>';

    var res = await Promise.all([
      db.from('ds_character_poses').select('*').eq('character_id', id).order('pose_order'),
      db.from('ds_character_expressions').select('*').eq('character_id', id),
      db.rpc('ds_character_lines_for', { p_character_id: id }),
      db.rpc('ds_character_progress',  { p_character_id: id })
    ]);
    POSES = res[0].data || [];
    (res[1].data || []).forEach(function(e){ FACES[e.slug] = e.image_path; });
    LINES = res[2].data || [];
    OPEN._progress = res[3].data || null;
    renderDetail();

  function unlockPanel(c, prog){
    if(c.availability === 'secret'){
      return '<div class="panel"><h3>Not found yet</h3>'
        + '<p>Some of the crew turn up on their own, for people who read the right things. '
        + 'Nobody is going to tell you which.</p></div>';

    if(c.availability === 'purchase'){
      return '<div class="panel"><h3>In the shop</h3>'
        + '<p>This one is bought outright, and stays yours.</p></div>';
    }
    var goal = (prog && prog.goal) || c.ember_unlock_price || 0;
    var have = (prog && prog.pledged) || 0;
    var pct  = goal ? Math.min(100, Math.round(have / goal * 100)) : 0;
    return '<div class="panel">'
      + '<h3>Being opened</h3>'
      + '<p>Give a few Embers whenever you like. When the last one lands, everybody who '
      +   'helped gets them \u2014 and the next of the crew steps forward.</p>'
      + '<div class="bar"><i style="width:' + pct + '%"></i></div>'
      + '<div class="bar-note">' + have.toLocaleString() + ' of ' + goal.toLocaleString()
      +   ' Embers \u00b7 ' + ((prog && prog.backers) || 0) + ' helping'
      +   ((prog && prog.mine) ? ' \u00b7 you have given ' + prog.mine.toLocaleString() : '') + '</div>'
      + '<div class="give">'
      +   '<input id="give-amt" type="number" min="1" max="1000" value="10" aria-label="Embers to give"/>'
      +   '<button class="btn primary" onclick="give(\'' + esc(c.id) + '\')">'
      +     '<i class="ti ti-flame"></i> Give Embers</button>'
      + '</div></div>';
  }

  /* Tap to talk. Picks a line for that spot at random from the ones this
     viewer has earned, and swaps the face to match if the line names one. */
  function say(where){
    var pool = LINES.filter(function(l){ return l.trigger === where; });
    if(!pool.length) pool = LINES.filter(function(l){ return l.trigger === 'idle'; });
    if(!pool.length) return;
    var line = pool[Math.floor(Math.random() * pool.length)];

    var b = document.getElementById('bubble');
    b.innerHTML = '<span class="who">' + esc(OPEN.name) + '</span>' + esc(line.body);
    b.classList.add('show');

    var face = document.getElementById('face'), img = document.getElementById('face-img');
    clearTimeout(faceTimer);
    if(line.image_path && face && img){
      img.src = assetUrl(line.image_path);
      face.classList.add('show');
      // Back to the drawn expression after a beat, so the figure is not left
      // wearing a reaction to something that happened a minute ago.
      faceTimer = setTimeout(function(){ face.classList.remove('show'); }, 4000);
    }
  }

  async function makeActive(id){
    var r = await db.rpc('ds_character_set_active', { p_character_id: id });
    if(r.error || !r.data || r.data.ok !== true){
      toast((r.data && r.data.error) || 'Could not do that', 'ti-x', true); return;
    }
    Object.keys(MINE).forEach(function(k){ MINE[k].is_active = (k === id); });
    toast('They are with you now');
    renderDetail();
  }

  async function give(id){
    var el = document.getElementById('give-amt');
    var amt = Math.floor(Number(el && el.value));
    if(!amt || amt < 1){ toast('Pick an amount first', 'ti-x', true); return; }
    var r = await db.rpc('ds_pledge_embers', { p_character_id: id, p_embers: amt });
    if(r.error || !r.data || r.data.ok !== true){
      toast((r.data && r.data.error) || (r.error && r.error.message) || 'Could not give that', 'ti-x', true);
      return;
    }
    refreshEmbers(typeof r.data.balance === 'number' ? r.data.balance : undefined);
    if(r.data.unlocked){
      toast('Open! They belong to everyone who helped.', 'ti-sparkles');
      await load();
      return openChar(id);
    }
    toast('Given \u2014 ' + r.data.pledged.toLocaleString() + ' of ' + r.data.goal.toLocaleString());
    var p = await db.rpc('ds_character_progress', { p_character_id: id });
    OPEN._progress = p.data || OPEN._progress;
    renderDetail();
  }

  boot();
</script>
<script src="footer.js"></script>
<script src="nav.js"></script>
</body>
</html>
