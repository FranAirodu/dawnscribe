<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var t=localStorage.getItem('ds_theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DawnScribe — Email preferences</title>
  <meta name="robots" content="noindex,nofollow"/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--accent:#2dd4bf;--accent2:#0d9488;--text:#f1f0ff;--text2:#9b9bc0;--text3:#5a5a80;--border:rgba(255,255,255,0.07);--red:#f87171;--green:#34d399;}
    html[data-theme="light"]{--bg:#f4f4f8;--bg2:#ffffff;--bg3:#ebebf2;--accent:#0d9488;--accent2:#0f766e;--text:#0a0a0f;--text2:#3a3a5c;--text3:#7a7a9a;--border:rgba(0,0,0,0.08);--red:#dc2626;--green:#059669;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;max-width:440px;width:100%;padding:40px 34px;text-align:center;}
    .logo{font-family:'Cinzel',serif;font-size:26px;color:var(--accent);letter-spacing:1px;text-decoration:none;display:inline-block;margin-bottom:22px;}
    .logo span{color:var(--text);}
    h1{font-family:'Cinzel',serif;font-size:21px;font-weight:600;margin-bottom:12px;}
    p{font-size:14.5px;color:var(--text2);line-height:1.75;}
    .actions{margin-top:26px;display:flex;flex-direction:column;gap:12px;align-items:center;}
    button{background:var(--accent2);color:#fff;border:0;border-radius:9px;padding:12px 26px;font-family:'Lato',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:opacity 0.2s;}
    button:hover{opacity:0.88;}
    button:disabled{opacity:0.5;cursor:default;}
    a.secondary{color:var(--text3);font-size:13px;text-decoration:underline;}
    a.secondary:hover{color:var(--accent);}
    .cta{display:inline-block;background:var(--accent2);color:#fff;padding:11px 24px;border-radius:9px;text-decoration:none;font-weight:700;font-size:13.5px;margin-top:22px;}
    .good{color:var(--green);}
    .bad{color:var(--red);}
    .spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
  <div class="card">
    <a class="logo" href="/">Dawn<span>Scribe</span></a>
    <div id="view"><div class="spinner"></div></div>
  </div>

  <script>
    // Confirmation page for email unsubscribe links.
    //
    // WHY THIS PAGE EXISTS (session 26): the unsubscribe link used to hit the
    // edge function directly, and a plain GET turned email off. Mail scanners,
    // Outlook Safe Links and antivirus checkers PREFETCH links in email, so
    // people were unsubscribed without ever clicking. Loading this page changes
    // NOTHING -- the mutation only happens on the POST fired by the button.
    // Keep it that way: never call the function with POST on page load.
    //
    // The page lives on the site rather than in the edge function because the
    // Supabase function gateway rewrites text/html responses to text/plain, so
    // a function cannot serve a readable page (verified by probe, session 26).
    (function () {
      var FN = 'https://cajjyyskpmjnpcxcfeuk.supabase.co/functions/v1/email-unsubscribe';
      var view = document.getElementById('view');

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function render(title, body, opts) {
        opts = opts || {};
        var html = '<h1' + (opts.tone ? ' class="' + opts.tone + '"' : '') + '>' + esc(title) + '</h1>' +
                   '<p>' + esc(body) + '</p>';
        if (opts.confirm) {
          html += '<div class="actions">' +
                  '<button id="go" type="button">Yes, turn off emails</button>' +
                  '<a class="secondary" href="/">No, keep them on</a>' +
                  '</div>';
        } else {
          html += '<a class="cta" href="/">Back to DawnScribe</a>';
        }
        view.innerHTML = html;
        if (opts.confirm) document.getElementById('go').addEventListener('click', doUnsub);
      }

      var params = new URLSearchParams(location.search);
      var token = params.get('token') || '';
      var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

      function doUnsub() {
        var btn = document.getElementById('go');
        if (btn) { btn.disabled = true; btn.textContent = 'Working\u2026'; }
        fetch(FN + '?token=' + encodeURIComponent(token), { method: 'POST' })
          .then(function (r) { return r.json().catch(function () { return null; }); })
          .then(function (d) {
            // The function reports outcome in the body, not only via HTTP status
            // -- check the payload, not just that the request resolved.
            if (d && d.ok && d.status === 'unsubscribed') {
              render('You\u2019re unsubscribed', 'You will no longer receive email notifications from DawnScribe. You can turn them back on any time from Settings.', { tone: 'good' });
            } else if (d && d.status === 'expired') {
              render('Link expired', 'This unsubscribe link is no longer valid. You can manage email preferences from your account settings.');
            } else {
              render('Something went wrong', 'We could not turn off your emails. Please try again, or change this from Settings.', { tone: 'bad' });
            }
          })
          .catch(function () {
            render('Something went wrong', 'We could not reach DawnScribe. Please try again, or change this from Settings.', { tone: 'bad' });
          });
      }

      if (!UUID_RE.test(token)) {
        render('Invalid link', 'This unsubscribe link is invalid or incomplete. You can manage email preferences from your account settings instead.');
        return;
      }

      // Read-only check so an already-used or bogus token says so up front.
      fetch(FN + '?token=' + encodeURIComponent(token), { method: 'GET' })
        .then(function (r) { return r.json().catch(function () { return null; }); })
        .then(function (d) {
          if (d && d.ok && d.status === 'valid') {
            render('Turn off emails?', 'Confirm below and DawnScribe will stop sending you email notifications. You can turn them back on any time from Settings.', { confirm: true });
          } else if (d && d.status === 'expired') {
            render('Link expired', 'This unsubscribe link is no longer valid. You can manage email preferences from your account settings.');
          } else {
            render('Invalid link', 'This unsubscribe link is invalid or incomplete. You can manage email preferences from your account settings instead.');
          }
        })
        .catch(function () {
          // Network failure: still offer the button rather than dead-ending.
          render('Turn off emails?', 'Confirm below and DawnScribe will stop sending you email notifications. You can turn them back on any time from Settings.', { confirm: true });
        });
    })();
  </script>
</body>
</html>
