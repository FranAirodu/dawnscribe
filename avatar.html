<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Avatar — DawnScribe</title>
  <script>
    (function(){
      var t=localStorage.getItem('ds_theme');
      if(t==='light'){document.documentElement.setAttribute('data-theme','light');}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="avatarRender.js"></script>
  <style>
    :root {
      --bg:#0f1117; --bg2:#161b27; --bg3:#1e2535; --bg4:#252d3d;
      --border:#2a3347; --text:#e8eaf0; --text2:#9ba3b8; --text3:#5c6480;
      --accent:#2dd4bf; --gold:#f59e0b; --red:#f87171;
    }
    [data-theme="light"] {
      --bg:#f4f5f8; --bg2:#ffffff; --bg3:#eef0f5; --bg4:#e4e7ef;
      --border:#d0d5e8; --text:#1a1f2e; --text2:#4a5270; --text3:#8890a8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Lato', sans-serif; min-height: 100vh; }

    /* NAV */
    nav { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .nav-left { display: flex; align-items: center; gap: 16px; }
    .logo { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: 0.5px; }
    .logo span { color: var(--accent); }
    .back-btn { display: flex; align-items: center; gap: 6px; color: var(--text2); font-size: 13px; font-weight: 700; text-decoration: none; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); transition: all 0.2s; }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); }

    .page-wrap { max-width: 1080px; margin: 0 auto; padding: 40px 20px 80px; }
    .page-header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
    .page-icon { width: 48px; height: 48px; border-radius: 12px; background: rgba(45,212,191,0.1); border: 1px solid rgba(45,212,191,0.2); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 22px; flex-shrink: 0; }
    .page-title { font-family: 'Cinzel', serif; font-size: 26px; font-weight: 700; }
    .page-title span { color: var(--accent); }
    .page-subtitle { color: var(--text3); font-size: 13px; margin-top: 3px; }

    .editor-layout { display: grid; grid-template-columns: 360px 1fr; gap: 24px; align-items: start; }
    @media (max-width: 840px) { .editor-layout { grid-template-columns: 1fr; } }

    /* ── PREVIEW PANEL ────────────────────────────────────────── */
    .preview-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; align-items: center; position: sticky; top: 84px; }
    .preview-canvas-wrap { width: 100%; max-width: 320px; aspect-ratio: 2/3; background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; position: relative; }
    .preview-canvas-wrap svg { width: 100%; height: 100%; display: block; }
    .preview-note { font-size: 11px; color: var(--text3); text-align: center; margin-top: 12px; line-height: 1.6; }
    .pose-row { display: flex; justify-content: center; gap: 8px; margin: 10px 0 12px; }
    .pose-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg2); color: var(--text3); font-size: 11px; font-weight: 600; cursor: pointer; transition: border-color .15s, color .15s; }
    .pose-btn i { font-size: 18px; }
    .pose-btn:hover { color: var(--text1); border-color: var(--text3); }
    .pose-btn.active { color: var(--accent); border-color: var(--accent); }
    .pose-btn.pose-locked { opacity: 0.45; cursor: default; }
    .pose-btn.pose-locked:hover { color: var(--text3); border-color: var(--border); }
    .pose-btn.pose-unlockable { color: #f97316; border-color: rgba(249,115,22,0.45); }
    .pose-btn.pose-unlockable:hover { color: #fb923c; border-color: #f97316; }
    .pose-btn .pose-cost { font-size: 10px; font-weight: 700; display: flex; align-items: center; gap: 3px; }
    .display-roll-wrap { text-align: center; margin: 2px 0 10px; }
    .display-roll-btn { background: #f97316; border: none; border-radius: 9px; padding: 8px 16px; color: #1a1208; font-size: 12px; font-weight: 700; font-family: 'Lato', sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: opacity .2s; }
    .display-roll-btn:hover { opacity: 0.85; }
    .display-roll-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .display-roll-btn .pose-cost { font-size: 11px; }
    .display-roll-note { font-size: 10px; color: var(--text3); margin-top: 5px; }
    .ds-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 500; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .18s; }
    .ds-modal-overlay.open { opacity: 1; pointer-events: auto; }
    .ds-modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 26px 28px; width: min(92vw, 380px); text-align: center; transform: translateY(8px); transition: transform .18s; box-shadow: 0 18px 50px rgba(0,0,0,0.5); }
    .ds-modal-overlay.open .ds-modal { transform: translateY(0); }
    .ds-modal-icon { width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; background: rgba(249,115,22,0.12); color: #f97316; }
    .ds-modal-icon.error { background: rgba(232,88,74,0.12); color: var(--accent-red, #e8584a); }
    .ds-modal-title { font-size: 16px; font-weight: 700; color: var(--text1); margin-bottom: 8px; }
    .ds-modal-body { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 20px; }
    .ds-modal-body b { color: #f97316; }
    .ds-modal-actions { display: flex; gap: 10px; justify-content: center; }
    .ds-modal-btn { padding: 9px 22px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text2); transition: filter .15s, border-color .15s; }
    .ds-modal-btn:hover { border-color: var(--text3); color: var(--text1); }
    .ds-modal-btn.primary { background: #f97316; border-color: #f97316; color: #1a0e04; }
    .ds-modal-btn.primary:hover { filter: brightness(1.1); }
    .save-btn { width: 100%; max-width: 320px; margin-top: 16px; background: var(--accent); border: none; border-radius: 9px; padding: 12px; color: var(--bg); font-size: 13px; font-weight: 700; font-family: 'Lato', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
    .save-btn:hover { opacity: 0.9; }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .save-status { font-size: 12px; color: var(--accent); margin-top: 8px; text-align: center; min-height: 16px; }

    /* ── CONTROLS PANEL / TABS ────────────────────────────────── */
    .controls-panel { display: flex; flex-direction: column; }
    .tab-bar { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 0; background: var(--bg2); border-radius: 14px 14px 0 0; border: 1px solid var(--border); overflow: hidden; }
    .tab-btn { flex: 1; padding: 12px 6px; font-size: 11px; font-weight: 700; font-family: 'Lato', sans-serif; color: var(--text2); background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all 0.15s; text-transform: uppercase; letter-spacing: 0.5px; }
    .tab-btn i { font-size: 18px; }
    .tab-btn:hover { color: var(--text); background: var(--bg3); }
    .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); background: rgba(45,212,191,0.04); }
    .tab-panel { background: var(--bg2); border: 1px solid var(--border); border-top: none; border-radius: 0 0 14px 14px; padding: 20px; display: none; }
    .tab-panel.active { display: block; }

    /* skin tone swatches */
    /* ── BACKGROUND PICKER ─────────────────────── */
  .bg-picker-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 4px;
  }
  .bg-tile {
    cursor: pointer;
    border-radius: 8px;
    border: 2px solid var(--border, rgba(255,255,255,0.08));
    overflow: hidden;
    transition: border-color 0.15s, transform 0.1s;
    background: var(--bg2, #1e2130);
  }
  .bg-tile:hover { border-color: var(--accent, #2dd4bf); transform: scale(1.03); }
  .bg-tile-active { border-color: var(--accent, #2dd4bf) !important; box-shadow: 0 0 0 2px var(--accent, #2dd4bf); }
  .bg-tile-thumb {
    width: 100%;
    aspect-ratio: 2/3;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--bg1, #141622);
  }
  .bg-tile-thumb svg { display: block; width: 100%; height: 100%; }
  .bg-tile-none { background: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(255,255,255,0.04) 4px, rgba(255,255,255,0.04) 8px); }
  .bg-tile-label {
    font-size: 10px;
    font-weight: 600;
    text-align: center;
    color: var(--text2, #a0aec0);
    padding: 4px 4px 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .swatch-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .swatch { width: 26px; height: 32px; cursor: pointer; transition: all 0.15s; flex-shrink: 0; position: relative; filter: drop-shadow(0 0 0px transparent); }
    .swatch svg { width: 100%; height: 100%; }
    .swatch:hover { transform: scale(1.15); filter: drop-shadow(0 0 4px currentColor); }
    .swatch.selected svg path { stroke: var(--accent); stroke-width: 2; }
    .swatch.selected { filter: drop-shadow(0 0 5px var(--accent)); }
    .swatch-locked { position: relative; opacity: 0.35; cursor: not-allowed; }
    .swatch-locked:hover { transform: none; filter: none; }
    .swatch-locked i { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 12px; color: var(--text); }

    /* slot tabs */
    .slot-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .slot-tab { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; font-size: 12px; font-weight: 700; color: var(--text2); cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.15s; }
    .slot-tab:hover { color: var(--text); }
    .slot-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(45,212,191,0.06); }

    /* item grid */
    .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; }
    .item-option { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: all 0.15s; }
    .item-option:hover { border-color: rgba(45,212,191,0.3); }
    .item-option.selected { border-color: var(--accent); background: rgba(45,212,191,0.06); }
    .item-option-thumb { width: 40px; height: 40px; border-radius: 8px; background: var(--bg4); display: flex; align-items: center; justify-content: center; color: var(--text3); font-size: 18px; }
    .item-option.locked { cursor: pointer; opacity: 0.85; position: relative; }
    .item-option.locked:hover { border-color: rgba(245,158,11,0.5); }
    .item-option-price { display: flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; color: var(--gold); margin-top: 1px; }
    .item-option-price i { font-size: 11px; }
    .buy-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 600; align-items: center; justify-content: center; padding: 20px; }
    .buy-modal-overlay.show { display: flex; }
    .buy-modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 22px; max-width: 360px; width: 100%; }
    .buy-modal h3 { font-family: 'Cinzel', serif; font-size: 17px; color: var(--text); margin-bottom: 6px; }
    .buy-modal p { font-size: 13px; color: var(--text2); margin-bottom: 16px; }
    .buy-modal-price { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 700; color: var(--gold); margin-bottom: 18px; }
    .buy-modal-btns { display: flex; gap: 8px; }
    .buy-modal-btn { flex: 1; padding: 10px; border-radius: 9px; font-size: 13px; font-weight: 700; font-family: 'Lato', sans-serif; cursor: pointer; border: none; }
    .buy-modal-btn.confirm { background: #f59e0b; color: #1a1208; }
    .buy-modal-btn.confirm:disabled { opacity: 0.5; cursor: not-allowed; }
    .buy-modal-btn.cancel { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
    .item-option-name { font-size: 10px; color: var(--text2); text-align: center; line-height: 1.3; }
    .item-option.none .item-option-thumb { color: var(--text3); }

    /* color pickers */
    .color-region { padding: 10px 0; }
    .color-region:not(:last-child) { border-bottom: 1px solid var(--border); }
    .color-region-label { font-size: 12px; color: var(--text2); font-weight: 700; margin-bottom: 8px; display: block; }
    .color-swatch-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .color-swatch { width: 22px; height: 28px; cursor: pointer; transition: all 0.15s; flex-shrink: 0; position: relative; }
    .color-swatch svg { width: 100%; height: 100%; }
    .color-swatch:hover { transform: scale(1.18); filter: drop-shadow(0 0 4px currentColor); }
    .color-swatch.selected svg path { stroke: var(--accent); stroke-width: 2.5; }
    .color-swatch.selected { filter: drop-shadow(0 0 5px var(--accent)); }
    .color-swatch-default::after { content: '★'; position: absolute; top: -4px; right: -4px; font-size: 8px; color: var(--accent); line-height: 1; }

    .empty-note { font-size: 12px; color: var(--text3); text-align: center; padding: 16px 0; }

    /* ── RANDOMIZER ───────────────────────────────────────────── */
    .ember-balance-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .ember-balance { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; color: #f97316; }
    .ember-balance i { font-size: 20px; }
    .ember-balance-label { font-size: 11px; color: var(--text3); font-weight: 400; margin-left: 4px; }
    .randomizer-block { padding: 14px 0; }
    .randomizer-block:not(:last-child) { border-bottom: 1px solid var(--border); }
    .randomizer-block-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .randomizer-block-desc { font-size: 12px; color: var(--text3); margin-bottom: 12px; line-height: 1.5; }
    .randomizer-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .randomizer-select { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--text); font-size: 12px; font-family: 'Lato', sans-serif; cursor: pointer; }
    .reroll-target-label { font-size: 12px; color: var(--text2); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .reroll-target-label b { color: var(--text); }
    .reroll-target-label i { color: var(--accent); }
    .region-tab-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .region-tab { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; color: var(--text2); cursor: pointer; transition: all 0.15s; }
    .region-tab:hover { color: var(--text); }
    .region-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(45,212,191,0.06); }
    .reroll-empty-note { font-size: 12px; color: var(--text3); font-style: italic; }
    .randomizer-btn { background: #f97316; border: none; border-radius: 9px; padding: 10px 18px; color: #1a1208; font-size: 13px; font-weight: 700; font-family: 'Lato', sans-serif; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; white-space: nowrap; }
    .randomizer-btn:hover { opacity: 0.85; }
    .randomizer-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .randomizer-result { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--bg3); border: 1px solid var(--border); display: none; align-items: center; gap: 12px; }
    .randomizer-result.show { display: flex; }
    .randomizer-result-swatch { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); flex-shrink: 0; }
    .randomizer-result-text { font-size: 13px; color: var(--text); }
    .randomizer-result-text b { color: #f97316; }
    .randomizer-result-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .loading-state { padding: 40px 0; text-align: center; color: var(--text3); font-size: 13px; }
    .loading-state i { display: block; margin-bottom: 8px; font-size: 22px; animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="toast" id="avatar-toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg2);border:1px solid rgba(45,212,191,0.3);border-radius:10px;padding:10px 20px;color:var(--text);font-size:13px;font-weight:700;font-family:'Lato',sans-serif;display:flex;align-items:center;gap:8px;opacity:0;transition:all 0.3s;z-index:700;pointer-events:none;"><i class="ti ti-check" style="color:var(--accent);"></i><span id="avatar-toast-msg">Done!</span></div>
<style>#avatar-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}</style>

<div class="buy-modal-overlay" id="buy-modal-overlay">
  <div class="buy-modal">
    <h3 id="buy-modal-name">Item</h3>
    <p>Unlock this item permanently for your avatar.</p>
    <div class="buy-modal-price"><i class="ti ti-feather"></i> <span id="buy-modal-price-amount">0</span> Quills</div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:14px;" id="buy-modal-balance-note">You have 0 Quills.</div>
    <div class="buy-modal-btns">
      <button class="buy-modal-btn cancel" onclick="closeBuyModal()">Cancel</button>
      <button class="buy-modal-btn confirm" id="buy-modal-confirm-btn" onclick="confirmPurchase()">Purchase</button>
    </div>
  </div>
</div>

<nav>
  <div class="nav-left">
    <a class="logo" href="index.html"><span>Dawn</span>Scribe</a>
    <a class="back-btn" href="index.html"><i class="ti ti-arrow-left"></i> Back to home</a>
  </div>
</nav>

<div class="page-wrap">
  <div class="page-header">
    <div class="page-icon"><i class="ti ti-shirt"></i></div>
    <div>
      <div class="page-title">My <span>Avatar</span></div>
      <div class="page-subtitle">Customize your look. Unlock new items and colors through reading rewards and Embers.</div>
    </div>
  </div>

  <div id="editor-root">
    <div class="loading-state"><i class="ti ti-loader"></i>Loading your avatar...</div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://cajjyyskpmjnpcxcfeuk.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhamp5eXNrcG1qbnBjeGNmZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDUyMDUsImV4cCI6MjA5NTMyMTIwNX0.s93zWwRYymTsoW5BfUhUDli13ArCtk4S-tegAs54A2c';
  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  window.db = db;

  // ── CONFIG ──────────────────────────────────────────────────────
  // Slot render order (bottom to top). Matches the layered-asset spec.
  const SLOT_ORDER = [
    'background','companion','effect','pants','shoes','outfit','shirt',
    'jacket','gloves','accessory','neck','back','hair','eyes','lips','hat'
  ];

  // Default skin tone palette, always available at avatar creation.
  // (Legacy hex tones — kept for mapping old saved avatars onto presets.)
  const DEFAULT_SKIN_TONES = ['#f4d9c4','#e8b894','#c98a5e','#8d5a3c','#5c3a26','#3a2418'];

  // Real body artwork presets (avatar_body_presets table). Each preset is a
  // pre-colored PNG in the cosmetic-assets bucket. skin_tone now stores a
  // preset id like 'male_tone1'; legacy hex values map to the default preset.
  const BODY_ASSET_BASE = 'https://cajjyyskpmjnpcxcfeuk.supabase.co/storage/v1/object/public/cosmetic-assets/';
  var bodyPresets = [];

  // Pose metadata. Buttons appear for every pose here; ones missing from
  // the preset's pose_paths render locked ("coming soon"). Add entries as
  // the artist delivers more poses.
  var POSE_DEFS = [
    { id: 'pose1', label: 'Pose A' },
    { id: 'pose2', label: 'Pose B' }
  ];

  // Shared with all avatar-rendering pages — see avatarRender.js.
  function getPoseImagePath(preset, pose) { return DSAvatar.getPoseImagePath(preset, pose); }
  function getBodyPreset(key) { return DSAvatar.getBodyPreset(bodyPresets, key); }

  const SLOT_ICONS = {
    hat: '__hat__', hair: 'ti-cut', eyes: 'ti-eye', lips: '__lips__', skin: 'ti-droplet',
    outfit: 'ti-hanger', shirt: '__shirt__', jacket: 'ti-jacket', gloves: 'ti-hand-stop',
    pants: '__pants__', shoes: 'ti-shoe',
    back: 'ti-backpack', neck: '__neck__', accessory: 'ti-diamond',
    companion: 'ti-paw', effect: 'ti-sparkles', background: 'ti-photo'
  };

  // Slots shown as customization tabs. (background/companion/effect are
  // valid future slots but not surfaced in the editor yet — no items
  // exist for them. Hidden slots are simply skipped.)
  const VISIBLE_SLOTS = ['background','skin','shirt','pants','shoes','jacket','gloves','outfit','accessory','neck','back','hair','eyes','lips','hat'];

  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  // Suggestion B: sanitize hex colors before injecting into style attributes
  function sanitizeHex(hex) {
    if (!hex) return '#888888';
    var clean = String(hex).trim();
    return /^#[0-9a-fA-F]{3,8}$/.test(clean) ? clean : '#888888';
  }

  // Returns a color name from the palette map, or falls back to the hex value
  function colorName(hex) {
    if (!hex) return '';
    var name = window.hexColorMap && window.hexColorMap[hex.toLowerCase()];
    return name || hex;
  }

  // Returns the HSL hue (0-360) of a hex color, used for spectrum sorting
  // Returns a sort key for spectrum ordering.
  // Achromatic colors (black/white/grey, saturation < 8%) sort to the front (key < 0).
  // Chromatic colors sort by hue 0-360.
  function hexHue(hex) {
    if (!hex) return 0;
    hex = hex.replace('#','');
    if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    var r = parseInt(hex.slice(0,2),16)/255;
    var g = parseInt(hex.slice(2,4),16)/255;
    var b = parseInt(hex.slice(4,6),16)/255;
    var max = Math.max(r,g,b), min = Math.min(r,g,b);
    var saturation = max === 0 ? 0 : (max - min) / max;
    // Achromatic — sort by lightness so black→grey→white
    if (saturation < 0.08) return -1 + (max * 0.99); // range -1 to ~-0.01
    var h = 0, d = max - min;
    if (max === r) h = ((g-b)/d + (g<b?6:0)) / 6;
    else if (max === g) h = ((b-r)/d + 2) / 6;
    else h = ((r-g)/d + 4) / 6;
    return h * 360;
  }

  // Flame SVG swatch (free/ember colors)
  function flameSwatch(hex, tooltip, extraClass, onclick) {
    hex = sanitizeHex(hex);
    var tipAttr = tooltip ? ' title="' + esc(tooltip) + '"' : '';
    var clickAttr = onclick ? ' onclick="' + onclick + '"' : '';
    return '<div class="' + extraClass + '"' + tipAttr + clickAttr + '>' +
      '<svg viewBox="0 0 26 32" xmlns="http://www.w3.org/2000/svg">' +
        '<path d="M12 8 C12 8 6 14 6 19 C6 23.5 8.5 27 12 28 C15.5 27 18 23.5 18 19 C18 14 12 8 12 8Z" fill="' + hex + '" stroke="rgba(0,0,0,0.18)" stroke-width="0.8"/>' +
        '<circle cx="19" cy="4" r="2.5" fill="' + hex + '" stroke="rgba(0,0,0,0.18)" stroke-width="0.8"/>' +
        '<circle cx="8" cy="2" r="1.5" fill="' + hex + '" stroke="rgba(0,0,0,0.18)" stroke-width="0.8" opacity="0.75"/>' +
      '</svg>' +
    '</div>';
  }

  // Quill SVG swatch (marketplace/paid colors — placeholder for future use)
  function quillSwatch(hex, tooltip, extraClass, onclick) {
    hex = sanitizeHex(hex);
    var tipAttr = tooltip ? ' title="' + esc(tooltip) + '"' : '';
    var clickAttr = onclick ? ' onclick="' + onclick + '"' : '';
    return '<div class="' + extraClass + '"' + tipAttr + clickAttr + '>' +
      '<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">' +
        '<path d="M28 4C22 4 14 8 10 16c-1.5 3-2 5.5-2 8l3-3c0.5 2 1.5 4 3 5.5L12 30c2-1 4-3 5.5-5.5C20 23 22 21 23 18c2-1 4-3 5-6 0.5-2 0.5-4 0-8z" fill="' + hex + '" stroke="rgba(0,0,0,0.25)" stroke-width="1"/>' +
        '<line x1="10" y1="22" x2="4" y2="28" stroke="' + hex + '" stroke-width="2" stroke-linecap="round"/>' +
      '</svg>' +
    '</div>';
  }

  // ── STATE ───────────────────────────────────────────────────────
  var currentUid = null;
  var avatarData = null;     // { skin_tone, equipped: {slot:{item_id,colors}}, unlocked_skin_tones }
  var allItems = [];          // all cosmetic_items rows
  var unlockedItemIds = new Set();
  var activeSlot = 'shirt';
  var activeRegionId = null; // which fill_region of the active item is selected for Color Unlock
  var dirty = false;
  var emberBalance = 0;
  var quillBalance = 0;

  // Placeholder slot shapes moved to avatarRender.js (DSAvatar.SLOT_PLACEHOLDER_SHAPES).

  // ── INIT ────────────────────────────────────────────────────────
  (async function init(){
    var session = null;
    for (var i = 0; i < 5; i++) {
      session = (await db.auth.getSession()).data.session;
      if (session) break;
      await new Promise(function(r){ setTimeout(r, 350); });
    }
    if (!session) {
      document.getElementById('editor-root').innerHTML = '<div class="empty-note" style="padding:48px 0;">Please <a href="auth.html" style="color:var(--accent);">log in</a> to customize your avatar.</div>';
      return;
    }
    currentUid = session.user.id;

    var [avatarResult, itemsResult, unlockedResult, embersResult, quillsResult, paletteResult, accentPaletteResult, bodyPresetsResult] = await Promise.all([
      db.from('user_avatars').select('*').eq('user_id', currentUid).maybeSingle(),
      db.from('cosmetic_items').select('*').or('status.eq.approved,is_base_item.eq.true'),
      db.from('user_unlocked_items').select('cosmetic_item_id').eq('user_id', currentUid),
      db.from('user_embers').select('balance').eq('user_id', currentUid).maybeSingle(),
      db.from('user_quills').select('balance').eq('user_id', currentUid).maybeSingle(),
      db.from('reroll_color_palette').select('hex,label'),
      db.from('reroll_color_palette').select('hex,label,rarity_weight').eq('region_type','accent').order('label'),
      db.from('avatar_body_presets').select('*').eq('is_active', true).order('sort_order')
    ]);

    bodyPresets = bodyPresetsResult.data || [];

    emberBalance = (embersResult.data && embersResult.data.balance) || 0;
    quillBalance = (quillsResult.data && quillsResult.data.balance) || 0;

    // Build hex → label map for color name tooltips
    window.hexColorMap = {};
    (paletteResult.data || []).forEach(function(c) {
      window.hexColorMap[c.hex.toLowerCase()] = c.label;
    });
    // Also index accent colors
    window.accentPalette = accentPaletteResult.data || [];
    window.accentPalette.forEach(function(c) {
      window.hexColorMap[c.hex.toLowerCase()] = c.label;
    });

    allItems = itemsResult.data || [];
    unlockedItemIds = new Set((unlockedResult.data || []).map(function(u){ return u.cosmetic_item_id; }));

    if (avatarResult.data) {
      avatarData = avatarResult.data;
      if (!avatarData.unlocked_colors) avatarData.unlocked_colors = {};
      if (!avatarData.unlocked_accents) avatarData.unlocked_accents = [];
      // Always ensure default teal is in unlocked accents
      if (avatarData.unlocked_accents.indexOf('#2dd4bf') === -1) avatarData.unlocked_accents.unshift('#2dd4bf');
      // Default accent to teal if never set
      if (!avatarData.accent_color || !avatarData.accent_color.hex) avatarData.accent_color = { hex: '#2dd4bf' };
    } else {
      // First visit — initialize with base items equipped and a default skin tone.
      var _defPreset = getBodyPreset(null);
      avatarData = { skin_tone: _defPreset ? _defPreset.id : DEFAULT_SKIN_TONES[0], equipped: {}, unlocked_skin_tones: [], unlocked_colors: {}, unlocked_accents: ['#2dd4bf'], accent_color: { hex: '#2dd4bf' } };
      allItems.filter(function(it){ return it.is_base_item; }).forEach(function(it) {
        var colors = {};
        (it.fill_regions || []).forEach(function(r){ colors[r.id] = r.default_color; });
        avatarData.equipped[it.slot] = { item_id: it.id, colors: colors };
      });
    }

    if (!avatarData.pose) avatarData.pose = 'pose1';
    if (!avatarData.unlocked_poses || !avatarData.unlocked_poses.length) avatarData.unlocked_poses = ['pose1'];
    // If the saved pose was somehow never unlocked, fall back to pose1
    if (avatarData.unlocked_poses.indexOf(avatarData.pose) === -1) avatarData.pose = 'pose1';
    if (!avatarData.unlocked_display) avatarData.unlocked_display = [];
    if (!avatarData.avatar_position) avatarData.avatar_position = 'center';
    if (typeof avatarData.mirrored !== 'boolean') avatarData.mirrored = false;
    // Guard: saved position/mirror must actually be unlocked
    if (avatarData.avatar_position === 'left' && avatarData.unlocked_display.indexOf('pos_left') === -1) avatarData.avatar_position = 'center';
    if (avatarData.avatar_position === 'right' && avatarData.unlocked_display.indexOf('pos_right') === -1) avatarData.avatar_position = 'center';
    if (avatarData.mirrored && avatarData.unlocked_display.indexOf('mirror') === -1) avatarData.mirrored = false;

    // Migrate legacy hex skin tones onto the artwork preset system: if the
    // saved skin_tone isn't a known preset id, snap it to the default preset.
    if (bodyPresets.length && !bodyPresets.some(function(b){ return b.id === avatarData.skin_tone; })) {
      var _mapped = getBodyPreset(null);
      if (_mapped) avatarData.skin_tone = _mapped.id;
    }

    // Seed localStorage with current accent so all pages pick it up instantly
    var _currentAccentHex = (avatarData.accent_color && avatarData.accent_color.hex) ? avatarData.accent_color.hex : '#2dd4bf';
    if (_currentAccentHex === '#2dd4bf') {
      localStorage.removeItem('ds_accent_hex'); // default teal — no override needed
    } else {
      localStorage.setItem('ds_accent_hex', _currentAccentHex);
    }
    renderEditor();
  })();

  function getItemsForSlot(slot) {
    return allItems.filter(function(it) {
      return it.slot === slot && (it.is_base_item || unlockedItemIds.has(it.id));
    });
  }

  // Marketplace items for this slot the user doesn't own yet — shown as
  // purchasable tiles rather than left out entirely.
  function getPurchasableItemsForSlot(slot) {
    return allItems.filter(function(it) {
      return it.slot === slot && it.is_marketplace_item && it.quill_price != null && !it.is_base_item && !unlockedItemIds.has(it.id);
    });
  }

  function getEquippedItem(slot) {
    var eq = avatarData.equipped[slot];
    if (!eq) return null;
    return allItems.find(function(it){ return it.id === eq.item_id; }) || null;
  }

  // ── RENDER: PREVIEW ──────────────────────────────────────────────
  function renderPreview() {
    // Rendering is shared — see avatarRender.js. Any visual change to the
    // avatar must be made there so index/profile stay in sync.
    document.getElementById('avatar-preview-svg').innerHTML =
      DSAvatar.renderSvg(avatarData, bodyPresets, allItems);
  }

  // ── RENDER: POSE PICKER ──────────────────────────────────────────
  function renderPoseRow() {
    var el = document.getElementById('pose-row');
    if (!el) return;
    var preset = getBodyPreset(avatarData.skin_tone);
    var paths = (preset && preset.pose_paths) || {};
    var ownedPoses = avatarData.unlocked_poses || ['pose1'];
    el.innerHTML = POSE_DEFS.map(function(p) {
      var available = !!paths[p.id];
      if (!available) {
        // Artwork not delivered yet — never sell what can't render
        return '<div class="pose-btn pose-locked" title="Coming soon"><i class="ti ti-lock"></i><span>' + p.label + '</span></div>';
      }
      if (ownedPoses.indexOf(p.id) === -1) {
        return '<div class="pose-btn pose-locked" title="Unlock via a Random Display Unlock below"><i class="ti ti-dice-5"></i><span>' + p.label + '</span></div>';
      }
      var active = (avatarData.pose || 'pose1') === p.id ? ' active' : '';
      return '<button class="pose-btn' + active + '" onclick="setPose(\'' + p.id + '\')" title="' + p.label + '"><i class="ti ti-user"></i><span>' + p.label + '</span></button>';
    }).join('');
    renderDisplayRow(paths);
  }

  // ── RENDER: DISPLAY OPTIONS (position + mirror) ─────────────────
  // pos_left / pos_right / mirror are one-time random Ember unlocks;
  // once owned they toggle freely forever.
  function renderDisplayRow(posePaths) {
    var el = document.getElementById('display-row');
    if (!el) return;
    var owned = avatarData.unlocked_display || [];
    var pos = avatarData.avatar_position || 'center';

    function posBtn(id, key, label, icon) {
      if (key && owned.indexOf(key) === -1) {
        return '<div class="pose-btn pose-locked" title="Unlock via a Random Display Unlock"><i class="ti ti-dice-5"></i><span>' + label + '</span></div>';
      }
      var active = pos === id ? ' active' : '';
      return '<button class="pose-btn' + active + '" onclick="setPosition(\'' + id + '\')" title="' + label + '"><i class="ti ' + icon + '"></i><span>' + label + '</span></button>';
    }

    var html = posBtn('left', 'pos_left', 'Left', 'ti-align-left') +
               posBtn('center', null, 'Center', 'ti-align-center') +
               posBtn('right', 'pos_right', 'Right', 'ti-align-right');

    if (owned.indexOf('mirror') === -1) {
      html += '<div class="pose-btn pose-locked" title="Unlock via a Random Display Unlock"><i class="ti ti-dice-5"></i><span>Mirror</span></div>';
    } else {
      html += '<button class="pose-btn' + (avatarData.mirrored ? ' active' : '') + '" onclick="toggleMirror()" title="Flip your avatar horizontally"><i class="ti ti-arrows-left-right"></i><span>Mirror</span></button>';
    }
    el.innerHTML = html;

    // Roll button: show only while something in the pool is still locked
    var rollWrap = document.getElementById('display-roll-wrap');
    if (rollWrap) {
      var poolLeft = 0;
      POSE_DEFS.forEach(function(p) {
        if (posePaths && posePaths[p.id] && (avatarData.unlocked_poses || []).indexOf(p.id) === -1) poolLeft++;
      });
      ['pos_left', 'pos_right', 'mirror'].forEach(function(k) {
        if (owned.indexOf(k) === -1) poolLeft++;
      });
      if (poolLeft > 0) {
        rollWrap.innerHTML = '<button class="display-roll-btn" ' + (emberBalance < 10 ? 'disabled ' : '') + 'onclick="rollDisplayUnlock()"><i class="ti ti-dice-5"></i> Random Display Unlock <span class="pose-cost"><i class="ti ti-flame"></i>10</span></button>' +
          '<div class="display-roll-note">' + poolLeft + ' option' + (poolLeft === 1 ? '' : 's') + ' left \u2022 poses, positions & mirror</div>';
      } else {
        rollWrap.innerHTML = '';
      }
    }
  }

  function setPosition(pos) {
    if ((avatarData.avatar_position || 'center') === pos) return;
    avatarData.avatar_position = pos;
    dirty = true;
    renderPoseRow();
    renderPreview();
    updateSaveState();
  }

  function toggleMirror() {
    avatarData.mirrored = !avatarData.mirrored;
    dirty = true;
    renderPoseRow();
    renderPreview();
    updateSaveState();
  }

  async function rollDisplayUnlock() {
    if (emberBalance < 10) {
      await dsModal({ title: 'Not enough Embers', body: 'You need <b>10 Embers</b> for a Random Display Unlock. You currently have <b>' + emberBalance + '</b>.', icon: 'ti-flame', error: true });
      return;
    }
    var ok = await dsModal({ confirm: true, title: 'Random Display Unlock', body: 'Spend <b>10 Embers</b> to unlock one <b>random</b> display option \u2014 a pose, avatar position, or the mirror effect. Whatever you get is yours forever.', icon: 'ti-dice-5', okLabel: 'Roll \u2022 10 Embers' });
    if (!ok) return;
    var { data, error } = await db.rpc('roll_display_unlock', { p_user_id: currentUid });
    if (error || !data) {
      await dsModal({ title: 'Something went wrong', body: 'Could not roll right now. Please try again later.', icon: 'ti-alert-triangle', error: true });
      return;
    }
    if (data.status === 'insufficient_embers') {
      await dsModal({ title: 'Not enough Embers', body: 'You need <b>' + data.cost + ' Embers</b> for this roll. You currently have <b>' + data.balance + '</b>.', icon: 'ti-flame', error: true });
      return;
    }
    if (data.status === 'all_unlocked') {
      await dsModal({ title: 'All unlocked!', body: 'You already own every display option. Nice collection!', icon: 'ti-sparkles' });
      renderPoseRow();
      return;
    }
    if (data.status !== 'success') {
      await dsModal({ title: 'Something went wrong', body: 'Could not roll right now. Please try again later.', icon: 'ti-alert-triangle', error: true });
      return;
    }
    emberBalance -= data.cost;
    window.dispatchEvent(new CustomEvent('ds-embers-awarded', { detail: { amount: -data.cost } }));

    var got = data.unlocked;
    var label, applyMsg;
    if (data.kind === 'pose') {
      if (!avatarData.unlocked_poses) avatarData.unlocked_poses = ['pose1'];
      if (avatarData.unlocked_poses.indexOf(got) === -1) avatarData.unlocked_poses.push(got);
      var pd = POSE_DEFS.find(function(p){ return p.id === got; });
      label = (pd ? pd.label : got) + ' pose';
      avatarData.pose = got;
      applyMsg = 'It has been applied to your preview.';
    } else if (data.kind === 'mirror') {
      if (avatarData.unlocked_display.indexOf('mirror') === -1) avatarData.unlocked_display.push('mirror');
      label = 'Mirror effect';
      avatarData.mirrored = true;
      applyMsg = 'It has been applied \u2014 toggle it any time.';
    } else {
      if (avatarData.unlocked_display.indexOf(got) === -1) avatarData.unlocked_display.push(got);
      var side = got === 'pos_left' ? 'left' : 'right';
      label = (side === 'left' ? 'Left' : 'Right') + ' position';
      avatarData.avatar_position = side;
      applyMsg = 'It has been applied \u2014 switch positions any time.';
    }
    dirty = true;
    renderPoseRow();
    renderPreview();
    updateSaveState();
    await dsModal({ title: 'You unlocked: ' + label + '!', body: 'The <b>' + label + '</b> is now permanently yours. ' + applyMsg + ' Remember to hit <b>Save Avatar</b>.', icon: 'ti-confetti' });
  }

  // ── MODAL (styled replacement for alert/confirm) ────────────────
  function dsModal(opts) {
    return new Promise(function(resolve) {
      var overlay = document.createElement('div');
      overlay.className = 'ds-modal-overlay';
      overlay.innerHTML =
        '<div class="ds-modal" role="dialog" aria-modal="true">' +
          '<div class="ds-modal-icon' + (opts.error ? ' error' : '') + '"><i class="ti ' + (opts.icon || 'ti-flame') + '"></i></div>' +
          '<div class="ds-modal-title">' + opts.title + '</div>' +
          '<div class="ds-modal-body">' + opts.body + '</div>' +
          '<div class="ds-modal-actions">' +
            (opts.confirm
              ? '<button class="ds-modal-btn" data-act="cancel">Cancel</button><button class="ds-modal-btn primary" data-act="ok">' + (opts.okLabel || 'Confirm') + '</button>'
              : '<button class="ds-modal-btn primary" data-act="ok">' + (opts.okLabel || 'OK') + '</button>') +
          '</div>' +
        '</div>';
      function close(val) {
        overlay.classList.remove('open');
        setTimeout(function(){ overlay.remove(); }, 200);
        resolve(val);
      }
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) close(false);
        var act = e.target.closest && e.target.closest('[data-act]');
        if (act) close(act.dataset.act === 'ok');
      });
      document.body.appendChild(overlay);
      requestAnimationFrame(function(){ overlay.classList.add('open'); });
    });
  }

  function setPose(pose) {
    if ((avatarData.pose || 'pose1') === pose) return;
    avatarData.pose = pose;
    dirty = true;
    renderPoseRow();
    renderPreview();
    updateSaveState();
  }

    }).join('');
    // Locked placeholders hint at tones the artist hasn't delivered yet
    html += '<div class="swatch swatch-locked" title="More tones coming soon"><i class="ti ti-lock"></i></div>';
    html += '<div class="swatch swatch-locked" title="More tones coming soon"><i class="ti ti-lock"></i></div>';
    document.getElementById('skin-tone-row').innerHTML = html;

      var label = slot.charAt(0).toUpperCase() + slot.slice(1);
      var hasEquipped = !!avatarData.equipped[slot];
      var iconHtml = (icon === '__lips__') ? LIPS_SVG : (icon === '__pants__') ? PANTS_SVG : (icon === '__neck__') ? NECK_SVG : (icon === '__shirt__') ? SHIRT_SVG : (icon === '__hat__') ? HAT_SVG : '<i class="ti ' + icon + '"></i>';
      return '<div class="slot-tab' + active + '" onclick="selectSlot(\'' + slot + '\')">' + iconHtml + label + '</div>';
    }).join('');
    document.getElementById('slot-tabs').innerHTML = html;
  }

  function selectSlot(slot) {
    activeSlot = slot;
    activeRegionId = null;
    renderSlotTabs();
    if (slot === 'background') {
      document.getElementById('item-grid').innerHTML = '';
      document.getElementById('color-pickers-wrap').style.display = 'none';
      document.getElementById('skin-panel').style.display = 'none';

      if (bgp) bgp.style.display = 'none';

      document.getElementById('color-pickers-wrap').style.display = 'none';
      document.getElementById('skin-panel').style.display = 'block';
      renderSkinTonePicker();
    } else {
      var bgp = document.getElementById('background-panel');
      if (bgp) bgp.style.display = 'none';
      document.getElementById('skin-panel').style.display = 'none';
      document.getElementById('color-pickers-wrap').style.display = 'block';
      renderItemGrid();
      renderColorPickers();
      renderRandomizer();

  function renderBackgroundPicker() {

    panel.innerHTML =

  // ── RENDER: ITEM GRID FOR ACTIVE SLOT ────────────────────────────
  function renderItemGrid() {
    var items = getItemsForSlot(activeSlot);
    var purchasable = getPurchasableItemsForSlot(activeSlot);
    var equippedId = avatarData.equipped[activeSlot] ? avatarData.equipped[activeSlot].item_id : null;
    var icon = SLOT_ICONS[activeSlot] || 'ti-diamond';

    var html = '';
    // "None" option — only for non-base slots (you can't remove your shirt/pants/shoes)
    var slotHasBaseItem = allItems.some(function(it){ return it.slot === activeSlot && it.is_base_item; });
    if (!slotHasBaseItem) {
      var noneSelected = !equippedId ? ' selected' : '';
      html += '<div class="item-option none' + noneSelected + '" onclick="equipItem(null)">' +
        '<div class="item-option-thumb"><i class="ti ti-circle-x"></i></div>' +
        '<div class="item-option-name">None</div>' +
      '</div>';
    }

    if (items.length === 0 && purchasable.length === 0 && slotHasBaseItem === false) {
      html += '<div class="empty-note" style="grid-column:1/-1;">No items unlocked for this slot yet. Keep reading to earn rewards!</div>';
    } else {
      items.forEach(function(it) {
        var selected = it.id === equippedId ? ' selected' : '';
        var thumbColor = (it.fill_regions && it.fill_regions[0]) ? sanitizeHex(it.fill_regions[0].default_color) : null;
        var thumb = thumbColor
          ? '<div class="item-option-thumb" style="background:' + thumbColor + ';"></div>'
          : '<div class="item-option-thumb"><i class="ti ' + icon + '"></i></div>';
        html += '<div class="item-option' + selected + '" onclick="equipItem(&#39;' + esc(it.id) + '&#39;)">' +
          thumb +
          '<div class="item-option-name">' + esc(it.name) + '</div>' +
        '</div>';
      });
      purchasable.forEach(function(it) {
        var thumbColor = (it.fill_regions && it.fill_regions[0]) ? sanitizeHex(it.fill_regions[0].default_color) : null;
        var thumb = thumbColor
          ? '<div class="item-option-thumb" style="background:' + thumbColor + ';"></div>'
          : '<div class="item-option-thumb"><i class="ti ' + icon + '"></i></div>';
        html += '<div class="item-option locked" onclick="openBuyModal(&#39;' + esc(it.id) + '&#39;)">' +
          thumb +
          '<div class="item-option-name">' + esc(it.name) + '</div>' +
          '<div class="item-option-price"><i class="ti ti-feather"></i> ' + (it.quill_price || 0).toLocaleString() + '</div>' +
        '</div>';
      });
    }

    document.getElementById('item-grid').innerHTML = html;
  }

  function equipItem(itemId) {
    if (itemId === null) {
      delete avatarData.equipped[activeSlot];
    } else {
      var item = allItems.find(function(it){ return it.id === itemId; });
      var colors = {};
      (item.fill_regions || []).forEach(function(r){ colors[r.id] = r.default_color; });
      avatarData.equipped[activeSlot] = { item_id: itemId, colors: colors };
    }
    activeRegionId = null;
    dirty = true;
    renderSlotTabs();
    renderItemGrid();
    renderColorPickers();
    renderPreview();
    renderRandomizer();
    updateSaveState();
  }

  // ── RENDER: COLOR PICKERS FOR EQUIPPED ITEM IN ACTIVE SLOT ───────
  function renderColorPickers() {
    var pickers = document.getElementById('color-pickers');
    var rerollSection = document.getElementById('color-reroll-section');
    var emptyNote = document.getElementById('color-empty-note');
    if (!pickers) return;

    var item = getEquippedItem(activeSlot);

    if (!item || !item.fill_regions || item.fill_regions.length === 0) {
      pickers.innerHTML = '';
      if (rerollSection) rerollSection.style.display = 'none';
      if (emptyNote) emptyNote.style.display = 'block';
      return;
    }
    if (emptyNote) emptyNote.style.display = 'none';

    var eq = avatarData.equipped[activeSlot];
    var html = item.fill_regions.map(function(region) {
      var current = (eq.colors && eq.colors[region.id]) || region.default_color;
      var key = activeSlot + ':' + region.id;
      var unlocked = (avatarData.unlocked_colors && avatarData.unlocked_colors[key]) || [];

      var unlockedOthers = unlocked.filter(function(c){ return c !== region.default_color; });
      unlockedOthers.sort(function(a, b){ return hexHue(a) - hexHue(b); });
      var swatches = [region.default_color].concat(unlockedOthers);

      var swatchHtml = swatches.map(function(hex) {
        var selectedClass = hex === current ? ' selected' : '';
        var isDefault = hex === region.default_color ? ' color-swatch-default' : '';
        var tip = colorName(hex) + (hex === region.default_color ? ' (default)' : '');
        var click = "setRegionColor('" + region.id + "', '" + hex + "')";
        return flameSwatch(hex, tip, 'color-swatch' + selectedClass + isDefault, click);
      }).join('');

      return '<div class="color-region">' +
        '<span class="color-region-label">' + esc(region.label || region.id) + '</span>' +
        '<div class="color-swatch-row">' + swatchHtml + '</div>' +
      '</div>';
    }).join('');

    pickers.innerHTML = html;
    if (rerollSection) rerollSection.style.display = 'block';
  }

  function setRegionColor(regionId, hex) {
    var eq = avatarData.equipped[activeSlot];
    if (!eq.colors) eq.colors = {};
    eq.colors[regionId] = hex;
    dirty = true;
    renderColorPickers();
    renderPreview();
    updateSaveState();
  }

  // ── RANDOMIZER ──────────────────────────────────────────────────
  // The active item's recolorable regions (if any). This is what the
  // Color Unlock section now targets — synced with the Equipment tab.
  function getActiveItemRegions() {
    var item = getEquippedItem(activeSlot);
    if (!item || !item.fill_regions || item.fill_regions.length === 0) return [];
    return item.fill_regions;

  function renderRandomizer() {
    document.getElementById('ember-balance-amount').textContent = emberBalance.toLocaleString();
    var dawnBal = document.getElementById('ember-balance-amount-dawn');
    if (dawnBal) dawnBal.textContent = emberBalance.toLocaleString();

    var gachaBtn = document.getElementById('gacha-btn');

    var item = getEquippedItem(activeSlot);
    var regions = getActiveItemRegions();

    if (!item || regions.length === 0) {
      infoEl.innerHTML = '<div class="reroll-empty-note">Select an item with colors in the Equipment section above to unlock new colors for it.</div>';
      rerollBtn.disabled = true;
      return;
    }

    // Default to the first region if none selected yet, or if the
    // previously selected region doesn't exist on this item
    if (!activeRegionId || !regions.some(function(r){ return r.id === activeRegionId; })) {
      activeRegionId = regions[0].id;
    }

    var html = '<div class="reroll-target-label"><i class="ti ti-target-arrow"></i>Unlocking colors for <b>' + esc(item.name) + '</b></div>';

    if (regions.length > 1) {
      html += '<div class="region-tab-row">' + regions.map(function(r) {
        var active = r.id === activeRegionId ? ' active' : '';
        return '<div class="region-tab' + active + '" onclick="selectRegionTab(\'' + r.id + '\')">' + esc(r.label || r.id) + '</div>';
      }).join('') + '</div>';
    }

    infoEl.innerHTML = html;
    rerollBtn.disabled = emberBalance < 1;

    // Skin tone unlock button (separate control, lives in the Skin Tone section)
    var skinBtn = document.getElementById('skin-reroll-btn');
    if (skinBtn) skinBtn.disabled = emberBalance < 1;
  }

  async function rollColorReroll() {
    var btn = document.getElementById('reroll-btn');
    var result = document.getElementById('reroll-result');
    var item = getEquippedItem(activeSlot);
    var regions = getActiveItemRegions();
    if (!item || regions.length === 0 || !activeRegionId) return;

    var region = regions.find(function(r){ return r.id === activeRegionId; });
    if (!region) return;

    var label = item.name + ' — ' + (region.label || region.id);

    btn.disabled = true;
    btn.innerHTML = '<i class="ti ti-loader" style="animation:spin 1s linear infinite;"></i> Rolling...';

    var { data, error } = await db.rpc('roll_color_reroll', {
      p_user_id: currentUid,
      p_region_type: getActiveRegionType(),
      p_slot: activeSlot,
      p_region_id: activeRegionId
    });

    btn.innerHTML = '<i class="ti ti-sparkles"></i> Unlock Color (1 Ember)';

    if (error) {
      result.className = 'randomizer-result show';
      result.innerHTML = '<div class="randomizer-result-text">Something went wrong: ' + esc(error.message) + '</div>';
      btn.disabled = emberBalance < 1;
      return;
    }

    if (data.status === 'insufficient_embers') {
      result.className = 'randomizer-result show';
      result.innerHTML = '<div class="randomizer-result-text">You need <b>1 Ember</b> to unlock a color. You have ' + (data.balance != null ? data.balance : '?') + '.</div>';
      btn.disabled = true;
      return;
    }

    if (data.status !== 'success') {
      result.className = 'randomizer-result show';
      result.innerHTML = '<div class="randomizer-result-text">Could not unlock a color right now. Please try again later.</div>';
      btn.disabled = emberBalance < 1;
      return;
    }

    // Success — permanently unlocked, not auto-applied
    emberBalance -= 1;
    notifyEmbersSpent(1);

    var key = activeSlot + ':' + activeRegionId;
    var alreadyHad = false;
    if (!avatarData.unlocked_colors) avatarData.unlocked_colors = {};
    if (!avatarData.unlocked_colors[key]) avatarData.unlocked_colors[key] = [];
    if (avatarData.unlocked_colors[key].indexOf(data.hex) === -1) {
      avatarData.unlocked_colors[key].push(data.hex);
    } else {
      alreadyHad = true;
    }

    renderColorPickers();
    dirty = true;
    updateSaveState();

    result.className = 'randomizer-result show';
    var subText = alreadyHad
      ? 'You already had this color for ' + esc(label) + ' — no duplicate added.'
      : 'Added to your unlocked colors for ' + esc(label) + ' — select it from the swatches above and Save Avatar to apply.';
    result.innerHTML =
      '<div class="randomizer-result-swatch" style="background:' + sanitizeHex(data.hex) + ';"></div>' +
      '<div>' +
        '<div class="randomizer-result-text">Rolled <b>' + esc(data.label || data.hex) + '</b>!</div>' +
        '<div class="randomizer-result-sub">' + subText + '</div>' +
      '</div>';

    document.getElementById('ember-balance-amount').textContent = emberBalance.toLocaleString();
    btn.disabled = emberBalance < 1;
  }

  function applyAccentCSS(hex) {

    } else {
      localStorage.removeItem('ds_accent_hex');
    }
    dsApplyAccent(hex || null);

    }).join('');

  async function saveAvatar() {
    var btn = document.getElementById('save-btn');
    var status = document.getElementById('save-status');
    btn.disabled = true;
    status.textContent = 'Saving...';

    var payload = {
      user_id: currentUid,
      skin_tone: avatarData.skin_tone,
      pose: avatarData.pose || 'pose1',
      avatar_position: avatarData.avatar_position || 'center',
      mirrored: !!avatarData.mirrored,
      equipped: avatarData.equipped,
      unlocked_skin_tones: avatarData.unlocked_skin_tones || [],
      unlocked_colors: avatarData.unlocked_colors || {},
      unlocked_accents: avatarData.unlocked_accents || [],
      accent_color: avatarData.accent_color || null,
      updated_at: new Date().toISOString()
    };

    var { error } = await db.from('user_avatars').upsert(payload, { onConflict: 'user_id' });

    if (error) {
      status.textContent = 'Could not save: ' + error.message;
      btn.disabled = false;
      return;
    }

    dirty = false;
    status.textContent = 'Saved!';

    // Publish the avatar's face as the sitewide profile picture.
    // Every surface that shows profiles.avatar_url (nav, comments,
    // friends, search, messages) picks this up automatically — this is
    // the single sync point for "avatar face everywhere".
    try {
      status.textContent = 'Saved! Updating profile picture…';
      var pngBlob = await DSAvatar.exportHeadshotPng(avatarData, bodyPresets, allItems, 256);
      var hsPath = currentUid + '/avatar-headshot.png';
      var upErr = (await db.storage.from('avatars').upload(hsPath, pngBlob, { upsert: true, contentType: 'image/png' })).error;
      if (!upErr) {
        var hsUrl = db.storage.from('avatars').getPublicUrl(hsPath).data.publicUrl + '?v=' + Date.now();
        await db.from('profiles').upsert({ id: currentUid, avatar_url: hsUrl }, { onConflict: 'id' });
        // Refresh the nav pfp on this page immediately
        var _nb = document.getElementById('user-avatar-btn');
        if (_nb) _nb.innerHTML = '<img src="' + hsUrl + '" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;"/>';
      }
      status.textContent = 'Saved!';
    } catch(e) { status.textContent = 'Saved!'; /* headshot publish is best-effort */ }

    setTimeout(function(){ status.textContent = ''; }, 2000);
  }

  // ── MAIN RENDER ─────────────────────────────────────────────────
  var activeTab = 'equipment';

  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === tab); });
    document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.toggle('active', p.dataset.tab === tab); });
    if (tab === 'equipment') { renderSlotTabs(); if (activeSlot !== 'skin') { document.getElementById('color-pickers-wrap').style.display = 'block'; } }
    if (tab === 'aura') renderAccentSection();
  }

  // ── MARKETPLACE COSMETIC PURCHASE ────────────────────────────────
  var pendingBuyItem = null;

  window.openBuyModal = function(itemId) {
    var item = allItems.find(function(it){ return it.id === itemId; });
    if (!item) return;
    pendingBuyItem = item;
    document.getElementById('buy-modal-name').textContent = item.name;
    document.getElementById('buy-modal-price-amount').textContent = (item.quill_price || 0).toLocaleString();
    var confirmBtn = document.getElementById('buy-modal-confirm-btn');
    var insufficient = quillBalance < (item.quill_price || 0);
    confirmBtn.disabled = insufficient;
    confirmBtn.textContent = insufficient ? 'Not enough Quills' : 'Purchase';
    document.getElementById('buy-modal-balance-note').textContent = 'You have ' + quillBalance.toLocaleString() + ' Quills.';
    document.getElementById('buy-modal-overlay').classList.add('show');
  };

  window.closeBuyModal = function() {
    pendingBuyItem = null;
    document.getElementById('buy-modal-overlay').classList.remove('show');
  };

  window.confirmPurchase = async function() {
    if (!pendingBuyItem || !currentUid) return;
    var btn = document.getElementById('buy-modal-confirm-btn');
    btn.disabled = true;
    btn.textContent = 'Purchasing...';
    try {
      var { data, error } = await db.rpc('purchase_marketplace_cosmetic', { p_user_id: currentUid, p_cosmetic_id: pendingBuyItem.id });
      if (error || !data || data.status !== 'success') {
        var msg = (data && data.error === 'insufficient_quills') ? 'Not enough Quills.'
          : (data && data.error === 'already_owned') ? 'You already own this item.'
          : 'Could not complete purchase.';
        showToast(msg, 'ti-x');
        btn.disabled = false;
        btn.textContent = 'Purchase';
        return;
      }
      quillBalance = data.new_balance;
      unlockedItemIds.add(pendingBuyItem.id);
      var quillCountEl = document.getElementById('ds-quill-count');
      if (quillCountEl) quillCountEl.textContent = quillBalance.toLocaleString();
      showToast('Unlocked "' + data.name + '"!', 'ti-shopping-bag');
      closeBuyModal();
      renderItemGrid();
    } catch(err) {
      console.error('Purchase error:', err);
      showToast('Something went wrong', 'ti-alert-triangle');
      btn.disabled = false;
      btn.textContent = 'Purchase';
    }
  };

  function showToast(msg, icon) {
    var t = document.getElementById('avatar-toast');
    if (!t) return;
    document.getElementById('avatar-toast-msg').textContent = msg || 'Done!';
    t.querySelector('i').className = 'ti ' + (icon || 'ti-check');
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2800);
  }
</script>
