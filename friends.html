<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var t=localStorage.getItem('ds_theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DawnScribe — Friends</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
  <style>
    :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--bg4:#22223a;--accent:#2dd4bf;--accent2:#0d9488;--text:#f1f0ff;--text2:#9b9bc0;--text3:#5a5a80;--border:rgba(255,255,255,0.07);--red:#f87171;--green:#34d399;--gold:#f59e0b;}
    html[data-theme="light"]{--bg:#f4f4f8;--bg2:#ffffff;--bg3:#ebebf2;--bg4:#d8d8e8;--accent:#0d9488;--accent2:#0f766e;--text:#0a0a0f;--text2:#3a3a5c;--text3:#7a7a9a;--border:rgba(0,0,0,0.08);--red:#dc2626;--green:#059669;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    @keyframes spin{to{transform:rotate(360deg);}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

    nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .logo{font-family:'Cinzel',serif;font-size:22px;color:var(--accent);text-decoration:none;}
    .logo span{color:var(--text);}
    .back-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 16px;color:var(--text2);font-size:13px;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;text-decoration:none;}
    .back-btn:hover{border-color:var(--accent);color:var(--accent);}

    .page{max-width:760px;margin:0 auto;padding:40px 24px 80px;flex:1;animation:fadeIn 0.3s ease;}
    .page-header{margin-bottom:32px;}
    .page-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
    .page-title{font-family:'Cinzel',serif;font-size:28px;font-weight:700;color:var(--text);margin-bottom:6px;}
    .page-sub{font-size:14px;color:var(--text3);}

    .section{margin-bottom:32px;}
    .section-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
    .section-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
    .section-icon.gold{background:rgba(245,158,11,0.12);color:var(--gold);}
    .section-icon.teal{background:rgba(45,212,191,0.1);color:var(--accent);}
    .section-icon.red{background:rgba(248,113,113,0.1);color:var(--red);}
    .section-title{font-family:'Cinzel',serif;font-size:16px;font-weight:700;color:var(--text);}
    .section-count{font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:2px 8px;color:var(--text3);margin-left:auto;}
    .section-count.highlight{background:rgba(245,158,11,0.1);border-color:rgba(245,158,11,0.3);color:var(--gold);}

    .friend-row{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:10px;transition:border-color 0.2s;}
    .friend-row:last-child{margin-bottom:0;}
    .friend-row:hover{border-color:rgba(255,255,255,0.1);}
    .friend-avatar{width:46px;height:46px;border-radius:50%;background:var(--bg4);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;font-family:'Cinzel',serif;color:var(--text3);overflow:hidden;text-decoration:none;}
    .friend-avatar img{width:100%;height:100%;object-fit:cover;}
    .friend-info{flex:1;min-width:0;}
    .friend-name{font-size:14px;font-weight:700;color:var(--text);text-decoration:none;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
    .friend-name:hover{color:var(--accent);}
    .friend-handle{font-size:12px;color:var(--text3);}
    .friend-actions{display:flex;gap:8px;flex-shrink:0;}

    .btn-accept{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.35);border-radius:8px;padding:7px 16px;color:var(--green);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all 0.2s;}
    .btn-accept:hover{background:rgba(52,211,153,0.2);}
    .btn-decline{background:transparent;border:1px solid rgba(248,113,113,0.25);border-radius:8px;padding:7px 14px;color:var(--red);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all 0.2s;}
    .btn-decline:hover{background:rgba(248,113,113,0.08);}
    .btn-remove{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 14px;color:var(--text3);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all 0.2s;}
    .btn-remove:hover{border-color:var(--red);color:var(--red);}
    .btn-profile{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 14px;color:var(--text2);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;text-decoration:none;display:flex;align-items:center;gap:5px;transition:all 0.2s;}
    .btn-profile:hover{border-color:var(--accent);color:var(--accent);}
    .pending-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--gold);border-radius:8px;padding:3px 9px;flex-shrink:0;}

    .empty{text-align:center;padding:32px 24px;color:var(--text3);background:var(--bg2);border:1px solid var(--border);border-radius:12px;}
    .empty i{font-size:30px;display:block;margin-bottom:10px;}
    .empty p{font-size:13px;line-height:1.6;}

    .loading{text-align:center;padding:32px;color:var(--text3);font-size:13px;}
    .not-logged{text-align:center;padding:80px 24px;}
    .not-logged i{font-size:40px;display:block;margin-bottom:16px;color:var(--text3);}
    .not-logged h2{font-family:'Cinzel',serif;font-size:20px;color:var(--text);margin-bottom:8px;}
    .not-logged a{color:var(--accent);text-decoration:none;font-weight:700;}
    @media(max-width:440px){
      .friend-row{flex-wrap:wrap;}
      .friend-actions{width:100%;justify-content:flex-end;}
    }

    .toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 22px;font-size:13px;font-weight:700;color:var(--text);z-index:600;transition:transform 0.3s;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 40px);}
    .toast.show{transform:translateX(-50%) translateY(0);}

    /* Find friends search */
    .find-friends-box{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:32px;}
    .find-friends-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
    .find-friends-row{display:flex;gap:8px;}
    .find-friends-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:9px 14px;color:var(--text);font-size:13px;font-family:'Lato',sans-serif;outline:none;transition:border-color 0.2s;}
    .find-friends-input::placeholder{color:var(--text3);}
    .find-friends-input:focus{border-color:var(--accent);}
    .find-friends-btn{background:var(--accent);border:none;border-radius:9px;padding:9px 18px;color:#0a0a0f;font-size:13px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;transition:opacity 0.2s;white-space:nowrap;}
    .find-friends-btn:hover{opacity:0.85;}
    .find-friends-btn:disabled{opacity:0.5;cursor:default;}
    .find-friends-results{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
    .find-result-row{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px;}
    .find-result-avatar{width:36px;height:36px;border-radius:50%;background:var(--bg4);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:'Cinzel',serif;color:var(--text3);overflow:hidden;text-decoration:none;}
    .find-result-avatar img{width:100%;height:100%;object-fit:cover;}
    .find-result-info{flex:1;min-width:0;}
    .find-result-name{font-size:13px;font-weight:700;color:var(--text);text-decoration:none;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .find-result-name:hover{color:var(--accent);}
    .find-result-handle{font-size:11px;color:var(--text3);}
    .find-result-status{font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;flex-shrink:0;}
    .find-result-status.already{background:rgba(45,212,191,0.1);border:1px solid rgba(45,212,191,0.25);color:var(--accent);}
    .find-result-status.pending{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--gold);}
    .btn-add-friend{background:transparent;border:1px solid var(--accent);border-radius:8px;padding:5px 13px;color:var(--accent);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;transition:all 0.2s;flex-shrink:0;}
    .btn-add-friend:hover{background:rgba(45,212,191,0.1);}
    .btn-add-friend:disabled{opacity:0.5;cursor:default;}

    /* Friend activity snippet */
    .friend-activity{font-size:11px;color:var(--text3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .friend-activity a{color:var(--text3);text-decoration:none;}
    .friend-activity a:hover{color:var(--accent);}

    /* Inline confirm for remove */
    .btn-remove-confirm{background:rgba(248,113,113,0.12);border:1px solid rgba(248,113,113,0.5);border-radius:8px;padding:7px 14px;color:var(--red);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all 0.2s;}
    .btn-remove-confirm:hover{background:rgba(248,113,113,0.2);}

    /* Message button */
    .btn-message{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 14px;color:var(--text2);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;text-decoration:none;display:flex;align-items:center;gap:5px;transition:all 0.2s;}
    .btn-message:hover{border-color:var(--accent);color:var(--accent);}

    /* Friends filter + sort */
    .friends-filter-wrap{margin-left:auto;}
    .friends-filter-input{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:5px 10px;color:var(--text);font-size:12px;font-family:'Lato',sans-serif;outline:none;width:130px;transition:border-color 0.2s;}
    .friends-filter-input:focus{border-color:var(--accent);}
    .friends-filter-input::placeholder{color:var(--text3);}
    .friends-sort-select{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:5px 8px;color:var(--text2);font-size:12px;font-family:'Lato',sans-serif;outline:none;cursor:pointer;margin-left:6px;}
    .friends-sort-select:focus{border-color:var(--accent);}

    /* Mutual friends + friend-since */
    .friend-mutual{font-size:11px;color:var(--text3);margin-top:2px;display:flex;align-items:center;gap:4px;}
    .friend-since{font-size:11px;color:var(--text3);font-weight:400;}

    /* Find friends placeholder + no-results */
    .find-placeholder{font-size:12px;color:var(--text3);padding:10px 2px;display:flex;align-items:center;gap:7px;}
    .find-placeholder i{font-size:14px;flex-shrink:0;}
    .find-no-results{font-size:12px;color:var(--text3);padding:10px 2px;display:flex;align-items:center;gap:7px;}
    .find-no-results i{font-size:14px;flex-shrink:0;}
    .find-no-results a{color:var(--accent);text-decoration:none;font-weight:700;}
    .find-no-results a:hover{text-decoration:underline;}

    /* Undo toast */
    .toast-undo-btn{background:transparent;border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:3px 10px;color:var(--accent);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;margin-left:8px;transition:all 0.2s;}
    .toast-undo-btn:hover{border-color:var(--accent);background:rgba(45,212,191,0.08);}

    /* Mobile: collapse action buttons to icon-only */
    @media(max-width:580px){
      .btn-message span, .btn-profile span, .btn-remove span{ display:none; }
      .btn-message, .btn-profile, .btn-remove, .btn-remove-confirm{ padding:7px 10px; }
    }
  </style>
</head>
<body>

<nav style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
  <a class="logo" href="index.html">Dawn<span>Scribe</span></a>
  <a class="back-btn" id="nav-back" href="profile.html"><i class="ti ti-arrow-left"></i> Back</a>
</nav>

<div class="page">
  <div class="page-header">
    <div class="page-label"><i class="ti ti-users"></i> Social</div>
    <h1 class="page-title">Friends</h1>
    <p class="page-sub">Manage your friend requests and connections.</p>
  </div>
  <div class="find-friends-box" id="find-friends-box" style="display:none;">
    <div class="find-friends-label"><i class="ti ti-search"></i> Find Friends</div>
    <div class="find-friends-row">
      <input class="find-friends-input" id="find-input" type="text" placeholder="Search by username or display name…" maxlength="60" autocomplete="off"/>
      <button class="find-friends-btn" id="find-btn">Search</button>
    </div>
    <div class="find-friends-results" id="find-results"></div>
  </div>
  <div id="content"><div class="loading"><i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i> Loading…</div></div>
</div>

<div class="toast" id="toast"></div>

<script src="blockUtils.js"></script>
<script>
  const SUPA_URL = 'https://cajjyyskpmjnpcxcfeuk.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhamp5eXNrcG1qbnBjeGNmZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDUyMDUsImV4cCI6MjA5NTMyMTIwNX0.s93zWwRYymTsoW5BfUhUDli13ArCtk4S-tegAs54A2c';
  const db = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  window.db = db;

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function showToast(msg, icon){ var t=document.getElementById('toast'); t.innerHTML='<i class="ti '+(icon||'ti-check')+'"></i> '+esc(msg); t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); },3000); }

  var _undoCb = null;
  function showToastUndo(msg, icon, undoCb){
    _undoCb = undoCb;
    var t = document.getElementById('toast');
    t.innerHTML = '<i class="ti ' + (icon||'ti-check') + '"></i> ' + esc(msg)
      + '<button class="toast-undo-btn" onclick="doUndo()">Undo</button>';
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); _undoCb = null; }, 4000);
  }
  function doUndo(){ if(_undoCb){ _undoCb(); _undoCb = null; document.getElementById('toast').classList.remove('show'); } }

  function friendSince(dateStr){
    if(!dateStr) return '';
    var d = new Date(dateStr);
    return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
  }

  var uid = null;
  // Snapshot of all friendship rows for the find-friends feature
  var allFriendshipRows = [];

  document.getElementById('nav-back').addEventListener('click', function(e){
    if(window.history.length > 1 && document.referrer){ e.preventDefault(); history.back(); }
    else { e.preventDefault(); window.location.href = 'dashboard.html'; }
  });

  function profileHref(prof){
    return prof && prof.username ? 'profile.html?user=' + encodeURIComponent(prof.username) : '#';
  }

  function avatarHtml(prof, size){
    size = size || 46;
    var name = (prof.display_name || prof.username || '?');
    if(prof.avatar_url) return '<img src="' + esc(prof.avatar_url) + '" alt=""/>';
    return esc(name.charAt(0).toUpperCase());
  }

  // ── ACTIVITY SNIPPET ──────────────────────────────────────────
  // activityMap[userId] = { title, type, workId } or null
  var activityMap = {};

  async function loadActivity(userIds){
    if(!userIds.length) return;
    var { data } = await Promise.resolve(
      db.from('works')
        .select('author_id, id, title, type, updated_at')
        .in('author_id', userIds)
        .in('status', ['published', 'one-shot'])
        .order('updated_at', { ascending: false })
    ).catch(function(){ return { data: null }; });
    if(!data) return;
    // Keep only most-recent per author
    data.forEach(function(w){
      if(!activityMap[w.author_id]) activityMap[w.author_id] = w;
    });
  }

  function activitySnippet(userId){
    var w = activityMap[userId];
    if(!w) return '<div class="friend-activity"><i class="ti ti-book" style="font-size:10px;"></i> Reader</div>';
    var isArt = w.type === 'artwork';
    var href = isArt ? 'artwork.html?id=' + esc(w.id) : 'story.html?id=' + esc(w.id);
    var icon = isArt ? 'ti-photo' : 'ti-writing';
    var label = isArt ? 'artwork' : 'story';
    return '<div class="friend-activity"><i class="ti ' + icon + '" style="font-size:10px;"></i> Latest '
      + label + ': <a href="' + href + '">' + esc(w.title) + '</a></div>';
  }

  // ── INIT ──────────────────────────────────────────────────────
  async function init(){
    var content = document.getElementById('content');
    var { data: { session } } = await db.auth.getSession();
    if(!session){
      content.innerHTML = '<div class="not-logged"><i class="ti ti-lock"></i><h2>Not logged in</h2><p><a href="auth.html">Log in</a> to manage your friends.</p></div>';
      return;
    }
    uid = session.user.id;
    try { await dsBlock.load(uid); } catch(e) {}
    await renderAll();
    initFindFriends();
  }

  // ── RENDER ────────────────────────────────────────────────────
  async function renderAll(){
    var content = document.getElementById('content');
    content.innerHTML = '<div class="loading"><i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i> Loading…</div>';

    var { data: rows, error: rowsError } = await db.from('friendships')
      .select('id, requester_id, recipient_id, status, created_at')
      .or('requester_id.eq.' + uid + ',recipient_id.eq.' + uid)
      .order('created_at', { ascending: false });

    if(rowsError){
      content.innerHTML = '<div class="empty"><i class="ti ti-plug-x"></i><p>Could not load your friends right now.<br><a href="javascript:location.reload()" style="color:var(--accent);">Try again</a></p></div>';
      return;
    }
    rows = rows || [];
    rows = rows.filter(function(r){
      var other = r.requester_id === uid ? r.recipient_id : r.requester_id;
      return !dsBlock.either(other);
    });
    allFriendshipRows = rows; // snapshot for find-friends status checks

    var otherIds = [...new Set(rows.map(function(r){ return r.requester_id === uid ? r.recipient_id : r.requester_id; }))];
    var profMap = {};
    if(otherIds.length){
      var { data: profs } = await db.from('profiles').select('id, username, display_name, avatar_url').in('id', otherIds);
      (profs||[]).forEach(function(p){ profMap[p.id] = p; });
    }

    rows = rows.filter(function(r){
      var other = r.requester_id === uid ? r.recipient_id : r.requester_id;
      return !!profMap[other];
    });

    var incoming = rows.filter(function(r){ return r.recipient_id === uid && r.status === 'pending'; });
    var outgoing = rows.filter(function(r){ return r.requester_id === uid && r.status === 'pending'; });
    var accepted  = rows.filter(function(r){ return r.status === 'accepted'; });

    // Load latest work per accepted friend
    activityMap = {};
    var acceptedIds = accepted.map(function(r){ return r.requester_id === uid ? r.recipient_id : r.requester_id; });
    await loadActivity(acceptedIds);

    // Build mutual-friend counts for incoming requests
    // myFriendSet = set of UIDs I'm already friends with
    var myFriendSet = new Set(acceptedIds);
    // For each incoming requester, count how many of their accepted friends are also in myFriendSet
    var mutualMap = {};
    if(incoming.length && myFriendSet.size){
      var requesterIds = incoming.map(function(r){ return r.requester_id; });
      var { data: theirFriendships } = await Promise.resolve(
        db.from('friendships')
          .select('requester_id, recipient_id')
          .eq('status', 'accepted')
          .or(requesterIds.map(function(id){ return 'requester_id.eq.' + id + ',recipient_id.eq.' + id; }).join(','))
      ).catch(function(){ return { data: [] }; });
      (theirFriendships || []).forEach(function(r){
        var requesterId = requesterIds.find(function(id){ return r.requester_id === id || r.recipient_id === id; });
        if(!requesterId) return;
        var theirFriend = r.requester_id === requesterId ? r.recipient_id : r.requester_id;
        if(myFriendSet.has(theirFriend)){
          mutualMap[requesterId] = (mutualMap[requesterId] || 0) + 1;
        }
      });
    }

    content.innerHTML = '';

    // ── INCOMING REQUESTS
    var s1 = document.createElement('div');
    s1.className = 'section'; s1.id = 's-incoming';
    s1.innerHTML =
      '<div class="section-header">'
        + '<div class="section-icon gold"><i class="ti ti-user-plus"></i></div>'
        + '<div class="section-title">Friend Requests</div>'
        + '<div class="section-count ' + (incoming.length ? 'highlight' : '') + '" data-count-for="s-incoming">' + incoming.length + '</div>'
      + '</div>';

    if(!incoming.length){
      s1.innerHTML += '<div class="empty"><i class="ti ti-user-check"></i><p>No pending friend requests.</p></div>';
    } else {
      incoming.forEach(function(row){
        var prof = profMap[row.requester_id] || {};
        var name = prof.display_name || prof.username || 'User';
        var div = document.createElement('div');
        div.className = 'friend-row';
        div.dataset.id = row.id;
        var mutualCount = mutualMap[row.requester_id] || 0;
        var mutualHtml = mutualCount
          ? '<div class="friend-mutual"><i class="ti ti-users" style="font-size:10px;"></i> ' + mutualCount + ' mutual friend' + (mutualCount !== 1 ? 's' : '') + '</div>'
          : '';
        div.innerHTML =
          '<a class="friend-avatar" href="' + profileHref(prof) + '">' + avatarHtml(prof) + '</a>'
          + '<div class="friend-info">'
            + '<a class="friend-name" href="' + profileHref(prof) + '">' + esc(name) + '</a>'
            + '<div class="friend-handle">@' + esc(prof.username||'') + '</div>'
            + mutualHtml
          + '</div>'
          + '<div class="friend-actions">'
            + '<button class="btn-accept" onclick="acceptRequest(\'' + row.id + '\', this.closest(\'.friend-row\'))"><i class="ti ti-check"></i> Accept</button>'
            + '<button class="btn-decline" onclick="declineRequest(\'' + row.id + '\', this.closest(\'.friend-row\'))"><i class="ti ti-x"></i> Decline</button>'
          + '</div>';
        s1.appendChild(div);
      });
    }
    content.appendChild(s1);

    // ── MY FRIENDS
    var s2 = document.createElement('div');
    s2.className = 'section'; s2.id = 's-friends';
    s2.innerHTML =
      '<div class="section-header">'
        + '<div class="section-icon teal"><i class="ti ti-users"></i></div>'
        + '<div class="section-title">My Friends</div>'
        + '<div class="section-count" data-count-for="s-friends">' + accepted.length + '</div>'
        + (accepted.length >= 5
          ? '<div class="friends-filter-wrap"><input class="friends-filter-input" id="friends-filter" type="text" placeholder="Filter…" autocomplete="off"/></div>'
          : '')
        + (accepted.length
          ? '<select class="friends-sort-select" id="friends-sort" title="Sort friends">'
              + '<option value="recent">Recent</option>'
              + '<option value="alpha">A–Z</option>'
            + '</select>'
          : '')
      + '</div>';

    if(!accepted.length){
      s2.innerHTML += '<div class="empty"><i class="ti ti-users"></i><p>No friends yet. Here are some people you might know:</p></div>'
        + '<div class="find-friends-results" id="friend-suggestions" style="margin-top:12px;"></div>';
      loadFriendSuggestions();
    } else {
      accepted.forEach(function(row){
        var otherId = row.requester_id === uid ? row.recipient_id : row.requester_id;
        var prof = profMap[otherId] || {};
        var name = prof.display_name || prof.username || 'User';
        var div = document.createElement('div');
        div.className = 'friend-row';
        div.dataset.id = row.id;
        var msgHref = prof.username ? 'messages.html?user=' + encodeURIComponent(prof.username) : '#';
        var sinceStr = row.created_at ? friendSince(row.created_at) : '';
        div.dataset.name = (prof.display_name || prof.username || '').toLowerCase();
        div.innerHTML =
          '<a class="friend-avatar" href="' + profileHref(prof) + '">' + avatarHtml(prof) + '</a>'
          + '<div class="friend-info">'
            + '<a class="friend-name" href="' + profileHref(prof) + '">' + esc(name) + '</a>'
            + '<div class="friend-handle">@' + esc(prof.username||'') + (sinceStr ? ' <span class="friend-since">· friends since ' + esc(sinceStr) + '</span>' : '') + '</div>'
            + activitySnippet(otherId)
          + '</div>'
          + '<div class="friend-actions">'
            + '<a class="btn-message" href="' + msgHref + '"><i class="ti ti-message"></i><span> Message</span></a>'
            + '<a class="btn-profile" href="' + profileHref(prof) + '"><i class="ti ti-user"></i><span> Profile</span></a>'
            + '<button class="btn-remove" onclick="confirmRemove(\'' + row.id + '\', this)"><i class="ti ti-user-minus"></i><span> Remove</span></button>'
          + '</div>';
        s2.appendChild(div);
      });
    }
    content.appendChild(s2);
    // Wire filter + sort
    var filterInput = document.getElementById('friends-filter');
    var sortSelect  = document.getElementById('friends-sort');
    function applyFilterSort(){
      var q = filterInput ? filterInput.value.trim().toLowerCase() : '';
      var sortVal = sortSelect ? sortSelect.value : 'recent';
      var section = document.getElementById('s-friends');
      if(!section) return;
      var rows = Array.from(section.querySelectorAll('.friend-row'));
      rows.forEach(function(r){
        var n = (r.dataset.name || '');
        r.style.display = (!q || n.includes(q)) ? '' : 'none';
      });
      // Sort visible rows
      var visible = rows.filter(function(r){ return r.style.display !== 'none'; });
      if(sortVal === 'alpha'){
        visible.sort(function(a, b){ return (a.dataset.name||'').localeCompare(b.dataset.name||''); });
      }
      visible.forEach(function(r){ section.appendChild(r); });
      // Show/hide empty
      var anyVisible = visible.length > 0;
      var existingEmpty = section.querySelector('.empty');
      if(!anyVisible && !existingEmpty){
        var d = document.createElement('div'); d.className = 'empty filter-empty';
        d.innerHTML = '<i class="ti ti-search"></i><p>No friends match "' + esc(q) + '".</p>';
        section.appendChild(d);
      } else if(anyVisible && existingEmpty && existingEmpty.classList.contains('filter-empty')){
        existingEmpty.remove();
      }
    }
    if(filterInput) filterInput.addEventListener('input', applyFilterSort);
    if(sortSelect) sortSelect.addEventListener('change', applyFilterSort);

    // ── SENT REQUESTS
    if(outgoing.length){
      var s3 = document.createElement('div');
      s3.className = 'section'; s3.id = 's-sent';
      s3.innerHTML =
        '<div class="section-header">'
          + '<div class="section-icon teal"><i class="ti ti-send"></i></div>'
          + '<div class="section-title">Sent Requests</div>'
          + '<div class="section-count" data-count-for="s-sent">' + outgoing.length + '</div>'
        + '</div>';
      outgoing.forEach(function(row){
        var prof = profMap[row.recipient_id] || {};
        var name = prof.display_name || prof.username || 'User';
        var div = document.createElement('div');
        div.className = 'friend-row';
        div.dataset.id = row.id;
        div.innerHTML =
          '<a class="friend-avatar" href="' + profileHref(prof) + '">' + avatarHtml(prof) + '</a>'
          + '<div class="friend-info">'
            + '<a class="friend-name" href="' + profileHref(prof) + '">' + esc(name) + '</a>'
            + '<div class="friend-handle">@' + esc(prof.username||'') + '</div>'
          + '</div>'
          + '<div class="friend-actions">'
            + '<span class="pending-badge"><i class="ti ti-clock"></i> Pending</span>'
            + '<button class="btn-remove" onclick="cancelRequest(\'' + row.id + '\', this.closest(\'.friend-row\'))"><i class="ti ti-x"></i> Cancel</button>'
          + '</div>';
        s3.appendChild(div);
      });
      content.appendChild(s3);
    }
  }

  // ── ROW HELPERS ───────────────────────────────────────────────
  function dropRow(rowEl, sectionId, emptyHtml){
    var section = document.getElementById(sectionId);
    rowEl.remove();
    if(!section) return;
    var remaining = section.querySelectorAll('.friend-row').length;
    var badge = section.querySelector('[data-count-for="' + sectionId + '"]');
    if(badge){
      badge.textContent = remaining;
      if(sectionId === 's-incoming') badge.classList.toggle('highlight', remaining > 0);
    }
    if(!remaining){
      if(emptyHtml){
        var d = document.createElement('div'); d.className = 'empty'; d.innerHTML = emptyHtml;
        section.appendChild(d);
      } else {
        section.remove();
      }
    }
  }

  // ── ACTIONS ───────────────────────────────────────────────────
  async function acceptRequest(id, rowEl){
    rowEl.style.opacity = '0.5';
    var { error } = await db.from('friendships').update({ status: 'accepted' }).eq('id', id).eq('recipient_id', uid);
    if(error){ rowEl.style.opacity = '1'; showToast('Failed: ' + error.message, 'ti-alert-circle'); return; }
    showToast('Friend request accepted!', 'ti-check');
    var friendsSection = document.getElementById('s-friends');
    if(friendsSection){
      var actions = rowEl.querySelector('.friend-actions');
      var pHref = (rowEl.querySelector('.friend-name')||{}).getAttribute ? rowEl.querySelector('.friend-name').getAttribute('href') : 'profile.html';
      // Extract username from href for message link
      var uname = pHref.includes('user=') ? pHref.split('user=')[1] : '';
      var msgHref = uname ? 'messages.html?user=' + uname : '#';
      actions.innerHTML =
        '<a class="btn-message" href="' + msgHref + '"><i class="ti ti-message"></i><span> Message</span></a>'
        + '<a class="btn-profile" href="' + pHref + '"><i class="ti ti-user"></i><span> Profile</span></a>'
        + '<button class="btn-remove" onclick="confirmRemove(\'' + id + '\', this)"><i class="ti ti-user-minus"></i><span> Remove</span></button>';
      rowEl.style.opacity = '1';
      var emptyInFriends = friendsSection.querySelector('.empty');
      if(emptyInFriends) emptyInFriends.remove();
      friendsSection.appendChild(rowEl);
      // FIX: decrement incoming count by removing the actual rowEl from the incoming section count first
      var incomingSection = document.getElementById('s-incoming');
      if(incomingSection){
        var inBadge = incomingSection.querySelector('[data-count-for="s-incoming"]');
        // Count BEFORE the row was moved (rowEl is already gone from incoming at this point),
        // so querySelectorAll gives the correct post-accept count.
        var inRemaining = incomingSection.querySelectorAll('.friend-row').length;
        if(inBadge){ inBadge.textContent = inRemaining; inBadge.classList.toggle('highlight', inRemaining > 0); }
        if(!inRemaining){
          var d = document.createElement('div'); d.className = 'empty';
          d.innerHTML = '<i class="ti ti-user-check"></i><p>No pending friend requests.</p>';
          incomingSection.appendChild(d);
        }
      }
      var fBadge = friendsSection.querySelector('[data-count-for="s-friends"]');
      if(fBadge) fBadge.textContent = friendsSection.querySelectorAll('.friend-row').length;
    } else {
      await renderAll();
    }
  }

  async function declineRequest(id, rowEl){
    // Optimistic hide with undo window
    rowEl.style.display = 'none';
    var undone = false;
    showToastUndo('Request declined.', 'ti-x', function(){
      undone = true;
      rowEl.style.display = '';
    });
    setTimeout(async function(){
      if(undone) return;
      var { error } = await db.from('friendships').delete().eq('id', id).eq('recipient_id', uid);
      if(error){ rowEl.style.display = ''; showToast('Failed: ' + error.message, 'ti-alert-circle'); return; }
      dropRow(rowEl, 's-incoming', '<i class="ti ti-user-check"></i><p>No pending friend requests.</p>');
    }, 4000);
  }

  async function cancelRequest(id, rowEl){
    rowEl.style.opacity = '0.5';
    var { error } = await db.from('friendships').delete().eq('id', id).eq('requester_id', uid);
    if(error){ rowEl.style.opacity = '1'; showToast('Failed: ' + error.message, 'ti-alert-circle'); return; }
    showToast('Request cancelled.', 'ti-x');
    dropRow(rowEl, 's-sent', null);
  }

  // Inline confirm: first click turns button red with "Sure?", second click executes
  var _removeTimers = {};
  function confirmRemove(id, btn){
    var rowEl = btn.closest('.friend-row');
    if(btn.dataset.confirming === '1'){
      clearTimeout(_removeTimers[id]);
      removeFriend(id, rowEl);
    } else {
      btn.dataset.confirming = '1';
      btn.classList.add('btn-remove-confirm');
      btn.innerHTML = '<i class="ti ti-alert-triangle"></i> Sure?';
      _removeTimers[id] = setTimeout(function(){
        btn.dataset.confirming = '';
        btn.classList.remove('btn-remove-confirm');
        btn.innerHTML = '<i class="ti ti-user-minus"></i> Remove';
      }, 3000);
    }
  }

  async function removeFriend(id, rowEl){
    // Optimistic hide with undo window
    rowEl.style.display = 'none';
    var undone = false;
    showToastUndo('Friend removed.', 'ti-user-minus', function(){
      undone = true;
      rowEl.style.display = '';
      // Reset the confirm button state if it was in confirming mode
      var btn = rowEl.querySelector('.btn-remove, .btn-remove-confirm');
      if(btn){ btn.dataset.confirming = ''; btn.className = 'btn-remove'; btn.innerHTML = '<i class="ti ti-user-minus"></i> Remove'; }
    });
    setTimeout(async function(){
      if(undone) return;
      var { error } = await db.from('friendships').delete().eq('id', id)
        .or('requester_id.eq.' + uid + ',recipient_id.eq.' + uid);
      if(error){ rowEl.style.display = ''; showToast('Failed: ' + error.message, 'ti-alert-circle'); return; }
      dropRow(rowEl, 's-friends', '<i class="ti ti-users"></i><p>No friends yet.<br>Visit someone\'s profile and send them a friend request!</p>');
      allFriendshipRows = allFriendshipRows.filter(function(r){ return r.id !== id; });
    }, 4000);
  }

  // ── FIND FRIENDS ──────────────────────────────────────────────
  function initFindFriends(){
    document.getElementById('find-friends-box').style.display = '';
    var input = document.getElementById('find-input');
    var btn   = document.getElementById('find-btn');
    var results = document.getElementById('find-results');

    // Placeholder shown before first search
    results.innerHTML = '<div class="find-placeholder"><i class="ti ti-search"></i> Search by username or display name to find people on DawnScribe.</div>';

    function doSearch(){
      var q = input.value.trim();
      if(!q){ results.innerHTML = '<div class="find-placeholder"><i class="ti ti-search"></i> Search by username or display name to find people on DawnScribe.</div>'; return; }
      btn.disabled = true;
      btn.textContent = 'Searching…';
      searchUsers(q).then(function(users){
        btn.disabled = false;
        btn.textContent = 'Search';
        renderFindResults(users, results);
      });
    }

    btn.addEventListener('click', doSearch);
    input.addEventListener('keydown', function(e){ if(e.key === 'Enter') doSearch(); });
  }

  async function searchUsers(q){
    // Search display_name ilike or username ilike, exclude self
    var { data: byDisplay } = await Promise.resolve(
      db.from('profiles').select('id, username, display_name, avatar_url')
        .ilike('display_name', '%' + q + '%')
        .neq('id', uid)
        .limit(8)
    ).catch(function(){ return { data: [] }; });

    var { data: byUsername } = await Promise.resolve(
      db.from('profiles').select('id, username, display_name, avatar_url')
        .ilike('username', '%' + q + '%')
        .neq('id', uid)
        .limit(8)
    ).catch(function(){ return { data: [] }; });

    // Merge, deduplicate
    var seen = {};
    var merged = [];
    ((byDisplay||[]).concat(byUsername||[])).forEach(function(p){
      if(!seen[p.id]){ seen[p.id] = true; merged.push(p); }
    });
    return merged.slice(0, 10);
  }

  function getFriendshipStatus(otherId){
    for(var i = 0; i < allFriendshipRows.length; i++){
      var r = allFriendshipRows[i];
      var involves = (r.requester_id === uid && r.recipient_id === otherId)
                  || (r.recipient_id === uid && r.requester_id === otherId);
      if(!involves) continue;
      if(r.status === 'accepted') return 'friends';
      if(r.status === 'pending' && r.requester_id === uid) return 'sent';
      if(r.status === 'pending' && r.recipient_id === uid) return 'incoming';
    }
    return 'none';
  }

  function renderFindResults(users, container){
    if(!users.length){
      container.innerHTML = '<div class="find-no-results"><i class="ti ti-user-off"></i> No users found. Try a different name, or <a href="browse.html">browse works</a> to discover writers and artists.</div>';
      return;
    }
    container.innerHTML = '';
    users.forEach(function(prof){
      var status = getFriendshipStatus(prof.id);
      var name = prof.display_name || prof.username || 'User';
      var row = document.createElement('div');
      row.className = 'find-result-row';

      var actionHtml = '';
      if(status === 'friends'){
        actionHtml = '<span class="find-result-status already"><i class="ti ti-check"></i> Friends</span>';
      } else if(status === 'sent'){
        actionHtml = '<span class="find-result-status pending"><i class="ti ti-clock"></i> Pending</span>';
      } else if(status === 'incoming'){
        actionHtml = '<span class="find-result-status pending"><i class="ti ti-user-plus"></i> Wants to add you</span>';
      } else {
        actionHtml = '<button class="btn-add-friend" onclick="sendRequest(\'' + esc(prof.id) + '\', this)"><i class="ti ti-user-plus"></i> Add Friend</button>';
      }

      row.innerHTML =
        '<a class="find-result-avatar" href="' + profileHref(prof) + '">'
          + (prof.avatar_url ? '<img src="' + esc(prof.avatar_url) + '" alt=""/>' : esc(name.charAt(0).toUpperCase()))
        + '</a>'
        + '<div class="find-result-info">'
          + '<a class="find-result-name" href="' + profileHref(prof) + '">' + esc(name) + '</a>'
          + '<div class="find-result-handle">@' + esc(prof.username||'') + '</div>'
        + '</div>'
        + actionHtml;
      container.appendChild(row);
    });
  }

  // ── FRIEND SUGGESTIONS (empty-state) ─────────────────────────
  // Suggests authors of works in the viewer's library first, then
  // pads with recently-active users. Reuses renderFindResults so
  // Add Friend / Pending / blocked handling all behave identically.
  async function loadFriendSuggestions(){
    var container = document.getElementById('friend-suggestions');
    if(!container) return;
    try {
      var excluded = {}; excluded[uid] = true;
      allFriendshipRows.forEach(function(r){ excluded[r.requester_id] = true; excluded[r.recipient_id] = true; });

      var picks = [];
      // 1) Authors of works in my library
      var { data: entries } = await db.from('reading_list_entries')
        .select('work_id').eq('user_id', uid).limit(30);
      var workIds = [...new Set((entries||[]).map(function(e){ return e.work_id; }).filter(Boolean))];
      if(workIds.length){
        var { data: libWorks } = await db.from('works').select('author_id').in('id', workIds);
        var authorIds = [...new Set((libWorks||[]).map(function(w){ return w.author_id; }).filter(function(a){ return a && !excluded[a]; }))];
        if(authorIds.length){
          var { data: authorProfs } = await db.from('profiles')
            .select('id,username,display_name,avatar_url').in('id', authorIds.slice(0, 10));
          (authorProfs||[]).forEach(function(p){ if(!excluded[p.id]){ excluded[p.id] = true; picks.push(p); } });
        }
      }
      // 2) Pad with recently-active users
      if(picks.length < 5){
        var { data: recent } = await db.from('profiles')
          .select('id,username,display_name,avatar_url')
          .neq('id', uid)
          .order('last_active_at', { ascending: false, nullsFirst: false })
          .limit(15);
        (recent||[]).forEach(function(p){
          if(picks.length >= 5) return;
          if(excluded[p.id]) return;
          excluded[p.id] = true; picks.push(p);
        });
      }
      picks = picks.filter(function(p){ return !dsBlock.either(p.id); }).slice(0, 5);
      if(!picks.length){ container.remove(); return; }
      renderFindResults(picks, container);
    } catch(e) { try { container.remove(); } catch(e2) {} }
  }

  async function sendRequest(recipientId, btn){
    btn.disabled = true;
    btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i>';
    var { error } = await db.from('friendships').insert({ requester_id: uid, recipient_id: recipientId, status: 'pending' });
    if(error){
      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-user-plus"></i> Add Friend';
      showToast('Failed: ' + error.message, 'ti-alert-circle');
      return;
    }
    showToast('Friend request sent!', 'ti-user-plus');
    // Update snapshot and replace button with status badge
    allFriendshipRows.push({ id: 'tmp-' + recipientId, requester_id: uid, recipient_id: recipientId, status: 'pending' });
    var span = document.createElement('span');
    span.className = 'find-result-status pending';
    span.innerHTML = '<i class="ti ti-clock"></i> Pending';
    btn.parentNode.replaceChild(span, btn);
  }

  init();
</script>

<script src="nav.js"></script>
