<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var t=localStorage.getItem('ds_theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DawnScribe — Friends</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
  <style>
    :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--bg4:#22223a;--accent:#2dd4bf;--accent2:#0d9488;--text:#f1f0ff;--text2:#9b9bc0;--text3:#5a5a80;--border:rgba(255,255,255,0.07);--red:#f87171;--green:#34d399;--gold:#f59e0b;}
    html[data-theme="light"]{--bg:#f4f4f8;--bg2:#ffffff;--bg3:#ebebf2;--bg4:#d8d8e8;--accent:#0d9488;--accent2:#0f766e;--text:#0a0a0f;--text2:#3a3a5c;--text3:#7a7a9a;--border:rgba(0,0,0,0.08);--red:#dc2626;--green:#059669;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    @keyframes spin{to{transform:rotate(360deg);}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

    nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .logo{font-family:'Cinzel',serif;font-size:22px;color:var(--accent);text-decoration:none;}
    .logo span{color:var(--text);}
    .back-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 16px;color:var(--text2);font-size:13px;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;text-decoration:none;}
    .back-btn:hover{border-color:var(--accent);color:var(--accent);}

    .page{max-width:760px;margin:0 auto;padding:40px 24px 80px;flex:1;animation:fadeIn 0.3s ease;}
    .page-header{margin-bottom:32px;}
    .page-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
    .page-title{font-family:'Cinzel',serif;font-size:28px;font-weight:700;color:var(--text);margin-bottom:6px;}
    .page-sub{font-size:14px;color:var(--text3);}

    .section{margin-bottom:32px;}
    .section-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
    .section-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
    .section-icon.gold{background:rgba(245,158,11,0.12);color:var(--gold);}
    .section-icon.teal{background:rgba(45,212,191,0.1);color:var(--accent);}
    .section-icon.red{background:rgba(248,113,113,0.1);color:var(--red);}
    .section-title{font-family:'Cinzel',serif;font-size:16px;font-weight:700;color:var(--text);}
    .section-count{font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:2px 8px;color:var(--text3);margin-left:auto;}
    .section-count.highlight{background:rgba(245,158,11,0.1);border-color:rgba(245,158,11,0.3);color:var(--gold);}

    .friend-row{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:10px;transition:border-color 0.2s;}
    .friend-row:last-child{margin-bottom:0;}
    .friend-row:hover{border-color:rgba(255,255,255,0.1);}
    .friend-avatar{width:46px;height:46px;border-radius:50%;background:var(--bg4);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;font-family:'Cinzel',serif;color:var(--text3);overflow:hidden;text-decoration:none;}
    .friend-avatar img{width:100%;height:100%;object-fit:cover;}
    .friend-info{flex:1;min-width:0;}
    .friend-name{font-size:14px;font-weight:700;color:var(--text);text-decoration:none;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
    .friend-name:hover{color:var(--accent);}
    .friend-handle{font-size:12px;color:var(--text3);}
    .friend-actions{display:flex;gap:8px;flex-shrink:0;}

    .btn-accept{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.35);border-radius:8px;padding:7px 16px;color:var(--green);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all 0.2s;}
    .btn-accept:hover{background:rgba(52,211,153,0.2);}
    .btn-decline{background:transparent;border:1px solid rgba(248,113,113,0.25);border-radius:8px;padding:7px 14px;color:var(--red);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all 0.2s;}
    .btn-decline:hover{background:rgba(248,113,113,0.08);}
    .btn-remove{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 14px;color:var(--text3);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all 0.2s;}
    .btn-remove:hover{border-color:var(--red);color:var(--red);}
    .btn-profile{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 14px;color:var(--text2);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;text-decoration:none;display:flex;align-items:center;gap:5px;transition:all 0.2s;}
    .btn-profile:hover{border-color:var(--accent);color:var(--accent);}
    .pending-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--gold);border-radius:8px;padding:3px 9px;flex-shrink:0;}

    .empty{text-align:center;padding:32px 24px;color:var(--text3);background:var(--bg2);border:1px solid var(--border);border-radius:12px;}
    .empty i{font-size:30px;display:block;margin-bottom:10px;}
    .empty p{font-size:13px;line-height:1.6;}

    .loading{text-align:center;padding:32px;color:var(--text3);font-size:13px;}
    .not-logged{text-align:center;padding:80px 24px;}
    .not-logged i{font-size:40px;display:block;margin-bottom:16px;color:var(--text3);}
    .not-logged h2{font-family:'Cinzel',serif;font-size:20px;color:var(--text);margin-bottom:8px;}
    .not-logged a{color:var(--accent);text-decoration:none;font-weight:700;}
    @media(max-width:440px){
      .friend-row{flex-wrap:wrap;}
      .friend-actions{width:100%;justify-content:flex-end;}
    }

    .toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 22px;font-size:13px;font-weight:700;color:var(--text);z-index:600;transition:transform 0.3s;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 40px);}
    .toast.show{transform:translateX(-50%) translateY(0);}
  </style>
</head>
<body>

<nav style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
  <a class="logo" href="index.html">Dawn<span>Scribe</span></a>
  <a class="back-btn" id="nav-back" href="profile.html"><i class="ti ti-arrow-left"></i> Back</a>
</nav>

<div class="page">
  <div class="page-header">
    <div class="page-label"><i class="ti ti-users"></i> Social</div>
    <h1 class="page-title">Friends</h1>
    <p class="page-sub">Manage your friend requests and connections.</p>
  </div>
  <div id="content"><div class="loading"><i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i> Loading…</div></div>
</div>

<div class="toast" id="toast"></div>

<script src="blockUtils.js"></script>
<script>
  const SUPA_URL = 'https://cajjyyskpmjnpcxcfeuk.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhamp5eXNrcG1qbnBjeGNmZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDUyMDUsImV4cCI6MjA5NTMyMTIwNX0.s93zWwRYymTsoW5BfUhUDli13ArCtk4S-tegAs54A2c';
  const db = window.supabase.createClient(SUPA_URL, SUPA_KEY);
    window.db = db;

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function showToast(msg, icon){ var t=document.getElementById('toast'); t.innerHTML='<i class="ti '+(icon||'ti-check')+'"></i> '+esc(msg); t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); },3000); }

  var uid = null;

  // Back = history when we have referrer, otherwise fall through to dashboard
  document.getElementById('nav-back').addEventListener('click', function(e){
    if(window.history.length > 1 && document.referrer){ e.preventDefault(); history.back(); }
    else { e.preventDefault(); window.location.href = 'dashboard.html'; }
  });

  function profileHref(prof){
    return prof && prof.username ? 'profile.html?user=' + encodeURIComponent(prof.username) : '#';
  }

  function avatarHtml(prof){
    var name = (prof.display_name || prof.username || '?');
    var initial = name.charAt(0).toUpperCase();
    if(prof.avatar_url) return '<img src="' + esc(prof.avatar_url) + '" alt=""/>';
    return initial;
  }

  async function init(){
    var content = document.getElementById('content');
    var { data: { session } } = await db.auth.getSession();
    if(!session){
      content.innerHTML = '<div class="not-logged"><i class="ti ti-lock"></i><h2>Not logged in</h2><p><a href="auth.html">Log in</a> to manage your friends.</p></div>';
      return;
    }
    uid = session.user.id;
    try { await dsBlock.load(uid); } catch(e) {}
    await renderAll();
  }

  async function renderAll(){
    var content = document.getElementById('content');
    content.innerHTML = '<div class="loading"><i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i> Loading…</div>';

    // Fetch all friendships involving this user
    var { data: rows, error: rowsError } = await db.from('friendships')
      .select('id, requester_id, recipient_id, status, created_at')
      .or('requester_id.eq.' + uid + ',recipient_id.eq.' + uid)
      .order('created_at', { ascending: false });

    if(rowsError){
      content.innerHTML = '<div class="empty"><i class="ti ti-plug-x"></i><p>Could not load your friends right now.<br><a href="javascript:location.reload()" style="color:var(--accent);">Try again</a></p></div>';
      return;
    }
    rows = rows || [];
    // Hide anyone in a block relationship (either direction)
    rows = rows.filter(function(r){
      var other = r.requester_id === uid ? r.recipient_id : r.requester_id;
      return !dsBlock.either(other);
    });

    // Collect all other user IDs
    var otherIds = [...new Set(rows.map(function(r){ return r.requester_id === uid ? r.recipient_id : r.requester_id; }))];
    var profMap = {};
    if(otherIds.length){
      var { data: profs } = await db.from('profiles').select('id, username, display_name, avatar_url').in('id', otherIds);
      (profs||[]).forEach(function(p){ profMap[p.id] = p; });
    }

    // Skip rows whose profile no longer exists (deleted accounts)
    rows = rows.filter(function(r){
      var other = r.requester_id === uid ? r.recipient_id : r.requester_id;
      return !!profMap[other];
    });

    var incoming = rows.filter(function(r){ return r.recipient_id === uid && r.status === 'pending'; });
    var outgoing = rows.filter(function(r){ return r.requester_id === uid && r.status === 'pending'; });
    var accepted = rows.filter(function(r){ return r.status === 'accepted'; });

    content.innerHTML = '';

    // ── INCOMING REQUESTS
    var s1 = document.createElement('div');
    s1.className = 'section'; s1.id = 's-incoming';
    s1.innerHTML =
      '<div class="section-header">'
        + '<div class="section-icon gold"><i class="ti ti-user-plus"></i></div>'
        + '<div class="section-title">Friend Requests</div>'
        + '<div class="section-count ' + (incoming.length ? 'highlight' : '') + '" data-count-for="s-incoming">' + incoming.length + '</div>'
      + '</div>';

    if(!incoming.length){
      s1.innerHTML += '<div class="empty"><i class="ti ti-user-check"></i><p>No pending friend requests.</p></div>';
    } else {
      incoming.forEach(function(row){
        var prof = profMap[row.requester_id] || {};
        var name = prof.display_name || prof.username || 'User';
        var div = document.createElement('div');
        div.className = 'friend-row';
        div.dataset.id = row.id;
        div.innerHTML =
          '<a class="friend-avatar" href="' + profileHref(prof) + '">' + avatarHtml(prof) + '</a>'
          + '<div class="friend-info">'
            + '<a class="friend-name" href="' + profileHref(prof) + '">' + esc(name) + '</a>'
            + '<div class="friend-handle">@' + esc(prof.username||'') + '</div>'
          + '</div>'
          + '<div class="friend-actions">'
            + '<button class="btn-accept" onclick="acceptRequest(\'' + row.id + '\', this.closest(\'.friend-row\'))"><i class="ti ti-check"></i> Accept</button>'
            + '<button class="btn-decline" onclick="declineRequest(\'' + row.id + '\', this.closest(\'.friend-row\'))"><i class="ti ti-x"></i> Decline</button>'
          + '</div>';
        s1.appendChild(div);
      });
    }
    content.appendChild(s1);

    // ── FRIENDS
    var s2 = document.createElement('div');
    s2.className = 'section'; s2.id = 's-friends';
    s2.innerHTML =
      '<div class="section-header">'
        + '<div class="section-icon teal"><i class="ti ti-users"></i></div>'
        + '<div class="section-title">My Friends</div>'
        + '<div class="section-count" data-count-for="s-friends">' + accepted.length + '</div>'
      + '</div>';

    if(!accepted.length){
      s2.innerHTML += '<div class="empty"><i class="ti ti-users"></i><p>No friends yet.<br>Visit someone\'s profile and send them a friend request!</p></div>';
    } else {
      accepted.forEach(function(row){
        var otherId = row.requester_id === uid ? row.recipient_id : row.requester_id;
        var prof = profMap[otherId] || {};
        var name = prof.display_name || prof.username || 'User';
        var div = document.createElement('div');
        div.className = 'friend-row';
        div.dataset.id = row.id;
        div.innerHTML =
          '<a class="friend-avatar" href="' + profileHref(prof) + '">' + avatarHtml(prof) + '</a>'
          + '<div class="friend-info">'
            + '<a class="friend-name" href="' + profileHref(prof) + '">' + esc(name) + '</a>'
            + '<div class="friend-handle">@' + esc(prof.username||'') + '</div>'
          + '</div>'
          + '<div class="friend-actions">'
            + '<a class="btn-profile" href="' + profileHref(prof) + '"><i class="ti ti-user"></i> Profile</a>'
            + '<button class="btn-remove" onclick="removeFriend(\'' + row.id + '\', this.closest(\'.friend-row\'))"><i class="ti ti-user-minus"></i> Remove</button>'
          + '</div>';
        s2.appendChild(div);
      });
    }
    content.appendChild(s2);

    // ── SENT REQUESTS
    if(outgoing.length){
      var s3 = document.createElement('div');
      s3.className = 'section'; s3.id = 's-sent';
      s3.innerHTML =
        '<div class="section-header">'
          + '<div class="section-icon teal"><i class="ti ti-send"></i></div>'
          + '<div class="section-title">Sent Requests</div>'
          + '<div class="section-count" data-count-for="s-sent">' + outgoing.length + '</div>'
        + '</div>';
      outgoing.forEach(function(row){
        var prof = profMap[row.recipient_id] || {};
        var name = prof.display_name || prof.username || 'User';
        var div = document.createElement('div');
        div.className = 'friend-row';
        div.dataset.id = row.id;
        div.innerHTML =
          '<a class="friend-avatar" href="' + profileHref(prof) + '">' + avatarHtml(prof) + '</a>'
          + '<div class="friend-info">'
            + '<a class="friend-name" href="' + profileHref(prof) + '">' + esc(name) + '</a>'
            + '<div class="friend-handle">@' + esc(prof.username||'') + '</div>'
          + '</div>'
          + '<div class="friend-actions">'
            + '<span class="pending-badge"><i class="ti ti-clock"></i> Pending</span>'
            + '<button class="btn-remove" onclick="cancelRequest(\'' + row.id + '\', this.closest(\'.friend-row\'))"><i class="ti ti-x"></i> Cancel</button>'
          + '</div>';
        s3.appendChild(div);
      });
      content.appendChild(s3);
    }
  }

  // Remove a row in place, fix the section count, and swap in the empty
  // state when a section runs dry — no full re-render, no scroll reset.
  function dropRow(rowEl, sectionId, emptyHtml){
    var section = document.getElementById(sectionId);
    rowEl.remove();
    if(!section) return;
    var remaining = section.querySelectorAll('.friend-row').length;
    var badge = section.querySelector('[data-count-for="' + sectionId + '"]');
    if(badge){
      badge.textContent = remaining;
      if(sectionId === 's-incoming') badge.classList.toggle('highlight', remaining > 0);
    }
    if(!remaining){
      if(emptyHtml){
        var d = document.createElement('div');
        d.className = 'empty';
        d.innerHTML = emptyHtml;
        section.appendChild(d);
      } else {
        section.remove(); // Sent Requests section disappears entirely when empty
      }
    }
  }

  async function acceptRequest(id, rowEl){
    rowEl.style.opacity = '0.5';
    var { error } = await db.from('friendships').update({ status: 'accepted' }).eq('id', id).eq('recipient_id', uid);
    if(error){ rowEl.style.opacity = '1'; showToast('Failed: ' + error.message, 'ti-alert-circle'); return; }
    showToast('Friend request accepted!', 'ti-check');
    // Move the row into My Friends: swap actions, then relocate
    var friendsSection = document.getElementById('s-friends');
    if(friendsSection){
      var actions = rowEl.querySelector('.friend-actions');
      var profileHref = (rowEl.querySelector('.friend-name')||{}).getAttribute ? rowEl.querySelector('.friend-name').getAttribute('href') : 'profile.html';
      actions.innerHTML = '<a class="btn-profile" href="' + profileHref + '"><i class="ti ti-user"></i> Profile</a>'
        + '<button class="btn-remove" onclick="removeFriend(\'' + id + '\', this.closest(\'.friend-row\'))"><i class="ti ti-user-minus"></i> Remove</button>';
      rowEl.style.opacity = '1';
      var emptyInFriends = friendsSection.querySelector('.empty');
      if(emptyInFriends) emptyInFriends.remove();
      friendsSection.appendChild(rowEl);
      // Fix both counts
      dropRow(document.createElement('div'), 's-incoming', '<i class="ti ti-user-check"></i><p>No pending friend requests.</p>');
      var fBadge = friendsSection.querySelector('[data-count-for="s-friends"]');
      if(fBadge) fBadge.textContent = friendsSection.querySelectorAll('.friend-row').length;
    } else {
      await renderAll();
    }
  }

  async function declineRequest(id, rowEl){
    rowEl.style.opacity = '0.5';
    var { error } = await db.from('friendships').delete().eq('id', id).eq('recipient_id', uid);
    if(error){ rowEl.style.opacity = '1'; showToast('Failed: ' + error.message, 'ti-alert-circle'); return; }
    showToast('Request declined.', 'ti-x');
    dropRow(rowEl, 's-incoming', '<i class="ti ti-user-check"></i><p>No pending friend requests.</p>');
  }

  async function cancelRequest(id, rowEl){
    rowEl.style.opacity = '0.5';
    var { error } = await db.from('friendships').delete().eq('id', id).eq('requester_id', uid);
    if(error){ rowEl.style.opacity = '1'; showToast('Failed: ' + error.message, 'ti-alert-circle'); return; }
    showToast('Request cancelled.', 'ti-x');
    dropRow(rowEl, 's-sent', null);
  }

  async function removeFriend(id, rowEl){
    if(!confirm('Remove this friend?')) return;
    rowEl.style.opacity = '0.5';
    var { error } = await db.from('friendships').delete().eq('id', id);
    if(error){ rowEl.style.opacity = '1'; showToast('Failed: ' + error.message, 'ti-alert-circle'); return; }
    showToast('Friend removed.', 'ti-user-minus');
    dropRow(rowEl, 's-friends', '<i class="ti ti-users"></i><p>No friends yet.<br>Visit someone\'s profile and send them a friend request!</p>');
  }

  init();
</script>
<script src="footer.js"></script>
<script src="spoilerUtils.js"></script>
<script src="nav.js"></script>
</body>
</html>
