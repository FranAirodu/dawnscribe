<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var t=localStorage.getItem('ds_theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DawnScribe — Search</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
  <style>
    :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--bg4:#22223a;--accent:#2dd4bf;--accent2:#0d9488;--text:#f1f0ff;--text2:#9b9bc0;--text3:#5a5a80;--border:rgba(255,255,255,0.07);--red:#f87171;--green:#34d399;--gold:#f59e0b;}
    html[data-theme="light"]{--bg:#f4f4f8;--bg2:#ffffff;--bg3:#ebebf2;--bg4:#d8d8e8;--accent:#0d9488;--accent2:#0f766e;--text:#0a0a0f;--text2:#3a3a5c;--text3:#7a7a9a;--border:rgba(0,0,0,0.08);--red:#dc2626;--green:#059669;--gold:#d97706;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* NAV */
    nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:16px;}
    .logo{font-family:'Cinzel',serif;font-size:22px;color:var(--accent);text-decoration:none;letter-spacing:1px;flex-shrink:0;}
    .logo span{color:var(--text);}
    .nav-search-bar{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:0 14px;transition:border-color 0.2s;}
    .nav-search-bar:focus-within{border-color:var(--accent);}
    .nav-search-bar i{color:var(--text3);font-size:16px;flex-shrink:0;}
    .nav-search-bar input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'Lato',sans-serif;font-size:14px;padding:10px 0;}
    .nav-search-bar input::placeholder{color:var(--text3);}
    .tag-mode-btn{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:0 14px;height:42px;display:flex;align-items:center;gap:7px;color:var(--text3);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;transition:all 0.2s;white-space:nowrap;flex-shrink:0;}
    .tag-mode-btn:hover{border-color:var(--accent);color:var(--accent);}
    .tag-mode-btn.active{background:rgba(45,212,191,0.1);border-color:var(--accent);color:var(--accent);}
    .tag-mode-btn i{font-size:15px;}
    .back-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 16px;color:var(--text2);font-size:13px;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;text-decoration:none;flex-shrink:0;}
    .back-btn:hover{border-color:var(--accent);color:var(--accent);}

    /* FILTERS */
    .filters-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;}
    .filters-bar::-webkit-scrollbar{display:none;}
    .filter-tab{background:transparent;border:none;border-bottom:2px solid transparent;padding:14px 16px;color:var(--text3);font-size:13px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;transition:all 0.2s;white-space:nowrap;display:flex;align-items:center;gap:6px;}
    .filter-tab:hover{color:var(--text2);}
    .filter-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
    .filter-count{background:rgba(45,212,191,0.15);color:var(--accent);font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;}

    /* PAGE */
    .page-wrap{max-width:900px;margin:40px auto 80px;padding:0 24px;flex:1;}
    .results-header{margin-bottom:28px;}
    .results-title{font-family:'Cinzel',serif;font-size:22px;font-weight:700;color:var(--text);margin-bottom:6px;}
    .results-title span{color:var(--accent);}
    .results-meta{font-size:13px;color:var(--text3);}

    /* CARDS */
    .results-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .result-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;gap:16px;align-items:flex-start;transition:border-color 0.2s;text-decoration:none;color:inherit;}
    .result-card:hover{border-color:rgba(45,212,191,0.3);}
    .result-cover{width:80px;height:110px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:white;overflow:hidden;}
    .result-cover img{width:80px;height:110px;border-radius:8px;object-fit:cover;display:block;}
    .result-cover.round{width:64px;height:64px;border-radius:50%;align-self:center;font-size:22px;}
    .result-cover.round img{width:64px;height:64px;border-radius:50%;object-fit:cover;}
    .result-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
    .result-title{font-size:14px;font-weight:700;color:var(--text);}
    .result-sub{font-size:11px;color:var(--text3);}
    .result-flavor{font-size:12px;color:var(--text2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
    .result-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px;}
    /* Advanced filters */
    .adv-toggle{background:transparent;border:none;border-bottom:2px solid transparent;padding:14px 16px;color:var(--text3);font-size:13px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;margin-left:auto;}
    .adv-toggle:hover{color:var(--text2);}
    .adv-toggle.on{color:var(--gold);border-bottom-color:var(--gold);}
    .adv-active-count{display:inline-flex;align-items:center;justify-content:center;background:rgba(245,158,11,0.18);color:var(--gold);font-size:10px;font-weight:800;width:16px;height:16px;border-radius:50%;margin-left:2px;}
    .adv-panel{display:none;background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 32px;}
    .adv-panel.open{display:block;}
    .adv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 18px;max-width:1100px;}
    .adv-field label{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:5px;}
    .adv-field input,.adv-field select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 11px;color:var(--text);font-family:inherit;font-size:13px;}
    .adv-field input:focus,.adv-field select:focus{outline:none;border-color:var(--accent);}
    .adv-actions{display:flex;gap:10px;margin-top:14px;align-items:center;}
    .adv-apply{background:var(--accent);border:none;border-radius:8px;padding:8px 18px;color:#04211d;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;}
    .adv-apply:hover{opacity:0.85;}
    .adv-clear{background:transparent;border:1px solid var(--border);border-radius:8px;padding:8px 14px;color:var(--text3);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
    .adv-clear:hover{color:var(--text2);border-color:var(--text3);}
    .adv-hint{font-size:11px;color:var(--text3);}
    @media(max-width:640px){.adv-panel{padding:14px 16px;}}
    .result-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--bg3);border:1px solid var(--border);color:var(--text3);}
    .result-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;}
    .badge-author{background:rgba(45,212,191,0.1);border:1px solid rgba(45,212,191,0.3);color:var(--accent);}
    .badge-artist{background:rgba(167,139,250,0.1);border:1px solid rgba(167,139,250,0.3);color:#a78bfa;}
    .badge-reader{background:rgba(96,165,250,0.1);border:1px solid rgba(96,165,250,0.3);color:#60a5fa;}

    /* States */
    .state-wrap{text-align:center;padding:60px 24px;}
    .state-icon{font-size:40px;color:var(--text3);margin-bottom:16px;}
    .state-title{font-family:'Cinzel',serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;}
    .state-body{font-size:14px;color:var(--text3);max-width:360px;margin:0 auto 24px;}
    .state-btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent2);color:white;padding:10px 22px;border-radius:9px;text-decoration:none;font-size:13px;font-weight:700;transition:all 0.2s;}
    .state-btn:hover{background:var(--accent);color:var(--bg);}

    /* ARTWORK 3-COLUMN GRID */
    .artwork-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
    .artwork-bubble{display:flex;flex-direction:row;align-items:stretch;background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:border-color 0.2s;}
    .artwork-bubble:hover{border-color:rgba(45,212,191,0.35);}
    .artwork-thumb{width:180px;min-height:120px;flex-shrink:0;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;color:white;overflow:hidden;border-radius:0;}
    .artwork-thumb img{width:180px;height:100%;min-height:120px;object-fit:cover;display:block;flex-shrink:0;}
    .artwork-info{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:4px;justify-content:center;}
    .artwork-title{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .artwork-artist{font-size:11px;color:var(--accent);cursor:pointer;}
    .artwork-artist:hover{text-decoration:underline;}
    .artwork-flavor{font-size:12px;color:var(--text2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
    .artwork-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;}
    .badge-collab{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(167,139,250,0.12);border:1px solid rgba(167,139,250,0.3);color:#a78bfa;display:inline-flex;align-items:center;gap:4px;}
    @media(max-width:1000px){.artwork-grid{grid-template-columns:1fr 1fr;}}
    @media(max-width:700px){.artwork-grid{grid-template-columns:1fr;}.artwork-thumb,.artwork-thumb img{width:100px;}.results-grid{grid-template-columns:1fr;}}

    /* Load more */
    .load-more-wrap{text-align:center;margin-top:24px;}
    .load-more-btn{background:transparent;border:1px solid var(--border);border-radius:9px;padding:10px 28px;color:var(--text2);font-size:13px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;transition:all 0.2s;}
    .load-more-btn:hover{border-color:var(--accent);color:var(--accent);}

    footer{background:var(--bg2);border-top:1px solid var(--border);padding:28px;text-align:center;color:var(--text3);font-size:13px;margin-top:auto;}
    .footer-links{display:flex;justify-content:center;gap:24px;margin:10px 0;flex-wrap:wrap;}
    .footer-links a{color:var(--text3);text-decoration:none;transition:color 0.2s;}
    .footer-links a:hover{color:var(--accent);}
  </style>
</head>
<body>

  <nav style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
    <a class="logo" href="index.html">Dawn<span>Scribe</span></a>
    <div class="nav-search-bar">
      <i class="ti ti-search" id="search-icon"></i>
      <input type="text" id="nav-search-input" placeholder="Search DawnScribe…" autocomplete="off"/>
    </div>
    <button class="tag-mode-btn" id="tag-mode-btn" onclick="toggleTagMode()">
      <i class="ti ti-tag"></i> Search by Tag
    </button>
    <a class="back-btn" href="index.html"><i class="ti ti-arrow-left"></i> Back</a>
  </nav>

  <div class="filters-bar">
    <button class="filter-tab active" data-type="titles" onclick="switchTab(this)"><i class="ti ti-book-2"></i> Titles <span class="filter-count" id="count-titles">—</span></button>
    <button class="filter-tab" data-type="authors" onclick="switchTab(this)"><i class="ti ti-feather"></i> Authors <span class="filter-count" id="count-authors">—</span></button>
    <button class="filter-tab" data-type="artwork" onclick="switchTab(this)"><i class="ti ti-photo"></i> Artwork <span class="filter-count" id="count-artwork">—</span></button>
    <button class="filter-tab" data-type="artists" onclick="switchTab(this)"><i class="ti ti-brush"></i> Artists <span class="filter-count" id="count-artists">—</span></button>
    <button class="filter-tab" data-type="oneshots" onclick="switchTab(this)"><i class="ti ti-camera"></i> One-Shots <span class="filter-count" id="count-oneshots">—</span></button>
    <button class="adv-toggle" id="adv-toggle" onclick="toggleAdvanced()"><i class="ti ti-adjustments"></i> Filters</button>
  </div>

  <div class="adv-panel" id="adv-panel">
    <div class="adv-grid">
      <div class="adv-field"><label>Include tags</label><input id="adv-inc-tags" placeholder="fantasy, romance"/></div>
      <div class="adv-field"><label>Exclude tags</label><input id="adv-exc-tags" placeholder="harem, isekai"/></div>
      <div class="adv-field"><label>Type</label>
        <select id="adv-fanfic"><option value="">Any</option><option value="original">Original only</option><option value="fanfic">Fanfiction only</option></select></div>
      <div class="adv-field"><label>Status</label>
        <select id="adv-status"><option value="">Any</option><option value="ongoing">Ongoing</option><option value="completed">Completed</option><option value="hiatus">On Hiatus</option></select></div>
      <div class="adv-field"><label>Min chapters</label><input id="adv-min-ch" type="number" min="0" placeholder="e.g. 10"/></div>
      <div class="adv-field"><label>Min rating</label>
        <select id="adv-min-rating"><option value="">Any</option><option value="4.5">4.5★+</option><option value="4">4★+</option><option value="3">3★+</option></select></div>
      <div class="adv-field"><label>Sort by</label>
        <select id="adv-sort"><option value="newest">Newest</option><option value="rating">Highest rated</option><option value="views">Most viewed</option><option value="sparks">Most sparked</option></select></div>
    </div>
    <div class="adv-actions">
      <button class="adv-apply" onclick="applyAdvanced()"><i class="ti ti-search"></i> Apply</button>
      <button class="adv-clear" onclick="clearAdvanced()">Clear</button>
      <span class="adv-hint">Tag, status, chapter, and rating filters apply to Titles &amp; Artwork. Leave the search box empty to browse everything with just filters.</span>
    </div>
  </div>

  <div class="page-wrap">
    <div class="results-header">
      <h1 class="results-title">Results for <span id="query-display"></span></h1>
      <p class="results-meta" id="results-meta"></p>
    </div>
    <div id="results-container">
      <div class="state-wrap"><div class="state-icon"><i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i></div></div>
    </div>
    <div class="load-more-wrap" id="load-more-wrap" style="display:none;">
      <button class="load-more-btn" onclick="loadMore()"><i class="ti ti-chevron-down"></i> Load more</button>
    </div>
  </div>

  <footer>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="terms.html">Terms of Service</a>
      <a href="privacy.html">Privacy Policy</a>
      <a href="guidelines.html">Community Guidelines</a>
      <a href="contact.html">Contact</a>
    </div>
    <p>© 2026 DawnScribe. All rights reserved.</p>
  </footer>

  <script src="blockUtils.js"></script>
<script>
    const SUPA_URL = 'https://cajjyyskpmjnpcxcfeuk.supabase.co';
    const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhamp5eXNrcG1qbnBjeGNmZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDUyMDUsImV4cCI6MjA5NTMyMTIwNX0.s93zWwRYymTsoW5BfUhUDli13ArCtk4S-tegAs54A2c';
    const db = window.supabase.createClient(SUPA_URL, SUPA_KEY);
    window.db = db;

    const PAGE_SIZE = 20;
    var state = { type: 'titles', query: '', offset: 0, total: 0, results: [] };
    var counts = { titles: null, authors: null, artwork: null, artists: null, oneshots: null };
    var myContentFilters = { safe: true, gore: false, erotica: false };
    var myBlockedTags = [];
    var myMutedIds = [];
    var myFilteredWarnings = [];
    var myLangPrefs = { pref_language: 'any', lang_original: true, lang_strict: false };

    const coverColors = ['#2dd4bf','#f59e0b','#a78bfa','#f87171','#34d399','#60a5fa','#fb923c'];
    function coverColor(id) { return coverColors[Math.abs(id || 0) % coverColors.length]; }
    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    // Parse URL params
    function getParams() {
      var p = new URLSearchParams(window.location.search);
      return { type: p.get('type') || 'titles', q: (p.get('q') || '').trim(), tagmode: p.get('tagmode') === '1' };
    }


    // ── TAB SWITCH
    function switchTab(btn) {
      document.querySelectorAll('.filter-tab').forEach(function(t){ t.classList.remove('active'); });
      btn.classList.add('active');
      var newType = btn.dataset.type;
      state.type = newType;
      state.offset = 0;
      state.results = [];
      updateUrl();
      runSearch(true);
    }

    function updateUrl() {
      var url = new URL(window.location.href);
      url.searchParams.set('type', state.type);
      url.searchParams.set('q', state.query);
      if (tagMode) { url.searchParams.set('tagmode', '1'); } else { url.searchParams.delete('tagmode'); }
      var advParams = { inc: adv.inc.join(','), exc: adv.exc.join(','), ftype: adv.fanfic, status: adv.status,
        minch: adv.minCh || '', minr: adv.minRating || '', sort: adv.sort !== 'newest' ? adv.sort : '' };
      Object.keys(advParams).forEach(function(k){
        if (advParams[k]) url.searchParams.set(k, advParams[k]); else url.searchParams.delete(k);
      });
      history.replaceState(null, '', url.toString());
    }

    // ── ADVANCED FILTERS ─────────────────────────────────────────
    var adv = { inc: [], exc: [], fanfic: '', status: '', minCh: 0, minRating: 0, sort: 'newest' };

    function parseTagList(s){
      return String(s||'').split(',').map(function(t){ return t.trim().toLowerCase(); }).filter(Boolean).slice(0, 8);
    }
    function advActive(){
      return adv.inc.length || adv.exc.length || adv.fanfic || adv.status || adv.minCh || adv.minRating || adv.sort !== 'newest';
    }
    function toggleAdvanced(){
      document.getElementById('adv-panel').classList.toggle('open');
    }
    function readAdvInputs(){
      adv.inc = parseTagList(document.getElementById('adv-inc-tags').value);
      adv.exc = parseTagList(document.getElementById('adv-exc-tags').value);
      adv.fanfic = document.getElementById('adv-fanfic').value;
      adv.status = document.getElementById('adv-status').value;
      adv.minCh = parseInt(document.getElementById('adv-min-ch').value, 10) || 0;
      adv.minRating = parseFloat(document.getElementById('adv-min-rating').value) || 0;
      adv.sort = document.getElementById('adv-sort').value || 'newest';
    }
    function writeAdvInputs(){
      document.getElementById('adv-inc-tags').value = adv.inc.join(', ');
      document.getElementById('adv-exc-tags').value = adv.exc.join(', ');
      document.getElementById('adv-fanfic').value = adv.fanfic;
      document.getElementById('adv-status').value = adv.status;
      document.getElementById('adv-min-ch').value = adv.minCh || '';
      document.getElementById('adv-min-rating').value = adv.minRating || '';
      document.getElementById('adv-sort').value = adv.sort;
    }
    function advActiveCount(){
      var n = 0;
      if (adv.inc.length) n++;
      if (adv.exc.length) n++;
      if (adv.fanfic) n++;
      if (adv.status) n++;
      if (adv.minCh) n++;
      if (adv.minRating) n++;
      if (adv.sort !== 'newest') n++;
      return n;
    }
    function updateAdvToggle(){
      var n = advActiveCount();
      var btn = document.getElementById('adv-toggle');
      btn.classList.toggle('on', n > 0);
      var chip = btn.querySelector('.adv-active-count');
      if (n > 0) {
        if (!chip) { chip = document.createElement('span'); chip.className = 'adv-active-count'; btn.appendChild(chip); }
        chip.textContent = n;
      } else {
        if (chip) chip.remove();
      }
    }
    function applyAdvanced(){
      readAdvInputs();
      document.getElementById('adv-toggle').classList.toggle('on', !!advActive());
      updateAdvToggle();
      state.offset = 0; state.results = [];
      updateUrl();
      runSearch(true);
    }
    function clearAdvanced(){
      adv = { inc: [], exc: [], fanfic: '', status: '', minCh: 0, minRating: 0, sort: 'newest' };
      writeAdvInputs();
      document.getElementById('adv-toggle').classList.remove('on');
      updateAdvToggle();
      state.offset = 0; state.results = [];
      updateUrl();
      runSearch(true);
    }
    // Escape a value for PostgREST ilike patterns (%, _ are wildcards)
    function ilikeEsc(s){ return s.replace(/[%_]/g, '\\$&').replace(/"/g, ''); }
    function applyAdvancedFilters(q, isNovel){
      adv.inc.forEach(function(t){ q = q.ilike('tags_all', '%"' + ilikeEsc(t) + '"%'); });
      adv.exc.forEach(function(t){ q = q.not('tags_all', 'ilike', '%"' + ilikeEsc(t) + '"%'); });
      if (adv.fanfic === 'original') q = q.neq('is_fanfiction', true);
      if (adv.fanfic === 'fanfic') q = q.eq('is_fanfiction', true);
      if (isNovel) {
        if (adv.status) q = q.eq('status', adv.status);
        if (adv.minCh) q = q.gte('chapters_count', adv.minCh);
      }
      if (adv.minRating) q = q.gte('rating_avg', adv.minRating);
      return q;
    }
    function advOrder(q){
      if (adv.sort === 'rating') return q.order('rating_avg', { ascending: false, nullsFirst: false }).order('rating_count', { ascending: false });
      if (adv.sort === 'views') return q.order('views', { ascending: false, nullsFirst: false });
      if (adv.sort === 'sparks') return q.order('spark_count_total', { ascending: false, nullsFirst: false });
      return q.order('created_at', { ascending: false });
    }

    // ── TAG MODE ──────────────────────────────────────────────────
    var tagMode = false;

    function toggleTagMode() {
      tagMode = !tagMode;
      var btn = document.getElementById('tag-mode-btn');
      var icon = document.getElementById('search-icon');
      var input = document.getElementById('nav-search-input');
      if (tagMode) {
        btn.classList.add('active');
        btn.innerHTML = '<i class="ti ti-tag"></i> Tag Mode On';
        icon.className = 'ti ti-tag';
        input.placeholder = 'Search by tag… e.g. fantasy, romance';
      } else {
        btn.classList.remove('active');
        btn.innerHTML = '<i class="ti ti-tag"></i> Search by Tag';
        icon.className = 'ti ti-search';
        input.placeholder = 'Search DawnScribe…';
      }
      if (input.value.trim()) runSearch(true);
    }

    // Applies the viewer's content filter and blocked-tag preferences to a works query
    // Safe is the master switch: when on, gore AND erotica are both hidden no matter what.
    function applyContentFilters(q) {
      var allowGore   = myContentFilters.gore   !== false && !myContentFilters.safe;
      var allowErotica = myContentFilters.erotica !== false && !myContentFilters.safe;
      if (!allowGore) q = q.or('content_rating_gore.eq.false,content_rating_gore.is.null');
      if (!allowErotica) q = q.or('content_rating_erotica.eq.false,content_rating_erotica.is.null');
      myBlockedTags.forEach(function(tag){ q = q.not('tags_all', 'ilike', '%"' + tag.replace(/"/g,'') + '"%'); });
      if (myMutedIds.length) q = q.not('author_id', 'in', '("' + myMutedIds.join('","') + '")');
      myFilteredWarnings.forEach(function(w){ q = q.not('content_warnings', 'cs', JSON.stringify([w])); });
      return q;
    }

    // Excludes fan translations if turned off, and hard-filters by language if
    // strict mode is on. (Novels only — language doesn't apply to artwork search.)
    function applyLanguageFilters(q) {
      if (!myLangPrefs.lang_original) q = q.eq('is_fan_translation', false);
      if (myLangPrefs.lang_strict && myLangPrefs.pref_language !== 'any') q = q.eq('language', myLangPrefs.pref_language);
      return q;
    }

    // ── QUERIES
    async function queryTitles(q, offset) {
      var col = tagMode ? 'tags_all' : 'title';
      var query = db.from('works')
        .select('id, title, cover_url, type, tags_main, synopsis, flavor_text, created_at, author_id, language', { count: 'exact' })
        .eq('type', 'novel')
        .eq('is_published', true);
      if (q) query = query.ilike(col, '%' + (tagMode ? ilikeEsc(q) : q) + '%');
      query = applyContentFilters(query);
      query = applyLanguageFilters(query);
      query = applyAdvancedFilters(query, true);
      return await advOrder(query)
        .range(offset, offset + PAGE_SIZE - 1);
    }

    async function queryAuthors(q, offset) {
      if (!q) return { data: [], count: 0 };
      return await db.from('profiles')
        .select('id, username, display_name, avatar_url, role, bio', { count: 'exact' })
        .or('username.ilike.%' + q + '%,display_name.ilike.%' + q + '%')
        .order('username')
        .range(offset, offset + PAGE_SIZE - 1);
    }

    async function queryArtwork(q, offset) {
      var col = tagMode ? 'tags_all' : 'title';
      var query = db.from('works')
        .select('id, title, cover_url, type, tags_main, synopsis, flavor_text, created_at, author_id', { count: 'exact' })
        .eq('type', 'artwork')
        .eq('is_published', true);
      if (q) query = query.ilike(col, '%' + (tagMode ? ilikeEsc(q) : q) + '%');
      query = applyContentFilters(query);
      query = applyAdvancedFilters(query, false);
      return await advOrder(query)
        .range(offset, offset + PAGE_SIZE - 1);
    }

    async function queryArtists(q, offset) {
      if (!q) return { data: [], count: 0 };
      return await db.from('profiles')
        .select('id, username, display_name, avatar_url, role, bio', { count: 'exact' })
        .or('username.ilike.%' + q + '%,display_name.ilike.%' + q + '%')
        .ilike('role', '%Artist%')
        .order('username')
        .range(offset, offset + PAGE_SIZE - 1);
    }

    async function queryOneShots(q, offset) {
      var col = tagMode ? 'tags_all' : 'title';
      var query = db.from('works')
        .select('id, title, cover_url, type, tags_main, synopsis, flavor_text, created_at, author_id, language', { count: 'exact' })
        .eq('type', 'one-shot')
        .eq('is_published', true);
      if (q) query = query.ilike(col, '%' + (tagMode ? ilikeEsc(q) : q) + '%');
      query = applyContentFilters(query);
      query = applyLanguageFilters(query);
      query = applyAdvancedFilters(query, false);
      return await advOrder(query)
        .range(offset, offset + PAGE_SIZE - 1);
    }

    var queryFns = { titles: queryTitles, authors: queryAuthors, artwork: queryArtwork, artists: queryArtists, oneshots: queryOneShots };

    // ── RENDER
    function renderWorkCard(w, profileMap, collabSet) {
      var prof = (profileMap && profileMap[w.author_id]) || {};
      var author = prof.display_name || prof.username || 'Unknown';
      var authorHandle = prof.username || '';
      var color = coverColor(w.id);
      var letter = (w.title || '?')[0].toUpperCase();
      var isCollab = collabSet && collabSet[w.id];

      // ── ARTWORK bubble layout
      if (w.type === 'artwork') {
        var thumbHtml = w.cover_url
          ? '<img src="' + esc(w.cover_url) + '" alt="' + esc(w.title) + '"/>'
          : letter;
        var flavorText = w.synopsis || w.flavor_text || '';
        var flavorHtml = flavorText
          ? '<div class="artwork-flavor">' + esc(flavorText) + '</div>'
          : '';
        var collabHtml = isCollab
          ? '<span class="badge-collab"><i class="ti ti-users"></i> Collab</span>'
          : '';
        return '<a class="artwork-bubble" href="artwork.html?id=' + w.id + '">'
          + '<div class="artwork-thumb" style="background:' + color + ';">' + thumbHtml + '</div>'
          + '<div class="artwork-info">'
          + '<div class="artwork-title">' + esc(w.title) + '</div>'
          + '<span class="artwork-artist" onclick="event.stopPropagation();window.location.href=\'profile.html?user=' + esc(authorHandle) + '\'"" >by ' + esc(author) + '</span>'
          + flavorHtml
          + (collabHtml ? '<div class="artwork-meta">' + collabHtml + '</div>' : '')
          + '</div></a>';
      }

      // ── NOVEL list layout (unchanged)
      var coverHtml = w.cover_url
        ? '<img src="' + esc(w.cover_url) + '" alt="cover"/>'
        : letter;
      var tags = [];
      if (w.tags_main) {
        try { tags = JSON.parse(w.tags_main); } catch(e) { tags = []; }
        tags = tags.slice(0, 3);
      }
      var tagHtml = tags.map(function(t){ return '<span class="result-tag">' + esc(t) + '</span>'; }).join('');
      var flavorHtml2 = w.synopsis
        ? '<div class="result-flavor">' + esc(w.synopsis) + '</div>'
        : '';
      return '<a class="result-card" href="story.html?id=' + w.id + '">'
        + '<div class="result-cover" style="background:' + color + ';">' + coverHtml + '</div>'
        + '<div class="result-body">'
        + '<span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:2px;display:block;">' + (w.type === 'one-shot' ? 'One-Shot' : 'Novel') + '</span>'
        + '<div class="result-title">' + esc(w.title) + '</div>'
        + '<div class="result-sub">by <span onclick="event.stopPropagation();window.location.href=\'profile.html?user=' + esc(authorHandle) + '\'" style="color:var(--accent);cursor:pointer;">' + esc(author) + '</span></div>'
        + flavorHtml2
        + (tagHtml ? '<div class="result-tags">' + tagHtml + '</div>' : '')
        + '</div></a>';
    }
    function renderProfileCard(p) {
      var name = p.display_name || p.username;
      var initial = (name || '?')[0].toUpperCase();
      var coverHtml = p.avatar_url ? '<img src="' + esc(p.avatar_url) + '" alt="avatar"/>' : initial;
      var roles = (p.role || '').split(',').map(function(r){ return r.trim(); }).filter(Boolean);
      var badgeHtml = roles.map(function(r) {
        var cls = r === 'Artist' ? 'badge-artist' : r === 'Reader' ? 'badge-reader' : 'badge-author';
        return '<span class="result-badge ' + cls + '">' + esc(r) + '</span>';
      }).join('');
      var bio = p.bio ? '<div class="result-sub" style="margin-bottom:6px;">' + esc(p.bio.slice(0, 100)) + (p.bio.length > 100 ? '…' : '') + '</div>' : '';
      return '<a class="result-card" href="profile.html?user=' + esc(p.username) + '">'
        + '<div class="result-cover round" style="background:var(--bg4);">' + coverHtml + '</div>'
        + '<div class="result-body">'
        + '<div class="result-title">' + esc(name) + '</div>'
        + '<div class="result-sub">@' + esc(p.username) + '</div>'
        + bio
        + (badgeHtml ? '<div class="result-tags">' + badgeHtml + '</div>' : '')
        + '</div></a>';
    }

     function renderResults(items, type, append, profileMap, collabSet) {
      items = items.filter(function(item){ var uid = item.author_id || item.id; return !dsBlock.either(uid); });
      var container = document.getElementById('results-container');
      var isProfile = (type === 'authors' || type === 'artists');
      var isArtwork = (type === 'artwork');

      if (!append) {
        if (!items.length) {
          container.innerHTML = '<div class="state-wrap">'
            + '<div class="state-icon"><i class="ti ti-search-off"></i></div>'
            + '<div class="state-title">No results found</div>'
            + '<div class="state-body">Try a different search term, or browse the homepage to discover new content.</div>'
            + '<a class="state-btn" href="index.html"><i class="ti ti-compass"></i> Browse DawnScribe</a>'
            + '</div>';
          return;
        }
        var gridClass = isArtwork ? 'artwork-grid' : 'results-grid';
        container.innerHTML = '<div class="' + gridClass + '" id="results-grid"></div>';
      }

      var grid = document.getElementById('results-grid');
      items.forEach(function(item) {
        var html = isProfile ? renderProfileCard(item) : renderWorkCard(item, profileMap, collabSet);
        var temp = document.createElement('div');
        temp.innerHTML = html;
        var node = temp.firstElementChild;
        if (node) grid.appendChild(node);
      });
    }

    // ── SEARCH
    async function runSearch(reset) {
      if (reset) {
        state.offset = 0;
        state.results = [];
        document.getElementById('results-container').innerHTML =
          '<div class="state-wrap"><div class="state-icon"><i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i></div></div>';
        document.getElementById('load-more-wrap').style.display = 'none';
      }

      var q = state.query;
      var type = state.type;

      try {
        var { data, count, error } = await queryFns[type](q, state.offset);
        if (error) throw error;

        var items = data || [];
        state.results = state.results.concat(items);
        state.offset += items.length;
        if (counts[type] === null && count !== null) {
          counts[type] = count;
          updateCountBadge(type, count);
        }

        // For work results, batch-fetch author profiles separately (no FK join available)
        var profileMap = {};
        var collabSet = {};
        var isWorkType = (type === 'titles' || type === 'artwork');
        if (isWorkType && items.length) {
          var authorIds = items.map(function(w){ return w.author_id; }).filter(Boolean);
          if (authorIds.length) {
            var { data: profs } = await db.from('profiles')
              .select('id, username, display_name')
              .in('id', authorIds);
            (profs || []).forEach(function(p){ profileMap[p.id] = p; });
          }
          // Fetch collab info for artwork
          if (type === 'artwork') {
            var workIds = items.map(function(w){ return w.id; });
            var { data: collabs } = await db.from('artwork_collabs')
              .select('artwork_id')
              .in('artwork_id', workIds)
              .eq('status', 'approved');
            (collabs || []).forEach(function(c){ collabSet[c.artwork_id] = true; });
          }
        }

        renderResults(items, type, !reset, profileMap, collabSet);

        var _displayCount = counts[type] !== null ? counts[type] : state.results.length;
        document.getElementById('results-meta').textContent =
          _displayCount + ' result' + (_displayCount !== 1 ? 's' : '');

        var hasMore = counts[type] !== null ? state.offset < counts[type] : items.length === PAGE_SIZE;
        document.getElementById('load-more-wrap').style.display = hasMore ? 'block' : 'none';

      } catch(e) {
        document.getElementById('results-container').innerHTML =
          '<div class="state-wrap"><div class="state-icon"><i class="ti ti-alert-circle"></i></div>'
          + '<div class="state-title">Something went wrong</div>'
          + '<div class="state-body">Please try again.</div></div>';
      }
    }

    function loadMore() {
      runSearch(false);
    }

    function updateCountBadge(type, count) {
      var el = document.getElementById('count-' + type);
      if (el) el.textContent = count > 999 ? '999+' : count;
    }

    // ── ALL COUNTS (run in background)
    async function fetchAllCounts(q) {
      var types = ['titles','authors','artwork','artists','oneshots'];
      await Promise.all(types.map(async function(t) {
        if (t === state.type) return; // already have it
        try {
          var res = await queryFns[t](q, 0);
          counts[t] = res.count || 0;
          updateCountBadge(t, counts[t]);
        } catch(e) {}
      }));
    }

    // ── NAV SEARCH BAR
    var navInput = document.getElementById('nav-search-input');
    var navTimer = null;
    navInput.addEventListener('input', function() {
      clearTimeout(navTimer);
      var delay = tagMode ? 150 : 350;
      navTimer = setTimeout(function() {
        var q = navInput.value.trim();
        state.query = q;
        state.offset = 0;
        counts = { titles: null, authors: null, artwork: null, artists: null, oneshots: null };
        document.getElementById('query-display').textContent = q ? '"' + q + '"' : '';
        updateUrl();
        if (!q) {
          var browseMode = advActive() && (state.type === 'titles' || state.type === 'artwork' || state.type === 'oneshots');
          if (!browseMode) {
            document.getElementById('results-container').innerHTML =
              '<div class="state-wrap">'
              + '<div class="state-icon"><i class="ti ti-search"></i></div>'
              + '<div class="state-title">Start searching</div>'
              + '<div class="state-body">Type something in the search bar above, or open <b>Filters</b> to browse by tag, status, and rating.</div>'
              + '</div>';
            document.getElementById('load-more-wrap').style.display = 'none';
            return;
          }
        }
        runSearch(true);
        if (q) fetchAllCounts(q);
      }, delay);
    });

    navInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        clearTimeout(navTimer);
        var q = navInput.value.trim();
        state.query = q;
        state.offset = 0;
        counts = { titles: null, authors: null, artwork: null, artists: null, oneshots: null };
        document.getElementById('query-display').textContent = q ? '"' + q + '"' : '';
        updateUrl();
        if (!q) {
          var browseMode = advActive() && (state.type === 'titles' || state.type === 'artwork' || state.type === 'oneshots');
          if (!browseMode) {
            document.getElementById('results-container').innerHTML =
              '<div class="state-wrap">'
              + '<div class="state-icon"><i class="ti ti-search"></i></div>'
              + '<div class="state-title">Start searching</div>'
              + '<div class="state-body">Type something in the search bar above, or open <b>Filters</b> to browse by tag, status, and rating.</div>'
              + '</div>';
            document.getElementById('load-more-wrap').style.display = 'none';
            return;
          }
        }
        runSearch(true);
        if (q) fetchAllCounts(q);
      }
    });

    // ── / KEY: focus search bar
    document.addEventListener('keydown', function(e) {
      if (e.key === '/' && document.activeElement !== navInput) {
        e.preventDefault();
        navInput.focus();
        navInput.select();
      }
    });

    // ── INIT
    (async function init() {
      try {
        var bs = await window.db.auth.getSession();
        if(bs&&bs.data&&bs.data.session) {
          await dsBlock.load(bs.data.session.user.id);
          var { data: prefRow } = await db.from('profiles').select('settings_filter_safe,settings_filter_gore,settings_filter_erotica,pref_story_language,lang_original,lang_strict,filtered_content_warnings').eq('id', bs.data.session.user.id).maybeSingle();
          if (prefRow) {
            if (prefRow.settings_filter_safe !== null && prefRow.settings_filter_safe !== undefined) myContentFilters.safe = !!prefRow.settings_filter_safe;
            myContentFilters.gore = prefRow.settings_filter_gore;
            myContentFilters.erotica = prefRow.settings_filter_erotica;
            if (prefRow.pref_story_language) myLangPrefs.pref_language = prefRow.pref_story_language;
            if (prefRow.lang_original !== null && prefRow.lang_original !== undefined) myLangPrefs.lang_original = prefRow.lang_original;
            if (prefRow.lang_strict !== null && prefRow.lang_strict !== undefined) myLangPrefs.lang_strict = prefRow.lang_strict;
            if (Array.isArray(prefRow.filtered_content_warnings)) myFilteredWarnings = prefRow.filtered_content_warnings;
          }
          try {
            var { data: muteRows } = await db.from('mutes').select('muted_id').eq('muter_id', bs.data.session.user.id);
            myMutedIds = (muteRows || []).map(function(r){ return r.muted_id; });
          } catch(e2) {}
        }
      } catch(e){}
      try {
        var tp = localStorage.getItem('ds_tag_prefs');
        if (tp) {
          var parsed = JSON.parse(tp);
          myBlockedTags = Object.keys(parsed).filter(function(t){ return parsed[t] === 'blocked'; });
        }
      } catch(e){}
      var params = getParams();
      state.type = params.type;
      state.query = params.q;

      // Restore advanced filters from URL (shareable filtered searches)
      var up = new URLSearchParams(window.location.search);
      adv.inc = parseTagList(up.get('inc'));
      adv.exc = parseTagList(up.get('exc'));
      adv.fanfic = up.get('ftype') || '';
      adv.status = up.get('status') || '';
      adv.minCh = parseInt(up.get('minch'), 10) || 0;
      adv.minRating = parseFloat(up.get('minr')) || 0;
      adv.sort = up.get('sort') || 'newest';
      writeAdvInputs();
      if (advActive()) {
        document.getElementById('adv-toggle').classList.add('on');
        document.getElementById('adv-panel').classList.add('open');
        updateAdvToggle();
      }

      // Auto-activate tag mode if coming from nav tag search
      if (params.tagmode) {
        tagMode = true;
        var btn = document.getElementById('tag-mode-btn');
        var icon = document.getElementById('search-icon');
        var input = document.getElementById('nav-search-input');
        if (btn) { btn.classList.add('active'); btn.innerHTML = '<i class="ti ti-tag"></i> Tag Mode On'; }
        if (icon) icon.className = 'ti ti-tag';
        if (input) input.placeholder = 'Search by tag… e.g. fantasy, romance';
      }

      // Set active tab
      document.querySelectorAll('.filter-tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.type === state.type);
      });

      // Set nav input
      navInput.value = state.query;
      document.getElementById('query-display').textContent = state.query ? '"' + state.query + '"' : '';

      // Empty query is fine when advanced filters are set (browse mode) —
      // but Authors/Artists tabs still need a text query.
      var browseMode = !state.query && advActive() && (state.type === 'titles' || state.type === 'artwork' || state.type === 'oneshots');
      if (!state.query && !browseMode) {
        var isPeopleTab = state.type === 'authors' || state.type === 'artists';
        document.getElementById('results-container').innerHTML =
          '<div class="state-wrap">'
          + '<div class="state-icon"><i class="ti ti-search"></i></div>'
          + '<div class="state-title">Start searching</div>'
          + '<div class="state-body">' + (isPeopleTab
              ? 'Enter a name to search for ' + (state.type === 'artists' ? 'artists' : 'authors') + '.'
              : 'Type something in the search bar above, or open <b>Filters</b> to browse by tag, status, and rating.')
          + '</div>'
          + '</div>';
        return;
      }

      runSearch(true);
      if (state.query) fetchAllCounts(state.query);
    })();
  </script>
