<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DawnScribe — Site Statistics</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (async function() {
      const _db = window.supabase.createClient(
        'https://cajjyyskpmjnpcxcfeuk.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhamp5eXNrcG1qbnBjeGNmZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDUyMDUsImV4cCI6MjA5NTMyMTIwNX0.s93zWwRYymTsoW5BfUhUDli13ArCtk4S-tegAs54A2c'
      );
      var session = (await _db.auth.getSession()).data.session;
      if (!session || session.user.id !== '516db718-edd5-4856-9281-2df642d006f5') {
        document.documentElement.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0a0f;color:#f87171;font-family:Lato,sans-serif;font-size:18px;">Access denied.</div>';
      }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
  <style>
    :root {
      --bg:#0a0a0f; --bg2:#12121a; --bg3:#1a1a26; --bg4:#22223a;
      --accent:#2dd4bf; --accent2:#0d9488;
      --text:#f1f0ff; --text2:#9b9bc0; --text3:#5a5a80;
      --border:rgba(255,255,255,0.07); --red:#f87171; --green:#34d399; --gold:#f59e0b;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;font-size:15px;line-height:1.6;min-height:100vh;}
    nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .logo{font-family:'Cinzel',serif;font-size:22px;color:var(--accent);text-decoration:none;letter-spacing:1px;}
    .logo span{color:var(--text);}
    .back-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 16px;color:var(--text2);font-size:13px;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;text-decoration:none;}
    .back-btn:hover{border-color:var(--accent);color:var(--accent);}

    .page{max-width:900px;margin:0 auto;padding:40px 24px 80px;}
    .page-title{font-family:'Cinzel',serif;font-size:26px;font-weight:700;color:var(--text);margin-bottom:6px;}
    .page-title span{color:var(--accent);}
    .page-sub{font-size:14px;color:var(--text3);margin-bottom:28px;}

    /* ── TABS ─────────────────────────────────────────────── */
    .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px;border-bottom:1px solid var(--border);padding-bottom:0;}
    .tab-btn{background:none;border:none;border-bottom:2px solid transparent;padding:10px 16px;font-size:13px;font-weight:700;color:var(--text3);cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.15s;font-family:'Lato',sans-serif;}
    .tab-btn:hover{color:var(--text2);}
    .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
    .tab-count{background:var(--bg3);border-radius:10px;padding:1px 7px;font-size:11px;color:var(--text3);}
    .tab-btn.active .tab-count{background:rgba(45,212,191,0.12);color:var(--accent);}

    /* ── LIST ─────────────────────────────────────────────── */
    .list-wrap{display:flex;flex-direction:column;gap:10px;}
    .loading-note,.empty-note{font-size:13px;color:var(--text3);text-align:center;padding:40px 0;}
    .loading-note i{display:block;margin-bottom:8px;font-size:22px;}

    .row-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;transition:border-color 0.15s;}
    .row-card.clickable{cursor:pointer;}
    .row-card.clickable:hover{border-color:rgba(45,212,191,0.25);}

    .row-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--bg4);flex-shrink:0;border:2px solid var(--border);}
    .row-avatar-placeholder{width:40px;height:40px;border-radius:50%;background:var(--bg4);flex-shrink:0;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:16px;}

    .row-info{flex:1;min-width:0;}
    .row-title{font-weight:700;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .row-meta{font-size:12px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

    .row-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.5px;flex-shrink:0;}
    .row-badge.admin{background:rgba(245,158,11,0.15);color:var(--gold);}
    .row-badge.moderator{background:rgba(45,212,191,0.12);color:var(--accent);}
    .row-badge.banned{background:rgba(248,113,113,0.12);color:var(--red);}
    .row-badge.user{background:rgba(155,155,192,0.1);color:var(--text3);}
    .row-badge.published{background:rgba(52,211,153,0.12);color:var(--green);}
    .row-badge.draft{background:rgba(155,155,192,0.1);color:var(--text3);}
    .row-badge.open{background:rgba(248,113,113,0.12);color:var(--red);}

    .row-arrow-link{display:flex;align-items:center;gap:6px;color:var(--text3);font-size:12px;flex-shrink:0;text-decoration:none;transition:color 0.15s;}
    .row-arrow-link:hover{color:var(--accent);}

    .follow-pair{display:flex;align-items:center;gap:10px;flex:1;min-width:0;flex-wrap:wrap;}
    .follow-name-link{color:var(--text);font-weight:700;font-size:13px;text-decoration:none;display:flex;align-items:center;gap:6px;min-width:0;}
    .follow-name-link:hover{color:var(--accent);}
    .follow-name-link .row-avatar,.follow-name-link .row-avatar-placeholder{width:28px;height:28px;font-size:12px;}
    .follow-arrow{color:var(--text3);font-size:13px;flex-shrink:0;}

    footer{background:var(--bg2);border-top:1px solid var(--border);padding:24px;text-align:center;color:var(--text3);font-size:13px;}
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <nav>
    <a class="logo" href="index.html">Dawn<span>Scribe</span></a>
    <a class="back-btn" href="WhiteRoomUnbreakable.html"><i class="ti ti-arrow-left"></i> Back to Admin</a>
  </nav>

  <div class="page">
    <h1 class="page-title">Site <span>Statistics</span></h1>
    <p class="page-sub">Detailed breakdowns behind each number on the admin dashboard. Click any user or work to open it.</p>

    <div class="tabs" id="tabs"></div>
    <div class="list-wrap" id="list-wrap">
      <div class="loading-note"><i class="ti ti-loader" style="animation:spin 1s linear infinite;"></i>Loading...</div>
    </div>
  </div>

  <footer>&copy; 2026 DawnScribe. Admin panel.</footer>

  <script>
    const SUPABASE_URL = 'https://cajjyyskpmjnpcxcfeuk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhamp5eXNrcG1qbnBjeGNmZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDUyMDUsImV4cCI6MjA5NTMyMTIwNX0.s93zWwRYymTsoW5BfUhUDli13ArCtk4S-tegAs54A2c';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    window.db = db;

    const TABS = [
      { id: 'users',  label: 'Users',      icon: 'ti-users' },
      { id: 'works',  label: 'Works',      icon: 'ti-books' },
      { id: 'reports', label: 'Open Reports', icon: 'ti-flag' },
      { id: 'banned', label: 'Banned',     icon: 'ti-user-off' },
      { id: 'mods',   label: 'Moderators', icon: 'ti-shield' },
      { id: 'follows', label: 'Follows',   icon: 'ti-heart' }
    ];

    var activeTab = 'users';
    var tabCounts = {};
    var profileCache = {}; // id -> profile row, for resolving follow pairs

    function escHtml(s) {
      return (s || '').replace(/[&<>"']/g, function(c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    function timeAgo(dateStr) {
      var diff = Date.now() - new Date(dateStr).getTime();
      var days = Math.floor(diff / 86400000);
      if (days === 0) return 'Today';
      if (days === 1) return 'Yesterday';
      if (days < 30) return days + 'd ago';
      var months = Math.floor(days / 30);
      if (months < 12) return months + 'mo ago';
      return Math.floor(months / 12) + 'y ago';
    }

    function avatarHtml(user, cls) {
      cls = cls || 'row-avatar';
      var placeholderCls = cls === 'row-avatar' ? 'row-avatar-placeholder' : cls + '-placeholder';
      if (user && user.avatar_url) {
        return '<img class="' + cls + '" src="' + escHtml(user.avatar_url) + '" alt=""/>';
      }
      var initial = user && (user.display_name || user.username) ? (user.display_name || user.username).charAt(0).toUpperCase() : '?';
      return '<div class="' + (placeholderCls.includes('placeholder') ? placeholderCls : cls + '-placeholder') + '">' + initial + '</div>';
    }

    function roleBadge(role) {
      var r = role || 'user';
      var label = r.charAt(0).toUpperCase() + r.slice(1);
      var cls = ['admin','moderator','banned'].includes(r) ? r : 'user';
      return '<span class="row-badge ' + cls + '">' + escHtml(label) + '</span>';
    }

    // ── TABS ──────────────────────────────────────────────────────
    function renderTabs() {
      document.getElementById('tabs').innerHTML = TABS.map(function(t) {
        var active = t.id === activeTab ? ' active' : '';
        var count = tabCounts[t.id] !== undefined ? '<span class="tab-count">' + tabCounts[t.id] + '</span>' : '';
        return '<button class="tab-btn' + active + '" onclick="selectTab(\'' + t.id + '\')"><i class="ti ' + t.icon + '"></i> ' + t.label + ' ' + count + '</button>';
      }).join('');
    }

    function selectTab(tabId) {
      activeTab = tabId;
      renderTabs();
      loadTab(tabId);
    }

    function showLoading() {
      document.getElementById('list-wrap').innerHTML = '<div class="loading-note"><i class="ti ti-loader" style="animation:spin 1s linear infinite;"></i>Loading...</div>';
    }
    function showEmpty(msg) {
      document.getElementById('list-wrap').innerHTML = '<div class="empty-note">' + escHtml(msg) + '</div>';
    }

    // ── LOAD TAB DATA ────────────────────────────────────────────
    async function loadTab(tabId) {
      showLoading();
      if (tabId === 'users') return loadUsers();
      if (tabId === 'works') return loadWorks();
      if (tabId === 'reports') return loadReports();
      if (tabId === 'banned') return loadProfilesByRole('banned', 'No banned users.');
      if (tabId === 'mods') return loadProfilesByRole('moderator', 'No moderators yet.');
      if (tabId === 'follows') return loadFollows();
    }

    // ── USERS ────────────────────────────────────────────────────
    async function loadUsers() {
      var result = await db.from('profiles').select('id,username,display_name,avatar_url,role,created_at').order('created_at', { ascending: false });
      var users = result.data || [];
      if (users.length === 0) { showEmpty('No users found.'); return; }

      document.getElementById('list-wrap').innerHTML = users.map(function(u) {
        return '<div class="row-card clickable" onclick="window.open(\'profile.html?id=' + u.id + '\', \'_blank\')">' +
          avatarHtml(u) +
          '<div class="row-info">' +
            '<div class="row-title">' + escHtml(u.display_name || u.username || 'Unnamed') + ' ' + roleBadge(u.role) + '</div>' +
            '<div class="row-meta">@' + escHtml(u.username || 'unknown') + ' &middot; Joined ' + timeAgo(u.created_at) + '</div>' +
          '</div>' +
          '<span class="row-arrow-link"><i class="ti ti-external-link"></i></span>' +
        '</div>';
      }).join('');
    }

    // ── WORKS ────────────────────────────────────────────────────
    async function loadWorks() {
      var worksResult = await db.from('works').select('id,title,author_id,status,type,is_published,chapters_count,created_at').order('created_at', { ascending: false });
      var works = worksResult.data || [];
      if (works.length === 0) { showEmpty('No works posted yet.'); return; }

      var authorIds = Array.from(new Set(works.map(function(w) { return w.author_id; }).filter(Boolean)));
      var authorsResult = authorIds.length > 0
        ? await db.from('profiles').select('id,username,display_name').in('id', authorIds)
        : { data: [] };
      var authors = {};
      (authorsResult.data || []).forEach(function(a) { authors[a.id] = a; });

      document.getElementById('list-wrap').innerHTML = works.map(function(w) {
        var author = authors[w.author_id];
        var authorName = author ? (author.display_name || author.username) : 'Unknown';
        var pubBadge = w.is_published ? '<span class="row-badge published">Published</span>' : '<span class="row-badge draft">Draft</span>';
        return '<div class="row-card clickable" onclick="window.open(\'story.html?id=' + w.id + '\', \'_blank\')">' +
          '<div class="row-info">' +
            '<div class="row-title">' + escHtml(w.title || 'Untitled') + ' ' + pubBadge + '</div>' +
            '<div class="row-meta">by ' + escHtml(authorName) + ' &middot; ' + escHtml(w.type || 'novel') + ' &middot; ' + (w.chapters_count || 0) + ' chapter' + (w.chapters_count === 1 ? '' : 's') + ' &middot; ' + timeAgo(w.created_at) + '</div>' +
          '</div>' +
          '<span class="row-arrow-link"><i class="ti ti-external-link"></i></span>' +
        '</div>';
      }).join('');
    }

    // ── REPORTS ──────────────────────────────────────────────────
    async function loadReports() {
      var result = await db.from('reports').select('id,content_id,reason,description,status,created_at').eq('status', 'open').order('created_at', { ascending: false });
      var reports = result.data || [];
      if (reports.length === 0) { showEmpty('No open reports. All clear!'); return; }

      document.getElementById('list-wrap').innerHTML = reports.map(function(r) {
        return '<div class="row-card">' +
          '<div class="row-info">' +
            '<div class="row-title">' + escHtml(r.reason || 'No reason given') + ' <span class="row-badge open">Open</span></div>' +
            '<div class="row-meta">' + escHtml(r.description || 'No description') + '</div>' +
            '<div class="row-meta">Content ID: ' + escHtml(r.content_id || '—') + ' &middot; ' + timeAgo(r.created_at) + '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    // ── BANNED / MODERATORS (filtered profiles) ───────────────────
    async function loadProfilesByRole(role, emptyMsg) {
      var result = await db.from('profiles').select('id,username,display_name,avatar_url,role,created_at').eq('role', role).order('created_at', { ascending: false });
      var users = result.data || [];
      if (users.length === 0) { showEmpty(emptyMsg); return; }

      document.getElementById('list-wrap').innerHTML = users.map(function(u) {
        return '<div class="row-card clickable" onclick="window.open(\'profile.html?id=' + u.id + '\', \'_blank\')">' +
          avatarHtml(u) +
          '<div class="row-info">' +
            '<div class="row-title">' + escHtml(u.display_name || u.username || 'Unnamed') + ' ' + roleBadge(u.role) + '</div>' +
            '<div class="row-meta">@' + escHtml(u.username || 'unknown') + ' &middot; Joined ' + timeAgo(u.created_at) + '</div>' +
          '</div>' +
          '<span class="row-arrow-link"><i class="ti ti-external-link"></i></span>' +
        '</div>';
      }).join('');
    }

    // ── FOLLOWS ──────────────────────────────────────────────────
    async function loadFollows() {
      var result = await db.from('follows').select('id,follower_id,following_id,created_at').order('created_at', { ascending: false });
      var follows = result.data || [];
      if (follows.length === 0) { showEmpty('No follow relationships yet.'); return; }

      var ids = new Set();
      follows.forEach(function(f) { ids.add(f.follower_id); ids.add(f.following_id); });
      var idList = Array.from(ids).filter(Boolean);
      var profilesResult = idList.length > 0
        ? await db.from('profiles').select('id,username,display_name,avatar_url').in('id', idList)
        : { data: [] };
      var profiles = {};
      (profilesResult.data || []).forEach(function(p) { profiles[p.id] = p; });

      document.getElementById('list-wrap').innerHTML = follows.map(function(f) {
        var follower = profiles[f.follower_id];
        var following = profiles[f.following_id];
        var followerName = follower ? (follower.display_name || follower.username) : 'Unknown';
        var followingName = following ? (following.display_name || following.username) : 'Unknown';
        return '<div class="row-card">' +
          '<div class="follow-pair">' +
            '<a class="follow-name-link" href="profile.html?id=' + f.follower_id + '" target="_blank">' + avatarHtml(follower, 'row-avatar') + escHtml(followerName) + '</a>' +
            '<span class="follow-arrow"><i class="ti ti-arrow-right"></i> follows</span>' +
            '<a class="follow-name-link" href="profile.html?id=' + f.following_id + '" target="_blank">' + avatarHtml(following, 'row-avatar') + escHtml(followingName) + '</a>' +
          '</div>' +
          '<div class="row-meta" style="flex-shrink:0;">' + timeAgo(f.created_at) + '</div>' +
        '</div>';
      }).join('');
    }

    // ── COUNTS (for tab badges) ─────────────────────────────────
    async function loadCounts() {
      var [users, works, reports, banned, mods, follows] = await Promise.all([
        db.from('profiles').select('id', { count: 'exact', head: true }),
        db.from('works').select('id', { count: 'exact', head: true }),
        db.from('reports').select('id', { count: 'exact', head: true }).eq('status', 'open'),
        db.from('profiles').select('id', { count: 'exact', head: true }).eq('role', 'banned'),
        db.from('profiles').select('id', { count: 'exact', head: true }).eq('role', 'moderator'),
        db.from('follows').select('id', { count: 'exact', head: true })
      ]);
      tabCounts = {
        users: users.count ?? 0,
        works: works.count ?? 0,
        reports: reports.count ?? 0,
        banned: banned.count ?? 0,
        mods: mods.count ?? 0,
        follows: follows.count ?? 0
      };
      renderTabs();
    }

    // ── INIT ─────────────────────────────────────────────────────
    // Read ?tab= from URL so admin cards can deep-link to a specific tab
    var params = new URLSearchParams(window.location.search);
    var initialTab = params.get('tab');
    if (initialTab && TABS.some(function(t) { return t.id === initialTab; })) {
      activeTab = initialTab;
    }

    renderTabs();
    loadCounts();
    loadTab(activeTab);
  </script>
</body>
</html>
