<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DawnScribe — Site Statistics</title>
  <script src="accessibilityPrefs.js"></script>
  <meta name="robots" content="noindex,nofollow" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.documentElement.style.visibility = 'hidden';
    (async function() {
      window.db = window.supabase.createClient(
        'https://cajjyyskpmjnpcxcfeuk.supabase.co',
        'sb_publishable_ZZjE1u_pQn5YkrMKH4P3KQ_HSGqTjzx'
      );
      var session = null;
      for (var i = 0; i < 5; i++) {
        var r = await window.db.auth.getSession();
        session = r.data.session;
        if (session) break;
        await new Promise(function(res) { setTimeout(res, 350); });
      }
      var adminRow = session ? await window.db.from('admins').select('id').eq('id', session.user.id).maybeSingle() : null;
      if (!session || !adminRow || !adminRow.data) {
        document.documentElement.style.visibility = '';
        document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0a0f;color:#f87171;font-family:Lato,sans-serif;font-size:18px;">Access denied.</div>';
        return;
      }
      document.documentElement.style.visibility = '';
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css"/>
  <style>
    :root {
      --bg:#0a0a0f; --bg2:#12121a; --bg3:#1a1a26; --bg4:#22223a;
      --accent:#2dd4bf; --accent2:#0d9488;
      --text:#f1f0ff; --text2:#9b9bc0; --text3:#5a5a80;
      --border:rgba(255,255,255,0.07); --red:#f87171; --green:#34d399; --gold:#f59e0b;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;font-size:15px;line-height:1.6;min-height:100vh;}
    nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .logo{font-family:'Cinzel',serif;font-size:22px;color:var(--accent);text-decoration:none;letter-spacing:1px;}
    .logo span{color:var(--text);}
    .back-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 16px;color:var(--text2);font-size:13px;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;text-decoration:none;}
    .back-btn:hover{border-color:var(--accent);color:var(--accent);}
    .page{max-width:960px;margin:0 auto;padding:40px 24px 80px;}
    .page-title{font-family:'Cinzel',serif;font-size:26px;font-weight:700;color:var(--text);margin-bottom:6px;}
    .page-title span{color:var(--accent);}
    .page-sub{font-size:14px;color:var(--text3);margin-bottom:28px;}

    /* ── TABS ── */
    .tabs{display:flex;gap:0;flex-wrap:wrap;margin-bottom:0;border-bottom:1px solid var(--border);}
    .tab-btn{background:none;border:none;border-bottom:2px solid transparent;padding:11px 16px;font-size:13px;font-weight:700;color:var(--text3);cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.15s;font-family:'Lato',sans-serif;white-space:nowrap;}
    .tab-btn:hover{color:var(--text2);}
    .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
    .tab-count{background:var(--bg3);border-radius:10px;padding:1px 7px;font-size:11px;color:var(--text3);}
    .tab-btn.active .tab-count{background:rgba(45,212,191,0.12);color:var(--accent);}
    .tab-count.has-alert{background:rgba(248,113,113,0.15);color:var(--red);}

    /* ── TOOLBAR (search + pagination) ── */
    .list-toolbar{display:flex;align-items:center;gap:10px;margin:16px 0 12px;flex-wrap:wrap;}
    .search-input{flex:1;min-width:180px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px 8px 34px;color:var(--text);font-size:13px;font-family:'Lato',sans-serif;outline:none;transition:border-color 0.2s;}
    .search-input:focus{border-color:var(--accent);}
    .search-wrap{position:relative;flex:1;min-width:180px;}
    .search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none;}
    .page-info{font-size:12px;color:var(--text3);white-space:nowrap;}
    .pag-btn{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:6px 12px;color:var(--text2);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all 0.15s;}
    .pag-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
    .pag-btn:disabled{opacity:0.35;cursor:default;}

    /* ── ROW CARDS ── */
    .list-wrap{display:flex;flex-direction:column;gap:8px;}
    .loading-note,.empty-note{font-size:13px;color:var(--text3);text-align:center;padding:40px 0;}
    .loading-note i{display:block;margin-bottom:8px;font-size:22px;}
    .row-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:12px;transition:border-color 0.15s;}
    .row-card.clickable{cursor:pointer;}
    .row-card.clickable:hover{border-color:rgba(45,212,191,0.3);}
    .row-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--bg4);flex-shrink:0;border:2px solid var(--border);}
    .row-avatar-placeholder{width:38px;height:38px;border-radius:50%;background:var(--bg4);flex-shrink:0;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:15px;}
    .row-info{flex:1;min-width:0;}
    .row-title{font-weight:700;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
    .row-meta{font-size:12px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .row-actions{display:flex;gap:6px;flex-shrink:0;align-items:center;}
    .row-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.5px;flex-shrink:0;}
    .row-badge.admin{background:rgba(245,158,11,0.15);color:var(--gold);}
    .row-badge.moderator{background:rgba(45,212,191,0.12);color:var(--accent);}
    .row-badge.banned{background:rgba(248,113,113,0.12);color:var(--red);}
    .row-badge.user{background:rgba(155,155,192,0.1);color:var(--text3);}
    .row-badge.published{background:rgba(52,211,153,0.12);color:var(--green);}
    .row-badge.draft{background:rgba(155,155,192,0.1);color:var(--text3);}
    .row-badge.open{background:rgba(248,113,113,0.12);color:var(--red);}
    .row-badge.artwork{background:rgba(245,158,11,0.1);color:var(--gold);}
    .row-arrow-link{display:flex;align-items:center;gap:6px;color:var(--text3);font-size:12px;flex-shrink:0;text-decoration:none;transition:color 0.15s;}
    .row-arrow-link:hover{color:var(--accent);}
    .follow-pair{display:flex;align-items:center;gap:10px;flex:1;min-width:0;flex-wrap:wrap;}
    .follow-name-link{color:var(--text);font-weight:700;font-size:13px;text-decoration:none;display:flex;align-items:center;gap:6px;min-width:0;}
    .follow-name-link:hover{color:var(--accent);}
    .follow-name-link .row-avatar,.follow-name-link .row-avatar-placeholder{width:26px;height:26px;font-size:11px;}
    .follow-arrow{color:var(--text3);font-size:12px;flex-shrink:0;}

    /* ── ACTION BUTTONS ── */
    .act-btn{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all 0.15s;white-space:nowrap;}
    .act-btn:hover{border-color:var(--accent);color:var(--accent);}
    .act-btn.danger{color:var(--red);}
    .act-btn.danger:hover{border-color:var(--red);background:rgba(248,113,113,0.08);}
    .act-btn.success{color:var(--green);}
    .act-btn.success:hover{border-color:var(--green);background:rgba(52,211,153,0.08);}
    .act-btn.gold{color:var(--gold);}
    .act-btn.gold:hover{border-color:var(--gold);background:rgba(245,158,11,0.08);}

    /* ── WORK FOLLOWS (S6 new tab) ── */
    .work-follow-cover{width:34px;height:46px;border-radius:5px;object-fit:cover;background:var(--bg4);flex-shrink:0;border:1px solid var(--border);}
    .work-follow-cover-placeholder{width:34px;height:46px;border-radius:5px;background:var(--bg4);flex-shrink:0;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:12px;font-family:'Cinzel',serif;}

    footer{background:var(--bg2);border-top:1px solid var(--border);padding:24px;text-align:center;color:var(--text3);font-size:13px;}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

    /* ── S1: Export + S6: Refresh toolbar extras ── */
    .toolbar-extra-btn{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:6px 12px;color:var(--text2);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all 0.15s;white-space:nowrap;}
    .toolbar-extra-btn:hover{border-color:var(--accent);color:var(--accent);}

    /* ── S2: Sparkline chart ── */
    .chart-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:16px;display:none;}
    .chart-wrap.visible{display:block;}
    .chart-title{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;}
    .chart-bars{display:flex;align-items:flex-end;gap:4px;height:60px;}
    .chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:default;}
    .chart-bar{width:100%;background:var(--accent);border-radius:3px 3px 0 0;opacity:0.7;transition:opacity 0.15s;min-height:2px;}
    .chart-bar:hover{opacity:1;}
    .chart-label{font-size:9px;color:var(--text3);white-space:nowrap;}

    /* ── S3: Most-followed tab cover thumbnail ── */
    .mf-cover{width:34px;height:46px;border-radius:5px;object-fit:cover;background:var(--bg4);flex-shrink:0;border:1px solid var(--border);}
    .mf-cover-placeholder{width:34px;height:46px;border-radius:5px;background:var(--bg4);flex-shrink:0;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:13px;color:var(--text3);}
    .follow-count-badge{background:rgba(45,212,191,0.12);color:var(--accent);font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;flex-shrink:0;white-space:nowrap;}

    /* ── S5: Last active in meta line ── */
    .active-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:3px;flex-shrink:0;}
    .inactive-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);display:inline-block;margin-right:3px;flex-shrink:0;}

    /* ── S1: Sort header buttons ── */
    .sort-hdr-btn{background:none;border:none;font-size:11px;font-weight:700;color:var(--text3);cursor:pointer;font-family:'Lato',sans-serif;display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:5px;transition:color 0.15s;}
    .sort-hdr-btn:hover{color:var(--text2);}

    /* ── S2: Chart toggle buttons ── */
    .chart-toggle-btn{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;color:var(--text3);cursor:pointer;font-family:'Lato',sans-serif;transition:all 0.15s;}
    .chart-toggle-btn:hover{color:var(--text2);}
    .chart-toggle-btn.active{background:rgba(45,212,191,0.12);border-color:var(--accent);color:var(--accent);}

    /* ── S4: Works filter wraps as flex ── */
    #works-filter-wrap{display:none;gap:4px;}
    #works-filter-wrap.visible{display:flex;}

    /* ── S5: Work cover thumbnail in Works tab ── */
    .work-cover-thumb{width:34px;height:46px;border-radius:5px;object-fit:cover;background:var(--bg4);flex-shrink:0;border:1px solid var(--border);}
    .work-cover-placeholder{width:34px;height:46px;border-radius:5px;background:var(--bg4);flex-shrink:0;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:13px;color:var(--text3);}
  </style>
</head>
<body>
  <nav>
    <a class="logo" href="index.html">Dawn<span>Scribe</span></a>
    <a class="back-btn" href="WhiteRoomUnbreakable.html"><i class="ti ti-arrow-left"></i> Back to Admin</a>
  </nav>

  <div class="page">
    <h1 class="page-title">Site <span>Statistics</span></h1>
    <p class="page-sub">Detailed breakdowns behind each number on the admin dashboard. Click any row to open it, or use the action buttons to manage users.</p>

    <div class="tabs" id="tabs"></div>

    <!-- S2: Sparkline chart (shown for users tab only) -->
    <div class="chart-wrap" id="chart-wrap">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div class="chart-title" id="chart-title">New signups — last 12 weeks</div>
        <div style="display:flex;gap:4px;">
          <button class="chart-toggle-btn active" id="ctog-signups" onclick="switchChart('signups')">Signups</button>
          <button class="chart-toggle-btn" id="ctog-works" onclick="switchChart('works')">Works</button>
          <button class="chart-toggle-btn" id="ctog-chapters" onclick="switchChart('chapters')">Chapters</button>
          <button class="chart-toggle-btn" id="ctog-follows" onclick="switchChart('follows')">Follows</button>
        </div>
      </div>
      <div class="chart-bars" id="chart-bars"></div>
    </div>

    <div class="list-toolbar" id="list-toolbar" style="display:none;">
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input class="search-input" id="search-input" type="text" placeholder="Filter…" oninput="onSearchInput()"/>
      </div>
      <span class="page-info" id="page-info"></span>
      <button class="pag-btn" id="pag-prev" onclick="changePage(-1)" disabled><i class="ti ti-chevron-left"></i> Prev</button>
      <button class="pag-btn" id="pag-next" onclick="changePage(1)">Next <i class="ti ti-chevron-right"></i></button>
      <!-- S1: Export CSV -->
      <button class="toolbar-extra-btn" onclick="exportCsv()" title="Export current tab to CSV"><i class="ti ti-download"></i> CSV</button>
      <!-- S4: Works type filter (shown only on works tab) -->
      <div id="works-filter-wrap">
        <button class="chart-toggle-btn active" id="wf-all"     onclick="setWorksFilter('all')">All</button>
        <button class="chart-toggle-btn" id="wf-novel"   onclick="setWorksFilter('novel')">Novels</button>
        <button class="chart-toggle-btn" id="wf-artwork" onclick="setWorksFilter('artwork')">Artwork</button>
      </div>
      <!-- S6: Refresh -->
      <button class="toolbar-extra-btn" id="refresh-btn" onclick="refreshTab()" title="Reload this tab"><i class="ti ti-refresh"></i></button>
    </div>
    <div class="list-wrap" id="list-wrap">
      <div class="loading-note"><i class="ti ti-loader" style="animation:spin 1s linear infinite;"></i>Loading...</div>
    </div>
  </div>

  <footer>&copy; 2026 DawnScribe. Admin panel.</footer>

  <!-- S5: User detail slide-in panel -->
  <div id="user-detail-overlay" onclick="closeUserDetail()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;"></div>
  <div id="user-detail-panel" style="display:none;position:fixed;top:0;right:0;width:360px;max-width:100vw;height:100vh;background:var(--bg2);border-left:1px solid var(--border);z-index:201;overflow-y:auto;padding:24px 20px;font-family:'Lato',sans-serif;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div style="font-family:'Cinzel',serif;font-size:16px;font-weight:700;color:var(--text);">User Detail</div>
      <button onclick="closeUserDetail()" style="background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;"><i class="ti ti-x"></i></button>
    </div>
    <div id="user-detail-content"><div class="loading-note"><i class="ti ti-loader" style="animation:spin 1s linear infinite;display:block;margin-bottom:6px;"></i>Loading…</div></div>
  </div>

  <script>
    // db is assigned by the auth guard script above via window.db
    // We reference window.db directly in all calls below to avoid timing issues
    const PAGE_SIZE = 25;

    // ── TAB DEFINITIONS ──────────────────────────────────────────
    const TABS = [
      { id: 'users',         label: 'Users',           icon: 'ti-users'      },
      { id: 'works',         label: 'Works',           icon: 'ti-books'      },
      { id: 'reports',       label: 'Open Reports',    icon: 'ti-flag'       },
      { id: 'banned',        label: 'Banned',          icon: 'ti-user-off'   },
      { id: 'mods',          label: 'Moderators',      icon: 'ti-shield'     },
      { id: 'follows',       label: 'Follows',         icon: 'ti-heart'      },
      { id: 'work-follows',  label: 'Work Follows',    icon: 'ti-bookmark'   },
      { id: 'most-followed', label: 'Most Followed',   icon: 'ti-trending-up'}
    ];

    var activeTab   = 'users';
    var tabCounts   = {};
    var currentPage = 1;
    var allRows     = [];   // full loaded dataset for current tab
    var filteredRows = [];  // after client-side search filter
    var searchTerm  = '';
    var adminIds    = new Set(); // S: admin badge — loaded at init
    var sortCol     = null;      // S1: current sort column key
    var sortDir     = 'asc';     // S1: 'asc' | 'desc'
    var worksTypeFilter = 'all'; // S4: 'all' | 'novel' | 'artwork'

    // ── HELPERS ──────────────────────────────────────────────────
    function escHtml(s) {
      return (s || '').replace(/[&<>"']/g, function(c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    function timeAgo(dateStr) {
      if (!dateStr) return '—';
      var diff = Date.now() - new Date(dateStr).getTime();
      var days = Math.floor(diff / 86400000);
      if (days === 0) return 'Today';
      if (days === 1) return 'Yesterday';
      if (days < 30)  return days + 'd ago';
      var months = Math.floor(days / 30);
      if (months < 12) return months + 'mo ago';
      return Math.floor(months / 12) + 'y ago';
    }

    function avatarHtml(user, cls) {
      cls = cls || 'row-avatar';
      if (user && user.avatar_url) return '<img class="' + cls + '" src="' + escHtml(user.avatar_url) + '" alt=""/>';
      var initial = user && (user.display_name || user.username) ? (user.display_name || user.username).charAt(0).toUpperCase() : '?';
      return '<div class="' + cls + '-placeholder">' + initial + '</div>';
    }

    function statusBadge(u) {
      if (adminIds.has(u.id))            return '<span class="row-badge admin">Admin</span>';
      if (u.account_status === 'banned') return '<span class="row-badge banned">Banned</span>';
      if (u.is_moderator)                return '<span class="row-badge moderator">Moderator</span>';
      return '<span class="row-badge user">User</span>';
    }

    // S1: Column sort ─────────────────────────────────────────────
    function sortBy(col) {
      if (sortCol === col) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
      else { sortCol = col; sortDir = 'asc'; }
      allRows.sort(function(a, b) {
        var av = (a._sortVals && a._sortVals[col]) || '';
        var bv = (b._sortVals && b._sortVals[col]) || '';
        if (av < bv) return sortDir === 'asc' ? -1 : 1;
        if (av > bv) return sortDir === 'asc' ?  1 : -1;
        return 0;
      });
      applyFilterAndRender();
    }

    function sortIcon(col) {
      if (sortCol !== col) return '<i class="ti ti-selector" style="opacity:0.3;font-size:11px;"></i>';
      return sortDir === 'asc'
        ? '<i class="ti ti-sort-ascending" style="color:var(--accent);font-size:11px;"></i>'
        : '<i class="ti ti-sort-descending" style="color:var(--accent);font-size:11px;"></i>';
    }

    function showLoading() {
      document.getElementById('list-wrap').innerHTML = '<div class="loading-note"><i class="ti ti-loader" style="animation:spin 1s linear infinite;"></i>Loading...</div>';
      document.getElementById('list-toolbar').style.display = 'none';
    }
    function showEmpty(msg) {
      document.getElementById('list-wrap').innerHTML = '<div class="empty-note"><i class="ti ti-mood-empty" style="font-size:24px;display:block;margin-bottom:8px;"></i>' + escHtml(msg) + '</div>';
      document.getElementById('list-toolbar').style.display = 'none';
    }

    // ── SEARCH & PAGINATION ──────────────────────────────────────
    function onSearchInput() {
      searchTerm = document.getElementById('search-input').value.trim().toLowerCase();
      currentPage = 1;
      applyFilterAndRender();
    }

    function changePage(dir) {
      if (!filteredRows.length) return; // guard: data not loaded yet
      var totalPages = Math.max(1, Math.ceil(filteredRows.length / PAGE_SIZE));
      currentPage = Math.max(1, Math.min(totalPages, currentPage + dir));
      renderPage();
    }

    function applyFilterAndRender() {
      filteredRows = allRows.filter(function(r) {
        var matchSearch = !searchTerm || (r._searchText || '').includes(searchTerm);
        var matchType = (activeTab !== 'works' || worksTypeFilter === 'all') || r._workType === worksTypeFilter;
        return matchSearch && matchType;
      });
      currentPage = 1;
      renderPage();
    }

    function renderSortHeader() {
      if (activeTab === 'users' || activeTab === 'banned' || activeTab === 'mods') {
        return '<div style="display:flex;gap:8px;padding:0 4px 8px;border-bottom:1px solid var(--border);margin-bottom:8px;">' +
          '<button class="sort-hdr-btn" onclick="sortBy(\'name\')" style="flex:1;">Name ' + sortIcon('name') + '</button>' +
          '<button class="sort-hdr-btn" onclick="sortBy(\'joined\')" style="width:130px;">Joined ' + sortIcon('joined') + '</button>' +
          '<button class="sort-hdr-btn" onclick="sortBy(\'active\')" style="width:160px;">Last Active ' + sortIcon('active') + '</button>' +
          '<div style="width:220px;"></div>' +
        '</div>';
      }
      if (activeTab === 'works') {
        return '<div style="display:flex;gap:8px;padding:0 4px 8px;border-bottom:1px solid var(--border);margin-bottom:8px;">' +
          '<button class="sort-hdr-btn" onclick="sortBy(\'title\')" style="flex:1;">Title ' + sortIcon('title') + '</button>' +
          '<button class="sort-hdr-btn" onclick="sortBy(\'author\')" style="width:150px;">Author ' + sortIcon('author') + '</button>' +
          '<button class="sort-hdr-btn" onclick="sortBy(\'created\')" style="width:120px;">Date ' + sortIcon('created') + '</button>' +
        '</div>';
      }
      return '';
    }

    function renderPage() {
      var total = filteredRows.length;
      var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      currentPage = Math.min(currentPage, totalPages);
      var start = (currentPage - 1) * PAGE_SIZE;
      var pageRows = filteredRows.slice(start, start + PAGE_SIZE);

      document.getElementById('list-toolbar').style.display = 'flex';
      document.getElementById('page-info').textContent =
        total === 0 ? 'No results' :
        total <= PAGE_SIZE ? total + ' result' + (total === 1 ? '' : 's') :
        (start + 1) + '–' + Math.min(start + PAGE_SIZE, total) + ' of ' + total;
      document.getElementById('pag-prev').disabled = currentPage <= 1;
      document.getElementById('pag-next').disabled = currentPage >= totalPages;

      if (pageRows.length === 0) {
        document.getElementById('list-wrap').innerHTML = '<div class="empty-note">No results match your search.</div>';
        return;
      }

      document.getElementById('list-wrap').innerHTML =
        renderSortHeader() +
        pageRows.map(function(r) { return r._html; }).join('');
    }

    // ── TABS ─────────────────────────────────────────────────────
    function renderTabs() {
      document.getElementById('tabs').innerHTML = TABS.map(function(t) {
        var active = t.id === activeTab ? ' active' : '';
        var cnt = tabCounts[t.id];
        var alertCls = (t.id === 'reports' && cnt > 0) ? ' has-alert' : '';
        var countHtml = cnt !== undefined
          ? '<span class="tab-count' + alertCls + '">' + cnt + '</span>' : '';
        return '<button class="tab-btn' + active + '" onclick="selectTab(\'' + t.id + '\')"><i class="ti ' + t.icon + '"></i> ' + t.label + ' ' + countHtml + '</button>';
      }).join('');
    }

    function selectTab(tabId) {
      activeTab = tabId;
      currentPage = 1;
      searchTerm = '';
      var si = document.getElementById('search-input');
      if (si) si.value = '';
      allRows = []; filteredRows = [];
      renderTabs();
      loadTab(tabId);
      // Update URL without reload for deep-linking
      try { history.replaceState(null, '', '?tab=' + tabId); } catch(e) {}
    }

    // ── LOAD TAB ─────────────────────────────────────────────────
    async function loadTab(tabId) {
      showLoading();
      sortCol = null; sortDir = 'asc';
      // S1: chart shown on all tabs, with sensible default type per tab
      var chartWrap = document.getElementById('chart-wrap');
      chartWrap.classList.add('visible');
      var defaultChartType = tabId === 'works' || tabId === 'most-followed' ? 'works'
        : tabId === 'follows' || tabId === 'work-follows' ? 'follows'
        : 'signups';
      // Only switch chart type automatically when entering a tab (not when user has manually toggled)
      if (activeChart !== defaultChartType) switchChart(defaultChartType);
      // S4: works type filter visibility
      var wfWrap = document.getElementById('works-filter-wrap');
      if (wfWrap) wfWrap.classList.toggle('visible', tabId === 'works');
      if (tabId !== 'works') worksTypeFilter = 'all';
      if (tabId === 'users')         return loadUsers();
      if (tabId === 'works')         return loadWorks();
      if (tabId === 'reports')       return loadReports();
      if (tabId === 'banned')        return loadProfilesByStatus('banned',    'No banned users.');
      if (tabId === 'mods')          return loadProfilesByStatus('moderator', 'No moderators yet.');
      if (tabId === 'follows')       return loadFollows();
      if (tabId === 'work-follows')  return loadWorkFollows();
      if (tabId === 'most-followed') return loadMostFollowed();
    }

    // ── USERS ────────────────────────────────────────────────────
    async function loadUsers() {
      var result;
      try {
        result = await window.db.from('profiles')
          .select('id,username,display_name,avatar_url,account_status,is_moderator,created_at')
          .order('created_at', { ascending: false }).limit(500);
        if (result.error) throw result.error;
      } catch(e) { showEmpty('Failed to load users — ' + (e.message || 'check your connection') + '. Try refreshing.'); return; }
      var users = result.data || [];
      if (!users.length) { showEmpty('No users found.'); return; }

      // S5: fetch most recent reading_progress per user as a last-active proxy
      var userIds = users.map(function(u){ return u.id; });
      var activeMap = {};
      try {
        var actRes = await window.db.from('reading_progress')
          .select('user_id,updated_at')
          .in('user_id', userIds)
          .order('updated_at', { ascending: false })
          .limit(1000); // one per user is enough; cap total fetch
        (actRes.data || []).forEach(function(r){
          if (!activeMap[r.user_id]) activeMap[r.user_id] = r.updated_at;
        });
      } catch(e) {}

      // Chart already managed by loadTab — no need to re-trigger here

      allRows = users.map(function(u) {
        var badge = statusBadge(u);
        var lastActive = activeMap[u.id];
        var activeMeta = lastActive
          ? '<span class="active-dot"></span>Last active ' + timeAgo(lastActive)
          : '<span class="inactive-dot"></span>No reading activity';
        return {
          _uid: u.id,
          _userData: u,
          _activeMeta: activeMeta,
          _searchText: ((u.display_name || '') + ' ' + (u.username || '')).toLowerCase(),
          _sortVals: { name: (u.display_name || u.username || '').toLowerCase(), joined: u.created_at || '', active: activeMap[u.id] || '' },
          _csvRow: '"' + (u.display_name||'').replace(/"/g,'""') + '","' + (u.username||'') + '","' + (u.account_status||'active') + '","' + (u.created_at||'') + '"',
          _html:
            '<div class="row-card" onclick="openUserDetail(\'' + u.id + '\')" style="cursor:pointer;">' +
              avatarHtml(u) +
              '<div class="row-info">' +
                '<div class="row-title">' + escHtml(u.display_name || u.username || 'Unnamed') + ' ' + badge + '</div>' +
                '<div class="row-meta">@' + escHtml(u.username || '—') + ' &middot; Joined ' + timeAgo(u.created_at) + '</div>' +
                '<div class="row-meta" style="margin-top:2px;display:flex;align-items:center;">' + activeMeta + '</div>' +
              '</div>' +
              renderUserActions(u) +
            '</div>'
        };
      });
      applyFilterAndRender();
    }

    // S2: Signup sparkline chart — uses RPC for accurate full-history counts

    function renderUserActions(u) {
      var isBanned = u.account_status === 'banned';
      var isMod    = !!u.is_moderator;
      var isAdmin  = adminIds.has(u.id); // Bug 4 fix: admins don't get mod buttons
      var safeUser = (u.username || 'user').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      var html = '<div class="row-actions" onclick="event.stopPropagation();">';
      if (!isAdmin) {
        if (isBanned) {
          html += '<button class="act-btn success" onclick="unbanUser(\'' + u.id + '\',\'' + safeUser + '\')"><i class="ti ti-user-check"></i> Unban</button>';
        } else {
          html += '<button class="act-btn danger" onclick="banUser(\'' + u.id + '\',\'' + safeUser + '\')"><i class="ti ti-user-off"></i> Ban</button>';
        }
        if (isMod) {
          html += '<button class="act-btn gold" onclick="setMod(\'' + u.id + '\',false,\'' + safeUser + '\')"><i class="ti ti-shield-off"></i> Remove Mod</button>';
        } else if (!isBanned) {
          html += '<button class="act-btn gold" onclick="setMod(\'' + u.id + '\',true,\'' + safeUser + '\')"><i class="ti ti-shield"></i> Make Mod</button>';
        }
      }
      html += '<a class="act-btn" href="profile.html?id=' + u.id + '" target="_blank"><i class="ti ti-external-link"></i></a>';
      html += '</div>';
      return html;
    }

    async function banUser(uid, username) {
      if (!confirm('Ban @' + username + '? They will not be able to log in.')) return;
      var res = await window.db.rpc('admin_set_account_status', { p_user_id: uid, p_status: 'banned' });
      if (res.error) { showToast('Error: ' + res.error.message); return; }
      showToast('@' + username + ' has been banned.');
      patchUserRow(uid, { account_status: 'banned' });
    }

    async function unbanUser(uid, username) {
      if (!confirm('Unban @' + username + '?')) return;
      var res = await window.db.rpc('admin_set_account_status', { p_user_id: uid, p_status: 'active' });
      if (res.error) { showToast('Error: ' + res.error.message); return; }
      showToast('@' + username + ' has been unbanned.');
      patchUserRow(uid, { account_status: 'active' });
    }

    async function setMod(uid, promote, username) {
      var action = promote ? 'promote @' + username + ' to moderator' : 'remove moderator from @' + username;
      if (!confirm('Are you sure you want to ' + action + '?')) return;
      var res = await window.db.rpc('admin_set_moderator', { p_user_id: uid, p_is_moderator: promote });
      if (res.error) { showToast('Error: ' + res.error.message); return; }
      showToast('@' + username + (promote ? ' is now a moderator.' : ' is no longer a moderator.'));
      patchUserRow(uid, { is_moderator: promote });
    }

    // Bug 1 fix: patch a single user's data in allRows and re-render in place
    // so the admin keeps their current page/search position
    function patchUserRow(uid, changes) {
      allRows = allRows.map(function(row) {
        if (!row._uid || row._uid !== uid) return row;
        var u = Object.assign({}, row._userData, changes);
        var badge = statusBadge(u);
        var activeMeta = row._activeMeta || '';
        return {
          _uid: uid,
          _userData: u,
          _activeMeta: activeMeta,
          _searchText: row._searchText,
          _sortVals: { name: (u.display_name || u.username || '').toLowerCase(), joined: u.created_at || '', active: row._sortVals ? (row._sortVals.active || '') : '' },
          _csvRow: '"' + (u.display_name||'').replace(/"/g,'""') + '","' + (u.username||'') + '","' + (u.account_status||'active') + '","' + (u.created_at||'') + '"',
          _html:
            '<div class="row-card" onclick="openUserDetail(\'' + u.id + '\')" style="cursor:pointer;">' +
              avatarHtml(u) +
              '<div class="row-info">' +
                '<div class="row-title">' + escHtml(u.display_name || u.username || 'Unnamed') + ' ' + badge + '</div>' +
                '<div class="row-meta">@' + escHtml(u.username || '—') + ' &middot; Joined ' + timeAgo(u.created_at) + '</div>' +
                '<div class="row-meta" style="margin-top:2px;display:flex;align-items:center;">' + activeMeta + '</div>' +
              '</div>' +
              renderUserActions(u) +
            '</div>'
        };
      });
      // Re-apply search filter without resetting page
      if (!searchTerm) {
        filteredRows = allRows.slice();
      } else {
        filteredRows = allRows.filter(function(r){ return (r._searchText||'').includes(searchTerm); });
      }
      renderPage();
      // Also refresh the banned/mod counts in tab badges
      loadCounts();
    }

    // ── WORKS ────────────────────────────────────────────────────

          .select('id,title,cover_url,author_id,status,type,is_published,chapters_count,created_at')

      var authorIds = Array.from(new Set(works.map(function(w){ return w.author_id; }).filter(Boolean)));
      var authRes = authorIds.length ? await window.db.from('profiles').select('id,username,display_name').in('id', authorIds) : { data: [] };

        return {
          _searchText: ((w.title || '') + ' ' + authorName).toLowerCase(),
          _workType: w.type || 'novel',
          _sortVals: { title: (w.title||'').toLowerCase(), author: authorName.toLowerCase(), created: w.created_at||'' },
          _csvRow: '"' + (w.title||'').replace(/"/g,'""') + '","' + authorName.replace(/"/g,'""') + '","' + (w.type||'') + '","' + (w.is_published?'published':'draft') + '","' + (w.created_at||'') + '"',

              '<span class="row-arrow-link"><i class="ti ti-external-link"></i></span>' +
            '</div>'
        };
      });
      applyFilterAndRender();
    }

    // ── REPORTS ──────────────────────────────────────────────────
    async function loadReports() {
      var result;
      try {
        result = await window.db.from('reports')
          .select('id,content_id,content_type,reason,description,status,created_at,reporter_id')
          .eq('status', 'open').order('created_at', { ascending: false }).limit(200);
        if (result.error) throw result.error;
      } catch(e) { showEmpty('Failed to load reports — ' + (e.message || 'check your connection') + '. Try refreshing.'); return; }
      var reports = result.data || [];
      if (!reports.length) { showEmpty('No open reports. All clear! 🎉'); return; }

      // S3: fetch reporter profiles
      var reporterIds = Array.from(new Set(reports.map(function(r){ return r.reporter_id; }).filter(Boolean)));
      var reporterMap = {};
      if (reporterIds.length) {
        var rRes = await window.db.from('profiles').select('id,username,display_name').in('id', reporterIds);
        (rRes.data||[]).forEach(function(p){ reporterMap[p.id] = p; });
      }

      allRows = reports.map(function(r) {
        var contentType = (r.content_type || '').toLowerCase();
        var href = '';
        if (contentType === 'work' || contentType === 'novel')      href = 'story.html?id='   + r.content_id;
        else if (contentType === 'artwork')                          href = 'artwork.html?id=' + r.content_id;
        else if (contentType === 'chapter')                          href = 'chapter.html?id=' + r.content_id;
        else if (contentType === 'profile' || contentType === 'user') href = 'profile.html?id=' + r.content_id;
        var contentLink = r.content_id
          ? (href ? '<a href="' + href + '" target="_blank" style="color:var(--accent);font-size:11px;text-decoration:none;"><i class="ti ti-external-link"></i> View ' + escHtml(contentType || 'content') + '</a>'
                  : '<span style="font-size:11px;color:var(--text3);">ID: ' + escHtml(r.content_id) + '</span>')
          : '';
        // S3: reporter name
        var reporter = r.reporter_id ? reporterMap[r.reporter_id] : null;
        var reporterHtml = reporter
          ? '<a href="profile.html?id=' + r.reporter_id + '" target="_blank" style="color:var(--text2);text-decoration:none;font-size:11px;"><i class="ti ti-user" style="font-size:10px;"></i> Reported by @' + escHtml(reporter.username || reporter.display_name) + '</a>'
          : '';
        return {
          _searchText: ((r.reason || '') + ' ' + (r.description || '')).toLowerCase(),
          _reportId: r.id,
          _csvRow: '"' + (r.reason||'').replace(/"/g,'""') + '","' + (r.description||'').replace(/"/g,'""') + '","' + (r.created_at||'') + '"',
          _html:
            '<div class="row-card">' +
              '<div class="row-info">' +
                '<div class="row-title">' + escHtml(r.reason || 'No reason given') + ' <span class="row-badge open">Open</span></div>' +
                '<div class="row-meta">' + escHtml((r.description || 'No description').slice(0, 120)) + '</div>' +
                '<div class="row-meta" style="margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;">' +
                  (contentLink || '') + (contentLink && reporterHtml ? ' &middot; ' : '') + reporterHtml +
                  '<span style="color:var(--text3);font-size:11px;margin-left:auto;">' + timeAgo(r.created_at) + '</span>' +
                '</div>' +
              '</div>' +
              '<div class="row-actions" onclick="event.stopPropagation();">' +

              '</div>' +
            '</div>'
        };
      });

    // ── WORK FOLLOWS (S6 new tab) ─────────────────────────────────
    async function loadWorkFollows() {
      var result;
      try {
        result = await window.db.from('work_follows')
          .select('id,user_id,work_id,created_at')
          .order('created_at', { ascending: false }).limit(500);
        if (result.error) throw result.error;
      } catch(e) { showEmpty('Failed to load work follows — ' + (e.message || 'check your connection') + '. Try refreshing.'); return; }
      var wf = result.data || [];
      if (!wf.length) { showEmpty('No work follows yet.'); return; }

      var userIds = Array.from(new Set(wf.map(function(r){ return r.user_id; }).filter(Boolean)));
      var workIds = Array.from(new Set(wf.map(function(r){ return r.work_id; }).filter(Boolean)));
      var [profRes, worksRes] = await Promise.all([
        userIds.length ? window.db.from('profiles').select('id,username,display_name,avatar_url').in('id', userIds) : { data: [] },
        workIds.length ? window.db.from('works').select('id,title,cover_url,type').in('id', workIds) : { data: [] }
      ]);
      var profiles = {};
      (profRes.data  || []).forEach(function(p){ profiles[p.id] = p; });
      var works = {};
      (worksRes.data || []).forEach(function(w){ works[w.id] = w; });

      allRows = wf.map(function(r) {
        var user = profiles[r.user_id] || {};
        var work = works[r.work_id] || null;
        var un = user.display_name || user.username || 'Unknown';
        var wt = work ? (work.title || 'Untitled') : '[Deleted work]';
        var href = !work ? '#' : (work.type === 'artwork' ? 'artwork.html?id=' + r.work_id : 'story.html?id=' + r.work_id);
        var coverHtml = (work && work.cover_url)
          ? '<img class="work-follow-cover" src="' + escHtml(work.cover_url) + '" alt=""/>'
          : '<div class="work-follow-cover-placeholder">' + escHtml(wt.charAt(0)) + '</div>';
        return {
          _searchText: (un + ' ' + wt).toLowerCase(),
          _csvRow: '"' + un.replace(/"/g,'""') + '","' + (user.username||'').replace(/"/g,'""') + '","' + wt.replace(/"/g,'""') + '","' + (work && work.type || 'work') + '","' + (r.created_at||'') + '"',
          _html:
            '<div class="row-card">' +
              avatarHtml(user) +
              '<div class="row-info">' +
                '<div class="row-title"><span onclick="openUserDetail(\'' + r.user_id + '\')" style="color:var(--text);cursor:pointer;font-weight:700;">' + escHtml(un) + '</span></div>' +
                '<div class="row-meta">is following</div>' +
              '</div>' +
              '<span class="follow-arrow" style="flex-shrink:0;padding:0 8px;"><i class="ti ti-arrow-right"></i></span>' +
              coverHtml +
              '<div class="row-info">' +
                '<div class="row-title"><a href="' + href + '" target="_blank" style="color:var(--text);text-decoration:none;">' + escHtml(wt) + '</a></div>' +
                '<div class="row-meta">' + escHtml(work && work.type || 'work') + ' &middot; ' + timeAgo(r.created_at) + '</div>' +
              '</div>' +
            '</div>'
        };
      });
      applyFilterAndRender();
    }

    // ── S3: MOST FOLLOWED WORKS ───────────────────────────────────
    async function loadMostFollowed() {
      var result;
      try {
        result = await window.db.rpc('get_most_followed_works', { p_limit: 100 });
        if (result.error) throw result.error;
      } catch(e) { showEmpty('Failed to load rankings — ' + (e.message || 'check your connection') + '. Try refreshing.'); return; }
      var ranked = result.data || [];
      if (!ranked.length) { showEmpty('No work follows yet.'); return; }

      var topIds = ranked.map(function(r){ return r.work_id; });
      var countMap = {};
      ranked.forEach(function(r){ countMap[r.work_id] = Number(r.follow_count); });

      var worksRes = await window.db.from('works').select('id,title,cover_url,type,author_id,is_published,chapters_count').in('id', topIds);
      var authorIds = Array.from(new Set((worksRes.data||[]).map(function(w){ return w.author_id; }).filter(Boolean)));
      var profRes = authorIds.length ? await window.db.from('profiles').select('id,username,display_name').in('id', authorIds) : { data: [] };
      var works = {}; (worksRes.data||[]).forEach(function(w){ works[w.id] = w; });
      var profs = {}; (profRes.data||[]).forEach(function(p){ profs[p.id] = p; });

      allRows = topIds.map(function(wid, idx) {
        var w = works[wid] || {};
        var p = profs[w.author_id] || {};
        var authorName = p.display_name || p.username || 'Unknown';
        var followCount = countMap[wid] || 0;
        var href = w.type === 'artwork' ? 'artwork.html?id=' + wid : 'story.html?id=' + wid;
        var coverHtml = w.cover_url
          ? '<img class="mf-cover" src="' + escHtml(w.cover_url) + '" alt=""/>'
          : '<div class="mf-cover-placeholder">' + escHtml((w.title||'?').charAt(0)) + '</div>';
        return {
          _searchText: ((w.title || '') + ' ' + authorName).toLowerCase(),
          _csvRow: '"' + (idx+1) + '","' + (w.title||'').replace(/"/g,'""') + '","' + authorName.replace(/"/g,'""') + '","' + followCount + '"',
          _html:
            '<div class="row-card clickable" onclick="window.open(\'' + href + '\',\'_blank\')">' +
              '<div style="font-size:12px;font-weight:700;color:var(--text3);width:24px;text-align:center;flex-shrink:0;">#' + (idx + 1) + '</div>' +
              coverHtml +
              '<div class="row-info">' +
                '<div class="row-title">' + escHtml(w.title || 'Untitled') +
                  (w.type === 'artwork' ? ' <span class="row-badge artwork">Artwork</span>' : '') +
                  (!w.is_published ? ' <span class="row-badge draft">Draft</span>' : '') +
                '</div>' +
                '<div class="row-meta">by ' + escHtml(authorName) + (w.type === 'novel' ? ' &middot; ' + (w.chapters_count || 0) + ' ch' : '') + '</div>' +
              '</div>' +
              '<span class="follow-count-badge"><i class="ti ti-heart" style="font-size:10px;"></i> ' + followCount + ' follower' + (followCount !== 1 ? 's' : '') + '</span>' +
              '<span class="row-arrow-link"><i class="ti ti-external-link"></i></span>' +
            '</div>'
        };
      });
      applyFilterAndRender();
    }

    // ── S4: REPORT ACTIONS ────────────────────────────────────────
    async function resolveReport(reportId) {
      if (!confirm('Mark this report as resolved?')) return;
      var res = await window.db.from('reports').update({ status: 'resolved' }).eq('id', reportId);
      if (res.error) { showToast('Error: ' + res.error.message); return; }
      showToast('Report marked as resolved.');
      removeReportRow(reportId);
    }

    async function dismissReport(reportId) {
      if (!confirm('Dismiss this report? It will be marked as closed with no action.')) return;
      var res = await window.db.from('reports').update({ status: 'dismissed' }).eq('id', reportId);
      if (res.error) { showToast('Error: ' + res.error.message); return; }
      showToast('Report dismissed.');
      removeReportRow(reportId);
    }

    // S3: remove report row immediately client-side instead of full refetch
    function removeReportRow(reportId) {
      allRows = allRows.filter(function(r){ return r._reportId !== reportId; });
      filteredRows = filteredRows.filter(function(r){ return r._reportId !== reportId; });
      if (filteredRows.length === 0) {
        showEmpty('No open reports. All clear! 🎉');
      } else {
        renderPage();
      }
      // Update the reports count badge
      if (tabCounts.reports > 0) {
        tabCounts.reports--;
        renderTabs();
      }
    }

    // ── S1: CSV EXPORT ────────────────────────────────────────────
    function exportCsv() {
      var sourceRows = searchTerm ? filteredRows : allRows;
      if (!sourceRows.length) { showToast('Nothing to export.'); return; }
      var rows = sourceRows.map(function(r){ return r._csvRow || r._searchText; });
      var header = csvHeaderFor(activeTab);
      var csv = header + '\n' + rows.join('\n');
      var blob = new Blob([csv], { type: 'text/csv' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'dawnscribe-' + activeTab + (searchTerm ? '-filtered' : '') + '-' + new Date().toISOString().slice(0,10) + '.csv';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Exported ' + sourceRows.length + ' row' + (sourceRows.length !== 1 ? 's' : '') + (searchTerm ? ' (filtered)' : '') + '.');
    }

    function csvHeaderFor(tab) {
      if (tab === 'users' || tab === 'banned' || tab === 'mods') return 'display_name,username,status,joined';
      if (tab === 'works')  return 'title,author,type,status,created';
      if (tab === 'reports') return 'reason,description,created';
      if (tab === 'follows')      return 'from_display,from_username,relationship,to_display,to_username,created';
      if (tab === 'work-follows') return 'user_display,username,work_title,work_type,created';
      if (tab === 'most-followed') return 'rank,title,author,followers';
      return 'data';
    }

    // ── S6: REFRESH ───────────────────────────────────────────────
    function refreshTab() {
      var btn = document.getElementById('refresh-btn');
      if (btn) { btn.querySelector('i').style.animation = 'spin 0.6s linear infinite'; }
      var result = loadTab(activeTab);
      var done = function() { if (btn) btn.querySelector('i').style.animation = ''; };
      if (result && typeof result.then === 'function') { result.then(done).catch(done); }
      else { done(); }
    }

    // ── TAB COUNTS ───────────────────────────────────────────────
    async function loadCounts() {
      try {
        var [users, works, reports, banned, mods, follows, workFollows] = await Promise.all([
          window.db.from('profiles').select('id', { count: 'exact', head: true }),
          window.db.from('works').select('id', { count: 'exact', head: true }),
          window.db.from('reports').select('id', { count: 'exact', head: true }).eq('status', 'open'),
          window.db.from('profiles').select('id', { count: 'exact', head: true }).eq('account_status', 'banned'),
          window.db.from('profiles').select('id', { count: 'exact', head: true }).eq('is_moderator', true),
          window.db.from('follows').select('id', { count: 'exact', head: true }),
          window.db.from('work_follows').select('id', { count: 'exact', head: true })
        ]);
        tabCounts = {
          users:           users.count        ?? 0,
          works:           works.count        ?? 0,
          reports:         reports.count      ?? 0,
          banned:          banned.count       ?? 0,
          mods:            mods.count         ?? 0,
          follows:         follows.count      ?? 0,
          'work-follows':  workFollows.count  ?? 0,
          'most-followed': undefined  // no count badge — it's a derived/sorted view
        };
        renderTabs();
      } catch(e) {
        // Non-critical — tab badges just stay blank if counts fail
        console.warn('loadCounts failed:', e);
      }
    }

    // ── TOAST ────────────────────────────────────────────────────
    var _toastTimer = null;
    function showToast(msg) {
      var t = document.getElementById('toast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'toast';
        t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:13px;color:var(--text);z-index:9999;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,0.4);transition:opacity 0.3s;';
        t.innerHTML = '<i class="ti ti-check" style="color:var(--accent);"></i><span></span>';
        document.body.appendChild(t);
      }
      t.querySelector('span').textContent = msg;
      t.style.opacity = '1';
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(function(){ t.style.opacity = '0'; }, 3000);
    }

    // ── S2: CHART TOGGLE ─────────────────────────────────────────
    var activeChart = 'signups';
    function switchChart(type) {
      activeChart = type;
      document.querySelectorAll('.chart-toggle-btn').forEach(function(b){ b.classList.toggle('active', b.id === 'ctog-' + type); });
      var titles = {
        signups:  'New signups — last 12 weeks',
        works:    'New works — last 12 weeks',
        chapters: 'New chapters — last 12 weeks',
        follows:  'New follows — last 12 weeks'
      };
      document.getElementById('chart-title').textContent = titles[type] || '';
      renderChartForType(type);
    }

    async function renderChartForType(type) {
      var barsEl = document.getElementById('chart-bars');
      if (!barsEl) return;
      barsEl.innerHTML = '<div style="color:var(--text3);font-size:11px;padding:18px 0;">Loading…</div>';
      var now = Date.now();
      var buckets = [];
      for (var i = 11; i >= 0; i--) {
        var weekEnd = now - i * 7 * 86400000;
        var label = new Date(weekEnd).toLocaleDateString('en', { month:'short', day:'numeric' });
        buckets.push({ weekStart: new Date(weekEnd - 7*86400000).toISOString().slice(0,10), label: label, count: 0 });
      }
      try {
        // All three chart types use the same weekly aggregation RPC pattern
        var rpcName = type === 'signups' ? 'get_signup_counts_by_week'
          : type === 'works'   ? 'get_works_counts_by_week'
          : type === 'follows' ? 'get_follows_counts_by_week'
          : 'get_chapters_counts_by_week';
        var res = await window.db.rpc(rpcName, { p_weeks: 12 });
        (res.data || []).forEach(function(row) {
          var rowWeek = (row.week_start || '').slice(0, 10);
          for (var b = 0; b < buckets.length; b++) {
            if (buckets[b].weekStart === rowWeek) { buckets[b].count = Number(row.count || row.signup_count || 0); break; }
          }
        });
      } catch(e) { /* keep zeros */ }
      var maxCount = Math.max(1, Math.max.apply(null, buckets.map(function(b){ return b.count; })));
      barsEl.innerHTML = buckets.map(function(b) {
        var pct = Math.max(4, Math.round((b.count / maxCount) * 100));
        return '<div class="chart-bar-wrap" title="' + b.label + ': ' + b.count + '">' +
          '<div class="chart-bar" style="height:' + pct + '%;"></div>' +
          '<div class="chart-label">' + escHtml(b.label.split(' ')[0]) + '</div>' +
        '</div>';
      }).join('');
    }

    // ── S4: WORKS TYPE FILTER ────────────────────────────────────
    function setWorksFilter(type) {
      worksTypeFilter = type;
      ['all','novel','artwork'].forEach(function(t) {
        var btn = document.getElementById('wf-' + t);
        if (btn) btn.classList.toggle('active', t === type);
      });
      currentPage = 1;
      applyFilterAndRender(); // applyFilterAndRender already handles worksTypeFilter
    }

    // ── S5: USER DETAIL PANEL ────────────────────────────────────
    async function openUserDetail(uid) {
      document.getElementById('user-detail-overlay').style.display = 'block';
      document.getElementById('user-detail-panel').style.display = 'block';
      document.getElementById('user-detail-content').innerHTML = '<div class="loading-note"><i class="ti ti-loader" style="animation:spin 1s linear infinite;display:block;margin-bottom:6px;"></i>Loading…</div>';

      var [profRes, worksRes, followsRes] = await Promise.all([
        window.db.rpc('get_public_profile', { p_id: uid }).then(function(r){
          // Returns location/pronouns unmasked to admins, and honours each user's
          // show_* toggles for everyone else. Shaped like a .single() result.
          return { data: (r && r.data && r.data.length) ? r.data[0] : null, error: r ? r.error : null };
        }),
        window.db.from('works').select('id', { count: 'exact', head: true }).eq('author_id', uid),
        window.db.from('follows').select('id', { count: 'exact', head: true }).eq('following_id', uid)
      ]);
      var u = profRes.data;
      if (!u) { document.getElementById('user-detail-content').innerHTML = '<div class="empty-note">User not found.</div>'; return; }

      var isAdmin = adminIds.has(uid);
      var badge = isAdmin ? '<span class="row-badge admin">Admin</span>' : (u.account_status === 'banned' ? '<span class="row-badge banned">Banned</span>' : (u.is_moderator ? '<span class="row-badge moderator">Moderator</span>' : '<span class="row-badge user">User</span>'));
      var safeUser = (u.username||'user').replace(/\\/g, '\\\\').replace(/'/g, "\\'");

      document.getElementById('user-detail-content').innerHTML =
        '<div style="text-align:center;margin-bottom:20px;">' +
          (u.avatar_url ? '<img src="' + escHtml(u.avatar_url) + '" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--border);margin-bottom:10px;"/>'
                        : '<div style="width:72px;height:72px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--text3);margin:0 auto 10px;">' + escHtml((u.display_name||u.username||'?').charAt(0).toUpperCase()) + '</div>') +
          '<div style="font-family:Cinzel,serif;font-size:16px;font-weight:700;color:var(--text);">' + escHtml(u.display_name || u.username) + ' ' + badge + '</div>' +
          '<div style="font-size:12px;color:var(--text3);">@' + escHtml(u.username||'—') + '</div>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:10px;">' +
          detailRow('ti-calendar', 'Joined', timeAgo(u.created_at)) +
          detailRow('ti-books', 'Works Published', String(worksRes.count || 0) +
            (worksRes.count > 0 ? ' <a onclick="closeUserDetail();selectTab(\'works\');setTimeout(function(){document.getElementById(\'search-input\').value=\'' + escHtml(u.username||'') + '\';onSearchInput();},300);" style="color:var(--accent);font-size:11px;cursor:pointer;margin-left:6px;text-decoration:none;"><i class=\'ti ti-arrow-right\' style=\'font-size:10px;\'></i> View</a>' : '')) +
          detailRow('ti-heart', 'Followers', String(followsRes.count || 0)) +
          detailRow('ti-diamond', 'Prestige XP', (u.prestige_xp || 0).toLocaleString() + ' XP &middot; Tier ' + (u.prestige_tier || 1)) +
          (u.location ? detailRow('ti-map-pin', 'Location', u.location) : '') +
          (u.pronouns  ? detailRow('ti-user', 'Pronouns', u.pronouns) : '') +
          (u.bio ? '<div style="background:var(--bg3);border-radius:8px;padding:10px 12px;"><div style="font-size:10px;color:var(--text3);text-transform:uppercase;font-weight:700;margin-bottom:4px;">Bio</div><div style="font-size:12px;color:var(--text2);line-height:1.5;">' + escHtml(u.bio.slice(0,200)) + (u.bio.length > 200 ? '…' : '') + '</div></div>' : '') +
        '</div>' +
        '<div style="display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;">' +
          '<a href="profile.html?id=' + uid + '" target="_blank" class="act-btn" style="text-decoration:none;"><i class="ti ti-external-link"></i> View Profile</a>' +
          (u.account_status === 'banned'
            ? '<button class="act-btn success" onclick="unbanUser(\'' + uid + '\',\'' + safeUser + '\');closeUserDetail()"><i class="ti ti-user-check"></i> Unban</button>'
            : '<button class="act-btn danger" onclick="banUser(\'' + uid + '\',\'' + safeUser + '\');closeUserDetail()"><i class="ti ti-user-off"></i> Ban</button>') +
          (u.is_moderator
            ? '<button class="act-btn gold" onclick="setMod(\'' + uid + '\',false,\'' + safeUser + '\');closeUserDetail()"><i class="ti ti-shield-off"></i> Remove Mod</button>'
            : (!isAdmin ? '<button class="act-btn gold" onclick="setMod(\'' + uid + '\',true,\'' + safeUser + '\');closeUserDetail()"><i class="ti ti-shield"></i> Make Mod</button>' : '')) +
        '</div>';
    }

    function detailRow(icon, label, value) {
      return '<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg3);border-radius:8px;">' +
        '<i class="ti ' + icon + '" style="color:var(--accent);font-size:15px;flex-shrink:0;width:18px;"></i>' +
        '<div style="flex:1;min-width:0;"><div style="font-size:10px;color:var(--text3);text-transform:uppercase;font-weight:700;">' + label + '</div>' +
        '<div style="font-size:13px;color:var(--text);">' + value + '</div></div></div>';
    }

    function closeUserDetail() {
      document.getElementById('user-detail-overlay').style.display = 'none';
      document.getElementById('user-detail-panel').style.display = 'none';
    }

    // ── S6: MOD AUDIT LINK ───────────────────────────────────────
    // Adds an audit link to moderator rows (wired in loadProfilesByStatus for 'moderator')

    // ── INIT: load adminIds ──────────────────────────────────────
    var params = new URLSearchParams(window.location.search);
    var initialTab = params.get('tab');
    if (initialTab && TABS.some(function(t){ return t.id === initialTab; })) {
      activeTab = initialTab;
    }

    // Load admin IDs for badge display, then proceed
    (async function() {
      try {
        var aRes = await window.db.from('admins').select('id');
        (aRes.data||[]).forEach(function(a){ adminIds.add(a.id); });
      } catch(e) {}
      renderTabs();
      loadCounts();
      loadTab(activeTab);
      // S4: refresh tab counts every 60 seconds so badges stay accurate
      setInterval(function() { loadCounts(); }, 60000);
    })();
  </script>
</body>
