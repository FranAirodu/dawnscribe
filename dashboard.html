<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var t=localStorage.getItem('ds_theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DawnScribe — Author Dashboard</title>
  <meta name="robots" content="noindex,nofollow" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css"/>
  <script src="accessibilityPrefs.js"></script>
  <style>
    :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--bg4:#22223a;--accent:#2dd4bf;--accent2:#0d9488;--text:#f1f0ff;--text2:#9b9bc0;--text3:#5a5a80;--border:rgba(255,255,255,0.07);--red:#f87171;--green:#34d399;--gold:#f0c040;--amber:#f59e0b;}
    html[data-theme="light"]{--bg:#f4f4f8;--bg2:#ffffff;--bg3:#ebebf2;--bg4:#d8d8e8;--accent:#0d9488;--accent2:#0f766e;--text:#0a0a0f;--text2:#3a3a5c;--text3:#7a7a9a;--border:rgba(0,0,0,0.08);--red:#dc2626;--green:#059669;--gold:#a16207;--amber:#b45309;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    @keyframes spin{to{transform:rotate(360deg);}}

    nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:16px;}
    .logo{font-family:'Cinzel',serif;font-size:22px;color:var(--accent);text-decoration:none;letter-spacing:1px;flex-shrink:0;}
    .logo span{color:var(--text);}
    .back-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 16px;color:var(--text2);font-size:13px;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;text-decoration:none;flex-shrink:0;}
    .back-btn:hover{border-color:var(--accent);color:var(--accent);}

    .page{max-width:960px;margin:0 auto;padding:32px 24px 60px;width:100%;}
    .page-header{margin-bottom:8px;display:flex;align-items:center;gap:12px;}
    .page-header i{font-size:26px;color:var(--accent);}
    .page-title{font-family:'Cinzel',serif;font-size:24px;font-weight:700;color:var(--text);}
    .page-subtitle{font-size:13px;color:var(--text3);margin:2px 0 28px;}

    /* Work picker */
    .picker-card{display:flex;align-items:center;gap:14px;padding:14px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;text-decoration:none;color:inherit;transition:border-color 0.2s;}
    .picker-card:hover{border-color:var(--accent);}
    .picker-cover{width:44px;height:62px;border-radius:6px;flex-shrink:0;background:var(--bg4);display:flex;align-items:center;justify-content:center;color:var(--text3);overflow:hidden;}
    .picker-cover img{width:100%;height:100%;object-fit:cover;}
    .picker-body{flex:1;min-width:0;}
    .picker-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .picker-stats{font-size:12px;color:var(--text3);margin-top:3px;display:flex;gap:14px;flex-wrap:wrap;}
    .picker-arrow{color:var(--text3);font-size:18px;flex-shrink:0;}

    /* Work header */
    .work-head{display:flex;align-items:center;gap:16px;margin-bottom:24px;}
    .work-head-cover{width:56px;height:78px;border-radius:8px;background:var(--bg4);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text3);}
    .work-head-cover img{width:100%;height:100%;object-fit:cover;}
    .work-head-title{font-family:'Cinzel',serif;font-size:20px;font-weight:700;}
    .work-head-links{font-size:12.5px;margin-top:5px;display:flex;gap:14px;flex-wrap:wrap;}
    .work-head-links a{color:var(--accent);text-decoration:none;}
    .work-head-links a:hover{text-decoration:underline;}

    /* Overview cards */
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:32px;}
    .stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
    .stat-value{font-family:'Cinzel',serif;font-size:22px;font-weight:700;color:var(--text);}
    .stat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-top:4px;display:flex;align-items:center;gap:5px;}
    .stat-label i{font-size:13px;color:var(--accent);}
    .stat-sub{font-size:11px;color:var(--text3);margin-top:3px;}

    .section{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:24px;}
    .section-title{font-family:'Cinzel',serif;font-size:16px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
    .section-title i{color:var(--accent);font-size:17px;}
    .section-sub{font-size:12px;color:var(--text3);margin-bottom:16px;line-height:1.5;}

    /* Retention table */
    .ret-table{width:100%;border-collapse:collapse;font-size:13px;}
    .ret-table th{text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
    .ret-table th.num, .ret-table td.num{text-align:right;}
    .ret-table td{padding:9px 10px;border-bottom:1px solid var(--border);}
    .ret-table tr:last-child td{border-bottom:none;}
    .ret-table tr:hover td{background:var(--bg3);}
    .ret-ch-title{max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
    .ret-ch-num{color:var(--text3);font-weight:700;margin-right:8px;}
    .ret-pct{font-weight:800;padding:2px 8px;border-radius:10px;display:inline-block;min-width:52px;text-align:center;}
    .ret-pct.good{color:var(--green);background:rgba(52,211,153,0.1);}
    .ret-pct.warn{color:var(--amber);background:rgba(245,158,11,0.1);}
    .ret-pct.bad{color:var(--red);background:rgba(248,113,113,0.1);}
    .ret-pct.na{color:var(--text3);background:var(--bg3);}
    .ret-wrap{position:relative;}
    .ret-scroll{overflow-x:auto;}
    .ret-wrap::after{content:'';position:absolute;top:0;right:0;bottom:0;width:28px;background:linear-gradient(to left,var(--bg2),transparent);pointer-events:none;opacity:0;transition:opacity 0.2s;}
    .ret-wrap.scrollable::after{opacity:1;}

    /* Charts */
    .chart-wrap{width:100%;overflow-x:auto;}
    .chart-svg{display:block;width:100%;height:auto;}
    .chart-empty{text-align:center;padding:28px;color:var(--text3);font-size:13px;}
    .legend{display:flex;gap:16px;font-size:11.5px;color:var(--text3);margin-top:10px;flex-wrap:wrap;}
    .legend-item{display:flex;align-items:center;gap:6px;}
    .legend-swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0;}

    /* Reading list chips */
    .rl-chips{display:flex;gap:10px;flex-wrap:wrap;}
    .rl-chip{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-size:12.5px;color:var(--text2);display:flex;align-items:center;gap:7px;}
    .rl-chip b{color:var(--text);font-size:14px;}

    .state-wrap{text-align:center;padding:70px 20px;}
    .state-icon{font-size:44px;color:var(--text3);margin-bottom:14px;}
    .state-title{font-family:'Cinzel',serif;font-size:19px;margin-bottom:8px;}
    .state-body{font-size:13.5px;color:var(--text3);line-height:1.6;}
    .state-body a{color:var(--accent);}

    /* Author Goals */
    .goal-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:0;}
    .goal-pledge{font-size:14px;color:var(--text);margin-bottom:12px;line-height:1.55;}
    .goal-meta{font-size:12px;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .goal-meta b{color:var(--text2);}
    .goal-bar-wrap{background:var(--bg4);border-radius:6px;height:10px;overflow:hidden;margin-bottom:8px;}
    .goal-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width 0.5s ease;}
    .goal-pct{font-size:11.5px;color:var(--text3);margin-bottom:14px;}
    .goal-pct b{color:var(--accent);}
    .goal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
    .goal-btn{background:var(--bg4);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:12.5px;font-family:'Lato',sans-serif;color:var(--text2);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;}
    .goal-btn:hover{border-color:var(--accent);color:var(--accent);}
    .goal-btn.primary{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700;}
    .goal-btn.primary:hover{background:var(--accent2);border-color:var(--accent2);}
    .goal-btn.danger{border-color:var(--red);color:var(--red);}
    .goal-btn.danger:hover{background:rgba(248,113,113,0.1);}
    .goal-visibility{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:6px;margin-top:10px;}
    .goal-visibility input{cursor:pointer;accent-color:var(--accent);}
    .goal-form{display:flex;flex-direction:column;gap:12px;}
    .goal-form label{font-size:12px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:0.7px;margin-bottom:2px;display:block;}
    .goal-form select,.goal-form input,.goal-form textarea{width:100%;background:var(--bg4);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13.5px;font-family:'Lato',sans-serif;outline:none;transition:border-color 0.2s;}
    .goal-form select:focus,.goal-form input:focus,.goal-form textarea:focus{border-color:var(--accent);}
    .goal-form textarea{resize:vertical;min-height:72px;}
    .goal-empty{font-size:13px;color:var(--text3);text-align:center;padding:18px 0 4px;}
    .flame-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:32px;}

    @media(max-width:640px){
      nav{padding:0 16px;}
      .page{padding:24px 14px 50px;}
      .ret-ch-title{max-width:150px;}
    }
  </style>
</head>
<body>
<nav>
  <a class="logo" href="index.html">Dawn<span>Scribe</span></a>
  <a class="back-btn" id="nav-back" href="profile.html"><i class="ti ti-arrow-left"></i> Back</a>
</nav>

<div class="page" id="page">
  <div class="state-wrap"><i class="ti ti-loader-2 state-icon" style="animation:spin 1s linear infinite;"></i></div>
</div>

<script>
  const SUPA_URL = 'https://cajjyyskpmjnpcxcfeuk.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhamp5eXNrcG1qbnBjeGNmZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDUyMDUsImV4cCI6MjA5NTMyMTIwNX0.s93zWwRYymTsoW5BfUhUDli13ArCtk4S-tegAs54A2c';
  const db = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  window.db = db;

  var session = null;
  var workId = null;

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmt(n){
    n = Number(n||0);
    function s(v, suf){ var t = v.toFixed(1); if(t.slice(-2) === '.0') t = t.slice(0, -2); return t + suf; }
    if(n >= 999500000) return s(n/1000000000, 'B');
    if(n >= 999500) return s(n/1000000, 'M');
    if(n >= 1000) return s(n/1000, 'k');
    return String(n);
  }
  function showState(icon, title, body){
    document.getElementById('page').innerHTML =
      '<div class="state-wrap"><i class="ti ' + icon + ' state-icon"></i>'
      + '<div class="state-title">' + title + '</div>'
      + '<div class="state-body">' + body + '</div></div>';
  }

  // ── INIT ─────────────────────────────────────────────────────
  async function init(){
    var { data: { session: s } } = await db.auth.getSession();
    session = s;
    if(!session){
      showState('ti-lock', 'Log in required', 'The author dashboard shows analytics for your own stories. <a href="auth.html">Sign in</a> to continue.');
      return;
    }
    var params = new URLSearchParams(window.location.search);
    workId = params.get('work');
    if(workId){
      var back = document.getElementById('nav-back');
      if(back){ back.href = 'dashboard.html'; back.innerHTML = '<i class="ti ti-arrow-left"></i> Your stories'; }
      loadDashboard();
    } else {
      loadPicker();
    }
  }

  // ── WORK PICKER (no ?work= param) ────────────────────────────
  async function loadPicker(){
    var uid = session.user.id;
    // Own novels + coauthored novels. Promise.resolve wrappers: builders lack .catch()
    var [ownRes, coRes] = await Promise.all([
      Promise.resolve(db.from('works')
        .select('id,title,cover_url,views,rating_avg,rating_count,chapters_count,created_at')
        .eq('author_id', uid).eq('type','novel')
        .order('created_at', { ascending: false })).catch(function(){ return {}; }),
      Promise.resolve(db.from('work_coauthors').select('work_id').eq('user_id', uid)).catch(function(){ return {}; })
    ]);
    if(ownRes.error){
      console.error('loadPicker:', ownRes.error);
      showState('ti-plug-x', 'Connection hiccup',
        'Could not load your stories. <a href="javascript:location.reload()">Try again</a>.');
      return;
    }
    var works = ownRes.data || [];
    var coIds = (coRes.data || []).map(function(r){ return r.work_id; })
      .filter(function(id){ return !works.some(function(w){ return w.id === id; }); });
    if(coIds.length){
      try {
        var { data: coWorks } = await db.from('works')
          .select('id,title,cover_url,views,rating_avg,rating_count,chapters_count,created_at')
          .in('id', coIds).eq('type','novel');
        works = works.concat(coWorks || []);
        works.sort(function(a,b){ return new Date(b.created_at) - new Date(a.created_at); });
      } catch(e) {}
    }

    var page = document.getElementById('page');
    if(!works.length){
      showState('ti-books-off', 'No stories yet',
        'Once you publish a novel, its analytics will live here. <a href="publish.html">Publish your first story</a>.');
      return;
    }

    // Follower counts in one query
    var followerMap = {};
    try {
      var ids = works.map(function(w){ return w.id; });
      // Aggregate RPC: individual follow rows are private, counts are not.
      var { data: fRows } = await db.rpc('get_work_follow_counts', { p_work_ids: ids });
      (fRows || []).forEach(function(r){ followerMap[r.work_id] = r.follows || 0; });
    } catch(e) {}

    page.innerHTML =
      '<div class="page-header"><i class="ti ti-chart-line"></i><div class="page-title">Author Dashboard</div></div>'
      + '<div class="page-subtitle">Pick a story to see its readers, retention, and growth.</div>'
      + works.map(function(w){
          var cover = w.cover_url ? '<img src="' + esc(w.cover_url) + '" alt=""/>' : '<i class="ti ti-book"></i>';
          var rating = w.rating_avg ? Number(w.rating_avg).toFixed(1) + '★ (' + (w.rating_count||0) + ')' : 'No ratings';
          return '<a class="picker-card" href="dashboard.html?work=' + w.id + '">'
            + '<div class="picker-cover">' + cover + '</div>'
            + '<div class="picker-body">'
              + '<div class="picker-title">' + esc(w.title) + '</div>'
              + '<div class="picker-stats">'
                + '<span><i class="ti ti-eye"></i> ' + fmt(w.views) + ' views</span>'
                + '<span><i class="ti ti-users"></i> ' + fmt(followerMap[w.id]||0) + ' followers</span>'
                + '<span><i class="ti ti-star"></i> ' + rating + '</span>'
                + '<span><i class="ti ti-writing"></i> ' + (w.chapters_count||0) + ' chapters</span>'
              + '</div>'
            + '</div>'
            + '<i class="ti ti-chevron-right picker-arrow"></i>'
          + '</a>';
        }).join('');
  }

  // ── DASHBOARD ────────────────────────────────────────────────
  async function loadDashboard(){
    var payload = null;
    try {
      var { data, error } = await db.rpc('get_work_dashboard', { p_work_id: workId });
      if(error) throw error;
      payload = data;
    } catch(e) {
      var msg = String((e && e.message) || '');
      if(msg.indexOf('not authorized') !== -1 || msg.indexOf('invalid input syntax') !== -1){
        showState('ti-lock', 'Not available',
          'This dashboard is only visible to the story\u2019s author and coauthors. <a href="dashboard.html">Back to your stories</a>.');
      } else {
        showState('ti-plug-x', 'Connection hiccup',
          'Could not reach the analytics service. <a href="javascript:location.reload()">Try again</a> or <a href="dashboard.html">go back to your stories</a>.');
      }
      return;
    }
    if(!payload || !payload.overview){
      showState('ti-alert-circle', 'Something went wrong', 'Could not load analytics for this story. <a href="dashboard.html">Back to your stories</a>.');
      return;
    }

    window._dashPayload = payload;
    var ov = payload.overview;
    var chapters = payload.chapters || [];
    var page = document.getElementById('page');
    document.title = 'DawnScribe — Dashboard: ' + (ov.title || 'Story');

    var cover = ov.cover_url ? '<img src="' + esc(ov.cover_url) + '" alt=""/>' : '<i class="ti ti-book"></i>';
    var ratingVal = ov.rating_avg ? Number(ov.rating_avg).toFixed(1) : '—';

    page.innerHTML =
      '<div class="work-head">'
        + '<div class="work-head-cover">' + cover + '</div>'
        + '<div>'
          + '<div class="work-head-title">' + esc(ov.title) + '</div>'
          + '<div class="work-head-links">'
            + '<a href="story.html?id=' + encodeURIComponent(workId) + '"><i class="ti ti-book-open"></i> Story page</a>'
            + '<a href="chapters.html?edit=' + encodeURIComponent(workId) + '"><i class="ti ti-pencil"></i> Manage chapters</a>'
            + '<a href="dashboard.html"><i class="ti ti-switch-horizontal"></i> Switch story</a>'
          + '</div>'
        + '</div>'
      + '</div>'

      + '<div class="stat-grid">'
        + statCard(fmt(ov.views), 'ti-eye', 'Total Views')
        + statCard(fmt(ov.followers), 'ti-users', 'Followers')
        + statCard(fmt(ov.readers), 'ti-book-open', 'Readers', 'started reading')
        + statCard(ratingVal + ' ★', 'ti-star', 'Rating', (ov.rating_count||0) + ' rating' + (ov.rating_count===1?'':'s'))
        + statCard(fmt(ov.sparks_total), 'ti-flame', 'Sparks', fmt(ov.sparks_week) + ' this week')
        + statCard(fmt(ov.comments), 'ti-message-circle', 'Comments')
      + '</div>'

      + '<div class="section-title" style="font-family:Cinzel,serif;font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;"><i class="ti ti-fire" style="color:var(--gold);font-size:16px;"></i> Vote Tallies</div>'
      + '<div class="flame-grid">'
        + statCard(fmt(ov.celestial_flames||0), 'ti-star', 'Celestial Flames', 'all-time')
        + statCard(fmt(ov.scribe_flames||0), 'ti-bookmark', 'Scribe\u2019s Flames', 'all-time \u00b7 available Jan 2027')
        + statCard(fmt(ov.infernal_dawns||0), 'ti-sun', 'Infernal Dawns', 'all-time · available Jan 2027')
      + '</div>'

      + '<div class="section">'
        + '<div class="section-title"><i class="ti ti-stairs-down"></i> Chapter Retention</div>'
        + '<div class="section-sub">Readers = accounts that finished each chapter. <b>% of previous</b> shows how many carried on from the chapter before — dips mark where readers drop off; over 100% means more readers finished than the chapter before it.</div>'
        + '<div class="ret-wrap"><div class="ret-scroll" id="ret-scroll">' + retentionTable(chapters) + '</div></div>'
      + '</div>'

      + '<div class="section">'
        + '<div class="section-title"><i class="ti ti-users"></i> Follower Growth</div>'
        + '<div class="section-sub">Cumulative story followers over time. Vertical lines mark chapter releases.</div>'
        + followerChart(payload.followers_daily || [], chapters)
      + '</div>'

      + '<div class="section">'
        + '<div class="section-title"><i class="ti ti-eye"></i> Views — last 30 days</div>'
        + '<div class="section-sub">Story page + chapter views per day.</div>'
        + barChart(payload.views_daily || [], 'views', 'var(--accent)', 'No views recorded in the last 30 days.', 'Daily views bar chart, last 30 days')
      + '</div>'

      + '<div class="section">'
        + '<div class="section-title"><i class="ti ti-flame"></i> Sparks — last 30 days</div>'
        + '<div class="section-sub">Dawn Sparks received per day.</div>'
        + barChart(payload.sparks_daily || [], 'n', 'var(--gold)', 'No sparks received in the last 30 days.', 'Daily sparks bar chart, last 30 days')
      + '</div>'

      + '<div class="section">'
        + '<div class="section-title"><i class="ti ti-books"></i> Reading Lists</div>'
        + '<div class="section-sub">How readers have shelved this story.</div>'
        + readingListChips(payload.reading_list || [])
      + '</div>'

      + '<div class="section" id="goals-section">'
        + '<div class="section-title"><i class="ti ti-target"></i> Author Goals</div>'
        + '<div class="section-sub">Set a public milestone for your readers — they see the progress bar on your story page. Only one active goal at a time; you can move the goalpost once it’s reached.</div>'
        + '<div id="goals-body"><div style="color:var(--text3);font-size:13px;">Loading…</div></div>'
      + '</div>';

    loadGoals(payload.active_goal || null);

    // Show a right-edge fade on the retention table only while more columns
    // are hidden off-screen; hide it once the user scrolls to the end.
    var rs = document.getElementById('ret-scroll');
    if(rs){
      var rw = rs.parentElement;
      function retFade(){
        var more = rs.scrollWidth - rs.clientWidth - rs.scrollLeft > 4;
        rw.classList.toggle('scrollable', more);
      }
      rs.addEventListener('scroll', retFade);
      window.addEventListener('resize', retFade);
      retFade();
    }
  }

  function statCard(value, icon, label, sub){
    return '<div class="stat-card">'
      + '<div class="stat-value">' + value + '</div>'
      + '<div class="stat-label"><i class="ti ' + icon + '"></i> ' + label + '</div>'
      + (sub ? '<div class="stat-sub">' + sub + '</div>' : '')
      + '</div>';
  }

  // ── RETENTION TABLE ──────────────────────────────────────────
  function retentionTable(chapters){
    if(!chapters.length) return '<div class="chart-empty"><i class="ti ti-file-off"></i> No published chapters yet.</div>';
    var rows = chapters.map(function(c, i){
      var prev = i > 0 ? chapters[i-1] : null;
      var pctHtml;
      if(i === 0){
        pctHtml = '<span class="ret-pct na">—</span>';
      } else if(!prev.readers){
        pctHtml = '<span class="ret-pct na">n/a</span>';
      } else {
        var pct = Math.round((c.readers / prev.readers) * 100);
        var cls = pct >= 90 ? 'good' : (pct >= 70 ? 'warn' : 'bad');
        pctHtml = '<span class="ret-pct ' + cls + '">' + pct + '%</span>';
      }
      return '<tr>'
        + '<td class="ret-ch-title" title="' + esc(c.title||'') + '"><span class="ret-ch-num">' + c.chapter_number + '</span>' + esc(c.title || 'Untitled') + '</td>'
        + '<td class="num">' + fmt(c.readers) + '</td>'
        + '<td class="num">' + pctHtml + '</td>'
        + '<td class="num">' + fmt(c.views) + '</td>'
        + '<td class="num">' + fmt(c.comments) + '</td>'
        + '<td class="num">' + fmt(c.word_count||0) + '</td>'
      + '</tr>';
    }).join('');
    return '<table class="ret-table">'
      + '<thead><tr><th>Chapter</th><th class="num">Readers</th><th class="num">% of previous</th><th class="num">Views</th><th class="num">Comments</th><th class="num">Words</th></tr></thead>'
      + '<tbody>' + rows + '</tbody></table>';
  }

  // ── FOLLOWER GROWTH (SVG line, chapter release markers) ──────
  function followerChart(daily, chapters){
    if(!daily.length) return '<div class="chart-empty"><i class="ti ti-chart-line"></i> No followers yet — the graph starts with your first.</div>';
    var W = 900, H = 240, padL = 44, padR = 14, padT = 14, padB = 30;

    // Cumulative series
    var pts = [];
    var total = 0;
    daily.forEach(function(d){ total += Number(d.n); pts.push({ t: new Date(d.day).getTime(), v: total }); });
    var t0 = pts[0].t, t1 = Math.max(Date.now(), pts[pts.length-1].t);
    if(t1 === t0) t1 = t0 + 86400000;
    var vMax = Math.max(total, 1);

    function x(t){ return padL + ((t - t0) / (t1 - t0)) * (W - padL - padR); }
    function y(v){ return H - padB - (v / vMax) * (H - padT - padB); }

    // Step line (followers accumulate in jumps)
    var d = 'M ' + x(pts[0].t).toFixed(1) + ' ' + y(0).toFixed(1);
    var last = 0;
    pts.forEach(function(p){
      d += ' L ' + x(p.t).toFixed(1) + ' ' + y(last).toFixed(1);
      d += ' L ' + x(p.t).toFixed(1) + ' ' + y(p.v).toFixed(1);
      last = p.v;
    });
    d += ' L ' + x(t1).toFixed(1) + ' ' + y(last).toFixed(1);

    // Chapter release markers within range
    var markers = (chapters||[]).map(function(c){ return new Date(c.published_at || c.created_at).getTime(); })
      .filter(function(t){ return t >= t0 && t <= t1; })
      .map(function(t){
        var xx = x(t).toFixed(1);
        return '<line x1="' + xx + '" y1="' + padT + '" x2="' + xx + '" y2="' + (H-padB) + '" stroke="var(--green)" stroke-width="1" stroke-dasharray="3,3" opacity="0.55"/>';
      }).join('');

    // Y axis: 0, mid, max
    var yTicks = [0, Math.round(vMax/2), vMax].filter(function(v, i, a){ return a.indexOf(v) === i; }).map(function(v){
      return '<text x="' + (padL-8) + '" y="' + (y(v)+4).toFixed(1) + '" text-anchor="end" font-size="11" fill="var(--text3)">' + fmt(v) + '</text>'
        + '<line x1="' + padL + '" y1="' + y(v).toFixed(1) + '" x2="' + (W-padR) + '" y2="' + y(v).toFixed(1) + '" stroke="var(--border)" stroke-width="1"/>';
    }).join('');
    // X axis: first + last date
    function dLabel(t){ return new Date(t).toLocaleDateString(undefined, { month:'short', day:'numeric', timeZone:'UTC' }); }
    var xTicks = '<text x="' + padL + '" y="' + (H-8) + '" font-size="11" fill="var(--text3)">' + dLabel(t0) + '</text>'
      + '<text x="' + (W-padR) + '" y="' + (H-8) + '" text-anchor="end" font-size="11" fill="var(--text3)">' + dLabel(t1) + '</text>';

    return '<div class="chart-wrap"><svg class="chart-svg" role="img" aria-label="Cumulative follower growth over time with chapter release markers" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" style="min-width:560px;">'
      + yTicks + markers
      + '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>'
      + xTicks + '</svg></div>'
      + '<div class="legend">'
        + '<span class="legend-item"><span class="legend-swatch" style="background:var(--accent);"></span> Followers (cumulative)</span>'
        + '<span class="legend-item"><span class="legend-swatch" style="background:var(--green);opacity:0.6;"></span> Chapter release</span>'
      + '</div>';
  }

  // ── DAILY BAR CHART (views / sparks, last 30 days) ───────────
  function barChart(daily, valueKey, color, emptyLabel, ariaLabel){
    var W = 900, H = 200, padL = 40, padR = 10, padT = 12, padB = 28;
    // Build a continuous 30-day window ending today
    var byDay = {};
    daily.forEach(function(d){ byDay[d.day] = Number(d[valueKey]||0); });
    var days = [];
    // Server days are UTC dates (CURRENT_DATE / ::date), so build the 30-day
    // window in UTC too — local-midnight keys drift a day for users east of UTC.
    var now = new Date();
    var todayUTC = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
    for(var i = 29; i >= 0; i--){
      var t = todayUTC - i*86400000;
      var key = new Date(t).toISOString().slice(0,10);
      days.push({ key: key, t: t, v: byDay[key] || 0 });
    }
    var vMax = Math.max.apply(null, days.map(function(d){ return d.v; }).concat([1]));
    if(!days.some(function(d){ return d.v > 0; })){
      return '<div class="chart-empty"><i class="ti ti-chart-bar"></i> ' + (emptyLabel || 'Nothing in the last 30 days.') + '</div>';
    }
    var slot = (W - padL - padR) / 30;
    var barW = Math.max(4, slot - 4);
    var bars = days.map(function(d, i){
      var h = (d.v / vMax) * (H - padT - padB);
      var xx = padL + i*slot + (slot-barW)/2;
      var yy = H - padB - h;
      return '<rect x="' + xx.toFixed(1) + '" y="' + yy.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + Math.max(h, d.v ? 2 : 0).toFixed(1) + '" rx="2" fill="' + color + '"><title>' + d.key + ': ' + d.v + '</title></rect>';
    }).join('');
    function dLabel(t){ return new Date(t).toLocaleDateString(undefined, { month:'short', day:'numeric', timeZone:'UTC' }); }
    var axis = '<line x1="' + padL + '" y1="' + (H-padB) + '" x2="' + (W-padR) + '" y2="' + (H-padB) + '" stroke="var(--border)"/>'
      + '<text x="' + (padL-8) + '" y="' + (padT+8) + '" text-anchor="end" font-size="11" fill="var(--text3)">' + fmt(vMax) + '</text>'
      + '<text x="' + (padL-8) + '" y="' + (H-padB) + '" text-anchor="end" font-size="11" fill="var(--text3)">0</text>'
      + '<text x="' + padL + '" y="' + (H-8) + '" font-size="11" fill="var(--text3)">' + dLabel(days[0].t) + '</text>'
      + '<text x="' + (W-padR) + '" y="' + (H-8) + '" text-anchor="end" font-size="11" fill="var(--text3)">' + dLabel(days[29].t) + '</text>';
    return '<div class="chart-wrap"><svg class="chart-svg" role="img" aria-label="' + esc(ariaLabel || 'Bar chart') + '" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" style="min-width:560px;">' + axis + bars + '</svg></div>';
  }

  // ── READING LIST CHIPS ───────────────────────────────────────
  function readingListChips(rows){
    if(!rows.length) return '<div class="chart-empty"><i class="ti ti-books"></i> Not on any reading lists yet.</div>';
    var labels = { reading: ['ti-book-open','Reading'], plan_to_read: ['ti-clock','Plan to Read'], completed: ['ti-circle-check','Completed'], on_hold: ['ti-player-pause','On Hold'], dropped: ['ti-x','Dropped'] };
    var order = ['reading','plan_to_read','completed','on_hold','dropped'];
    rows.sort(function(a,b){ return order.indexOf(a.status) - order.indexOf(b.status); });
    return '<div class="rl-chips">' + rows.map(function(r){
      var meta = labels[r.status] || ['ti-book', r.status];
      return '<span class="rl-chip"><i class="ti ' + meta[0] + '"></i> ' + meta[1] + ' <b>' + fmt(r.n) + '</b></span>';
    }).join('') + '</div>';
  }

  // ── AUTHOR GOALS ─────────────────────────────────────────────
  // These are the only three the DB accepts (chapter_goals goal_type CHECK) and
  // the only three goal_progress() knows how to measure. The picker used to
  // offer six more that create_chapter_goal rejects outright.
  var GOAL_TYPES = {
    sparks:    { label: 'Dawn Sparks', icon: 'ti-flame' },
    rallies:   { label: 'Rallies',     icon: 'ti-users' },
    offerings: { label: 'Offerings',   icon: 'ti-gift' }
  };
  var GOAL_TARGET_MIN = 5, GOAL_TARGET_MAX = 1000;

  async function loadGoals(activeGoal){
    var body = document.getElementById('goals-body');
    if(!body) return;
    body.innerHTML = renderGoal(activeGoal);
  }

  function renderGoal(g){
    if(!g){
      return '<div class="goal-empty">No active goal set.</div>'
        + '<div class="goal-actions" style="margin-top:14px;">'
          + '<button class="goal-btn primary" onclick="openGoalForm(null)"><i class="ti ti-plus"></i> Set a Goal</button>'
        + '</div>';
    }

    var typeMeta = GOAL_TYPES[g.goal_type] || { label: g.goal_type, icon: 'ti-target' };
    // progress is computed server-side by goal_progress() — the same function
    // check_goal_reached uses — so the bar can never disagree with the award.
    var progress = Math.max(0, Number(g.progress || 0));
    var needed   = Math.max(1, Number(g.target || 0));
    var pct      = Math.min(100, Math.round((progress / needed) * 100));
    var reached  = g.reached_at != null || g.status === 'reached';

    var html = '<div class="goal-card">';

    if(g.pledge){
      html += '<div class="goal-pledge">“' + esc(g.pledge) + '”</div>';
    }
    html += '<div class="goal-meta">'
      + '<i class="ti ' + typeMeta.icon + '" style="color:var(--accent);"></i>'
      + '<b>' + typeMeta.label + '</b>'
      + '<span>→ ' + fmt(g.target) + ' total</span>'
      + (reached ? '<span style="color:var(--green);font-weight:700;">✓ Goal reached!</span>' : '')
    + '</div>';

    html += '<div class="goal-bar-wrap"><div class="goal-bar-fill" style="width:' + pct + '%;' + (reached ? 'background:var(--green);' : '') + '"></div></div>';
    html += '<div class="goal-pct">Progress: <b>' + fmt(progress) + ' / ' + fmt(g.target) + '</b> (' + pct + '%)</div>';

    html += '<div class="goal-actions">';
    if(reached){
      html += '<button class="goal-btn primary" onclick="openGoalForm(' + JSON.stringify(g.id) + ')"><i class="ti ti-flag"></i> Move the Goalpost</button>';
    }
    html += '<button class="goal-btn" onclick="toggleVisibility(' + JSON.stringify(g.id) + ',' + (g.is_visible ? 'false' : 'true') + ')">'
      + '<i class="ti ' + (g.is_visible ? 'ti-eye-off' : 'ti-eye') + '"></i> '
      + (g.is_visible ? 'Hide from readers' : 'Show to readers')
    + '</button>';
    if(!reached){
      html += '<button class="goal-btn danger" onclick="abandonGoal(' + JSON.stringify(g.id) + ')"><i class="ti ti-trash"></i> Abandon</button>';
    }
    html += '</div>';

    html += '<div class="goal-visibility"><input type="checkbox" id="goal-vis-cb" ' + (g.is_visible ? 'checked' : '') + ' onchange="toggleVisibility(' + JSON.stringify(g.id) + ',this.checked)"> <label for="goal-vis-cb">Visible to readers on story page</label></div>';
    html += '</div>';
    return html;
  }

  function openGoalForm(existingGoalId){
    var body = document.getElementById('goals-body');
    if(!body) return;
    var typeOptions = Object.keys(GOAL_TYPES).map(function(k){
      return '<option value="' + k + '">' + GOAL_TYPES[k].label + '</option>';
    }).join('');

    body.innerHTML = '<div class="goal-form">'
      + '<div><label>Goal Type</label>'
        + '<select id="gf-type">' + typeOptions + '</select></div>'
      + '<div><label>Target Number</label>'
        + '<input type="number" id="gf-target" min="' + GOAL_TARGET_MIN + '" max="' + GOAL_TARGET_MAX + '" placeholder="e.g. 500"/>'
        + '<div style="font-size:11px;color:var(--text3);margin-top:4px;">Between ' + GOAL_TARGET_MIN + ' and ' + GOAL_TARGET_MAX + '. Goals run for 7 days.</div></div>'
      + '<div><label>Your Promise (pledge)</label>'
        + '<textarea id="gf-pledge" placeholder="e.g. When we hit 500 Sparks I will post a bonus chapter!"></textarea></div>'
      + '<div class="goal-actions">'
        + '<button class="goal-btn primary" onclick="saveGoal(' + (existingGoalId ? JSON.stringify(existingGoalId) : 'null') + ')"><i class="ti ti-check"></i> ' + (existingGoalId ? 'Update Goal' : 'Set Goal') + '</button>'
        + '<button class="goal-btn" onclick="reloadGoalSection()"><i class="ti ti-x"></i> Cancel</button>'
      + '</div>'
    + '</div>';
  }

  // chapter_goals has no write policies: every direct insert/update from this
  // page was silently refused by RLS. The correct paths are the existing
  // ownership-checked RPCs, which also compute baseline server-side, enforce
  // one active goal per work, and set the 7-day expiry.
  var GOAL_ERRORS = {
    not_authenticated:   'Your session expired. Please sign in again.',
    not_owner:           'Only the author of a published story can set a goal.',
    invalid_input:       'Pick a goal type and a target between ' + GOAL_TARGET_MIN + ' and ' + GOAL_TARGET_MAX + '.',
    goal_already_active: 'This story already has an active goal. Abandon it first.',
    not_found:           'That goal is no longer available. Refreshing.'
  };
  function goalErrorText(code){ return GOAL_ERRORS[code] || 'Something went wrong. Please try again.'; }

  async function saveGoal(existingGoalId){
    var type   = document.getElementById('gf-type').value;
    var target = parseInt(document.getElementById('gf-target').value, 10);
    var pledge = (document.getElementById('gf-pledge').value || '').trim();

    if(!type || !target || target < GOAL_TARGET_MIN || target > GOAL_TARGET_MAX){
      alert('Please choose a goal type and a target between ' + GOAL_TARGET_MIN + ' and ' + GOAL_TARGET_MAX + '.');
      return;
    }

    try {
      // "Move the Goalpost": cancel the reached goal first so the new one is
      // not rejected as goal_already_active.
      if(existingGoalId){
        var canRes = await db.rpc('cancel_chapter_goal', { p_goal_id: existingGoalId });
        if(canRes.error) throw canRes.error;
      }
      var { data, error } = await db.rpc('create_chapter_goal', {
        p_work_id:   workId,
        p_goal_type: type,
        p_target:    target,
        p_pledge:    pledge || null
      });
      if(error) throw error;
      if(!data || data.success !== true){ alert(goalErrorText(data && data.error)); return; }
      await reloadGoalSection();
    } catch(e){
      alert('Could not save goal. Please try again.');
    }
  }

  async function toggleVisibility(goalId, visible){
    try {
      var { data, error } = await db.rpc('set_goal_visibility', { p_goal_id: goalId, p_visible: !!visible });
      if(error) throw error;
      if(!data || data.success !== true){ alert(goalErrorText(data && data.error)); }
      await reloadGoalSection();
    } catch(e) { alert('Could not update visibility.'); }
  }

  async function abandonGoal(goalId){
    if(!confirm('Abandon this goal? It will be removed from your story page.')) return;
    try {
      var { data, error } = await db.rpc('cancel_chapter_goal', { p_goal_id: goalId });
      if(error) throw error;
      if(!data || data.success !== true){ alert(goalErrorText(data && data.error)); }
      await reloadGoalSection();
    } catch(e) { alert('Could not abandon goal.'); }
  }

  async function reloadGoalSection(){
    // Re-read through get_work_dashboard so the goal carries server-computed
    // progress; a direct table select would come back without it.
    try {
      var { data, error } = await db.rpc('get_work_dashboard', { p_work_id: workId });
      if(error) throw error;
      if(data){
        window._dashPayload = data;
        var body = document.getElementById('goals-body');
        if(body) body.innerHTML = renderGoal(data.active_goal || null);
      }
    } catch(e) {}
  }

  init();
</script>
