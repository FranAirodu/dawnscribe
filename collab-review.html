<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var t=localStorage.getItem('ds_theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DawnScribe — Review Collab Story</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
  <style>
    :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--bg4:#22223a;--accent:#2dd4bf;--accent2:#0d9488;--text:#f1f0ff;--text2:#9b9bc0;--text3:#5a5a80;--border:rgba(255,255,255,0.07);--red:#f87171;--green:#34d399;}
    html[data-theme="light"]{--bg:#f4f4f8;--bg2:#ffffff;--bg3:#ebebf2;--bg4:#d8d8e8;--accent:#0d9488;--accent2:#0f766e;--text:#0a0a0f;--text2:#3a3a5c;--text3:#7a7a9a;--border:rgba(0,0,0,0.08);--red:#dc2626;--green:#059669;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    @keyframes spin{to{transform:rotate(360deg);}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

    nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .logo{font-family:'Cinzel',serif;font-size:22px;color:var(--accent);text-decoration:none;letter-spacing:1px;}
    .logo span{color:var(--text);}
    .back-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 16px;color:var(--text2);font-size:13px;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;text-decoration:none;}
    .back-btn:hover{border-color:var(--accent);color:var(--accent);}

    .page-wrap{max-width:780px;margin:0 auto;padding:40px 24px 100px;flex:1;animation:fadeIn 0.3s ease;}

    /* GOLD REVIEW BANNER */
    .review-banner{background:rgba(245,158,11,0.07);border:1.5px solid rgba(245,158,11,0.3);border-radius:14px;padding:18px 22px;margin-bottom:32px;display:flex;align-items:center;gap:16px;}
    .review-banner-icon{width:44px;height:44px;background:rgba(245,158,11,0.12);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#f59e0b;flex-shrink:0;}
    .review-banner-text h2{font-family:'Cinzel',serif;font-size:17px;font-weight:700;color:#f59e0b;margin-bottom:3px;}
    .review-banner-text p{font-size:13px;color:var(--text3);line-height:1.6;}

    /* ARTWORK STRIP */
    .artwork-strip{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:28px;display:flex;align-items:center;gap:18px;padding:16px 20px;}
    .artwork-strip-img{width:72px;height:100px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--bg4);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:26px;overflow:hidden;}
    .artwork-strip-img img{width:100%;height:100%;object-fit:cover;}
    .artwork-strip-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);margin-bottom:4px;}
    .artwork-strip-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:3px;}
    .artwork-strip-artist{font-size:12px;color:var(--text3);}
    .artwork-strip-link{margin-left:auto;background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 14px;color:var(--text2);font-size:12px;font-weight:700;font-family:'Lato',sans-serif;text-decoration:none;display:flex;align-items:center;gap:5px;transition:all 0.2s;flex-shrink:0;}
    .artwork-strip-link:hover{border-color:var(--accent);color:var(--accent);}

    /* NOVEL HEADER */
    .novel-header{display:flex;gap:20px;align-items:flex-start;margin-bottom:24px;}
    .novel-cover{width:90px;height:128px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--bg4);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:32px;overflow:hidden;}
    .novel-cover img{width:100%;height:100%;object-fit:cover;}
    .novel-meta{flex:1;min-width:0;}
    .novel-meta-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#f59e0b;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
    .novel-title{font-family:'Cinzel',serif;font-size:24px;font-weight:700;color:var(--text);margin-bottom:8px;line-height:1.3;}
    .novel-synopsis{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:10px;}
    .novel-author-row{display:flex;align-items:center;gap:8px;}
    .novel-author-avatar{width:28px;height:28px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text2);overflow:hidden;flex-shrink:0;}
    .novel-author-avatar img{width:100%;height:100%;object-fit:cover;}
    .novel-author-name{font-size:13px;color:var(--text2);text-decoration:none;}
    .novel-author-name:hover{color:var(--accent);}

    /* CHAPTER NAV */
    .chapter-nav{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
    .chapter-tab{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--text3);cursor:pointer;transition:all 0.2s;font-family:'Lato',sans-serif;}
    .chapter-tab:hover{border-color:rgba(245,158,11,0.4);color:#f59e0b;}
    .chapter-tab.active{border-color:#f59e0b;background:rgba(245,158,11,0.1);color:#f59e0b;}

    /* CHAPTER READER */
    .chapter-reader{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:32px 36px;margin-bottom:32px;}
    .chapter-reader-title{font-family:'Cinzel',serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border);}
    .chapter-content{font-size:15px;line-height:1.9;color:var(--text2);}
    .chapter-content p{margin-bottom:1.2em;}
    .chapter-content h1,.chapter-content h2,.chapter-content h3{font-family:'Cinzel',serif;color:var(--text);margin:1.5em 0 0.6em;}
    .chapter-content blockquote{border-left:3px solid var(--accent);padding-left:16px;color:var(--text3);font-style:italic;margin:1em 0;}
    .chapter-content ul,.chapter-content ol{padding-left:24px;margin-bottom:1em;}
    .chapter-content li{margin-bottom:0.4em;}

    /* DECISION BAR */
    .decision-bar{position:sticky;bottom:0;background:var(--bg2);border-top:1px solid rgba(245,158,11,0.2);padding:16px 24px;display:flex;align-items:center;gap:12px;z-index:50;}
    .decision-label{font-size:12px;color:var(--text3);flex:1;}
    .decision-label strong{color:var(--text2);display:block;font-size:13px;}
    .approve-btn{background:#f59e0b;border:none;border-radius:10px;padding:11px 28px;color:#0a0a0f;font-size:14px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:7px;}
    .approve-btn:hover{background:#fbbf24;transform:translateY(-1px);}
    .approve-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
    .deny-btn{background:transparent;border:1.5px solid var(--red);border-radius:10px;padding:11px 24px;color:var(--red);font-size:14px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:7px;}
    .deny-btn:hover{background:rgba(248,113,113,0.08);}
    .deny-btn:disabled{opacity:0.5;cursor:not-allowed;}

    /* DENY MODAL */
    .deny-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:400;display:none;align-items:center;justify-content:center;padding:24px;}
    .deny-backdrop.show{display:flex;}
    .deny-modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:460px;}
    .deny-modal-header{padding:22px 24px 0;display:flex;align-items:center;justify-content:space-between;}
    .deny-modal-title{font-family:'Cinzel',serif;font-size:17px;font-weight:700;color:var(--text);}
    .deny-modal-close{background:transparent;border:none;color:var(--text3);font-size:20px;cursor:pointer;transition:color 0.2s;}
    .deny-modal-close:hover{color:var(--text);}
    .deny-modal-body{padding:16px 24px;}
    .deny-modal-desc{font-size:13px;color:var(--text3);margin-bottom:14px;line-height:1.6;}
    .deny-reason-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:10px 14px;color:var(--text);font-family:'Lato',sans-serif;font-size:13px;outline:none;resize:none;min-height:100px;transition:border-color 0.2s;line-height:1.6;}
    .deny-reason-input:focus{border-color:var(--red);}
    .deny-reason-input::placeholder{color:var(--text3);}
    .deny-modal-footer{padding:0 24px 22px;display:flex;gap:10px;justify-content:flex-end;}
    .deny-cancel{background:transparent;border:1px solid var(--border);border-radius:8px;padding:9px 20px;color:var(--text2);font-size:13px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;transition:all 0.2s;}
    .deny-cancel:hover{border-color:var(--text3);}
    .deny-confirm{background:var(--red);border:none;border-radius:8px;padding:9px 22px;color:white;font-size:13px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;}
    .deny-confirm:hover{opacity:0.85;}
    .deny-confirm:disabled{opacity:0.5;cursor:not-allowed;}

    /* STATES */
    .state-wrap{text-align:center;padding:80px 24px;}
    .state-icon{font-size:40px;color:var(--text3);margin-bottom:16px;}
    .state-title{font-family:'Cinzel',serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;}
    .state-body{font-size:14px;color:var(--text3);}

    /* TOAST */
    .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 22px;font-size:13px;font-weight:700;color:var(--text);z-index:600;transition:transform 0.3s;display:flex;align-items:center;gap:8px;white-space:nowrap;}
    .toast.show{transform:translateX(-50%) translateY(0);}

    @media(max-width:600px){
      .chapter-reader{padding:20px 18px;}
      .novel-header{flex-direction:column;}
      .decision-bar{flex-wrap:wrap;}
      .artwork-strip{flex-wrap:wrap;}
    }
  </style>
</head>
<body>

  <nav style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
    <a class="logo" href="index.html">Dawn<span>Scribe</span></a>
    <a class="back-btn" id="back-btn" href="index.html"><i class="ti ti-arrow-left"></i> Back</a>
  </nav>

  <div class="page-wrap" id="page-wrap">
    <div class="state-wrap">
      <div class="state-icon"><i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i></div>
    </div>
  </div>

  <!-- DECISION BAR (hidden until loaded) -->
  <div class="decision-bar" id="decision-bar" style="display:none;">
    <div class="decision-label">
      <strong>Your Decision</strong>
      Approve to publish this story under your artwork, or deny with a reason.
    </div>
    <button class="deny-btn" id="deny-btn" onclick="openDenyModal()"><i class="ti ti-x"></i> Deny</button>
    <button class="approve-btn" id="approve-btn" onclick="confirmApprove()"><i class="ti ti-check"></i> Approve</button>
  </div>

  <!-- DENY MODAL -->
  <div class="deny-backdrop" id="deny-backdrop">
    <div class="deny-modal">
      <div class="deny-modal-header">
        <div class="deny-modal-title">Deny Collab Request</div>
        <button class="deny-modal-close" onclick="closeDenyModal()"><i class="ti ti-x"></i></button>
      </div>
      <div class="deny-modal-body">
        <p class="deny-modal-desc">Let the author know why you're declining. Your reason will be sent to them as a direct message.</p>
        <textarea class="deny-reason-input" id="deny-reason" placeholder="e.g. The tone of this story doesn't quite match the artwork's atmosphere. Feel free to try again with a different approach!"></textarea>
      </div>
      <div class="deny-modal-footer">
        <button class="deny-cancel" onclick="closeDenyModal()">Cancel</button>
        <button class="deny-confirm" id="deny-confirm-btn" onclick="confirmDeny()"><i class="ti ti-send"></i> Send & Deny</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SUPA_URL = 'https://cajjyyskpmjnpcxcfeuk.supabase.co';
    const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhamp5eXNrcG1qbnBjeGNmZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDUyMDUsImV4cCI6MjA5NTMyMTIwNX0.s93zWwRYymTsoW5BfUhUDli13ArCtk4S-tegAs54A2c';
    const db = window.supabase.createClient(SUPA_URL, SUPA_KEY);

    var collabId = null;
    var artworkId = null;
    var collabData = null;   // artwork_collabs row
    var novelData = null;    // works row for the novel
    var artworkData = null;  // works row for the artwork
    var authorProfile = null;
    var session = null;
    var chapters = [];
    var activeChapterIdx = 0;

    function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function showToast(msg, icon){ var t=document.getElementById('toast'); t.innerHTML='<i class="ti '+(icon||'ti-check')+'"></i> '+msg; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); },3000); }
    function showError(msg){ document.getElementById('page-wrap').innerHTML='<div class="state-wrap"><div class="state-icon"><i class="ti ti-alert-circle"></i></div><div class="state-title">Oops</div><div class="state-body">'+msg+'</div></div>'; }

    var isFanArtFlow = false;

    async function init(){
      var params = new URLSearchParams(window.location.search);
      var fanartId = params.get('fanart');
      collabId = params.get('collab');
      artworkId = params.get('artwork');
      var workIdParam = params.get('work');

      var { data: { session: s } } = await db.auth.getSession();
      if(!s){ showError('You need to be logged in to review collab requests.'); return; }
      session = s;

      // ── FAN ART ON NOVEL flow
      if(fanartId){
        isFanArtFlow = true;
        var { data: fa } = await db.from('story_collabs').select('*').eq('id', fanartId).maybeSingle();
        if(!fa){ showError('Fan art submission not found.'); return; }
        collabData = fa; collabId = fa.id;
        var { data: nov } = await db.from('works').select('*').eq('id', fa.work_id).maybeSingle();
        if(!nov){ showError('Novel not found.'); return; }
        novelData = nov;
        if(nov.author_id !== s.user.id){ showError("You don't have permission to review this request."); return; }
        if(fa.status !== 'pending'){ renderAlreadyDecidedFanArt(fa.status, nov.id); return; }
        var { data: artistProf } = await db.from('profiles').select('id,username,display_name,avatar_url').eq('id', fa.artist_id).maybeSingle();
        authorProfile = artistProf || {};
        document.getElementById('back-btn').href = 'story.html?id=' + nov.id;
        renderFanArtPage(nov);
        return;
      }

      if(!collabId && !workIdParam){ showError('No collab specified.'); return; }

      // Try to load collab row — may fail due to RLS, so fall back to work+artwork params
      var cd = null;
      if(collabId){
        var cdRes = await db.from('artwork_collabs').select('*').eq('id', collabId).maybeSingle();
        cd = cdRes.data || null;
      }
      // If RLS blocked the direct lookup, reconstruct from work_id + artwork_id
      if(!cd && workIdParam && artworkId){
        var cdRes2 = await db.from('artwork_collabs').select('*')
          .eq('work_id', workIdParam).eq('artwork_id', artworkId).maybeSingle();
        cd = cdRes2.data || null;
      }
      if(!cd){ showError('Collab request not found. It may have already been reviewed or you may not have permission.'); return; }
      collabData = cd;
      collabId = cd.id;

      // Load artwork
      var { data: art } = await db.from('works').select('*').eq('id', cd.artwork_id).maybeSingle();
      if(!art){ showError('Artwork not found.'); return; }
      artworkData = art;

      if(art.author_id !== s.user.id){ showError('You don\'t have permission to review this request.'); return; }

      if(cd.status !== 'pending'){ renderAlreadyDecided(cd.status); return; }

      // Load novel
      var { data: novel } = await db.from('works').select('*').eq('id', cd.work_id).maybeSingle();
      if(!novel){ showError('The submitted story could not be found.'); return; }
      novelData = novel;

      var { data: prof } = await db.from('profiles').select('id,username,display_name,avatar_url').eq('id', cd.author_id).maybeSingle();
      authorProfile = prof || {};

      var { data: artistProf } = await db.from('profiles').select('username,display_name').eq('id', art.author_id).maybeSingle();
      var artistName = artistProf ? (artistProf.display_name || artistProf.username || 'Artist') : 'Artist';

      var { data: chaps } = await db.from('chapters')
        .select('id, title, content, chapter_number')
        .eq('work_id', cd.work_id)
        .order('chapter_number', { ascending: true });
      chapters = chaps || [];

      document.getElementById('back-btn').href = 'artwork.html?id=' + art.id;
      renderPage(artistName);
    }

    function renderFanArtPage(novel){
      var artistName = authorProfile.display_name || authorProfile.username || 'Artist';
      var avHtml = authorProfile.avatar_url ? '<img src="' + esc(authorProfile.avatar_url) + '" alt=""/>' : (artistName[0]||'?').toUpperCase();
      var wrap = document.getElementById('page-wrap');
      wrap.innerHTML =
        '<div class="review-banner">'
          + '<div class="review-banner-icon"><i class="ti ti-palette"></i></div>'
          + '<div class="review-banner-text"><h2>Fan Art Review</h2>'
          + '<p>Review the fan artwork submitted for your novel. Approve to publish it on your story page, or deny with a reason.</p>'
          + '</div></div>'
        + '<div class="artwork-strip">'
          + '<div class="artwork-strip-img">'
            + (collabData.image_url ? '<img src="' + esc(collabData.image_url) + '" alt="Fan art"/>' : '<i class="ti ti-photo"></i>')
          + '</div>'
          + '<div style="flex:1;">'
            + '<div class="artwork-strip-label">Fan Art Submission</div>'
            + '<div class="artwork-strip-title">' + esc(collabData.description || 'Untitled Artwork') + '</div>'
            + '<div class="artwork-strip-artist">by <strong>' + esc(artistName) + '</strong> &middot; for <strong>' + esc(novel.title) + '</strong></div>'
            + (collabData.inspiration ? '<div style="margin-top:6px;font-size:12px;color:var(--text3);font-style:italic;">&ldquo;' + esc(collabData.inspiration) + '&rdquo;</div>' : '')
          + '</div>'
          + '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">'
            + '<div style="width:36px;height:36px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--text2);overflow:hidden;">' + avHtml + '</div>'
            + '<span style="font-size:13px;font-weight:700;color:var(--text);">' + esc(artistName) + '</span>'
          + '</div>'
        + '</div>'
        + '<div style="display:flex;justify-content:center;gap:14px;margin-top:32px;">'
          + '<button class="approve-btn" id="approve-btn" onclick="confirmApprove()"><i class="ti ti-check"></i> Approve</button>'
          + '<button class="deny-btn" id="deny-btn" onclick="openDenyModal()"><i class="ti ti-x"></i> Deny</button>'
        + '</div>';
    }

    function renderAlreadyDecidedFanArt(status, novelId){
      var color = status === 'approved' ? 'var(--green)' : 'var(--red)';
      var icon = status === 'approved' ? 'ti-circle-check' : 'ti-circle-x';
      var label = status === 'approved' ? 'Already Approved' : 'Already Denied';
      document.getElementById('page-wrap').innerHTML =
        '<div class="state-wrap"><div class="state-icon" style="color:' + color + '"><i class="ti ' + icon + '"></i></div>'
        + '<div class="state-title">' + label + '</div>'
        + '<a href="story.html?id=' + esc(novelId) + '" style="display:inline-flex;align-items:center;gap:6px;margin-top:24px;color:var(--accent);text-decoration:none;font-size:14px;font-weight:700;"><i class="ti ti-arrow-left"></i> Back to novel</a>'
        + '</div>';
    }

    function renderPage(artistName){
      var authorName = authorProfile.display_name || authorProfile.username || 'Author';
      var authorInitial = (authorName[0]||'?').toUpperCase();
      var authorAvHtml = authorProfile.avatar_url
        ? '<img src="' + esc(authorProfile.avatar_url) + '" alt=""/>'
        : authorInitial;

      var tags = [];
      try{ tags = JSON.parse(novelData.tags_all || novelData.tags_main || '[]'); }catch(e){}

      var wrap = document.getElementById('page-wrap');
      wrap.innerHTML =

        // Gold review banner
        '<div class="review-banner">'
          + '<div class="review-banner-icon"><i class="ti ti-writing"></i></div>'
          + '<div class="review-banner-text">'
            + '<h2>Collab Review</h2>'
            + '<p>Read the story below in full. When you\'re ready, use the Approve or Deny buttons at the bottom of the page.</p>'
          + '</div>'
        + '</div>'

        // Artwork strip
        + '<div class="artwork-strip">'
          + '<div class="artwork-strip-img">'
            + (artworkData.cover_url ? '<img src="' + esc(artworkData.cover_url) + '" alt=""/>' : '<i class="ti ti-palette"></i>')
          + '</div>'
          + '<div>'
            + '<div class="artwork-strip-label">Inspired by your artwork</div>'
            + '<div class="artwork-strip-title">' + esc(artworkData.title || 'Untitled') + '</div>'
            + '<div class="artwork-strip-artist">by ' + esc(artistName) + '</div>'
          + '</div>'
          + '<a class="artwork-strip-link" href="artwork.html?id=' + esc(artworkData.id) + '"><i class="ti ti-external-link"></i> View artwork</a>'
        + '</div>'

        // Novel header
        + '<div class="novel-header">'
          + '<div class="novel-cover">'
            + (novelData.cover_url ? '<img src="' + esc(novelData.cover_url) + '" alt=""/>' : '<i class="ti ti-book"></i>')
          + '</div>'
          + '<div class="novel-meta">'
            + '<div class="novel-meta-label"><i class="ti ti-writing"></i> Collab Story Submission</div>'
            + '<div class="novel-title">' + esc(novelData.title || 'Untitled') + '</div>'
            + '<div class="novel-synopsis">' + esc(novelData.synopsis || '') + '</div>'
            + '<div class="novel-author-row">'
              + '<div class="novel-author-avatar">' + authorAvHtml + '</div>'
              + '<a class="novel-author-name" href="profile.html?user=' + esc(authorProfile.username||'') + '">by ' + esc(authorName) + '</a>'
            + '</div>'
          + '</div>'
        + '</div>'

        // Chapter tabs
        + (chapters.length > 1
            ? '<div class="chapter-nav" id="chapter-nav">'
              + chapters.map(function(c, i){
                  return '<button class="chapter-tab' + (i===0?' active':'') + '" onclick="switchChapter(' + i + ')">Ch. ' + c.chapter_number + ' — ' + esc(c.title) + '</button>';
                }).join('')
              + '</div>'
            : '')

        // Chapter reader
        + '<div class="chapter-reader" id="chapter-reader">'
          + (chapters.length
              ? '<div class="chapter-reader-title" id="chapter-reader-title">' + esc(chapters[0].title) + '</div>'
                + '<div class="chapter-content" id="chapter-content">' + (chapters[0].content || '') + '</div>'
              : '<div style="text-align:center;padding:40px;color:var(--text3);">No chapters found.</div>')
        + '</div>';

      // Show decision bar
      document.getElementById('decision-bar').style.display = 'flex';
    }

    function switchChapter(idx){
      activeChapterIdx = idx;
      var c = chapters[idx];
      if(!c) return;
      var titleEl = document.getElementById('chapter-reader-title');
      var contentEl = document.getElementById('chapter-content');
      if(titleEl) titleEl.textContent = c.title;
      if(contentEl) contentEl.innerHTML = c.content || '';
      // Update tab active state
      document.querySelectorAll('.chapter-tab').forEach(function(btn, i){
        btn.classList.toggle('active', i === idx);
      });
      // Scroll reader into view
      var reader = document.getElementById('chapter-reader');
      if(reader) reader.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderAlreadyDecided(status){
      var icon = status === 'approved' ? 'ti-circle-check' : 'ti-circle-x';
      var color = status === 'approved' ? 'var(--green)' : 'var(--red)';
      var label = status === 'approved' ? 'Already Approved' : 'Already Denied';
      var body = status === 'approved'
        ? 'You approved this collab story. It is now live on your artwork page.'
        : 'You denied this collab request.';
      document.getElementById('page-wrap').innerHTML =
        '<div class="state-wrap">'
          + '<div class="state-icon" style="color:' + color + ';"><i class="ti ' + icon + '"></i></div>'
          + '<div class="state-title">' + label + '</div>'
          + '<div class="state-body">' + body + '</div>'
          + '<a href="artwork.html?id=' + esc(collabData.artwork_id) + '" style="display:inline-flex;align-items:center;gap:6px;margin-top:24px;color:var(--accent);text-decoration:none;font-size:14px;font-weight:700;"><i class="ti ti-arrow-left"></i> Back to artwork</a>'
        + '</div>';
    }

    // ── APPROVE
    async function confirmApprove(){
      var btn = document.getElementById('approve-btn');
      var denyBtn = document.getElementById('deny-btn');
      btn.disabled = true; if(denyBtn) denyBtn.disabled = true;
      btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i> Approving…';

      if(isFanArtFlow){
        var { error } = await db.from('story_collabs').update({ status: 'approved' }).eq('id', collabId);
        if(error){ showToast('Failed to approve: ' + error.message, 'ti-alert-circle'); btn.disabled=false; if(denyBtn) denyBtn.disabled=false; btn.innerHTML='<i class="ti ti-check"></i> Approve'; return; }
        if(collabData.artist_id && collabData.artist_id !== session.user.id){
          var { data: myProf2 } = await db.from('profiles').select('display_name,username').eq('id', session.user.id).maybeSingle();
          var myName2 = myProf2 ? (myProf2.display_name || myProf2.username || 'Someone') : 'Someone';
          try {
            var rpc2 = await db.rpc('get_or_create_conversation', { user_a: session.user.id, user_b: collabData.artist_id });
            if(!rpc2.error && rpc2.data){
              var msg2 = '🎨 ' + myName2 + ' approved your fan art for "' + (novelData.title||'Untitled') + '"! It is now live on the novel page.';
              await db.from('messages').insert({ conversation_id: rpc2.data, sender_id: session.user.id, content: msg2 });
              await db.from('conversations').update({ last_message: msg2, last_message_at: new Date().toISOString() }).eq('id', rpc2.data);
            }
          } catch(e){}
        }
        showToast('Fan art approved!', 'ti-check');
        setTimeout(function(){ window.location.href = 'story.html?id=' + novelData.id; }, 1500);
        return;
      }

      var { error } = await db.from('artwork_collabs').update({ status: 'approved' }).eq('id', collabId);
      if(error){ showToast('Failed to approve: ' + error.message, 'ti-alert-circle'); btn.disabled=false; if(denyBtn) denyBtn.disabled=false; btn.innerHTML='<i class="ti ti-check"></i> Approve'; return; }
      await db.from('works').update({ is_published: true }).eq('id', collabData.artwork_id);
      var denyTarget = isFanArtFlow ? collabData.artist_id : collabData.author_id;
      if(denyTarget && denyTarget !== session.user.id){
        var { data: myProf } = await db.from('profiles').select('display_name,username').eq('id', session.user.id).maybeSingle();
        var myName = myProf ? (myProf.display_name || myProf.username || 'Someone') : 'Someone';
        try {
          var rpc = await db.rpc('get_or_create_conversation', { user_a: session.user.id, user_b: denyTarget });
          if(!rpc.error && rpc.data){
            var msg = '🌟 ' + myName + ' approved your collab story for "' + (artworkData.title||'Untitled') + '"! Your story is now live.';
            await db.from('messages').insert({ conversation_id: rpc.data, sender_id: session.user.id, content: msg });
            await db.from('conversations').update({ last_message: msg, last_message_at: new Date().toISOString() }).eq('id', rpc.data);
          }
        } catch(e){}
      }
      showToast('Story approved and published!', 'ti-check');
      setTimeout(function(){ window.location.href = 'artwork.html?id=' + artworkData.id; }, 1500);
    }

    // ── DENY MODAL
    function openDenyModal(){
      document.getElementById('deny-reason').value = '';
      document.getElementById('deny-backdrop').classList.add('show');
      document.body.style.overflow = 'hidden';
      setTimeout(function(){ document.getElementById('deny-reason').focus(); }, 100);
    }
    function closeDenyModal(){
      document.getElementById('deny-backdrop').classList.remove('show');
      document.body.style.overflow = '';
    }
    document.getElementById('deny-backdrop').addEventListener('click', function(e){ if(e.target===this) closeDenyModal(); });

    async function confirmDeny(){
      var reason = document.getElementById('deny-reason').value.trim();
      if(!reason){ document.getElementById('deny-reason').style.borderColor='var(--red)'; return; }

      var btn = document.getElementById('deny-confirm-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i> Sending…';

      var { error } = isFanArtFlow ? await db.from('story_collabs').update({ status: 'rejected' }).eq('id', collabId) : await db.from('artwork_collabs').update({ status: 'rejected' }).eq('id', collabId);
      if(error){ showToast('Failed: ' + error.message, 'ti-alert-circle'); btn.disabled=false; btn.innerHTML='<i class="ti ti-send"></i> Send & Deny'; return; }

      // Send reason as DM to author
      var denyTarget = isFanArtFlow ? collabData.artist_id : collabData.author_id;
      if(denyTarget && denyTarget !== session.user.id){
        var { data: myProf } = await db.from('profiles').select('display_name,username').eq('id', session.user.id).maybeSingle();
        var myName = myProf ? (myProf.display_name || myProf.username || 'Someone') : 'Someone';
        try {
          var rpc = await db.rpc('get_or_create_conversation', { user_a: session.user.id, user_b: denyTarget });
          if(!rpc.error && rpc.data){
            var dmMsg = isFanArtFlow ? myName + ' declined your fan art for "' + (novelData.title||'Untitled') + '".\n\nReason: ' + reason : myName + ' declined your collab story for "' + (artworkData.title||'Untitled') + '".\n\nReason: ' + reason;
            await db.from('messages').insert({ conversation_id: rpc.data, sender_id: session.user.id, content: dmMsg });
            await db.from('conversations').update({ last_message: dmMsg, last_message_at: new Date().toISOString() }).eq('id', rpc.data);
          }
        } catch(e){}
      }

      closeDenyModal();
      showToast('Request denied. Reason sent to author.', 'ti-x');
      setTimeout(function(){ window.location.href = isFanArtFlow ? 'story.html?id=' + novelData.id : 'artwork.html?id=' + artworkData.id; }, 1800);
    }

    init();
  </script>
<script src="nav.js"></script>
<script src="footer.js"></script>
</body>
</html>
