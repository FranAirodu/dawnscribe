<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DawnScribe — Contact Inbox</title>
  <script src="accessibilityPrefs.js"></script>
  <meta name="robots" content="noindex,nofollow" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Block all rendering until the admin check completes.
    document.documentElement.style.visibility = 'hidden';
    (async function() {
      window.db = window.supabase.createClient(
        'https://cajjyyskpmjnpcxcfeuk.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhamp5eXNrcG1qbnBjeGNmZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDUyMDUsImV4cCI6MjA5NTMyMTIwNX0.s93zWwRYymTsoW5BfUhUDli13ArCtk4S-tegAs54A2c'
      );
      var session = null;
      for (var i = 0; i < 5; i++) {
        var r = await window.db.auth.getSession();
        session = r.data.session;
        if (session) break;
        await new Promise(function(res) { setTimeout(res, 350); });
      }
      var adminRes = session ? await window.db.from('admins').select('id').eq('id', session.user.id).maybeSingle() : null;
      if (!session || !adminRes || !adminRes.data) {
        document.documentElement.style.visibility = '';
        document.body.innerHTML = '<div style="margin:0;display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0a0f;color:#f87171;font-family:Lato,sans-serif;font-size:18px;">Access denied.</div>';
        return;
      }
      document.documentElement.style.visibility = '';
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css"/>
  <style>
    :root {
      --bg:#0a0a0f; --bg2:#12121a; --bg3:#1a1a26; --bg4:#22223a;
      --accent:#2dd4bf; --accent2:#0d9488;
      --text:#f1f0ff; --text2:#9b9bc0; --text3:#5a5a80;
      --border:rgba(255,255,255,0.07); --red:#f87171; --green:#34d399; --gold:#f59e0b;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;font-size:15px;line-height:1.6;min-height:100vh;}
    nav{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px;}
    .logo{font-family:'Cinzel',serif;font-size:20px;font-weight:700;color:var(--text);text-decoration:none;letter-spacing:1px;}
    .logo span{color:var(--accent);}
    .back-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 16px;color:var(--text2);font-size:13px;font-family:'Lato',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;text-decoration:none;}
    .back-btn:hover{border-color:#2dd4bf;color:#2dd4bf;}
    .page{max-width:1000px;margin:0 auto;padding:32px 24px 80px;}
    .page-title{font-family:'Cinzel',serif;font-size:30px;font-weight:700;margin-bottom:4px;}
    .page-title span{color:var(--accent);}
    .page-sub{color:var(--text2);font-size:14px;margin-bottom:26px;}
    .section{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:24px;}
    .section-title{font-family:'Cinzel',serif;font-size:17px;font-weight:700;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:8px;}
    .section-title i{color:#2dd4bf;}
    .section-sub{color:var(--text3);font-size:12.5px;margin-bottom:16px;}

    .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
    .filter-btn{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:5px 15px;font-size:11.5px;font-weight:700;color:var(--text3);cursor:pointer;font-family:'Lato',sans-serif;transition:all 0.15s;}
    .filter-btn:hover{color:var(--text2);}
    .filter-btn.active{background:rgba(45,212,191,0.12);border-color:var(--accent);color:var(--accent);}
    .filter-btn .cnt{opacity:0.7;font-weight:400;}

    .msg{background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--text3);border-radius:10px;padding:14px 16px;margin-bottom:12px;transition:all 0.15s;}
    .msg.urgent{border-left-color:var(--red);}
    .msg.handled{opacity:0.55;border-left-color:var(--green);}
    .msg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
    .msg-subj{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:2px 8px;border-radius:20px;}
    .tag.urgent{background:rgba(248,113,113,0.15);color:var(--red);}
    .tag.open{background:rgba(245,158,11,0.15);color:var(--gold);}
    .tag.handled{background:rgba(52,211,153,0.15);color:var(--green);}
    .msg-meta{color:var(--text3);font-size:12px;margin-top:3px;}
    .msg-meta a{color:var(--text2);}
    .msg-body{white-space:pre-wrap;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:12px;font-size:13.5px;color:var(--text2);line-height:1.65;}
    .msg-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center;}
    .act{background:var(--bg4);border:1px solid var(--border);border-radius:8px;padding:6px 13px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;font-family:'Lato',sans-serif;display:flex;align-items:center;gap:5px;transition:all 0.15s;text-decoration:none;}
    .act:hover{border-color:var(--accent);color:var(--accent);}
    .act.green:hover{border-color:var(--green);color:var(--green);}
    .note{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text);font-size:12.5px;font-family:'Lato',sans-serif;}
    .note:focus{outline:none;border-color:var(--accent);}
    .handled-note{margin-top:8px;font-size:12px;color:var(--green);display:flex;align-items:center;gap:6px;}
    .empty{text-align:center;color:var(--text3);padding:34px 0;font-size:13.5px;}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg2);border:1px solid rgba(45,212,191,0.3);border-radius:10px;padding:10px 20px;color:var(--text);font-size:13px;font-weight:700;font-family:'Lato',sans-serif;display:flex;align-items:center;gap:8px;opacity:0;transition:all 0.3s;z-index:500;pointer-events:none;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .toast i{color:#2dd4bf;}
    footer{text-align:center;color:var(--text3);font-size:12px;padding:24px;border-top:1px solid var(--border);}
  </style>
</head>
<body>

  <div class="toast" id="toast"><i class="ti ti-check"></i><span id="toast-msg">Saved!</span></div>

  <nav>
    <a class="logo" href="index.html">Dawn<span>Scribe</span></a>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <a class="back-btn" href="WhiteRoomUnbreakable.html"><i class="ti ti-arrow-left"></i> Site Admin</a>
    </div>
  </nav>

  <div class="page">
    <h1 class="page-title">Contact <span>Inbox</span></h1>
    <p class="page-sub">Every message from the contact form, stored on DawnScribe. Nothing here depends on email.</p>

    <div class="section">
      <div class="section-title"><i class="ti ti-inbox"></i> Messages</div>
      <div class="section-sub">Safety Reports and DMCA / Copyright are flagged urgent and sorted first.</div>

      <div class="filters" id="filters">
        <button class="filter-btn active" data-f="open"     onclick="setFilter(this,'open')">Open <span class="cnt" id="c-open"></span></button>
        <button class="filter-btn"        data-f="urgent"   onclick="setFilter(this,'urgent')">Urgent <span class="cnt" id="c-urgent"></span></button>
        <button class="filter-btn"        data-f="handled"  onclick="setFilter(this,'handled')">Closed <span class="cnt" id="c-handled"></span></button>
        <button class="filter-btn"        data-f="all"      onclick="setFilter(this,'all')">All <span class="cnt" id="c-all"></span></button>
      </div>

      <div id="list"><div class="empty">Loading…</div></div>
    </div>
  </div>

  <footer>&copy; 2026 DawnScribe. Admin panel.</footer>

  <script>
    var URGENT = ['Safety Report', 'DMCA / Copyright'];
    // Status vocabulary is fixed by contact_messages_status_check:
    // 'new' | 'in_progress' | 'resolved' | 'spam'. Default is 'new'.
    var OPEN_STATUSES = ['new', 'in_progress'];
    var LABEL = { new:'New', in_progress:'In progress', resolved:'Resolved', spam:'Spam' };
    var _all = [];
    var _filter = 'open';

    function escHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function showToast(msg, icon) {
      var t = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      t.querySelector('i').className = 'ti ' + (icon || 'ti-check');
      t.classList.add('show');
      setTimeout(function(){ t.classList.remove('show'); }, 2200);
    }

    function fmtDate(iso) {
      try {
        var d = new Date(iso);
        return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) +
               ' ' + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
      } catch(e){ return iso; }
    }

    function isUrgent(m){ return URGENT.indexOf(m.subject) !== -1; }
    function isHandled(m){ return OPEN_STATUSES.indexOf(m.status || 'new') === -1; }

    async function loadMessages() {
      var res = await window.db.from('contact_messages')
        .select('id,created_at,user_id,name,email,subject,message,status,handled_at,handled_note')
        .order('created_at', { ascending: false })
        .limit(500);

      if (res.error) {
        document.getElementById('list').innerHTML =
          '<div class="empty">Could not load messages: ' + escHtml(res.error.message) + '</div>';
        return;
      }
      _all = res.data || [];

      // Urgent unhandled first, then newest first.
      _all.sort(function(a,b){
        var au = (isUrgent(a) && !isHandled(a)) ? 0 : 1;
        var bu = (isUrgent(b) && !isHandled(b)) ? 0 : 1;
        if (au !== bu) return au - bu;
        return new Date(b.created_at) - new Date(a.created_at);
      });

      document.getElementById('c-open').textContent    = '(' + _all.filter(function(m){ return !isHandled(m); }).length + ')';
      document.getElementById('c-urgent').textContent  = '(' + _all.filter(function(m){ return isUrgent(m) && !isHandled(m); }).length + ')';
      document.getElementById('c-handled').textContent = '(' + _all.filter(isHandled).length + ')';
      document.getElementById('c-all').textContent     = '(' + _all.length + ')';

      render();
    }

    function setFilter(btn, f) {
      _filter = f;
      Array.prototype.forEach.call(document.querySelectorAll('#filters .filter-btn'), function(b){
        b.classList.remove('active');
      });
      btn.classList.add('active');
      render();
    }

    function render() {
      var rows = _all.filter(function(m){
        if (_filter === 'open')    return !isHandled(m);
        if (_filter === 'urgent')  return isUrgent(m) && !isHandled(m);
        if (_filter === 'handled') return isHandled(m);
        return true;
      });

      if (!rows.length) {
        document.getElementById('list').innerHTML = '<div class="empty">Nothing here. \u2728</div>';
        return;
      }

      document.getElementById('list').innerHTML = rows.map(function(m){
        var urgent  = isUrgent(m);
        var handled = isHandled(m);
        // onclick with JSON.stringify'd ids: addEventListener is stripped by the
        // outerHTML serialisation this render uses.
        var idArg = JSON.stringify(m.id);

        return '<div class="msg' + (handled ? ' handled' : (urgent ? ' urgent' : '')) + '">' +
          '<div class="msg-head"><div>' +
            '<div class="msg-subj">' + escHtml(m.subject) +
              (urgent && !handled ? ' <span class="tag urgent">Urgent</span>' : '') +
              ' <span class="tag ' + (handled ? 'handled' : 'open') + '">' +
                escHtml(LABEL[m.status || 'new'] || m.status || 'New') + '</span>' +
            '</div>' +
            '<div class="msg-meta">' + escHtml(m.name) +
              ' &middot; <a href="mailto:' + encodeURIComponent(m.email) + '">' + escHtml(m.email) + '</a>' +
              ' &middot; ' + fmtDate(m.created_at) +
              (m.user_id ? ' &middot; <span title="Signed-in account">acct ' + escHtml(String(m.user_id).slice(0,8)) + '\u2026</span>'
                         : ' &middot; <em>not signed in</em>') +
            '</div>' +
          '</div></div>' +
          '<div class="msg-body">' + escHtml(m.message) + '</div>' +
          (handled
            ? '<div class="handled-note"><i class="ti ti-check"></i> ' +
                escHtml(m.handled_note || 'Handled') +
                (m.handled_at ? ' \u2014 ' + fmtDate(m.handled_at) : '') +
                ' <button class="act" style="margin-left:auto;" onclick=\'setStatus(' + escHtml(idArg) + ', "new")\'>' +
                '<i class="ti ti-rotate"></i> Reopen</button></div>'
            : '<div class="msg-actions">' +
                '<input class="note" id="n-' + escHtml(m.id) + '" placeholder="Internal note (optional, never shown to the user)" />' +
                '<button class="act green" onclick=\'setStatus(' + escHtml(idArg) + ', "resolved")\'><i class="ti ti-check"></i> Resolve</button>' +
                '<button class="act" onclick=\'setStatus(' + escHtml(idArg) + ', "spam")\'><i class="ti ti-trash"></i> Spam</button>' +
              '</div>'
          ) +
        '</div>';
      }).join('');
    }

    async function setStatus(id, status) {
      var patch = { status: status };
      if (status === 'new') {
        patch.handled_at = null;
        patch.handled_note = null;
      } else {
        var el = document.getElementById('n-' + id);
        var note = el ? el.value.trim() : '';
        patch.handled_at = new Date().toISOString();
        if (note) patch.handled_note = note;
      }

      // Supabase builder .catch() throws a TypeError unless wrapped first.
      var res = await Promise.resolve(
        window.db.from('contact_messages').update(patch).eq('id', id)
      ).catch(function(e){ return { error: e }; });

      if (res && res.error) { showToast('Could not update: ' + res.error.message, 'ti-x'); return; }
      showToast(status === 'new' ? 'Reopened' : (status === 'spam' ? 'Marked spam' : 'Resolved'));
      loadMessages();
    }

    // window.db is created by the admin gate in <head>; wait for it plus the session.
    (function waitForDb(tries) {
      if (window.db) { loadMessages(); return; }
      if (tries > 25) return;
      setTimeout(function(){ waitForDb(tries + 1); }, 200);
    })(0);
  </script>
</body>
</html>
